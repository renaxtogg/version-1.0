<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mythos · Módulo no disponible</title>
  <meta name="robots" content="noindex"/>
  <link rel="stylesheet" href="tokens.css">
  <script src="mythos-theme.js"></script>
  <script>MythosTheme.init();</script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg-subtle);color:var(--text-primary);font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;-webkit-font-smoothing:antialiased}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:44px 36px;width:100%;max-width:440px;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,0.08),0 0 1px rgba(0,0,0,0.04)}
    .logo{font-size:28px;font-weight:800;color:var(--primary);letter-spacing:-1px;margin-bottom:22px}
    .ic{width:62px;height:62px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;color:var(--text-secondary)}
    h1{font-size:19px;font-weight:800;margin-bottom:10px;letter-spacing:-0.3px}
    .mod{display:inline-block;font-size:11px;font-weight:700;border:1px solid var(--border);border-radius:20px;padding:3px 12px;margin-bottom:16px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-secondary)}
    p{font-size:14px;line-height:1.6;color:var(--text-secondary);margin-bottom:26px}
    .btn{display:inline-block;background:var(--primary);color:var(--on-primary);border:none;border-radius:10px;padding:12px 22px;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none}
    .btn:hover{opacity:.84}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Mythos</div>
    <div class="ic">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>
      </svg>
    </div>
    <div class="mod" id="mod" style="display:none"></div>
    <h1>Este módulo no está disponible</h1>
    <p>El acceso a este panel no está incluido para este restaurante. Si creés que es un error, contactá al administrador de la plataforma.</p>
    <a class="btn" href="login.html">Volver a iniciar sesión</a>
  </div>
  <script>
  (function () {
    try {
      var LABELS = { 'caja':'Caja', 'cocina':'Cocina', 'mozo':'Mozo', 'gerente':'Gerente',
        'admin':'Administración', 'delivery-cliente':'Delivery Cliente', 'delivery-rider':'Rider Delivery' };
      var p = new URLSearchParams(location.search).get('panel');
      if (p && LABELS[p]) { var el = document.getElementById('mod'); el.textContent = LABELS[p]; el.style.display = ''; }
    } catch (_) {}
  })();
  </script>
</body>
</html>
