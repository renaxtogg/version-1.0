/* ════════════════════════════════════════════════════════════════════════════
   MÓDULO 9: REPORTES DEL DÍA
   ════════════════════════════════════════════════════════════════════════════ */
function ReportesDelDia() {
  const [data, setData] = useState({orders:[], items:[], approvals:[], cancels:[]});
  const [loading, setLoading] = useState(true);

  const load = useCallback(async () => {
    if (!db) return;
    const today = new Date(); today.setHours(0,0,0,0);
    const yesterday = new Date(today); yesterday.setDate(yesterday.getDate()-1);
    const tomorrow = new Date(today); tomorrow.setDate(tomorrow.getDate()+1);
    const [o, i, a, c] = await Promise.all([
      db.from('orders').select('id,total,status,order_type,table_id,table_number,waiter_id,waiter_name,created_at,paid_at,confirmed_at').eq('restaurant_id',RID).gte('created_at', yesterday.toISOString()).lte('created_at', tomorrow.toISOString()),
      db.from('order_items').select('id,order_id,name,quantity,price').gte('created_at', today.toISOString()),
      db.from('manager_approvals').select('id,request_type,status,amount,created_at').eq('restaurant_id',RID).gte('created_at', today.toISOString()),
      db.from('cancelaciones_caja').select('id,monto_cancelado,motivo,created_at').eq('restaurant_id',RID).gte('created_at', today.toISOString())
    ]);
    setData({orders: o.data||[], items: i.data||[], approvals: a.data||[], cancels: c.data||[]});
    setLoading(false);
  }, []);
  useEffect(() => { load(); const id = setInterval(() => { if (!_shouldPause()) load(); }, 60000); return () => clearInterval(id); }, [load]);

  if (loading) return <div style={{padding:40,textAlign:'center'}}><div className="spin"/></div>;

  const today = new Date(); today.setHours(0,0,0,0);
  const ordersToday = data.orders.filter(o => new Date(o.created_at) >= today);
  const ordersYday  = data.orders.filter(o => new Date(o.created_at) <  today);

  const salesToday = ordersToday.filter(o => ['paid','delivered','kitchen_received','cooking','ready'].includes(o.status)).reduce((s,o) => s + (o.total||0), 0);
  const salesYday  = ordersYday.filter(o => ['paid','delivered'].includes(o.status)).reduce((s,o) => s + (o.total||0), 0);
  const deltaPct = salesYday ? ((salesToday - salesYday) / salesYday * 100) : 0;

  const ticketsToday = ordersToday.filter(o => ['paid','delivered'].includes(o.status)).length;
  const ticketAvg = ticketsToday ? salesToday/ticketsToday : 0;

  // por mozo
  const byWaiter = {};
  ordersToday.filter(o => o.waiter_id).forEach(o => {
    if (!byWaiter[o.waiter_id]) byWaiter[o.waiter_id] = {name:o.waiter_name||'—', sales:0, count:0};
    byWaiter[o.waiter_id].sales += o.total||0;
    byWaiter[o.waiter_id].count++;
  });
  const waiters = Object.values(byWaiter).sort((a,b) => b.sales - a.sales);

  // top productos
  const itemMap = {};
  data.items.forEach(it => {
    if (!itemMap[it.name]) itemMap[it.name] = {qty:0, total:0};
    itemMap[it.name].qty += it.quantity||0;
    itemMap[it.name].total += (it.price||0) * (it.quantity||0);
  });
  const topItems = Object.entries(itemMap).map(([name,v]) => ({name, ...v})).sort((a,b) => b.qty - a.qty).slice(0,10);

  // tiempo medio servicio
  const completed = ordersToday.filter(o => o.paid_at && o.created_at);
  const avgServiceMin = completed.length ? completed.reduce((s,o) => s + (new Date(o.paid_at) - new Date(o.created_at))/60000, 0) / completed.length : 0;

  return (
    <div className="page">
      <h2 style={{fontSize:20,fontWeight:800,marginBottom:16}}>Reportes del día</h2>

      <div style={{display:'flex',gap:12,flexWrap:'wrap',marginBottom:18}}>
        <KpiCard label="Ventas hoy" value={fmt(salesToday)} sub={`vs ayer: ${deltaPct>=0?'+':''}${deltaPct.toFixed(0)}%`} accent={deltaPct>=0?C.green:C.red}/>
        <KpiCard label="Tickets" value={ticketsToday} sub={`Promedio ${fmt(ticketAvg)}`}/>
        <KpiCard label="Tiempo medio servicio" value={`${Math.round(avgServiceMin)} min`} sub={`${completed.length} pedidos completos`}/>
        <KpiCard label="Aprobaciones" value={data.approvals.length} sub={`${data.approvals.filter(a=>a.status==='aprobado').length} aprobadas / ${data.approvals.filter(a=>a.status==='rechazado').length} rechazadas`}/>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
        <Card title="Ventas por mozo">
          {waiters.length === 0 ? <div style={{padding:20,textAlign:'center',color:C.dim,fontSize:13}}>Sin actividad</div>
            : <table style={{width:'100%',borderCollapse:'collapse'}}>
                <thead><tr style={{borderBottom:`1px solid ${C.border}`}}><Th>Mozo</Th><Th right>Pedidos</Th><Th right>Ventas</Th></tr></thead>
                <tbody>{waiters.map((w,i) => (
                  <tr key={i} style={{borderBottom:`1px solid ${C.border}`}}>
                    <Td><strong>{w.name}</strong></Td>
                    <Td right mono>{w.count}</Td>
                    <Td right mono><strong>{fmt(w.sales)}</strong></Td>
                  </tr>
                ))}</tbody>
              </table>}
        </Card>

        <Card title="Top productos del día">
          {topItems.length === 0 ? <div style={{padding:20,textAlign:'center',color:C.dim,fontSize:13}}>Sin datos</div>
            : <table style={{width:'100%',borderCollapse:'collapse'}}>
                <thead><tr style={{borderBottom:`1px solid ${C.border}`}}><Th>Producto</Th><Th right>Cantidad</Th><Th right>Subtotal</Th></tr></thead>
                <tbody>{topItems.map((it,i) => (
                  <tr key={i} style={{borderBottom:`1px solid ${C.border}`}}>
                    <Td>{it.name}</Td>
                    <Td right mono><strong>{it.qty}</strong></Td>
                    <Td right mono>{fmt(it.total)}</Td>
                  </tr>
                ))}</tbody>
              </table>}
        </Card>

        {data.cancels.length>0 && (
          <Card title={`Cancelaciones hoy (${data.cancels.length})`} style={{gridColumn:'1 / -1'}}>
            <table style={{width:'100%',borderCollapse:'collapse'}}>
              <thead><tr style={{borderBottom:`1px solid ${C.border}`}}><Th>Hora</Th><Th>Motivo</Th><Th right>Monto</Th></tr></thead>
              <tbody>{data.cancels.map(c => (
                <tr key={c.id} style={{borderBottom:`1px solid ${C.border}`}}>
                  <Td mono dim>{fmtTime(c.created_at)}</Td>
                  <Td>{c.motivo}</Td>
                  <Td right mono>{fmt(c.monto_cancelado)}</Td>
                </tr>
              ))}</tbody>
            </table>
          </Card>
        )}
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════════════════
   MÓDULO 10: SOPORTE (chat con Mythos / Superadmin)
   ════════════════════════════════════════════════════════════════════════════ */
const SUPPORT_CATS = {
  problema_tecnico:'Problema técnico',
  consulta:'Consulta',
  facturacion:'Facturación',
  sugerencia:'Sugerencia',
  urgente:'Urgente',
  otro:'Otro'
};
const SUPPORT_STATUS = {
  abierto:{label:'Abierto', color:'#007AFF'},
  en_curso:{label:'En curso', color:'#FF9500'},
  esperando_cliente:{label:'Esperando respuesta', color:'#86868B'},
  resuelto:{label:'Resuelto', color:'#34C759'},
  cerrado:{label:'Cerrado', color:'#6E6E73'}
};
const PRIO_DOT = {baja:'#86868B', normal:'#007AFF', alta:'#FF9500', urgente:'#FF3B30'};

function Soporte({user, role, userName, userUsername, userEmail}) {
  const [tickets, setTickets] = useState([]);
  const [selected, setSelected] = useState(null);
  const [messages, setMessages] = useState([]);
  const [loading, setLoading] = useState(true);
  const [showNew, setShowNew] = useState(false);
  const [restaurantName, setRestaurantName] = useState('');
  const [restaurantPhone, setRestaurantPhone] = useState(null);
  const scrollRef = useRef(null);

  // Carga del nombre del restaurante (una vez)
  useEffect(() => {
    if (!db) return;
    db.from('restaurants').select('name,phone').eq('id', RID).single().then(({data}) => {
      if (data) { setRestaurantName(data.name||'Restaurante'); setRestaurantPhone(data.phone||null); }
    });
  }, []);

  const loadTickets = useCallback(async () => {
    if (!db) return;
    // El gerente solo ve sus propios tickets — no los del admin (privacidad jerárquica)
    const { data } = await db.from('support_tickets')
      .select('*')
      .eq('restaurant_id', RID)
      .eq('created_by_role', 'supervisor_local')
      .order('last_message_at', {ascending:false})
      .limit(80);
    setTickets(data||[]);
    setLoading(false);
  }, []);

  const loadMessages = useCallback(async (ticketId) => {
    if (!db || !ticketId) return;
    const { data } = await db.from('support_messages')
      .select('*')
      .eq('ticket_id', ticketId)
      .order('created_at', {ascending:true});
    setMessages(data||[]);
    // marcar como leídos del lado cliente
    await db.rpc('support_mark_read', {p_ticket_id: ticketId, p_side: 'client'});
    loadTickets();
  }, [loadTickets]);

  useEffect(() => { loadTickets(); }, [loadTickets]);

  // Realtime — refresh lista y mensajes del ticket abierto
  useEffect(() => {
    if (!db) return;
    const ch = db.channel('support-client-rt')
      .on('postgres_changes',{event:'*',schema:'public',table:'support_tickets',filter:`restaurant_id=eq.${RID}`},() => loadTickets())
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'support_messages'},(payload) => {
        if (selected && payload.new?.ticket_id === selected.id) {
          loadMessages(selected.id);
        } else {
          loadTickets();
        }
      })
      .subscribe();
    const pollId = setInterval(() => { if (!_shouldPause()) loadTickets(); }, 25000);
    return () => { db.removeChannel(ch); clearInterval(pollId); };
  }, [selected, loadTickets, loadMessages]);

  // Scroll automático al fondo
  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages]);

  function openTicket(t) {
    setSelected(t);
    loadMessages(t.id);
  }

  async function createTicket({subject, category, priority, body}) {
    if (!db) return null;
    const payload = {
      restaurant_id: RID,
      restaurant_name: restaurantName,
      created_by_user_id: user?.id||null,
      created_by_name: userName,
      created_by_username: userUsername,
      created_by_role: role,
      created_by_email: userEmail,
      created_by_phone: restaurantPhone,
      subject, category, priority,
      status:'abierto',
      last_message_at: new Date().toISOString(),
      last_message_preview: body.slice(0,140),
      last_message_by_side: 'client',
      total_messages: 0
    };
    const { data: t, error } = await db.from('support_tickets').insert(payload).select('*').single();
    if (error || !t) { toast('No se pudo crear el ticket: '+(error?.message||''), false); return null; }
    const { error: e2 } = await db.from('support_messages').insert({
      ticket_id: t.id,
      author_user_id: user?.id||null,
      author_name: userName,
      author_role: role,
      author_side: 'client',
      body
    });
    if (e2) { toast('No se pudo enviar el mensaje: '+e2.message, false); return null; }
    toast('Ticket enviado a Mythos');
    await loadTickets();
    // re-fetch del ticket para tener los contadores actualizados
    const { data: fresh } = await db.from('support_tickets').select('*').eq('id', t.id).single();
    setSelected(fresh||t);
    loadMessages(t.id);
    return t;
  }

  async function sendReply(body) {
    if (!db || !selected || !body.trim()) return;
    const { error } = await db.from('support_messages').insert({
      ticket_id: selected.id,
      author_user_id: user?.id||null,
      author_name: userName,
      author_role: role,
      author_side: 'client',
      body: body.trim()
    });
    if (error) { toast('Error: '+error.message, false); return; }
    loadMessages(selected.id);
  }

  return (
    <div className="page">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:18}}>
        <div>
          <h2 style={{fontSize:20,fontWeight:800}}>Soporte Mythos</h2>
          <div style={{fontSize:12,color:C.mid,marginTop:3}}>Chat directo con el equipo Mythos · Tus datos se envían automáticamente</div>
        </div>
        <Btn onClick={() => setShowNew(true)}>＋ Nueva consulta</Btn>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'340px 1fr',gap:14,minHeight:520,maxHeight:'calc(100vh - 180px)'}}>
        {/* LISTA DE TICKETS */}
        <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,display:'flex',flexDirection:'column',overflow:'hidden'}}>
          <div style={{padding:'12px 14px',borderBottom:`1px solid ${C.border}`,fontSize:11,color:C.mid,fontWeight:700,textTransform:'uppercase',letterSpacing:1}}>
            Mis tickets ({tickets.length})
          </div>
          <div style={{flex:1,overflowY:'auto'}}>
            {loading ? <div style={{padding:30,textAlign:'center'}}><div className="spin"/></div>
              : tickets.length === 0
                ? <div style={{padding:30,textAlign:'center',color:C.dim,fontSize:13}}>Sin tickets todavía.<br/>Abrí uno nuevo para escribirle al equipo Mythos.</div>
                : tickets.map(t => {
                    const s = SUPPORT_STATUS[t.status]||{label:t.status,color:C.mid};
                    const isSelected = selected?.id === t.id;
                    return (
                      <div key={t.id} onClick={() => openTicket(t)} style={{
                        padding:'12px 14px',borderBottom:`1px solid ${C.border}`,cursor:'pointer',
                        background: isSelected ? '#F0F6FF' : 'transparent',
                        borderLeft: isSelected ? `3px solid ${C.blue}` : '3px solid transparent',
                        transition:'background .15s'
                      }}>
                        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:6,marginBottom:4}}>
                          <div style={{fontSize:13,fontWeight:700,flex:1,minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{t.subject}</div>
                          {t.unread_for_client > 0 && (
                            <span style={{background:C.red,color:'#fff',fontSize:10,fontWeight:800,padding:'1px 6px',borderRadius:8,flexShrink:0}}>{t.unread_for_client}</span>
                          )}
                        </div>
                        <div style={{fontSize:11,color:C.mid,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',marginBottom:6}}>
                          {t.last_message_by_side==='support' && <span style={{color:C.blue,fontWeight:700}}>Mythos: </span>}
                          {t.last_message_preview||'—'}
                        </div>
                        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:6}}>
                          <Badge color={s.color}>{s.label}</Badge>
                          <span style={{fontSize:10,color:C.dim}}>{fmtDT(t.last_message_at)}</span>
                        </div>
                      </div>
                    );
                  })
            }
          </div>
        </div>

        {/* CHAT */}
        <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,display:'flex',flexDirection:'column',overflow:'hidden'}}>
          {!selected ? (
            <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:10,padding:40,color:C.dim}}>
              <div style={{fontSize:28,opacity:.4}}>💬</div>
              <div style={{fontSize:14,fontWeight:600,color:C.mid}}>Seleccioná un ticket o creá uno nuevo</div>
              <div style={{fontSize:12,maxWidth:340,textAlign:'center'}}>El equipo Mythos verá automáticamente quién sos, tu rol y tu restaurante. Vos solo escribí tu consulta.</div>
            </div>
          ) : (
            <SoporteChat
              ticket={selected}
              messages={messages}
              onSend={sendReply}
              currentUserId={user?.id}
              onClose={() => setSelected(null)}
            />
          )}
        </div>
      </div>

      {showNew && (
        <NewTicketModal
          onClose={() => setShowNew(false)}
          onCreate={async (d) => { const t = await createTicket(d); if (t) setShowNew(false); }}
          userName={userName}
          role={role}
          email={userEmail}
          restaurantName={restaurantName}
        />
      )}
    </div>
  );
}

function SoporteChat({ticket, messages, onSend, currentUserId, onClose}) {
  const [draft, setDraft] = useState('');
  const [sending, setSending] = useState(false);
  const scrollRef = useRef(null);
  const s = SUPPORT_STATUS[ticket.status]||{label:ticket.status,color:C.mid};
  const closed = ['resuelto','cerrado'].includes(ticket.status);

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages]);

  async function submit() {
    if (!draft.trim() || sending) return;
    setSending(true);
    await onSend(draft);
    setDraft('');
    setSending(false);
  }

  return (
    <>
      {/* Header */}
      <div style={{padding:'12px 16px',borderBottom:`1px solid ${C.border}`,display:'flex',justifyContent:'space-between',alignItems:'center',gap:10}}>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:14,fontWeight:700,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{ticket.subject}</div>
          <div style={{display:'flex',gap:6,marginTop:4,alignItems:'center',flexWrap:'wrap'}}>
            <Badge color={s.color}>{s.label}</Badge>
            <span style={{fontSize:11,color:C.mid}}>{SUPPORT_CATS[ticket.category]||ticket.category}</span>
            <span style={{fontSize:11,color:PRIO_DOT[ticket.priority]||C.mid,fontWeight:700}}>· Prioridad: {ticket.priority}</span>
          </div>
        </div>
        <button onClick={onClose} style={{background:'none',color:C.mid,fontSize:20,padding:'4px 10px',border:'none',cursor:'pointer'}}>×</button>
      </div>

      {/* Mensajes */}
      <div ref={scrollRef} style={{flex:1,overflowY:'auto',padding:'18px 20px',background:'#FAFAFB',display:'flex',flexDirection:'column',gap:10}}>
        {messages.length === 0 && <div style={{textAlign:'center',color:C.dim,fontSize:12,padding:20}}>Sin mensajes aún…</div>}
        {messages.map(m => {
          if (m.author_side === 'system') {
            return (
              <div key={m.id} style={{textAlign:'center',fontSize:11,color:C.dim,padding:'4px 8px'}}>
                — {m.body} · {fmtTime(m.created_at)} —
              </div>
            );
          }
          const mine = m.author_side === 'client';
          return (
            <div key={m.id} style={{display:'flex',justifyContent: mine?'flex-end':'flex-start'}}>
              <div style={{maxWidth:'78%'}}>
                <div style={{
                  background: mine ? '#000' : '#fff',
                  color: mine ? '#fff' : C.ink,
                  border: mine ? '1px solid #000' : `1px solid ${C.border}`,
                  padding:'9px 13px',borderRadius:12,
                  borderBottomRightRadius: mine?4:12,
                  borderBottomLeftRadius:  mine?12:4,
                  fontSize:13,lineHeight:1.45,whiteSpace:'pre-wrap',wordBreak:'break-word'
                }}>{m.body}</div>
                <div style={{fontSize:10,color:C.dim,marginTop:3,textAlign: mine?'right':'left'}}>
                  {mine ? 'Vos' : (m.author_name||'Mythos')} · {fmtTime(m.created_at)}
                </div>
              </div>
            </div>
          );
        })}
      </div>

      {/* Composer */}
      <div style={{padding:12,borderTop:`1px solid ${C.border}`,background:C.surface}}>
        {closed && (
          <div style={{fontSize:11,color:C.mid,marginBottom:8,textAlign:'center'}}>
            Este ticket está {SUPPORT_STATUS[ticket.status]?.label?.toLowerCase()}. Si volvés a escribir, se reabrirá.
          </div>
        )}
        <div style={{display:'flex',gap:8,alignItems:'flex-end'}}>
          <Txt
            value={draft}
            onChange={e => setDraft(e.target.value)}
            rows={2}
            placeholder="Escribí tu mensaje al equipo Mythos…"
            onKeyDown={e => { if (e.key==='Enter' && (e.metaKey||e.ctrlKey)) submit(); }}
            style={{minHeight:46,resize:'none'}}
          />
          <Btn onClick={submit} disabled={sending || !draft.trim()} style={{flexShrink:0}}>{sending?'Enviando…':'Enviar'}</Btn>
        </div>
        <div style={{fontSize:10,color:C.dim,marginTop:5,textAlign:'right'}}>Ctrl/Cmd + Enter para enviar</div>
      </div>
    </>
  );
}

function NewTicketModal({onClose, onCreate, userName, role, email, restaurantName}) {
  const [subject, setSubject] = useState('');
  const [category, setCategory] = useState('consulta');
  const [priority, setPriority] = useState('normal');
  const [body, setBody] = useState('');
  const [saving, setSaving] = useState(false);

  async function save() {
    if (!subject.trim() || !body.trim()) { toast('Completá el asunto y el mensaje', false); return; }
    setSaving(true);
    await onCreate({subject:subject.trim(), category, priority, body:body.trim()});
    setSaving(false);
  }

  return (
    <Modal title="Nueva consulta a Mythos" onClose={onClose} width={560}>
      <div style={{display:'flex',flexDirection:'column',gap:12}}>
        <div style={{background:C.bg,border:`1px solid ${C.border}`,borderRadius:8,padding:'10px 12px',fontSize:11,color:C.mid,lineHeight:1.5}}>
          <div style={{fontWeight:700,color:C.ink,marginBottom:4}}>Estos datos se envían automáticamente:</div>
          <div>• Restaurante: <strong style={{color:C.ink}}>{restaurantName||'—'}</strong></div>
          <div>• Usuario: <strong style={{color:C.ink}}>{userName}</strong> ({role})</div>
          {email && <div>• Email: <strong style={{color:C.ink}}>{email}</strong></div>}
        </div>

        <div><Lbl>Asunto</Lbl>
          <Inp value={subject} onChange={e=>setSubject(e.target.value)} placeholder="Resumen breve del problema o consulta" autoFocus/>
        </div>

        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
          <div><Lbl>Categoría</Lbl>
            <Sel value={category} onChange={e=>setCategory(e.target.value)}>
              {Object.entries(SUPPORT_CATS).map(([k,v]) => <option key={k} value={k}>{v}</option>)}
            </Sel>
          </div>
          <div><Lbl>Prioridad</Lbl>
            <Sel value={priority} onChange={e=>setPriority(e.target.value)}>
              <option value="baja">Baja</option>
              <option value="normal">Normal</option>
              <option value="alta">Alta</option>
              <option value="urgente">Urgente</option>
            </Sel>
          </div>
        </div>

        <div><Lbl>Descripción del problema / consulta</Lbl>
          <Txt value={body} onChange={e=>setBody(e.target.value)} rows={6} placeholder="Describí con el mayor detalle posible qué está pasando, qué intentaste, qué esperabas que pasara…"/>
        </div>

        <div style={{display:'flex',gap:8,justifyContent:'flex-end',marginTop:4}}>
          <Btn variant="ghost" onClick={onClose}>Cancelar</Btn>
          <Btn onClick={save} disabled={saving}>{saving?'Enviando…':'Enviar consulta'}</Btn>
        </div>
      </div>
    </Modal>
  );
}

/* ════════════════════════════════════════════════════════════════════════════
   SOLICITUDES DE PERSONAL
   ════════════════════════════════════════════════════════════════════════════ */
const STAFF_ROLES = ['mozo','cajero','cocina','rider','supervisor_local'];
const ROLE_LABEL  = {mozo:'Mozo',cajero:'Cajero',cocina:'Cocina',rider:'Rider',supervisor_local:'Supervisor / Gerente'};
const SR_STATUS   = {pending:'Pendiente',approved:'Aprobado',rejected:'Rechazado'};
const SR_COLOR    = {pending:C.orange,approved:C.green,rejected:C.red};

function SolicitudPersonal({user, userName}) {
  const [list, setList]       = useState([]);
  const [loading, setLoading] = useState(true);
  const [showForm, setShowForm] = useState(false);
  const [saving, setSaving]   = useState(false);
  const blank = {full_name:'',username:'',role:'mozo',dni:'',phone:'',email:'',notes:''};
  const [form, setForm]       = useState(blank);

  async function load() {
    if (!db) return;
    setLoading(true);
    const {data} = await db.from('staff_requests')
      .select('*').eq('restaurant_id',RID)
      .order('created_at',{ascending:false});
    setList(data||[]);
    setLoading(false);
  }

  useEffect(()=>{ load(); },[]);

  async function save() {
    if (!form.full_name.trim()) { toast('Ingresá el nombre completo',false); return; }
    if (!form.username.trim())  { toast('Ingresá el usuario propuesto',false); return; }
    setSaving(true);
    const {error} = await db.from('staff_requests').insert({
      restaurant_id: RID,
      requested_by: user.id,
      requested_by_name: userName||'—',
      full_name: form.full_name.trim(),
      username: form.username.trim().toLowerCase(),
      role: form.role,
      dni: form.dni.trim(),
      phone: form.phone.trim(),
      email: form.email.trim(),
      notes: form.notes.trim(),
    });
    setSaving(false);
    if (error) { toast('Error: '+error.message, false); return; }
    toast('Solicitud enviada al administrador');
    setForm(blank);
    setShowForm(false);
    load();
  }

  const pendientes = list.filter(x=>x.status==='pending').length;

  return (
    <div className="page">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
        <div>
          <h1 style={{fontSize:22,fontWeight:800,color:C.ink}}>Solicitudes de personal</h1>
          <div style={{fontSize:12,color:C.mid,marginTop:2}}>El administrador revisará y dará de alta al nuevo empleado</div>
        </div>
        <Btn onClick={()=>setShowForm(true)}>+ Nueva solicitud</Btn>

      {pendientes>0 && (
        <div style={{marginBottom:14,padding:'10px 14px',background:'#FFF9F0',border:'1px solid #FFDDA3',borderRadius:8,fontSize:13,color:C.orange,fontWeight:600}}>
          {pendientes} solicitud{pendientes>1?'es':''} pendiente{pendientes>1?'s':''} de revisión por el administrador
        </div>

      {loading && <div style={{display:'flex',gap:10,alignItems:'center',color:C.mid,fontSize:13}}><span className="spin"/>Cargando…</div>}
      {!loading && (
        <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,overflow:'hidden'}}>
          <table style={{width:'100%',borderCollapse:'collapse'}}>
            <thead>
              <tr style={{borderBottom:`1px solid ${C.border}`}}>
                <Th>Nombre completo</Th><Th>Usuario</Th><Th>Rol</Th><Th>DNI/CI</Th><Th>Teléfono</Th><Th>Estado</Th><Th>Fecha</Th>
              </tr>
            </thead>
            <tbody>
              {list.map(r => (
                <tr key={r.id} style={{borderBottom:`1px solid #F0F0F0`}}>
                  <Td>{r.full_name}</Td>
                  <Td mono>{r.username||'—'}</Td>
                  <Td><span style={{background:(SR_COLOR[r.status]||C.mid)+'18',color:SR_COLOR[r.status]||C.mid,border:`1px solid ${(SR_COLOR[r.status]||C.mid)}33`,padding:'2px 8px',fontSize:11,fontWeight:700,borderRadius:4}}>{ROLE_LABEL[r.role]||r.role}</span></Td>
                  <Td dim>{r.dni||'—'}</Td>
                  <Td dim>{r.phone||'—'}</Td>
                  <Td>
                    <span style={{background:(SR_COLOR[r.status]||C.mid)+'18',color:SR_COLOR[r.status]||C.mid,border:`1px solid ${(SR_COLOR[r.status]||C.mid)}33`,padding:'2px 8px',fontSize:11,fontWeight:700,borderRadius:4}}>
                      {SR_STATUS[r.status]||r.status}
                    </span>
                    {r.review_notes && <div style={{fontSize:11,color:C.mid,marginTop:3}}>{r.review_notes}</div>}
                  </Td>
                  <Td mono dim>{fmtDate(r.created_at)}</Td>
                </tr>
              ))}
              {list.length===0 && <Empty cols={7} label="Sin solicitudes. Usá + Nueva solicitud para enviar una al administrador."/>}
            </tbody>
          </table>
        </div>
      )}

      {showForm && (
        <Modal title="Nueva solicitud de incorporación" onClose={()=>setShowForm(false)} width={520}>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'14px 16px'}}>
            <div style={{gridColumn:'1/-1'}}>
              <Lbl>Nombre completo *</Lbl>
              <Inp value={form.full_name} onChange={e=>setForm(f=>({...f,full_name:e.target.value}))} placeholder="ej: Juan García" autoFocus/>
            </div>
            <div>
              <Lbl>Usuario propuesto *</Lbl>
              <Inp value={form.username} onChange={e=>setForm(f=>({...f,username:e.target.value}))} placeholder="ej: juanmozo"/>
            </div>
            <div>
              <Lbl>Rol</Lbl>
              <Sel value={form.role} onChange={e=>setForm(f=>({...f,role:e.target.value}))}>
                {STAFF_ROLES.map(r=><option key={r} value={r}>{ROLE_LABEL[r]||r}</option>)}
              </Sel>
            </div>
            <div>
              <Lbl>DNI / Cédula</Lbl>
              <Inp value={form.dni} onChange={e=>setForm(f=>({...f,dni:e.target.value}))} placeholder="ej: 4.123.456"/>
            </div>
            <div>
              <Lbl>Teléfono</Lbl>
              <Inp value={form.phone} onChange={e=>setForm(f=>({...f,phone:e.target.value}))} placeholder="ej: 0981 123456"/>
            </div>
            <div style={{gridColumn:'1/-1'}}>
              <Lbl>Email</Lbl>
              <Inp value={form.email} onChange={e=>setForm(f=>({...f,email:e.target.value}))} placeholder="ej: juan@email.com" type="email"/>
            </div>
            <div style={{gridColumn:'1/-1'}}>
              <Lbl>Notas / observaciones</Lbl>
              <Txt value={form.notes} onChange={e=>setForm(f=>({...f,notes:e.target.value}))} placeholder="Experiencia previa, referencia, horario preferido…"/>
            </div>
          </div>
          <div style={{marginTop:14,padding:'8px 12px',background:C.bg,borderRadius:8,fontSize:12,color:C.mid}}>
            El administrador recibirá esta solicitud y luego de una entrevista dará de alta al empleado.
          </div>
          <div style={{display:'flex',gap:8,justifyContent:'flex-end',marginTop:16}}>
            <Btn variant="ghost" onClick={()=>setShowForm(false)} disabled={saving}>Cancelar</Btn>
            <Btn onClick={save} disabled={saving}>{saving?'Enviando…':'Enviar solicitud'}</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════════════════
   CALENDARIO
   ════════════════════════════════════════════════════════════════════════════ */
const G_CAL_TYPES = {
  holiday: {label:'Feriado',    color:'#FF3B30', icon:'🏖'},
  event:   {label:'Evento',     color:'#007AFF', icon:'🎉'},
  sport:   {label:'Deportivo',  color:'#34C759', icon:'⚽'},
  special: {label:'Especial',   color:'#AF52DE', icon:'🎊'},
  promo:   {label:'Promoción',  color:'#FF9500', icon:'📢'},
};
const G_CAL_CROWD = {
  low:    {label:'Afluencia baja',  color:'#34C759', dot:'🟢'},
  medium: {label:'Afluencia media', color:'#FF9500', dot:'🟡'},
  high:   {label:'Afluencia alta',  color:'#FF3B30', dot:'🔴'},
};
const G_WEEK   = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const G_MONTHS = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

function gCalGridDays(year, month) {
  const first    = new Date(year, month, 1);
  const last     = new Date(year, month + 1, 0);
  const startDow = (first.getDay() + 6) % 7;
  const days = [];
  for (let i = 0; i < startDow; i++) days.push(null);
  for (let d = 1; d <= last.getDate(); d++) days.push(d);
  return days;
}

function CalendarioGerente({user, userName}) {
  const now = new Date();
  const [year,  setYear]  = useState(now.getFullYear());
  const [month, setMonth] = useState(now.getMonth());
  const [events, setEvents] = useState([]);
  const [loading, setLoading] = useState(false);
  const [selected, setSelected] = useState(null);
  const [form, setForm] = useState({title:'', type:'event', end_date:'', expected_crowd:'medium', notes:''});
  const [editId, setEditId] = useState(null);
  const [saving, setSaving] = useState(false);

  const loadEvents = useCallback(async () => {
    if (!db) return;
    setLoading(true);
    const mm   = String(month + 1).padStart(2,'0');
    const days = new Date(year, month + 1, 0).getDate();
    const {data} = await db.from('calendar_events')
      .select('*')
      .or(`restaurant_id.eq.${RID},is_global.eq.true`)
      .gte('date', `${year}-${mm}-01`)
      .lte('date', `${year}-${mm}-${days}`)
      .order('date');
    setEvents(data || []);
    setLoading(false);
  }, [year, month]);

  useEffect(() => { loadEvents(); }, [loadEvents]);

  const prevMonth = () => { if (month===0){setYear(y=>y-1);setMonth(11);}else setMonth(m=>m-1); setSelected(null); };
  const nextMonth = () => { if (month===11){setYear(y=>y+1);setMonth(0);}else setMonth(m=>m+1); setSelected(null); };

  const days    = gCalGridDays(year, month);
  const today   = new Date();
  const isToday = d => d===today.getDate() && month===today.getMonth() && year===today.getFullYear();

  const evtsForDay = d => {
    if (!d) return [];
    const ds = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    return events.filter(e => e.date <= ds && (e.end_date ? e.end_date >= ds : e.date === ds));
  };

  const selDate = selected ? `${year}-${String(month+1).padStart(2,'0')}-${String(selected).padStart(2,'0')}` : null;
  const selEvts = selected ? evtsForDay(selected) : [];

  const resetForm = () => { setForm({title:'', type:'event', end_date:'', expected_crowd:'medium', notes:''}); setEditId(null); };
  const startEdit = e => { setForm({title:e.title, type:e.type, end_date:e.end_date||'', expected_crowd:e.expected_crowd||'medium', notes:e.notes||''}); setEditId(e.id); };

  const save = async () => {
    if (!form.title.trim() || !selDate || !db) return;
    setSaving(true);
    const payload = {
      restaurant_id:  RID,
      title:          form.title.trim(),
      type:           form.type,
      date:           selDate,
      end_date:       form.end_date || null,
      expected_crowd: form.expected_crowd,
      notes:          form.notes || null,
      color:          G_CAL_TYPES[form.type]?.color || '#007AFF',
      is_global:      false,
    };
    if (editId) await db.from('calendar_events').update(payload).eq('id', editId);
    else        await db.from('calendar_events').insert(payload);
    setSaving(false);
    resetForm();
    loadEvents();
  };

  const del = async id => {
    if (!db) return;
    await db.from('calendar_events').delete().eq('id', id).eq('restaurant_id', RID);
    loadEvents();
  };

  const highDays = [...new Set(events.filter(e => e.expected_crowd === 'high').map(e => e.date))].length;

  const upcoming = [...events]
    .filter(e => { const d = new Date(); d.setHours(0,0,0,0); return new Date(e.date + 'T12:00:00') >= d; })
    .sort((a,b) => a.date.localeCompare(b.date))
    .slice(0, 5);

  return (
    <div>
      <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:20,gap:12,flexWrap:'wrap'}}>
        <div>
          <h2 style={{fontSize:20,fontWeight:800,color:C.ink,margin:0}}>Calendario de Eventos</h2>
          <div style={{fontSize:12,color:C.mid,marginTop:3}}>Eventos, feriados y alertas de afluencia del local</div>
        </div>
        {highDays > 0 && (
          <div style={{background:'#FFF4E0',border:'1px solid #FFD580',borderRadius:8,padding:'6px 12px',fontSize:12,fontWeight:600,color:'#8A4B00'}}>
            🔴 {highDays} día{highDays>1?'s':''} de alta afluencia este mes
          </div>
        )}
      </div>

      <div style={{display:'flex',gap:20,alignItems:'flex-start',flexWrap:'wrap'}}>
        {/* Grilla */}
        <div style={{flex:'1 1 0',minWidth:280}}>
          <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:14}}>
            <button onClick={prevMonth} style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:7,width:32,height:32,fontSize:16,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>‹</button>
            <div style={{flex:1,textAlign:'center',fontWeight:800,fontSize:15,color:C.ink}}>{G_MONTHS[month]} {year}</div>
            <button onClick={nextMonth} style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:7,width:32,height:32,fontSize:16,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>›</button>
            <button onClick={()=>{setYear(today.getFullYear());setMonth(today.getMonth());setSelected(null);}} style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:7,padding:'4px 9px',fontSize:11,fontWeight:700,cursor:'pointer',color:C.mid}}>Hoy</button>
          </div>

          <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:2,marginBottom:2}}>
            {G_WEEK.map(d => <div key={d} style={{textAlign:'center',fontSize:10,fontWeight:800,color:C.mid,padding:'3px 0',textTransform:'uppercase',letterSpacing:.4}}>{d}</div>)}
          </div>

          {loading ? <div style={{textAlign:'center',padding:40}}><span className="spin"/></div> : (
            <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:2}}>
              {days.map((d, i) => {
                const dayEvts = evtsForDay(d);
                const sel     = d && selected === d;
                const isTdy   = isToday(d);
                const hasHigh = dayEvts.some(e => e.expected_crowd === 'high');
                return (
                  <div key={i}
                    onClick={() => { if (d) { setSelected(sel ? null : d); resetForm(); } }}
                    style={{
                      minHeight:62, padding:'5px 6px', borderRadius:7, cursor:d?'pointer':'default',
                      background: sel?'#000':isTdy?'#F0F6FF':hasHigh&&d?'#FFF4E0':d?C.surface:'transparent',
                      border: sel?'1.5px solid #000':isTdy?'1.5px solid #007AFF':hasHigh&&d?'1px solid #FFD580':`1px solid ${C.border}`,
                      transition:'all .1s',
                    }}>
                    {d && <>
                      <div style={{fontSize:12,fontWeight:isTdy?800:500,color:sel?'#fff':isTdy?'#007AFF':C.ink,lineHeight:1,marginBottom:3}}>{d}</div>
                      <div style={{display:'flex',flexWrap:'wrap',gap:2}}>
                        {dayEvts.slice(0,3).map(e=>(
                          <div key={e.id} style={{width:6,height:6,borderRadius:'50%',background:G_CAL_TYPES[e.type]?.color||'#007AFF',flexShrink:0}}/>
                        ))}
                        {dayEvts.length>3 && <div style={{fontSize:9,color:sel?'#ccc':C.mid}}>+{dayEvts.length-3}</div>}
                      </div>
                    </>}
                  </div>
                );
              })}
            </div>
          )}

          <div style={{display:'flex',flexWrap:'wrap',gap:12,marginTop:12,paddingTop:10,borderTop:`1px solid ${C.border}`}}>
            {Object.entries(G_CAL_TYPES).map(([k,v])=>(
              <div key={k} style={{display:'flex',alignItems:'center',gap:4,fontSize:10,color:C.mid}}>
                <div style={{width:7,height:7,borderRadius:'50%',background:v.color}}/>
                {v.label}
              </div>
            ))}
            <div style={{display:'flex',alignItems:'center',gap:4,fontSize:10,color:'#8A4B00'}}>
              <div style={{width:7,height:7,borderRadius:2,background:'#FFD580'}}/>
              Alta afluencia
            </div>
          </div>
        </div>

        {/* Panel lateral */}
        <div style={{width:300,flexShrink:0}}>
          {selected ? (
            <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,padding:14}}>
              <div style={{fontWeight:800,fontSize:13,marginBottom:10,color:C.ink,display:'flex',justifyContent:'space-between'}}>
                <span>{String(selected).padStart(2,'0')} {G_MONTHS[month].substring(0,3)} {year}</span>
                <span style={{fontSize:11,color:C.mid,fontWeight:400}}>{selEvts.length} evento{selEvts.length!==1?'s':''}</span>
              </div>

              {selEvts.map(e => (
                <div key={e.id} style={{background:C.bg,borderRadius:7,padding:'9px 11px',marginBottom:6,borderLeft:`3px solid ${G_CAL_TYPES[e.type]?.color||'#007AFF'}`}}>
                  <div style={{display:'flex',alignItems:'flex-start',gap:7}}>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontWeight:600,fontSize:12,color:C.ink,marginBottom:3}}>{G_CAL_TYPES[e.type]?.icon} {e.title}</div>
                      <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
                        <span style={{fontSize:10,padding:'1px 5px',borderRadius:4,background:G_CAL_TYPES[e.type]?.color+'22',color:G_CAL_TYPES[e.type]?.color,fontWeight:700}}>{G_CAL_TYPES[e.type]?.label}</span>
                        <span style={{fontSize:10,padding:'1px 5px',borderRadius:4,background:G_CAL_CROWD[e.expected_crowd]?.color+'22',color:G_CAL_CROWD[e.expected_crowd]?.color,fontWeight:700}}>{G_CAL_CROWD[e.expected_crowd]?.dot} {G_CAL_CROWD[e.expected_crowd]?.label}</span>
                        {e.is_global && <span style={{fontSize:10,padding:'1px 5px',borderRadius:4,background:'#F0F0F5',color:'#8E8E93',fontWeight:700}}>Global</span>}
                      </div>
                      {e.notes && <div style={{fontSize:11,color:C.mid,marginTop:3}}>{e.notes}</div>}
                    </div>
                    {e.restaurant_id === RID && (
                      <div style={{display:'flex',gap:3,flexShrink:0}}>
                        <button onClick={()=>startEdit(e)} style={{background:'none',border:`1px solid ${C.border}`,borderRadius:5,padding:'2px 6px',fontSize:11,cursor:'pointer',color:C.mid}}>✎</button>
                        <button onClick={()=>del(e.id)} style={{background:'none',border:`1px solid rgba(239,68,68,.3)`,borderRadius:5,padding:'2px 6px',fontSize:11,cursor:'pointer',color:C.red}}>✕</button>
                      </div>
                    )}
                  </div>
                </div>
              ))}

              <div style={{borderTop:selEvts.length?`1px solid ${C.border}`:'none',paddingTop:selEvts.length?10:0,marginTop:selEvts.length?4:0}}>
                <div style={{fontSize:10,fontWeight:800,color:C.mid,textTransform:'uppercase',letterSpacing:.5,marginBottom:7}}>
                  {editId ? '✎ Editar' : '+ Nuevo evento'}
                </div>
                <div style={{display:'flex',flexDirection:'column',gap:7}}>
                  <input value={form.title} onChange={e=>setForm(f=>({...f,title:e.target.value}))} placeholder="Título" style={{padding:'7px 9px',fontSize:12,borderRadius:7,border:`1px solid ${C.border}`,width:'100%'}}/>
                  <select value={form.type} onChange={e=>setForm(f=>({...f,type:e.target.value}))} style={{padding:'7px 9px',fontSize:12,borderRadius:7,border:`1px solid ${C.border}`}}>
                    {Object.entries(G_CAL_TYPES).map(([k,v])=><option key={k} value={k}>{v.icon} {v.label}</option>)}
                  </select>
                  <select value={form.expected_crowd} onChange={e=>setForm(f=>({...f,expected_crowd:e.target.value}))} style={{padding:'7px 9px',fontSize:12,borderRadius:7,border:`1px solid ${C.border}`}}>
                    {Object.entries(G_CAL_CROWD).map(([k,v])=><option key={k} value={k}>{v.dot} {v.label}</option>)}
                  </select>
                  <textarea value={form.notes} onChange={e=>setForm(f=>({...f,notes:e.target.value}))} placeholder="Notas" rows={2} style={{padding:'7px 9px',fontSize:12,borderRadius:7,border:`1px solid ${C.border}`,resize:'none',fontFamily:'inherit'}}/>
                  <div style={{display:'flex',gap:6}}>
                    {editId && <Btn variant="ghost" small onClick={resetForm} style={{flex:1}}>Cancelar</Btn>}
                    <Btn small onClick={save} disabled={saving||!form.title.trim()} style={{flex:1}}>
                      {saving ? 'Guardando…' : editId ? 'Guardar' : 'Agregar'}
                    </Btn>
                  </div>
                </div>
              </div>
            </div>
          ) : (
            <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,padding:14}}>
              <div style={{fontWeight:800,fontSize:13,marginBottom:10,color:C.ink}}>Próximos eventos</div>
              {upcoming.length === 0 ? (
                <div style={{fontSize:12,color:C.mid,textAlign:'center',padding:'20px 0',lineHeight:1.6}}>
                  Sin eventos próximos.<br/>
                  <span style={{fontSize:11}}>Hacé clic en un día para agregar.</span>
                </div>
              ) : upcoming.map(e => {
                const d = new Date(e.date + 'T12:00:00');
                return (
                  <div key={e.id} style={{display:'flex',gap:10,alignItems:'flex-start',padding:'7px 0',borderBottom:`1px solid ${C.border}`,cursor:'pointer'}}
                    onClick={()=>{setSelected(d.getDate());resetForm();}}>
                    <div style={{width:36,textAlign:'center',flexShrink:0}}>
                      <div style={{fontSize:19,fontWeight:900,color:G_CAL_TYPES[e.type]?.color||C.ink,lineHeight:1}}>{String(d.getDate()).padStart(2,'0')}</div>
                      <div style={{fontSize:9,color:C.mid,textTransform:'uppercase'}}>{G_MONTHS[d.getMonth()].substring(0,3)}</div>
                    </div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:12,fontWeight:600,color:C.ink,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{G_CAL_TYPES[e.type]?.icon} {e.title}</div>
                      <span style={{fontSize:10,color:G_CAL_CROWD[e.expected_crowd]?.color,fontWeight:700}}>{G_CAL_CROWD[e.expected_crowd]?.dot} {G_CAL_CROWD[e.expected_crowd]?.label}</span>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════════════════
   AVISOS DEL PERSONAL
   ════════════════════════════════════════════════════════════════════════════ */
function AvisosGerente({user,userName}) {
  const [received,    setReceived]    = useState([]);
  const [msg,         setMsg]         = useState('');
  const [target,      setTarget]      = useState('trabajadores');
  const [sending,     setSending]     = useState(false);
  const [sent,        setSent]        = useState(null); // mensaje de confirmación

  const TARGETS = [
    {v:'trabajadores', lbl:'Todos los trabajadores (cocina, mozo, caja, riders)'},
    {v:'cocina',       lbl:'Solo Cocina'},
    {v:'mozo',         lbl:'Solo Mozos'},
    {v:'cajero',       lbl:'Solo Caja'},
    {v:'rider',        lbl:'Solo Delivery riders'},
  ];

  useEffect(() => {
    if (!db) return;
    const load = async () => {
      const { data } = await db.from('staff_broadcasts')
        .select('*').eq('restaurant_id', RID)
        .overlaps('target_roles', ['supervisor_local', 'todos'])
        .order('created_at', { ascending: false }).limit(30);
      setReceived(data || []);
    };
    load();
    const ch = db.channel('bc-gerente')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'staff_broadcasts' }, () => load())
      .subscribe();
    return () => db.removeChannel(ch);
  }, []);

  async function enviar() {
    if (!msg.trim() || !db) return;
    setSending(true);
    const { error } = await db.from('staff_broadcasts').insert({
      restaurant_id: RID,
      sender_name: userName || 'Gerente',
      sender_role: 'supervisor_local',
      target_roles: [target],
      message: msg.trim(),
    });
    setSending(false);
    if (error) { toast('Error al enviar: ' + error.message, false); return; }
    setSent('Aviso enviado');
    setMsg('');
    setTimeout(() => setSent(null), 3000);
  }

  return (
    <div>
      <h2 style={{fontSize:20,fontWeight:800,marginBottom:4}}>Avisos al personal</h2>
      <p style={{fontSize:12,color:C.mid,marginBottom:20}}>Enviá un aviso a los trabajadores. No podés enviar avisos al admin.</p>

      {/* Formulario de envío */}
      <div style={{background:C.white,border:`1px solid ${C.border}`,borderRadius:12,padding:20,marginBottom:24}}>
        <div style={{fontSize:12,fontWeight:700,color:C.mid,marginBottom:8,textTransform:'uppercase',letterSpacing:'0.07em'}}>Nuevo aviso</div>
        <textarea
          value={msg} onChange={e=>setMsg(e.target.value)} rows={3}
          placeholder="Escribí el aviso..."
          style={{width:'100%',padding:'10px 12px',borderRadius:8,border:`1px solid ${C.border}`,fontSize:14,marginBottom:12,resize:'vertical',background:C.bg,color:C.ink,boxSizing:'border-box'}}
        />
        <div style={{display:'flex',gap:12,alignItems:'center',flexWrap:'wrap'}}>
          <select value={target} onChange={e=>setTarget(e.target.value)}
            style={{padding:'8px 12px',borderRadius:8,border:`1px solid ${C.border}`,fontSize:13,background:C.bg,color:C.ink}}>
            {TARGETS.map(t=><option key={t.v} value={t.v}>{t.lbl}</option>)}
          </select>
          <Btn onClick={enviar} disabled={!msg.trim()||sending}>{sending?'Enviando…':'Enviar aviso'}</Btn>
          {sent && <span style={{fontSize:12,color:C.green,fontWeight:600}}>{sent}</span>}
        </div>
      </div>

      {/* Avisos recibidos del admin */}
      {received.length > 0 && (
        <div>
          <div style={{fontSize:12,fontWeight:700,color:C.mid,marginBottom:10,textTransform:'uppercase',letterSpacing:'0.07em'}}>Avisos recibidos del admin</div>
          <div style={{display:'flex',flexDirection:'column',gap:8}}>
            {received.map(b=>(
              <div key={b.id} style={{background:C.white,border:`1px solid ${C.border}`,borderLeft:'4px solid #007AFF',borderRadius:10,padding:'12px 16px'}}>
                <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
                  <span style={{fontSize:12,fontWeight:700,color:C.mid}}>{b.sender_name}</span>
                  <span style={{fontSize:11,color:C.dim}}>{new Date(b.created_at).toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'})}</span>
                </div>
                <div style={{fontSize:14,color:C.ink,lineHeight:1.5}}>{b.message}</div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════════════════
   APP SHELL
   ════════════════════════════════════════════════════════════════════════════ */
function App() {
  const auth = useAuth();
  const [section, setSection] = useState('dashboard');
  const [pendingApprovals, setPendingApprovals] = useState(0);
  const [unreadSupport, setUnreadSupport] = useState(0);
  const [pendingStaffReqs, setPendingStaffReqs] = useState(0);
  const [unreadBroadcasts, setUnreadBroadcasts] = useState(0);
  const lastSeenBroadcasts = useRef(parseInt(localStorage.getItem('gerente_bc_seen') || '0'));
  const [themeMode, setThemeMode] = useState(window.MythosTheme ? window.MythosTheme.get() : 'light');
  useEffect(() => {
    const onTheme = e => setThemeMode(e.detail.mode);
    document.addEventListener('mythos:themechange', onTheme);
    return () => document.removeEventListener('mythos:themechange', onTheme);
  }, []);

  useEffect(() => {
    if (!db || !auth.user) return;
    const tick = async () => {
      if (_shouldPause()) return;
      const { count } = await db.from('manager_approvals').select('id',{count:'exact', head:true}).eq('restaurant_id',RID).eq('status','pendiente');
      setPendingApprovals(count||0);
      // unread soporte: solo tickets del gerente (no los del admin)
      const { data: tk } = await db.from('support_tickets')
        .select('unread_for_client').eq('restaurant_id',RID).eq('created_by_role','supervisor_local').neq('status','cerrado');
      setUnreadSupport((tk||[]).reduce((s,t)=>s+(t.unread_for_client||0),0));
      const { count: srCount } = await db.from('staff_requests').select('id',{count:'exact',head:true}).eq('restaurant_id',RID).eq('status','pending');
      setPendingStaffReqs(srCount||0);
    };
    tick();
    const id = setInterval(tick, 20000);
    return () => clearInterval(id);
  }, [auth.user]);

  /* Contador de avisos no leídos */
  useEffect(() => {
    if (!db || !auth.user) return;
    const load = async () => {
      const { data } = await db.from('staff_broadcasts')
        .select('created_at').eq('restaurant_id', RID)
        .overlaps('target_roles', ['supervisor_local', 'todos'])
        .order('created_at', { ascending: false }).limit(30);
      const unread = (data || []).filter(b => new Date(b.created_at).getTime() > lastSeenBroadcasts.current).length;
      setUnreadBroadcasts(unread);
    };
    load();
    const ch = db.channel('bc-gerente-count')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'staff_broadcasts' }, () => load())
      .subscribe();
    return () => db.removeChannel(ch);
  }, [auth.user]);

  if (auth.loading) return <div style={{height:'100vh',display:'flex',alignItems:'center',justifyContent:'center'}}><div className="spin"/></div>;
  if (!auth.user) return null;
  if (!db) return <div style={{padding:40,textAlign:'center'}}>Sin conexión a Supabase. Verificá <code>config.js</code>.</div>;

  const sections = [
    {key:'dashboard', label:'Dashboard', icon:'dashboard'},
    {key:'turno',     label:'Supervisión', icon:'users'},
    {key:'aprobaciones', label:'Aprobaciones', icon:'checkCircle', badge: pendingApprovals},
    {key:'quejas',    label:'Quejas y ratings', icon:'alert'},
    {key:'stock86',   label:'Stock / 86d', icon:'package'},
    {key:'caja',      label:'Caja en vivo', icon:'money'},
    {key:'reservas',  label:'Reservas', icon:'calendar'},
    {key:'calendario',label:'Calendario', icon:'layout'},
    {key:'bitacora',  label:'Bitácora', icon:'fileText'},
    {key:'reportes',  label:'Reportes', icon:'chart'},
    {key:'personal',  label:'Solicitudes personal', icon:'user', badge: pendingStaffReqs},
    {key:'avisos',    label:'Avisos al personal',  icon:'bell', badge: unreadBroadcasts},
    {key:'soporte',   label:'Soporte Mythos', icon:'chat', badge: unreadSupport},
  ];

  return (
    <div style={{display:'flex',minHeight:'100vh',background:C.bg}}>
      {/* Sidebar */}
      <aside style={{width:220,background:C.sidebar,borderRight:`1px solid ${C.border}`,padding:'20px 0',display:'flex',flexDirection:'column',flexShrink:0}}>
        <div style={{padding:'0 20px 18px',borderBottom:`1px solid ${C.border}`,display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:8}}>
          <div>
            <div style={{fontSize:20,fontWeight:800,letterSpacing:'-0.5px',color:C.ink}}>Mythos</div>
            <div style={{fontSize:11,color:C.mid,fontWeight:600,marginTop:2}}>Panel Gerente</div>
          </div>
          <button onClick={()=>window.MythosTheme && window.MythosTheme.toggle()} title={themeMode==='dark'?'Cambiar a claro':'Cambiar a oscuro'}
            style={{width:28,height:28,borderRadius:'50%',background:'transparent',border:`1px solid ${C.border}`,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',color:C.ink,flexShrink:0}}>
            <Icon name={themeMode==='dark'?'sun':'moon'} size={13}/>
          </button>
        </div>
        <nav style={{flex:1,padding:'12px 10px',display:'flex',flexDirection:'column',gap:2}}>
          {sections.map(s => (
            <button key={s.key} onClick={() => { setSection(s.key); if(s.key==='avisos'){const now=Date.now();localStorage.setItem('gerente_bc_seen',now);lastSeenBroadcasts.current=now;setUnreadBroadcasts(0);} }} style={{
              display:'flex',alignItems:'center',gap:10,padding:'10px 12px',background:section===s.key?C.ink:'transparent',color:section===s.key?C.sidebar:C.ink,
              border:'none',borderRadius:8,fontSize:13,fontWeight:section===s.key?600:500,textAlign:'left',transition:'background .15s',position:'relative',cursor:'pointer'
            }}>
              <span style={{display:'inline-flex',alignItems:'center',width:16,justifyContent:'center'}}><Icon name={s.icon} size={15}/></span>
              <span style={{flex:1}}>{s.label}</span>
              {s.badge>0 && <span style={{background:section===s.key?C.sidebar:C.red,color:section===s.key?C.red:C.sidebar,fontSize:10,fontWeight:800,padding:'2px 7px',borderRadius:10,minWidth:18,textAlign:'center'}}>{s.badge}</span>}
            </button>
          ))}
        </nav>
        <div style={{padding:'14px 16px',borderTop:`1px solid ${C.border}`}}>
          <div style={{fontSize:12,fontWeight:700,color:C.ink,marginBottom:2}}>{auth.name}</div>
          <div style={{fontSize:11,color:C.mid,marginBottom:10}}>{auth.role}</div>
          <Btn variant="ghost" small full onClick={logout}>Cerrar sesión</Btn>
        </div>
      </aside>

      {/* Main */}
      <main style={{flex:1,padding:'28px 32px',overflowX:'auto',background:C.bg}}>
        {section==='dashboard'    && <Dashboard onJump={setSection}/>}
        {section==='turno'        && <SupervisionTurno/>}
        {section==='aprobaciones' && <Aprobaciones user={auth.user} userName={auth.name}/>}
        {section==='quejas'       && <QuejasYRatings user={auth.user} userName={auth.name}/>}
        {section==='stock86'      && <Stock86 user={auth.user} userName={auth.name}/>}
        {section==='caja'         && <CajaLive/>}
        {section==='reservas'     && <ReservasHoy/>}
        {section==='calendario'   && <CalendarioGerente user={auth.user} userName={auth.name}/>}
        {section==='bitacora'     && <BitacoraTurno user={auth.user} userName={auth.name}/>}
        {section==='reportes'     && <ReportesDelDia/>}
        {section==='personal'     && <SolicitudPersonal user={auth.user} userName={auth.name}/>}
        {section==='avisos'       && <AvisosGerente user={auth.user} userName={auth.name}/>}
        {section==='soporte'      && <Soporte user={auth.user} role={auth.role} userName={auth.name} userUsername={auth.username} userEmail={auth.email}/>}
      </main>

      <ToastContainer/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
