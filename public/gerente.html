<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mythos · Gerente</title>
<link rel="stylesheet" href="design-system.css">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="ui-primitives.css">
<script src="mythos-theme.js"></script>
<script src="mythos-icons.js"></script>
<script src="mythos-offline.js"></script>
<!-- PR-B4B: Gerente activa dark real. init() (sin arg) respeta preferencia/sistema
     y persiste vía el toggle del sidebar (MythosTheme.toggle). Ya NO se pinea 'light'.
     Solo Gerente: el resto de paneles staff siguen pineados hasta su propio PR. -->
<script>MythosTheme.init();</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.1/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="mythos-presence.js"></script>
<script src="mythos-session.js"></script>
<script src="mythos-auth-guard.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg-subtle);font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;color:var(--text-primary);-webkit-font-smoothing:antialiased;transition:background var(--transition),color var(--transition)}
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-track{background:var(--bg-subtle)}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
  input,textarea,select{font-family:inherit;background:var(--surface);border:1px solid var(--border);color:var(--text-primary);outline:none;border-radius:8px}
  input:focus,textarea:focus,select:focus{border-color:var(--text-primary)}
  button{font-family:inherit;cursor:pointer;border:none}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  @keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
  .page{animation:fadeIn .15s ease}
  .pulse{animation:pulse 2s ease infinite}
  .spin{animation:spin .8s linear infinite;display:inline-block;width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--text-primary);border-radius:50%;vertical-align:middle}
</style>
</head>
<body>
<div id="root"></div>
<script>
/* ── Guardia de seguridad — redirige si no hay sesión activa ── */
(function(){
  var rid  = localStorage.getItem('mythos_restaurant_id');
  var role = localStorage.getItem('mythos_role');
  if (!rid && role !== 'superadmin') { window.location.replace('login.html?next=gerente.html'); }
})();
</script>
<!-- PR-5: panel precompilado con Vite. Reemplaza los CDN de React/ReactDOM y el transpilador en navegador + el script JSX inline. El bundle se genera en public/build/ por `npm run build`. -->
<script src="build/gerente.js"></script>
</body>
</html>
