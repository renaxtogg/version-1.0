<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mythos · Gerente</title>
<link rel="stylesheet" href="design-system.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:#F5F5F7;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;color:#1D1D1F;-webkit-font-smoothing:antialiased}
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-track{background:#F5F5F7}
  ::-webkit-scrollbar-thumb{background:#D2D2D7;border-radius:4px}
  input,textarea,select{font-family:inherit;background:#fff;border:1px solid #D2D2D7;color:#1D1D1F;outline:none;border-radius:8px}
  input:focus,textarea:focus,select:focus{border-color:#000}
  button{font-family:inherit;cursor:pointer;border:none}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  @keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
  .page{animation:fadeIn .15s ease}
  .pulse{animation:pulse 2s ease infinite}
  .spin{animation:spin .8s linear infinite;display:inline-block;width:18px;height:18px;border:2px solid #D2D2D7;border-top-color:#1D1D1F;border-radius:50%;vertical-align:middle}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

/* ───────────────────────── DB + CONFIG ───────────────────────── */
const _initDB = () => {
  const cfg = window.SUPABASE_CONFIG;
  if (!cfg?.url || !cfg?.anonKey) return null;
  const url = cfg.url.replace(/^﻿/,'').trim();
  const key = cfg.anonKey.replace(/^﻿/,'').trim();
  if (!url || url.includes('YOUR_') || !key) return null;
  try { return window.supabase.createClient(url, key); } catch(e){ return null; }
};
const db = _initDB();
const RID = ((window.SUPABASE_CONFIG?.restaurantId)||'00000000-0000-0000-0000-000000000001').replace(/^﻿/,'').trim();

/* ───────────────────────── UTILS ───────────────────────── */
const fmt    = n => '₲ ' + (Math.round(n)||0).toLocaleString('es-PY');
const fmtK   = n => n>=1000000 ? `${(n/1000000).toFixed(1)}M` : n>=1000 ? `${Math.round(n/1000)}k` : String(n||0);
const fmtDate= d => d ? new Date(d).toLocaleDateString('es-PY',{day:'2-digit',month:'2-digit',year:'2-digit'}) : '—';
const fmtTime= d => d ? new Date(d).toLocaleTimeString('es-PY',{hour:'2-digit',minute:'2-digit'}) : '—';
const fmtDT  = d => d ? `${fmtDate(d)} ${fmtTime(d)}` : '—';
const minsAgo = d => { if(!d) return 0; return Math.floor((Date.now()-new Date(d).getTime())/60000); };
const SL = {draft:'Borrador',confirmed:'Confirmado',paid:'Nuevo',kitchen_received:'En cocina',cooking:'Preparando',ready:'Listo',delivered:'Entregado',cancelled:'Cancelado'};
const SC = {draft:'#86868B',confirmed:'#6E6E73',paid:'#FF9500',kitchen_received:'#007AFF',cooking:'#FF9500',ready:'#34C759',delivered:'#86868B',cancelled:'#FF3B30'};
const APPROVAL_LABEL = {
  descuento:'Descuento', cortesia:'Cortesía', anulacion_cobro:'Anular cobro',
  cancelacion_item:'Cancelar item', cierre_diferencia:'Cierre con diferencia',
  egreso_mayor:'Egreso mayor', apertura_caja:'Apertura caja',
  reapertura_pedido:'Reabrir pedido', otro:'Otro'
};
const CAT_LOG = {nota:'Nota',incidencia:'Incidencia',tarea:'Tarea',traspaso:'Traspaso',cliente:'Cliente',personal:'Personal',equipo:'Equipo',limpieza:'Limpieza'};
const PRIO_COL = {baja:'#86868B', normal:'#007AFF', alta:'#FF9500', urgente:'#FF3B30'};

const C = {
  bg:'#F5F5F7', surface:'#FFFFFF', sidebar:'#FFFFFF',
  border:'#D2D2D7', bs:'#86868B',
  ink:'#1D1D1F', mid:'#6E6E73', dim:'#86868B',
  green:'#34C759', orange:'#FF9500', red:'#FF3B30', blue:'#007AFF', yellow:'#FFCC00'
};

function mesaLabel(o) {
  if (!o) return '—';
  if (o.order_type === 'llevar')   return 'Para llevar';
  if (o.order_type === 'delivery') return 'Delivery';
  if (o.table_number != null)      return `Mesa ${o.table_number}`;
  if (o.table_id)                  return 'Mesa';
  return 'Sin mesa';
}

/* contador modales / focus → pausa polling */
let _modalCount = 0;
function _shouldPause() {
  if (_modalCount > 0) return true;
  const el = document.activeElement;
  if (!el) return false;
  return ['INPUT','TEXTAREA','SELECT'].includes(el.tagName) || el.isContentEditable;
}

/* ───────────────────────── TOAST ───────────────────────── */
const _toast = { fn: null };
function toast(msg, ok=true) { _toast.fn?.({msg, ok, id: Date.now()}); }
function ToastContainer() {
  const [items, setItems] = useState([]);
  useEffect(() => {
    _toast.fn = it => { setItems(p => [...p.slice(-4), it]); setTimeout(() => setItems(p => p.filter(i => i.id !== it.id)), 4000); };
    return () => { _toast.fn = null; };
  }, []);
  return (
    <div style={{position:'fixed',bottom:20,right:20,zIndex:9999,display:'flex',flexDirection:'column',gap:8,pointerEvents:'none'}}>
      {items.map(it => (
        <div key={it.id} style={{background:it.ok?'#F0FAF3':'#FFF1F0',border:`1px solid ${it.ok?'#A3D9B1':'#FFB3AD'}`,color:it.ok?'#1A7E37':'#C0190F',padding:'10px 16px',fontSize:13,fontWeight:700,borderRadius:8,animation:'slideUp .2s ease',minWidth:220,maxWidth:320}}>
          {it.ok?'✓ ':'✕ '}{it.msg}
        </div>
      ))}
    </div>
  );
}

/* ───────────────────────── MODAL ───────────────────────── */
function Modal({title, onClose, children, width=460}) {
  useEffect(() => {
    _modalCount++;
    const fn = e => e.key === 'Escape' && onClose();
    window.addEventListener('keydown', fn);
    return () => { _modalCount = Math.max(0, _modalCount-1); window.removeEventListener('keydown', fn); };
  }, [onClose]);
  return (
    <div onClick={e => e.target===e.currentTarget && onClose()} style={{position:'fixed',inset:0,background:'rgba(0,0,0,.7)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000,padding:20}}>
      <div style={{background:'#fff',border:`1px solid ${C.border}`,borderRadius:12,padding:24,width:'100%',maxWidth:width,maxHeight:'92vh',overflowY:'auto',animation:'slideUp .2s ease'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:18}}>
          <div style={{fontSize:15,fontWeight:700}}>{title}</div>
          <button onClick={onClose} style={{background:'none',color:C.mid,fontSize:22,lineHeight:1,padding:0}}>×</button>
        </div>
        {children}
      </div>
    </div>
  );
}

/* ───────────────────────── COMPONENTES REUTILIZABLES ───────────────────────── */
function KpiCard({label,value,sub,accent,icon,onClick,alert}) {
  return (
    <div onClick={onClick} style={{background:C.surface,border:`1px solid ${alert?C.red:C.border}`,padding:'16px 18px',flex:1,minWidth:140,borderRadius:10,cursor:onClick?'pointer':'default',transition:'border-color .15s',position:'relative'}}>
      {icon && <div style={{fontSize:18,marginBottom:6}}>{icon}</div>}
      <div style={{fontSize:10,color:C.mid,fontWeight:700,letterSpacing:1,textTransform:'uppercase',marginBottom:6}}>{label}</div>
      <div style={{fontSize:22,fontWeight:800,fontFamily:"'SF Mono',ui-monospace,monospace",color:accent||C.ink,lineHeight:1}}>{value}</div>
      {sub && <div style={{fontSize:11,color:C.dim,marginTop:5}}>{sub}</div>}
    </div>
  );
}
function Badge({color, children, dot=true}) {
  return <span style={{display:'inline-flex',alignItems:'center',gap:5,padding:'3px 8px',fontSize:11,fontWeight:700,background:color+'22',color:color,border:`1px solid ${color}44`,borderRadius:5}}>{dot && <span style={{width:5,height:5,borderRadius:'50%',background:color}}/>}{children}</span>;
}
function StatusBadge({status}) {
  const col = SC[status]||C.mid;
  return <Badge color={col}>{SL[status]||status}</Badge>;
}
function Th({children,right,width}) { return <th style={{padding:'9px 14px',textAlign:right?'right':'left',fontSize:10,color:C.ink,fontWeight:700,letterSpacing:1,textTransform:'uppercase',whiteSpace:'nowrap',width:width||'auto'}}>{children}</th>; }
function Td({children,mono,dim,right,style:sx}) { return <td style={{padding:'10px 14px',fontSize:13,fontFamily:mono?"'SF Mono',ui-monospace,monospace":'inherit',color:dim?C.mid:C.ink,textAlign:right?'right':'left',...sx}}>{children}</td>; }
function Empty({cols, label}) { return <tr><td colSpan={cols} style={{padding:36,textAlign:'center',color:C.dim,fontSize:13}}>{label||'Sin datos'}</td></tr>; }
function Btn({children,onClick,variant='primary',disabled,small,style:sx,full}) {
  const bg = variant==='primary'?'#000':variant==='danger'?'#FFF1F0':variant==='success'?'#F0FAF3':variant==='ghost'?'transparent':'#F5F5F7';
  const color = variant==='primary'?'#fff':variant==='danger'?C.red:variant==='success'?C.green:C.ink;
  const border = variant==='primary'?'#000':variant==='danger'?'#FFB3AD':variant==='success'?'#A3D9B1':`1px solid ${C.border}`;
  return <button onClick={onClick} disabled={disabled} style={{background:bg,color,border:`1px solid ${border}`,padding:small?'6px 10px':'9px 14px',fontSize:small?12:13,fontWeight:600,borderRadius:8,opacity:disabled?.45:1,cursor:disabled?'not-allowed':'pointer',width:full?'100%':'auto',transition:'opacity .15s',...sx}}>{children}</button>;
}
function Lbl({children}) { return <label style={{fontSize:10,color:C.mid,display:'block',marginBottom:5,fontWeight:700,letterSpacing:1,textTransform:'uppercase'}}>{children}</label>; }
function Inp({value,onChange,placeholder,type='text',...rest}) {
  return <input type={type} value={value||''} onChange={onChange} placeholder={placeholder} {...rest} style={{width:'100%',padding:'9px 11px',fontSize:13,borderRadius:6,...(rest.style||{})}}/>;
}
function Sel({value,onChange,children,...rest}) {
  return <select value={value||''} onChange={onChange} {...rest} style={{width:'100%',padding:'9px 11px',fontSize:13,borderRadius:6,...(rest.style||{})}}>{children}</select>;
}
function Txt({value,onChange,placeholder,rows=3,...rest}) {
  return <textarea value={value||''} onChange={onChange} placeholder={placeholder} rows={rows} {...rest} style={{width:'100%',padding:'9px 11px',fontSize:13,borderRadius:6,resize:'vertical',fontFamily:'inherit',...(rest.style||{})}}/>;
}
function Card({title, action, children, style:sx}) {
  return (
    <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,padding:18,...sx}}>
      {(title||action) && (
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
          {title && <div style={{fontSize:13,fontWeight:700,color:C.ink}}>{title}</div>}
          {action}
        </div>
      )}
      {children}
    </div>
  );
}

/* ───────────────────────── AUTH HOOK ───────────────────────── */
function useAuth() {
  const [state, setState] = useState({loading:true, user:null, role:null, name:null});
  useEffect(() => {
    if (!db) { setState({loading:false, user:null, role:null, name:null}); return; }
    (async () => {
      const { data: { session } } = await db.auth.getSession();
      if (!session) { window.location.replace('login.html'); return; }
      const { data: profile } = await db.rpc('get_my_profile');
      if (!profile) { window.location.replace('login.html'); return; }
      const allowed = ['supervisor_local','admin','superadmin'];
      if (!allowed.includes(profile.role)) {
        toast('Acceso denegado: rol no autorizado para este panel', false);
        setTimeout(() => window.location.replace('login.html'), 1500);
        return;
      }
      setState({loading:false, user:session.user, role:profile.role, name:profile.full_name||profile.username||'Gerente'});
    })();
  }, []);
  return state;
}

async function logout() {
  if (!db) return;
  await db.auth.signOut();
  window.location.replace('login.html');
}

/* ════════════════════════════════════════════════════════════════════════════
   MÓDULO 1: DASHBOARD LIVE
   ════════════════════════════════════════════════════════════════════════════ */
function Dashboard({onJump}) {
  const [data, setData] = useState({orders:[], tables:[], waiterCalls:[], complaints:[], approvals:[], ratings:[], item86:[], shiftEmps:[]});
  const [loading, setLoading] = useState(true);

  const load = useCallback(async () => {
    if (!db || _shouldPause()) return;
    const today = new Date(); today.setHours(0,0,0,0);
    const todayISO = today.toISOString();
    const [o, t, w, q, a, r, i86, e] = await Promise.all([
      db.from('orders').select('id,total,status,order_type,table_id,table_number,created_at,paid_at,confirmed_at,payment_status').eq('restaurant_id',RID).gte('created_at', todayISO),
      db.from('tables').select('id,number,is_occupied').eq('restaurant_id',RID),
      db.from('waiter_calls').select('id,table_id,status,created_at').eq('restaurant_id',RID).eq('status','pending'),
      db.from('quejas_sugerencias').select('id,tipo,urgencia,descripcion,estado,created_at').eq('restaurant_id',RID).in('estado',['abierto','en_revision']),
      db.from('manager_approvals').select('id,request_type,amount,reason,status,created_at,requested_by_name').eq('restaurant_id',RID).eq('status','pendiente'),
      db.from('ratings').select('id,stars,created_at').eq('restaurant_id',RID).gte('created_at',todayISO),
      db.from('item_86_list').select('id,item_name').eq('restaurant_id',RID).eq('is_active',true),
      db.from('employee_shifts').select('id,employee_name,role,clock_in,clock_out').eq('restaurant_id',RID).is('clock_out',null)
    ]);
    setData({
      orders: o.data||[], tables: t.data||[], waiterCalls: w.data||[],
      complaints: q.data||[], approvals: a.data||[], ratings: r.data||[],
      item86: i86.data||[], shiftEmps: e.data||[]
    });
    setLoading(false);
  }, []);

  useEffect(() => { load(); const id = setInterval(load, 15000); return () => clearInterval(id); }, [load]);

  const kpis = useMemo(() => {
    const sales = data.orders.filter(o => ['paid','delivered','kitchen_received','cooking','ready'].includes(o.status)).reduce((s,o) => s + (o.total||0), 0);
    const tickets = data.orders.filter(o => ['paid','delivered'].includes(o.status)).length;
    const avg = tickets ? sales/tickets : 0;
    const inKitchen = data.orders.filter(o => ['kitchen_received','cooking'].includes(o.status));
    const delayed = inKitchen.filter(o => minsAgo(o.created_at) > 25);
    const occupied = data.tables.filter(t => t.is_occupied).length;
    const ratingAvg = data.ratings.length ? data.ratings.reduce((s,r) => s + r.stars, 0) / data.ratings.length : 0;
    return { sales, tickets, avg, inKitchen, delayed, occupied, totalTables: data.tables.length, ratingAvg };
  }, [data]);

  if (loading) return <div style={{padding:40,textAlign:'center',color:C.mid}}><div className="spin"/></div>;

  return (
    <div className="page">
      <h2 style={{fontSize:20,fontWeight:800,marginBottom:18}}>Dashboard del turno</h2>

      {/* Alertas críticas */}
      {(data.approvals.length>0 || data.waiterCalls.length>0 || kpis.delayed.length>0 || data.complaints.filter(c=>c.urgencia==='alta').length>0) && (
        <div style={{background:'#FFF1F0',border:`1px solid #FFB3AD`,borderRadius:10,padding:14,marginBottom:16,display:'flex',flexWrap:'wrap',gap:10}}>
          <span style={{fontSize:13,fontWeight:700,color:C.red,marginRight:6}}>⚠ Atención inmediata:</span>
          {data.approvals.length>0 && <button onClick={() => onJump('aprobaciones')} style={{background:'#fff',border:`1px solid ${C.red}`,borderRadius:6,padding:'4px 10px',fontSize:12,fontWeight:700,color:C.red}}>{data.approvals.length} aprobación{data.approvals.length>1?'es':''} pendiente{data.approvals.length>1?'s':''}</button>}
          {data.waiterCalls.length>0 && <button onClick={() => onJump('dashboard')} style={{background:'#fff',border:`1px solid ${C.orange}`,borderRadius:6,padding:'4px 10px',fontSize:12,fontWeight:700,color:C.orange}}>{data.waiterCalls.length} llamada{data.waiterCalls.length>1?'s':''} mozo</button>}
          {kpis.delayed.length>0 && <button onClick={() => onJump('dashboard')} style={{background:'#fff',border:`1px solid ${C.orange}`,borderRadius:6,padding:'4px 10px',fontSize:12,fontWeight:700,color:C.orange}}>{kpis.delayed.length} pedido{kpis.delayed.length>1?'s':''} demorado{kpis.delayed.length>1?'s':''}</button>}
          {data.complaints.filter(c=>c.urgencia==='alta').length>0 && <button onClick={() => onJump('quejas')} style={{background:'#fff',border:`1px solid ${C.red}`,borderRadius:6,padding:'4px 10px',fontSize:12,fontWeight:700,color:C.red}}>{data.complaints.filter(c=>c.urgencia==='alta').length} queja{data.complaints.filter(c=>c.urgencia==='alta').length>1?'s':''} urgente{data.complaints.filter(c=>c.urgencia==='alta').length>1?'s':''}</button>}
        </div>
      )}

      <div style={{display:'flex',gap:12,flexWrap:'wrap',marginBottom:18}}>
        <KpiCard label="Ventas hoy" value={fmt(kpis.sales)} sub={`${kpis.tickets} tickets`} accent={C.green}/>
        <KpiCard label="Ticket promedio" value={fmt(kpis.avg)} sub={`Sobre ${kpis.tickets} tickets`}/>
        <KpiCard label="Mesas ocupadas" value={`${kpis.occupied}/${kpis.totalTables}`} sub={`${Math.round(kpis.occupied/(kpis.totalTables||1)*100)}% ocupación`}/>
        <KpiCard label="En cocina" value={kpis.inKitchen.length} sub={kpis.delayed.length>0?`${kpis.delayed.length} demorados`:'Sin demoras'} accent={kpis.delayed.length>0?C.orange:C.blue} alert={kpis.delayed.length>0}/>
        <KpiCard label="Rating del día" value={kpis.ratingAvg ? `${kpis.ratingAvg.toFixed(1)} ★` : '—'} sub={`${data.ratings.length} calificaciones`} accent={C.yellow}/>
        <KpiCard label="Personal en turno" value={data.shiftEmps.length} sub="Empleados activos"/>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
        <Card title="Pedidos en cocina" action={kpis.inKitchen.length>0 && <span style={{fontSize:11,color:C.mid}}>{kpis.inKitchen.length} activos</span>}>
          {kpis.inKitchen.length === 0
            ? <div style={{padding:20,textAlign:'center',color:C.dim,fontSize:13}}>No hay pedidos en cocina</div>
            : <div style={{display:'flex',flexDirection:'column',gap:8}}>
                {kpis.inKitchen.slice(0,8).map(o => {
                  const ago = minsAgo(o.created_at);
                  const delayed = ago > 25;
                  return (
                    <div key={o.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 10px',background:delayed?'#FFF1F0':'#F5F5F7',borderRadius:6,border:delayed?`1px solid #FFB3AD`:'1px solid transparent'}}>
                      <div>
                        <div style={{fontSize:13,fontWeight:700}}>{mesaLabel(o)}</div>
                        <div style={{fontSize:11,color:C.mid}}>{fmt(o.total)} · {SL[o.status]||o.status}</div>
                      </div>
                      <div style={{fontSize:12,fontWeight:700,color:delayed?C.red:C.mid,fontFamily:"'SF Mono',ui-monospace,monospace"}}>{ago} min</div>
                    </div>
                  );
                })}
              </div>}
        </Card>

        <Card title="Personal en turno">
          {data.shiftEmps.length === 0
            ? <div style={{padding:20,textAlign:'center',color:C.dim,fontSize:13}}>Nadie con turno abierto</div>
            : <div style={{display:'flex',flexDirection:'column',gap:8}}>
                {data.shiftEmps.map(e => (
                  <div key={e.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 10px',background:'#F5F5F7',borderRadius:6}}>
                    <div>
                      <div style={{fontSize:13,fontWeight:700}}>{e.employee_name||'—'}</div>
                      <div style={{fontSize:11,color:C.mid}}>{e.role||'sin rol'}</div>
                    </div>
                    <div style={{fontSize:11,color:C.mid,fontFamily:"'SF Mono',ui-monospace,monospace"}}>desde {fmtTime(e.clock_in)}</div>
                  </div>
                ))}
              </div>}
        </Card>

        {data.waiterCalls.length>0 && (
          <Card title="Llamadas de mozo" style={{background:'#FFF8F0', borderColor:'#FFD8A8'}}>
            <div style={{display:'flex',flexDirection:'column',gap:8}}>
              {data.waiterCalls.map(w => {
                const mesa = data.tables.find(t => t.id === w.table_id);
                return (
                  <div key={w.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 10px',background:'#fff',borderRadius:6,border:`1px solid #FFD8A8`}}>
                    <div style={{fontSize:13,fontWeight:700,color:C.orange}}>Mesa {mesa?.number||'?'}</div>
                    <div style={{fontSize:11,color:C.mid}}>hace {minsAgo(w.created_at)} min</div>
                  </div>
                );
              })}
            </div>
          </Card>
        )}

        {data.item86.length>0 && (
          <Card title="Productos 86d (no disponibles)" action={<button onClick={()=>onJump('stock86')} style={{background:'none',color:C.blue,fontSize:11,fontWeight:700}}>Gestionar →</button>}>
            <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
              {data.item86.map(i => <span key={i.id} style={{padding:'4px 10px',background:'#FFF1F0',color:C.red,border:`1px solid #FFB3AD`,borderRadius:5,fontSize:12,fontWeight:600}}>✕ {i.item_name}</span>)}
            </div>
          </Card>
        )}
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════════════════
   MÓDULO 2: SUPERVISIÓN DE TURNO
   ════════════════════════════════════════════════════════════════════════════ */
function SupervisionTurno() {
  const [emps, setEmps] = useState([]);
  const [orders, setOrders] = useState([]);
  const [loading, setLoading] = useState(true);

  const load = useCallback(async () => {
    if (!db || _shouldPause()) return;
    const today = new Date(); today.setHours(0,0,0,0);
    const [e, o] = await Promise.all([
      db.from('employee_shifts').select('*').eq('restaurant_id',RID).gte('clock_in', today.toISOString()).order('clock_in',{ascending:false}),
      db.from('orders').select('id,total,status,waiter_id,waiter_name,created_at,paid_at').eq('restaurant_id',RID).gte('created_at', today.toISOString())
    ]);
    setEmps(e.data||[]); setOrders(o.data||[]); setLoading(false);
  }, []);
  useEffect(() => { load(); const id = setInterval(load, 30000); return () => clearInterval(id); }, [load]);

  const closeShift = async (empId) => {
    if (!confirm('¿Cerrar turno de este empleado?')) return;
    const { error } = await db.from('employee_shifts').update({clock_out: new Date().toISOString()}).eq('id', empId);
    if (error) toast(error.message, false); else { toast('Turno cerrado'); load(); }
  };

  const waiterStats = useMemo(() => {
    const grouped = {};
    orders.filter(o => o.waiter_id).forEach(o => {
      const k = o.waiter_id;
      if (!grouped[k]) grouped[k] = {name: o.waiter_name||'—', orders:0, sales:0, paid:0};
      grouped[k].orders++;
      grouped[k].sales += o.total||0;
      if (['paid','delivered'].includes(o.status)) grouped[k].paid++;
    });
    return Object.values(grouped).sort((a,b) => b.sales - a.sales);
  }, [orders]);

  if (loading) return <div style={{padding:40,textAlign:'center'}}><div className="spin"/></div>;

  const activos = emps.filter(e => !e.clock_out);
  const cerrados = emps.filter(e => e.clock_out);

  return (
    <div className="page">
      <h2 style={{fontSize:20,fontWeight:800,marginBottom:18}}>Supervisión de turno</h2>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:18}}>
        <Card title={`Empleados activos (${activos.length})`}>
          {activos.length === 0 ? <div style={{padding:20,textAlign:'center',color:C.dim,fontSize:13}}>Sin turnos abiertos</div>
            : <table style={{width:'100%',borderCollapse:'collapse'}}>
                <thead><tr style={{borderBottom:`1px solid ${C.border}`}}><Th>Empleado</Th><Th>Rol</Th><Th>Entrada</Th><Th>Tiempo</Th><Th right>Acción</Th></tr></thead>
                <tbody>{activos.map(e => {
                  const mins = minsAgo(e.clock_in);
                  return (
                    <tr key={e.id} style={{borderBottom:`1px solid ${C.border}`}}>
                      <Td><strong>{e.employee_name||'—'}</strong></Td>
                      <Td dim>{e.role||'—'}</Td>
                      <Td mono>{fmtTime(e.clock_in)}</Td>
                      <Td mono>{Math.floor(mins/60)}h {mins%60}m</Td>
                      <Td right><Btn small variant="danger" onClick={() => closeShift(e.id)}>Cerrar</Btn></Td>
                    </tr>
                  );
                })}</tbody>
              </table>}
        </Card>

        <Card title="Performance por mozo (hoy)">
          {waiterStats.length === 0 ? <div style={{padding:20,textAlign:'center',color:C.dim,fontSize:13}}>Sin actividad</div>
            : <table style={{width:'100%',borderCollapse:'collapse'}}>
                <thead><tr style={{borderBottom:`1px solid ${C.border}`}}><Th>Mozo</Th><Th right>Pedidos</Th><Th right>Cobrados</Th><Th right>Ventas</Th></tr></thead>
                <tbody>{waiterStats.map((w,i) => (
                  <tr key={i} style={{borderBottom:`1px solid ${C.border}`}}>
                    <Td><strong>{w.name}</strong></Td>
                    <Td right mono>{w.orders}</Td>
                    <Td right mono>{w.paid}</Td>
                    <Td right mono><strong>{fmt(w.sales)}</strong></Td>
                  </tr>
                ))}</tbody>
              </table>}
        </Card>
      </div>

      {cerrados.length>0 && (
        <Card title={`Turnos cerrados hoy (${cerrados.length})`}>
          <table style={{width:'100%',borderCollapse:'collapse'}}>
            <thead><tr style={{borderBottom:`1px solid ${C.border}`}}><Th>Empleado</Th><Th>Rol</Th><Th>Entrada</Th><Th>Salida</Th><Th right>Duración</Th></tr></thead>
            <tbody>{cerrados.map(e => {
              const mins = Math.floor((new Date(e.clock_out) - new Date(e.clock_in))/60000);
              return (
                <tr key={e.id} style={{borderBottom:`1px solid ${C.border}`}}>
                  <Td><strong>{e.employee_name||'—'}</strong></Td>
                  <Td dim>{e.role||'—'}</Td>
                  <Td mono>{fmtTime(e.clock_in)}</Td>
                  <Td mono>{fmtTime(e.clock_out)}</Td>
                  <Td right mono>{Math.floor(mins/60)}h {mins%60}m</Td>
                </tr>
              );
            })}</tbody>
          </table>
        </Card>
      )}
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════════════════
   MÓDULO 3: CENTRO DE APROBACIONES
   ════════════════════════════════════════════════════════════════════════════ */
function Aprobaciones({user, userName}) {
  const [list, setList] = useState([]);
  const [filter, setFilter] = useState('pendiente');
  const [showNew, setShowNew] = useState(false);
  const [loading, setLoading] = useState(true);

  const load = useCallback(async () => {
    if (!db) return;
    let q = db.from('manager_approvals').select('*').eq('restaurant_id',RID).order('created_at',{ascending:false}).limit(80);
    if (filter !== 'todos') q = q.eq('status', filter);
    const { data } = await q;
    setList(data||[]); setLoading(false);
  }, [filter]);
  useEffect(() => { load(); const id = setInterval(() => { if (!_shouldPause()) load(); }, 15000); return () => clearInterval(id); }, [load]);

  const resolve = async (id, status, note='') => {
    const { error } = await db.from('manager_approvals').update({
      status, resolution_note: note, resolved_at: new Date().toISOString(),
      resolved_by: user?.id, resolved_by_name: userName
    }).eq('id', id);
    if (error) toast(error.message, false); else { toast(status==='aprobado'?'Aprobado':'Rechazado'); load(); }
  };

  if (loading) return <div style={{padding:40,textAlign:'center'}}><div className="spin"/></div>;

  return (
    <div className="page">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
        <h2 style={{fontSize:20,fontWeight:800}}>Centro de aprobaciones</h2>
        <Btn onClick={() => setShowNew(true)}>+ Nueva solicitud</Btn>
      </div>

      <div style={{display:'flex',gap:8,marginBottom:14}}>
        {['pendiente','aprobado','rechazado','todos'].map(f => (
          <button key={f} onClick={() => setFilter(f)} style={{padding:'6px 14px',fontSize:12,fontWeight:700,borderRadius:6,border:`1px solid ${filter===f?'#000':C.border}`,background:filter===f?'#000':'#fff',color:filter===f?'#fff':C.ink,textTransform:'capitalize'}}>{f}</button>
        ))}
      </div>

      <Card>
        <table style={{width:'100%',borderCollapse:'collapse'}}>
          <thead><tr style={{borderBottom:`1px solid ${C.border}`}}><Th>Tipo</Th><Th>Solicitado por</Th><Th>Motivo</Th><Th right>Monto</Th><Th>Estado</Th><Th right>Acción</Th></tr></thead>
          <tbody>
            {list.length === 0 ? <Empty cols={6} label="Sin solicitudes"/> : list.map(a => (
              <tr key={a.id} style={{borderBottom:`1px solid ${C.border}`}}>
                <Td>
                  <div style={{display:'flex',flexDirection:'column'}}>
                    <strong>{APPROVAL_LABEL[a.request_type]||a.request_type}</strong>
                    <span style={{fontSize:11,color:C.dim}}>{fmtDT(a.created_at)}</span>
                  </div>
                </Td>
                <Td>{a.requested_by_name||'—'}<div style={{fontSize:11,color:C.dim}}>{a.requested_by_role||''}</div></Td>
                <Td style={{maxWidth:320}}>{a.reason}{a.resolution_note && <div style={{fontSize:11,color:C.mid,marginTop:4,fontStyle:'italic'}}>Resolución: {a.resolution_note}</div>}</Td>
                <Td right mono>{a.amount ? fmt(a.amount) : '—'}</Td>
                <Td>
                  <Badge color={a.status==='aprobado'?C.green:a.status==='rechazado'?C.red:a.status==='cancelado'?C.dim:C.orange}>{a.status}</Badge>
                </Td>
                <Td right>
                  {a.status === 'pendiente' && (
                    <div style={{display:'flex',gap:6,justifyContent:'flex-end'}}>
                      <Btn small variant="success" onClick={() => { const n = prompt('Nota (opcional):',''); resolve(a.id, 'aprobado', n||''); }}>✓ Aprobar</Btn>
                      <Btn small variant="danger" onClick={() => { const n = prompt('Motivo del rechazo:',''); if(n!==null) resolve(a.id, 'rechazado', n); }}>✕ Rechazar</Btn>
                    </div>
                  )}
                </Td>
              </tr>
            ))}
          </tbody>
        </table>
      </Card>

      {showNew && <NewApprovalModal onClose={() => setShowNew(false)} onSaved={() => { setShowNew(false); load(); }} user={user} userName={userName}/>}
    </div>
  );
}

function NewApprovalModal({onClose, onSaved, user, userName}) {
  const [type, setType] = useState('descuento');
  const [amount, setAmount] = useState('');
  const [reason, setReason] = useState('');
  const [saving, setSaving] = useState(false);

  const save = async () => {
    if (!reason.trim()) { toast('Indicá el motivo', false); return; }
    setSaving(true);
    const { error } = await db.from('manager_approvals').insert({
      restaurant_id: RID, request_type: type, amount: amount?Number(amount):null,
      reason: reason.trim(), requested_by: user?.id, requested_by_name: userName, requested_by_role: 'supervisor_local'
    });
    setSaving(false);
    if (error) toast(error.message, false);
    else { toast('Solicitud creada'); onSaved(); }
  };

  return (
    <Modal title="Nueva solicitud de aprobación" onClose={onClose}>
      <div style={{display:'flex',flexDirection:'column',gap:14}}>
        <div><Lbl>Tipo</Lbl>
          <Sel value={type} onChange={e=>setType(e.target.value)}>
            {Object.entries(APPROVAL_LABEL).map(([k,v]) => <option key={k} value={k}>{v}</option>)}
          </Sel>
        </div>
        <div><Lbl>Monto (opcional)</Lbl><Inp type="number" value={amount} onChange={e=>setAmount(e.target.value)} placeholder="0"/></div>
        <div><Lbl>Motivo / descripción</Lbl><Txt value={reason} onChange={e=>setReason(e.target.value)} placeholder="Describí el motivo de la solicitud"/></div>
        <div style={{display:'flex',gap:8,justifyContent:'flex-end',marginTop:6}}>
          <Btn variant="ghost" onClick={onClose}>Cancelar</Btn>
          <Btn onClick={save} disabled={saving}>{saving?'Guardando…':'Crear solicitud'}</Btn>
        </div>
      </div>
    </Modal>
  );
}

/* ════════════════════════════════════════════════════════════════════════════
   MÓDULO 4: QUEJAS Y RATINGS
   ════════════════════════════════════════════════════════════════════════════ */
function QuejasYRatings({user, userName}) {
  const [quejas, setQuejas] = useState([]);
  const [ratings, setRatings] = useState([]);
  const [filter, setFilter] = useState('abierto');
  const [loading, setLoading] = useState(true);

  const load = useCallback(async () => {
    if (!db) return;
    const today = new Date(); today.setHours(0,0,0,0);
    let q = db.from('quejas_sugerencias').select('*').eq('restaurant_id',RID).order('created_at',{ascending:false}).limit(80);
    if (filter !== 'todos') q = q.eq('estado', filter);
    const [qData, rData] = await Promise.all([
      q,
      db.from('ratings').select('id,stars,comment,created_at,table_id').eq('restaurant_id',RID).gte('created_at', today.toISOString()).order('created_at',{ascending:false})
    ]);
    setQuejas(qData.data||[]);
    setRatings(rData.data||[]);
    setLoading(false);
  }, [filter]);
  useEffect(() => { load(); const id = setInterval(() => { if (!_shouldPause()) load(); }, 20000); return () => clearInterval(id); }, [load]);

  const updateEstado = async (id, estado) => {
    const upd = {estado};
    if (estado === 'resuelto') {
      upd.resuelto_por_id = user?.id;
      upd.resuelto_por_nombre = userName;
      upd.resuelto_en = new Date().toISOString();
    }
    const { error } = await db.from('quejas_sugerencias').update(upd).eq('id', id);
    if (error) toast(error.message, false); else { toast('Actualizado'); load(); }
  };

  if (loading) return <div style={{padding:40,textAlign:'center'}}><div className="spin"/></div>;

  const ratingAvg = ratings.length ? ratings.reduce((s,r) => s + r.stars, 0) / ratings.length : 0;
  const ratingCount = [1,2,3,4,5].map(s => ratings.filter(r => r.stars === s).length);

  return (
    <div className="page">
      <h2 style={{fontSize:20,fontWeight:800,marginBottom:16}}>Quejas, sugerencias y ratings</h2>

      <div style={{display:'grid',gridTemplateColumns:'2fr 1fr',gap:16}}>
        <div>
          <div style={{display:'flex',gap:8,marginBottom:12}}>
            {['abierto','en_revision','resuelto','escalado','todos'].map(f => (
              <button key={f} onClick={() => setFilter(f)} style={{padding:'6px 12px',fontSize:12,fontWeight:700,borderRadius:6,border:`1px solid ${filter===f?'#000':C.border}`,background:filter===f?'#000':'#fff',color:filter===f?'#fff':C.ink,textTransform:'capitalize'}}>{f.replace('_',' ')}</button>
            ))}
          </div>

          <Card>
            <table style={{width:'100%',borderCollapse:'collapse'}}>
              <thead><tr style={{borderBottom:`1px solid ${C.border}`}}><Th>Tipo</Th><Th>Descripción</Th><Th>Urgencia</Th><Th>Estado</Th><Th right>Acción</Th></tr></thead>
              <tbody>
                {quejas.length === 0 ? <Empty cols={5} label="Sin quejas/sugerencias"/> : quejas.map(q => (
                  <tr key={q.id} style={{borderBottom:`1px solid ${C.border}`}}>
                    <Td>
                      <Badge color={q.tipo==='queja'?C.red:q.tipo==='sugerencia'?C.blue:C.green}>{q.tipo}</Badge>
                      <div style={{fontSize:11,color:C.dim,marginTop:3}}>{fmtDT(q.created_at)}</div>
                    </Td>
                    <Td style={{maxWidth:360}}>
                      <div>{q.descripcion}</div>
                      {q.usuario_nombre && <div style={{fontSize:11,color:C.dim,marginTop:3}}>por {q.usuario_nombre}</div>}
                    </Td>
                    <Td>{q.urgencia && <Badge color={q.urgencia==='alta'?C.red:q.urgencia==='media'?C.orange:C.dim}>{q.urgencia}</Badge>}</Td>
                    <Td><Badge color={q.estado==='resuelto'?C.green:q.estado==='escalado'?C.red:q.estado==='en_revision'?C.orange:C.blue}>{q.estado.replace('_',' ')}</Badge></Td>
                    <Td right>
                      {q.estado !== 'resuelto' && (
                        <Sel small value={q.estado} onChange={e => updateEstado(q.id, e.target.value)} style={{width:130,fontSize:12}}>
                          <option value="abierto">Abierto</option>
                          <option value="en_revision">En revisión</option>
                          <option value="resuelto">Resuelto</option>
                          <option value="escalado">Escalar</option>
                        </Sel>
                      )}
                    </Td>
                  </tr>
                ))}
              </tbody>
            </table>
          </Card>
        </div>

        <div>
          <Card title="Ratings de hoy">
            <div style={{textAlign:'center',marginBottom:14}}>
              <div style={{fontSize:36,fontWeight:800,color:ratingAvg>=4?C.green:ratingAvg>=3?C.orange:C.red,fontFamily:"'SF Mono',ui-monospace,monospace"}}>{ratingAvg ? ratingAvg.toFixed(1) : '—'}</div>
              <div style={{fontSize:12,color:C.mid,marginTop:4}}>{ratings.length} calificaciones</div>
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:5}}>
              {[5,4,3,2,1].map(s => {
                const pct = ratings.length ? (ratingCount[s-1]/ratings.length)*100 : 0;
                return (
                  <div key={s} style={{display:'flex',alignItems:'center',gap:8,fontSize:12}}>
                    <span style={{width:30,color:C.mid}}>{s} ★</span>
                    <div style={{flex:1,height:6,background:'#F5F5F7',borderRadius:3,overflow:'hidden'}}>
                      <div style={{width:`${pct}%`,height:'100%',background:s>=4?C.green:s>=3?C.orange:C.red}}/>
                    </div>
                    <span style={{width:30,textAlign:'right',color:C.mid,fontFamily:"'SF Mono',ui-monospace,monospace"}}>{ratingCount[s-1]}</span>
                  </div>
                );
              })}
            </div>
            {ratings.filter(r => r.comment).length>0 && (
              <div style={{marginTop:16,paddingTop:14,borderTop:`1px solid ${C.border}`}}>
                <div style={{fontSize:11,color:C.mid,fontWeight:700,letterSpacing:1,marginBottom:8,textTransform:'uppercase'}}>Comentarios</div>
                <div style={{display:'flex',flexDirection:'column',gap:8,maxHeight:300,overflowY:'auto'}}>
                  {ratings.filter(r => r.comment).map(r => (
                    <div key={r.id} style={{padding:'8px 10px',background:'#F5F5F7',borderRadius:6,fontSize:12}}>
                      <div style={{color:r.stars>=4?C.green:r.stars>=3?C.orange:C.red,fontWeight:700,marginBottom:3}}>{'★'.repeat(r.stars)}{'☆'.repeat(5-r.stars)}</div>
                      <div style={{color:C.ink}}>{r.comment}</div>
                      <div style={{fontSize:10,color:C.dim,marginTop:3}}>{fmtTime(r.created_at)}</div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </Card>
        </div>
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════════════════
   MÓDULO 5: STOCK 86'd / NO DISPONIBLES
   ════════════════════════════════════════════════════════════════════════════ */
function Stock86({user, userName}) {
  const [list, setList] = useState([]);
  const [menu, setMenu] = useState([]);
  const [stockAlerts, setStockAlerts] = useState([]);
  const [showAdd, setShowAdd] = useState(false);
  const [loading, setLoading] = useState(true);

  const load = useCallback(async () => {
    if (!db) return;
    const [i, m, a] = await Promise.all([
      db.from('item_86_list').select('*').eq('restaurant_id',RID).order('created_at',{ascending:false}).limit(60),
      db.from('menu_items').select('id,name,is_available,category_id').eq('restaurant_id',RID).order('name'),
      db.from('stock_alerts').select('id,alert_type,current_value,threshold_triggered,resolved_at,created_at,ingredient_id').eq('restaurant_id',RID).is('resolved_at',null).order('created_at',{ascending:false}).limit(40)
    ]);
    setList(i.data||[]); setMenu(m.data||[]); setStockAlerts(a.data||[]); setLoading(false);
  }, []);
  useEffect(() => { load(); const id = setInterval(() => { if (!_shouldPause()) load(); }, 30000); return () => clearInterval(id); }, [load]);

  const clear = async (id) => {
    if (!confirm('¿Marcar como disponible nuevamente?')) return;
    const { error } = await db.from('item_86_list').update({is_active:false, cleared_at: new Date().toISOString()}).eq('id', id);
    if (error) toast(error.message, false); else { toast('Producto repuesto'); load(); }
  };

  if (loading) return <div style={{padding:40,textAlign:'center'}}><div className="spin"/></div>;

  const activos = list.filter(i => i.is_active);
  const reactivados = list.filter(i => !i.is_active);

  return (
    <div className="page">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
        <h2 style={{fontSize:20,fontWeight:800}}>Productos no disponibles / Stock crítico</h2>
        <Btn onClick={() => setShowAdd(true)}>+ Marcar producto como 86d</Btn>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:16}}>
        <KpiCard label="Productos 86d" value={activos.length} sub="No disponibles hoy" accent={activos.length>0?C.red:C.green}/>
        <KpiCard label="Alertas de stock" value={stockAlerts.length} sub="Sin resolver" accent={stockAlerts.length>0?C.orange:C.green}/>
      </div>

      <Card title="Activos (productos no disponibles ahora)">
        {activos.length === 0 ? <div style={{padding:20,textAlign:'center',color:C.dim,fontSize:13}}>No hay productos marcados</div>
          : <table style={{width:'100%',borderCollapse:'collapse'}}>
              <thead><tr style={{borderBottom:`1px solid ${C.border}`}}><Th>Producto</Th><Th>Motivo</Th><Th>Marcado por</Th><Th>Desde</Th><Th right>Acción</Th></tr></thead>
              <tbody>{activos.map(i => (
                <tr key={i.id} style={{borderBottom:`1px solid ${C.border}`}}>
                  <Td><strong>{i.item_name}</strong></Td>
                  <Td dim>{i.reason||'—'}</Td>
                  <Td dim>{i.created_by_name||'—'}</Td>
                  <Td mono>{fmtTime(i.created_at)}</Td>
                  <Td right><Btn small variant="success" onClick={() => clear(i.id)}>Reponer</Btn></Td>
                </tr>
              ))}</tbody>
            </table>}
      </Card>

      {reactivados.length>0 && (
        <Card title="Repuestos hoy" style={{marginTop:16}}>
          <table style={{width:'100%',borderCollapse:'collapse'}}>
            <thead><tr style={{borderBottom:`1px solid ${C.border}`}}><Th>Producto</Th><Th>Marcado</Th><Th>Repuesto</Th></tr></thead>
            <tbody>{reactivados.slice(0,10).map(i => (
              <tr key={i.id} style={{borderBottom:`1px solid ${C.border}`}}>
                <Td dim>{i.item_name}</Td>
                <Td mono dim>{fmtDT(i.created_at)}</Td>
                <Td mono dim>{fmtDT(i.cleared_at)}</Td>
              </tr>
            ))}</tbody>
          </table>
        </Card>
      )}

      {showAdd && <Add86Modal menu={menu} onClose={() => setShowAdd(false)} onSaved={() => { setShowAdd(false); load(); }} user={user} userName={userName}/>}
    </div>
  );
}

function Add86Modal({menu, onClose, onSaved, user, userName}) {
  const [itemId, setItemId] = useState('');
  const [customName, setCustomName] = useState('');
  const [reason, setReason] = useState('');
  const [saving, setSaving] = useState(false);

  const save = async () => {
    const item = menu.find(m => String(m.id) === itemId);
    const name = item?.name || customName.trim();
    if (!name) { toast('Elegí o escribí el producto', false); return; }
    setSaving(true);
    const { error } = await db.from('item_86_list').insert({
      restaurant_id: RID, menu_item_id: item?.id||null, item_name: name, reason: reason.trim()||null,
      created_by: user?.id, created_by_name: userName
    });
    setSaving(false);
    if (error) toast(error.message, false); else { toast('Producto marcado como no disponible'); onSaved(); }
  };

  return (
    <Modal title="Marcar producto como no disponible" onClose={onClose}>
      <div style={{display:'flex',flexDirection:'column',gap:14}}>
        <div><Lbl>Producto del menú</Lbl>
          <Sel value={itemId} onChange={e => setItemId(e.target.value)}>
            <option value="">— Elegir del menú —</option>
            {menu.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}
          </Sel>
        </div>
        <div style={{textAlign:'center',color:C.dim,fontSize:11}}>— o —</div>
        <div><Lbl>Nombre libre</Lbl><Inp value={customName} onChange={e=>setCustomName(e.target.value)} placeholder="Ej: Promo del día"/></div>
        <div><Lbl>Motivo (opcional)</Lbl><Txt value={reason} onChange={e=>setReason(e.target.value)} placeholder="Ej: Sin proveedor, problema de stock, etc."/></div>
        <div style={{display:'flex',gap:8,justifyContent:'flex-end',marginTop:6}}>
          <Btn variant="ghost" onClick={onClose}>Cancelar</Btn>
          <Btn onClick={save} disabled={saving}>{saving?'Guardando…':'Marcar como 86d'}</Btn>
        </div>
      </div>
    </Modal>
  );
}

/* ════════════════════════════════════════════════════════════════════════════
   MÓDULO 6: CAJA EN VIVO
   ════════════════════════════════════════════════════════════════════════════ */
function CajaLive() {
  const [turnos, setTurnos] = useState([]);
  const [movs, setMovs] = useState([]);
  const [cancels, setCancels] = useState([]);
  const [loading, setLoading] = useState(true);

  const load = useCallback(async () => {
    if (!db) return;
    const today = new Date(); today.setHours(0,0,0,0);
    const [t, m, c] = await Promise.all([
      db.from('turnos_caja').select('*').eq('restaurant_id',RID).gte('fecha_apertura', today.toISOString()).order('fecha_apertura',{ascending:false}),
      db.from('movimientos_caja').select('id,tipo,monto,metodo_pago,descripcion,categoria,created_at,usuario_nombre,turno_id').eq('restaurant_id',RID).gte('created_at', today.toISOString()).order('created_at',{ascending:false}).limit(80),
      db.from('cancelaciones_caja').select('*').eq('restaurant_id',RID).gte('created_at', today.toISOString()).order('created_at',{ascending:false}).limit(40)
    ]);
    setTurnos(t.data||[]); setMovs(m.data||[]); setCancels(c.data||[]); setLoading(false);
  }, []);
  useEffect(() => { load(); const id = setInterval(() => { if (!_shouldPause()) load(); }, 20000); return () => clearInterval(id); }, [load]);

  if (loading) return <div style={{padding:40,textAlign:'center'}}><div className="spin"/></div>;

  const abiertos = turnos.filter(t => t.estado === 'abierto');
  const cerrados = turnos.filter(t => t.estado === 'cerrado');

  const totales = useMemo(() => {
    const cobros = movs.filter(m => m.tipo === 'cobro').reduce((s,m) => s + Number(m.monto||0), 0);
    const egresos = movs.filter(m => ['egreso','retiro_parcial'].includes(m.tipo)).reduce((s,m) => s + Number(m.monto||0), 0);
    const ingresos = movs.filter(m => ['ingreso_manual','reposicion','propina'].includes(m.tipo)).reduce((s,m) => s + Number(m.monto||0), 0);
    return { cobros, egresos, ingresos };
  }, [movs]);

  return (
    <div className="page">
      <h2 style={{fontSize:20,fontWeight:800,marginBottom:16}}>Caja en vivo</h2>

      <div style={{display:'flex',gap:12,flexWrap:'wrap',marginBottom:18}}>
        <KpiCard label="Turnos abiertos" value={abiertos.length} sub={`${cerrados.length} cerrados hoy`} accent={abiertos.length>0?C.green:C.mid}/>
        <KpiCard label="Cobros hoy" value={fmt(totales.cobros)} accent={C.green}/>
        <KpiCard label="Egresos" value={fmt(totales.egresos)} accent={C.red}/>
        <KpiCard label="Ingresos extra" value={fmt(totales.ingresos)} accent={C.blue}/>
      </div>

      <Card title={`Turnos abiertos (${abiertos.length})`}>
        {abiertos.length === 0 ? <div style={{padding:20,textAlign:'center',color:C.dim,fontSize:13}}>Sin turnos abiertos</div>
          : <table style={{width:'100%',borderCollapse:'collapse'}}>
              <thead><tr style={{borderBottom:`1px solid ${C.border}`}}><Th>Cajero</Th><Th>Apertura</Th><Th right>Fondo</Th><Th right>Tiempo</Th></tr></thead>
              <tbody>{abiertos.map(t => {
                const mins = minsAgo(t.fecha_apertura);
                const fondo = (t.fondo_apertura?.total)||0;
                return (
                  <tr key={t.id} style={{borderBottom:`1px solid ${C.border}`}}>
                    <Td><strong>{t.cajero_nombre||'—'}</strong></Td>
                    <Td mono>{fmtTime(t.fecha_apertura)}</Td>
                    <Td right mono>{fmt(fondo)}</Td>
                    <Td right mono>{Math.floor(mins/60)}h {mins%60}m</Td>
                  </tr>
                );
              })}</tbody>
            </table>}
      </Card>

      <Card title="Movimientos recientes" style={{marginTop:16}}>
        <table style={{width:'100%',borderCollapse:'collapse'}}>
          <thead><tr style={{borderBottom:`1px solid ${C.border}`}}><Th>Hora</Th><Th>Tipo</Th><Th>Método</Th><Th>Descripción</Th><Th>Usuario</Th><Th right>Monto</Th></tr></thead>
          <tbody>
            {movs.length === 0 ? <Empty cols={6} label="Sin movimientos"/> : movs.slice(0,30).map(m => (
              <tr key={m.id} style={{borderBottom:`1px solid ${C.border}`}}>
                <Td mono dim>{fmtTime(m.created_at)}</Td>
                <Td><Badge color={m.tipo==='cobro'?C.green:m.tipo==='egreso'||m.tipo==='retiro_parcial'?C.red:m.tipo==='propina'?C.yellow:C.blue}>{m.tipo}</Badge></Td>
                <Td dim>{m.metodo_pago||'—'}</Td>
                <Td>{m.descripcion||'—'}</Td>
                <Td dim>{m.usuario_nombre||'—'}</Td>
                <Td right mono><strong>{fmt(m.monto)}</strong></Td>
              </tr>
            ))}
          </tbody>
        </table>
      </Card>

      {cancels.length>0 && (
        <Card title={`Cancelaciones hoy (${cancels.length})`} style={{marginTop:16}}>
          <table style={{width:'100%',borderCollapse:'collapse'}}>
            <thead><tr style={{borderBottom:`1px solid ${C.border}`}}><Th>Hora</Th><Th>Pedido</Th><Th>Tipo</Th><Th>Motivo</Th><Th>Por</Th><Th right>Monto</Th></tr></thead>
            <tbody>{cancels.map(c => (
              <tr key={c.id} style={{borderBottom:`1px solid ${C.border}`}}>
                <Td mono dim>{fmtTime(c.created_at)}</Td>
                <Td mono>{c.pedido_numero||'—'}</Td>
                <Td><Badge color={c.tipo==='total'?C.red:C.orange}>{c.tipo}</Badge></Td>
                <Td>{c.motivo}</Td>
                <Td dim>{c.usuario_nombre||'—'}</Td>
                <Td right mono>{fmt(c.monto_cancelado)}</Td>
              </tr>
            ))}</tbody>
          </table>
        </Card>
      )}
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════════════════
   MÓDULO 7: RESERVAS DEL DÍA
   ════════════════════════════════════════════════════════════════════════════ */
function ReservasHoy() {
  const [list, setList] = useState([]);
  const [loading, setLoading] = useState(true);

  const load = useCallback(async () => {
    if (!db) return;
    const today = new Date().toISOString().slice(0,10);
    const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate()+1);
    const { data } = await db.from('reservations').select('*').eq('restaurant_id',RID).gte('reservation_date', today).lte('reservation_date', tomorrow.toISOString().slice(0,10)).order('reservation_date').order('reservation_time');
    setList(data||[]); setLoading(false);
  }, []);
  useEffect(() => { load(); const id = setInterval(() => { if (!_shouldPause()) load(); }, 60000); return () => clearInterval(id); }, [load]);

  const setStatus = async (id, status) => {
    const { error } = await db.from('reservations').update({status}).eq('id', id);
    if (error) toast(error.message, false); else { toast('Actualizado'); load(); }
  };

  if (loading) return <div style={{padding:40,textAlign:'center'}}><div className="spin"/></div>;

  const today = new Date().toISOString().slice(0,10);
  const hoy = list.filter(r => r.reservation_date === today);
  const manana = list.filter(r => r.reservation_date !== today);

  return (
    <div className="page">
      <h2 style={{fontSize:20,fontWeight:800,marginBottom:16}}>Reservas (hoy y mañana)</h2>

      <div style={{display:'flex',gap:12,flexWrap:'wrap',marginBottom:18}}>
        <KpiCard label="Reservas hoy" value={hoy.length} sub={`${hoy.filter(r=>r.status==='confirmed').length} confirmadas`}/>
        <KpiCard label="Personas hoy" value={hoy.reduce((s,r) => s + (r.guests||0), 0)} sub="comensales esperados"/>
        <KpiCard label="Mañana" value={manana.length} sub="próximas"/>
      </div>

      <Card title="Hoy">
        {hoy.length === 0 ? <div style={{padding:20,textAlign:'center',color:C.dim,fontSize:13}}>Sin reservas para hoy</div>
          : <table style={{width:'100%',borderCollapse:'collapse'}}>
              <thead><tr style={{borderBottom:`1px solid ${C.border}`}}><Th>Hora</Th><Th>Cliente</Th><Th>Teléfono</Th><Th right>Personas</Th><Th>Zona</Th><Th>Estado</Th><Th right>Acción</Th></tr></thead>
              <tbody>{hoy.map(r => (
                <tr key={r.id} style={{borderBottom:`1px solid ${C.border}`}}>
                  <Td mono><strong>{r.reservation_time?.slice(0,5)||'—'}</strong></Td>
                  <Td>{r.customer_name||'—'}</Td>
                  <Td dim>{r.customer_phone||'—'}</Td>
                  <Td right mono>{r.guests}</Td>
                  <Td dim>{r.zone||'—'}</Td>
                  <Td><Badge color={r.status==='confirmed'?C.green:r.status==='seated'?C.blue:r.status==='cancelled'?C.red:r.status==='no_show'?C.red:C.orange}>{r.status}</Badge></Td>
                  <Td right>
                    {r.status === 'pending' && <Btn small variant="success" onClick={() => setStatus(r.id, 'confirmed')}>Confirmar</Btn>}
                    {r.status === 'confirmed' && <Btn small onClick={() => setStatus(r.id, 'seated')}>Llegó</Btn>}
                    {['pending','confirmed'].includes(r.status) && <Btn small variant="danger" style={{marginLeft:6}} onClick={() => setStatus(r.id, 'no_show')}>No show</Btn>}
                  </Td>
                </tr>
              ))}</tbody>
            </table>}
      </Card>

      {manana.length>0 && (
        <Card title="Mañana" style={{marginTop:16}}>
          <table style={{width:'100%',borderCollapse:'collapse'}}>
            <thead><tr style={{borderBottom:`1px solid ${C.border}`}}><Th>Hora</Th><Th>Cliente</Th><Th right>Personas</Th><Th>Estado</Th></tr></thead>
            <tbody>{manana.map(r => (
              <tr key={r.id} style={{borderBottom:`1px solid ${C.border}`}}>
                <Td mono>{r.reservation_time?.slice(0,5)||'—'}</Td>
                <Td>{r.customer_name||'—'}</Td>
                <Td right mono>{r.guests}</Td>
                <Td><Badge color={r.status==='confirmed'?C.green:C.orange}>{r.status}</Badge></Td>
              </tr>
            ))}</tbody>
          </table>
        </Card>
      )}
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════════════════
   MÓDULO 8: BITÁCORA DE TURNO
   ════════════════════════════════════════════════════════════════════════════ */
function BitacoraTurno({user, userName}) {
  const [list, setList] = useState([]);
  const [filter, setFilter] = useState('hoy'); // hoy | abiertos | semana
  const [showNew, setShowNew] = useState(false);
  const [loading, setLoading] = useState(true);

  const load = useCallback(async () => {
    if (!db) return;
    let q = db.from('shift_logs').select('*').eq('restaurant_id',RID).order('created_at',{ascending:false}).limit(100);
    if (filter === 'hoy') {
      const today = new Date().toISOString().slice(0,10);
      q = q.eq('log_date', today);
    } else if (filter === 'abiertos') {
      q = q.eq('is_resolved', false);
    } else if (filter === 'semana') {
      const d = new Date(); d.setDate(d.getDate()-7);
      q = q.gte('created_at', d.toISOString());
    }
    const { data } = await q;
    setList(data||[]); setLoading(false);
  }, [filter]);
  useEffect(() => { load(); const id = setInterval(() => { if (!_shouldPause()) load(); }, 30000); return () => clearInterval(id); }, [load]);

  const resolve = async (id) => {
    const note = prompt('Nota de resolución (opcional):', '');
    const { error } = await db.from('shift_logs').update({
      is_resolved: true, resolved_at: new Date().toISOString(),
      resolved_by: user?.id, resolved_note: note||null
    }).eq('id', id);
    if (error) toast(error.message, false); else { toast('Marcado como resuelto'); load(); }
  };

  if (loading) return <div style={{padding:40,textAlign:'center'}}><div className="spin"/></div>;

  return (
    <div className="page">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
        <h2 style={{fontSize:20,fontWeight:800}}>Bitácora de turno</h2>
        <Btn onClick={() => setShowNew(true)}>+ Nueva entrada</Btn>
      </div>

      <div style={{display:'flex',gap:8,marginBottom:14}}>
        {[['hoy','Hoy'],['abiertos','Abiertos'],['semana','Última semana']].map(([k,l]) => (
          <button key={k} onClick={() => setFilter(k)} style={{padding:'6px 14px',fontSize:12,fontWeight:700,borderRadius:6,border:`1px solid ${filter===k?'#000':C.border}`,background:filter===k?'#000':'#fff',color:filter===k?'#fff':C.ink}}>{l}</button>
        ))}
      </div>

      {list.length === 0 ? <Card><div style={{padding:24,textAlign:'center',color:C.dim,fontSize:13}}>Sin entradas en bitácora</div></Card>
        : <div style={{display:'flex',flexDirection:'column',gap:10}}>
            {list.map(l => (
              <div key={l.id} style={{background:C.surface,border:`1px solid ${l.is_resolved?C.border:PRIO_COL[l.priority]}33`,borderLeft:`4px solid ${PRIO_COL[l.priority]||C.mid}`,borderRadius:8,padding:14,opacity:l.is_resolved?.6:1}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:6}}>
                  <div style={{display:'flex',alignItems:'center',gap:8}}>
                    <Badge color={PRIO_COL[l.priority]||C.mid}>{l.priority}</Badge>
                    <span style={{fontSize:11,color:C.mid,fontWeight:600}}>{CAT_LOG[l.category]||l.category}</span>
                    {l.is_resolved && <Badge color={C.green}>resuelto</Badge>}
                  </div>
                  <div style={{display:'flex',alignItems:'center',gap:10}}>
                    <span style={{fontSize:11,color:C.dim}}>{fmtDT(l.created_at)}</span>
                    {!l.is_resolved && <Btn small variant="success" onClick={() => resolve(l.id)}>✓ Resolver</Btn>}
                  </div>
                </div>
                <div style={{fontSize:14,fontWeight:700,marginBottom:4}}>{l.title}</div>
                {l.description && <div style={{fontSize:13,color:C.mid,whiteSpace:'pre-wrap'}}>{l.description}</div>}
                <div style={{fontSize:11,color:C.dim,marginTop:6}}>
                  por {l.created_by_name||'—'}
                  {l.resolved_note && <span style={{display:'block',marginTop:4,fontStyle:'italic'}}>Resolución: {l.resolved_note}</span>}
                </div>
              </div>
            ))}
          </div>}

      {showNew && <NewLogModal onClose={() => setShowNew(false)} onSaved={() => { setShowNew(false); load(); }} user={user} userName={userName}/>}
    </div>
  );
}

function NewLogModal({onClose, onSaved, user, userName}) {
  const [title, setTitle] = useState('');
  const [desc, setDesc] = useState('');
  const [cat, setCat] = useState('nota');
  const [prio, setPrio] = useState('normal');
  const [period, setPeriod] = useState('');
  const [saving, setSaving] = useState(false);

  const save = async () => {
    if (!title.trim()) { toast('Indicá título', false); return; }
    setSaving(true);
    const { error } = await db.from('shift_logs').insert({
      restaurant_id: RID, title: title.trim(), description: desc.trim()||null,
      category: cat, priority: prio, shift_period: period||null,
      created_by: user?.id, created_by_name: userName
    });
    setSaving(false);
    if (error) toast(error.message, false); else { toast('Entrada guardada'); onSaved(); }
  };

  return (
    <Modal title="Nueva entrada en bitácora" onClose={onClose}>
      <div style={{display:'flex',flexDirection:'column',gap:12}}>
        <div><Lbl>Título</Lbl><Inp value={title} onChange={e=>setTitle(e.target.value)} placeholder="Resumen breve"/></div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
          <div><Lbl>Categoría</Lbl>
            <Sel value={cat} onChange={e=>setCat(e.target.value)}>
              {Object.entries(CAT_LOG).map(([k,v]) => <option key={k} value={k}>{v}</option>)}
            </Sel>
          </div>
          <div><Lbl>Prioridad</Lbl>
            <Sel value={prio} onChange={e=>setPrio(e.target.value)}>
              <option value="baja">Baja</option><option value="normal">Normal</option><option value="alta">Alta</option><option value="urgente">Urgente</option>
            </Sel>
          </div>
        </div>
        <div><Lbl>Período</Lbl>
          <Sel value={period} onChange={e=>setPeriod(e.target.value)}>
            <option value="">— Sin especificar —</option>
            <option value="mañana">Mañana</option><option value="tarde">Tarde</option><option value="noche">Noche</option><option value="madrugada">Madrugada</option>
          </Sel>
        </div>
        <div><Lbl>Descripción</Lbl><Txt value={desc} onChange={e=>setDesc(e.target.value)} rows={4} placeholder="Detalle de la incidencia, traspaso o nota"/></div>
        <div style={{display:'flex',gap:8,justifyContent:'flex-end',marginTop:6}}>
          <Btn variant="ghost" onClick={onClose}>Cancelar</Btn>
          <Btn onClick={save} disabled={saving}>{saving?'Guardando…':'Guardar'}</Btn>
        </div>
      </div>
    </Modal>
  );
}

/* ════════════════════════════════════════════════════════════════════════════
   MÓDULO 9: REPORTES DEL DÍA
   ════════════════════════════════════════════════════════════════════════════ */
function ReportesDelDia() {
  const [data, setData] = useState({orders:[], items:[], approvals:[], cancels:[]});
  const [loading, setLoading] = useState(true);

  const load = useCallback(async () => {
    if (!db) return;
    const today = new Date(); today.setHours(0,0,0,0);
    const yesterday = new Date(today); yesterday.setDate(yesterday.getDate()-1);
    const tomorrow = new Date(today); tomorrow.setDate(tomorrow.getDate()+1);
    const [o, i, a, c] = await Promise.all([
      db.from('orders').select('id,total,status,order_type,table_id,table_number,waiter_id,waiter_name,created_at,paid_at,confirmed_at').eq('restaurant_id',RID).gte('created_at', yesterday.toISOString()).lte('created_at', tomorrow.toISOString()),
      db.from('order_items').select('id,order_id,name,quantity,price').gte('created_at', today.toISOString()),
      db.from('manager_approvals').select('id,request_type,status,amount,created_at').eq('restaurant_id',RID).gte('created_at', today.toISOString()),
      db.from('cancelaciones_caja').select('id,monto_cancelado,motivo,created_at').eq('restaurant_id',RID).gte('created_at', today.toISOString())
    ]);
    setData({orders: o.data||[], items: i.data||[], approvals: a.data||[], cancels: c.data||[]});
    setLoading(false);
  }, []);
  useEffect(() => { load(); const id = setInterval(() => { if (!_shouldPause()) load(); }, 60000); return () => clearInterval(id); }, [load]);

  if (loading) return <div style={{padding:40,textAlign:'center'}}><div className="spin"/></div>;

  const today = new Date(); today.setHours(0,0,0,0);
  const ordersToday = data.orders.filter(o => new Date(o.created_at) >= today);
  const ordersYday  = data.orders.filter(o => new Date(o.created_at) <  today);

  const salesToday = ordersToday.filter(o => ['paid','delivered','kitchen_received','cooking','ready'].includes(o.status)).reduce((s,o) => s + (o.total||0), 0);
  const salesYday  = ordersYday.filter(o => ['paid','delivered'].includes(o.status)).reduce((s,o) => s + (o.total||0), 0);
  const deltaPct = salesYday ? ((salesToday - salesYday) / salesYday * 100) : 0;

  const ticketsToday = ordersToday.filter(o => ['paid','delivered'].includes(o.status)).length;
  const ticketAvg = ticketsToday ? salesToday/ticketsToday : 0;

  // por mozo
  const byWaiter = {};
  ordersToday.filter(o => o.waiter_id).forEach(o => {
    if (!byWaiter[o.waiter_id]) byWaiter[o.waiter_id] = {name:o.waiter_name||'—', sales:0, count:0};
    byWaiter[o.waiter_id].sales += o.total||0;
    byWaiter[o.waiter_id].count++;
  });
  const waiters = Object.values(byWaiter).sort((a,b) => b.sales - a.sales);

  // top productos
  const itemMap = {};
  data.items.forEach(it => {
    if (!itemMap[it.name]) itemMap[it.name] = {qty:0, total:0};
    itemMap[it.name].qty += it.quantity||0;
    itemMap[it.name].total += (it.price||0) * (it.quantity||0);
  });
  const topItems = Object.entries(itemMap).map(([name,v]) => ({name, ...v})).sort((a,b) => b.qty - a.qty).slice(0,10);

  // tiempo medio servicio
  const completed = ordersToday.filter(o => o.paid_at && o.created_at);
  const avgServiceMin = completed.length ? completed.reduce((s,o) => s + (new Date(o.paid_at) - new Date(o.created_at))/60000, 0) / completed.length : 0;

  return (
    <div className="page">
      <h2 style={{fontSize:20,fontWeight:800,marginBottom:16}}>Reportes del día</h2>

      <div style={{display:'flex',gap:12,flexWrap:'wrap',marginBottom:18}}>
        <KpiCard label="Ventas hoy" value={fmt(salesToday)} sub={`vs ayer: ${deltaPct>=0?'+':''}${deltaPct.toFixed(0)}%`} accent={deltaPct>=0?C.green:C.red}/>
        <KpiCard label="Tickets" value={ticketsToday} sub={`Promedio ${fmt(ticketAvg)}`}/>
        <KpiCard label="Tiempo medio servicio" value={`${Math.round(avgServiceMin)} min`} sub={`${completed.length} pedidos completos`}/>
        <KpiCard label="Aprobaciones" value={data.approvals.length} sub={`${data.approvals.filter(a=>a.status==='aprobado').length} aprobadas / ${data.approvals.filter(a=>a.status==='rechazado').length} rechazadas`}/>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
        <Card title="Ventas por mozo">
          {waiters.length === 0 ? <div style={{padding:20,textAlign:'center',color:C.dim,fontSize:13}}>Sin actividad</div>
            : <table style={{width:'100%',borderCollapse:'collapse'}}>
                <thead><tr style={{borderBottom:`1px solid ${C.border}`}}><Th>Mozo</Th><Th right>Pedidos</Th><Th right>Ventas</Th></tr></thead>
                <tbody>{waiters.map((w,i) => (
                  <tr key={i} style={{borderBottom:`1px solid ${C.border}`}}>
                    <Td><strong>{w.name}</strong></Td>
                    <Td right mono>{w.count}</Td>
                    <Td right mono><strong>{fmt(w.sales)}</strong></Td>
                  </tr>
                ))}</tbody>
              </table>}
        </Card>

        <Card title="Top productos del día">
          {topItems.length === 0 ? <div style={{padding:20,textAlign:'center',color:C.dim,fontSize:13}}>Sin datos</div>
            : <table style={{width:'100%',borderCollapse:'collapse'}}>
                <thead><tr style={{borderBottom:`1px solid ${C.border}`}}><Th>Producto</Th><Th right>Cantidad</Th><Th right>Subtotal</Th></tr></thead>
                <tbody>{topItems.map((it,i) => (
                  <tr key={i} style={{borderBottom:`1px solid ${C.border}`}}>
                    <Td>{it.name}</Td>
                    <Td right mono><strong>{it.qty}</strong></Td>
                    <Td right mono>{fmt(it.total)}</Td>
                  </tr>
                ))}</tbody>
              </table>}
        </Card>

        {data.cancels.length>0 && (
          <Card title={`Cancelaciones hoy (${data.cancels.length})`} style={{gridColumn:'1 / -1'}}>
            <table style={{width:'100%',borderCollapse:'collapse'}}>
              <thead><tr style={{borderBottom:`1px solid ${C.border}`}}><Th>Hora</Th><Th>Motivo</Th><Th right>Monto</Th></tr></thead>
              <tbody>{data.cancels.map(c => (
                <tr key={c.id} style={{borderBottom:`1px solid ${C.border}`}}>
                  <Td mono dim>{fmtTime(c.created_at)}</Td>
                  <Td>{c.motivo}</Td>
                  <Td right mono>{fmt(c.monto_cancelado)}</Td>
                </tr>
              ))}</tbody>
            </table>
          </Card>
        )}
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════════════════
   APP SHELL
   ════════════════════════════════════════════════════════════════════════════ */
function App() {
  const auth = useAuth();
  const [section, setSection] = useState('dashboard');
  const [pendingApprovals, setPendingApprovals] = useState(0);

  useEffect(() => {
    if (!db || !auth.user) return;
    const tick = async () => {
      if (_shouldPause()) return;
      const { count } = await db.from('manager_approvals').select('id',{count:'exact', head:true}).eq('restaurant_id',RID).eq('status','pendiente');
      setPendingApprovals(count||0);
    };
    tick();
    const id = setInterval(tick, 20000);
    return () => clearInterval(id);
  }, [auth.user]);

  if (auth.loading) return <div style={{height:'100vh',display:'flex',alignItems:'center',justifyContent:'center'}}><div className="spin"/></div>;
  if (!auth.user) return null;
  if (!db) return <div style={{padding:40,textAlign:'center'}}>Sin conexión a Supabase. Verificá <code>config.js</code>.</div>;

  const sections = [
    {key:'dashboard', label:'Dashboard', icon:'📊'},
    {key:'turno',     label:'Supervisión', icon:'👥'},
    {key:'aprobaciones', label:'Aprobaciones', icon:'✓', badge: pendingApprovals},
    {key:'quejas',    label:'Quejas y ratings', icon:'⚠'},
    {key:'stock86',   label:'Stock / 86d', icon:'📦'},
    {key:'caja',      label:'Caja en vivo', icon:'💰'},
    {key:'reservas',  label:'Reservas', icon:'📅'},
    {key:'bitacora',  label:'Bitácora', icon:'📝'},
    {key:'reportes',  label:'Reportes', icon:'📈'},
  ];

  return (
    <div style={{display:'flex',minHeight:'100vh',background:C.bg}}>
      {/* Sidebar */}
      <aside style={{width:220,background:C.sidebar,borderRight:`1px solid ${C.border}`,padding:'20px 0',display:'flex',flexDirection:'column',flexShrink:0}}>
        <div style={{padding:'0 20px 18px',borderBottom:`1px solid ${C.border}`}}>
          <div style={{fontSize:18,fontWeight:800,letterSpacing:-0.5}}>Mythos</div>
          <div style={{fontSize:11,color:C.mid,fontWeight:600,marginTop:2}}>Panel Gerente</div>
        </div>
        <nav style={{flex:1,padding:'12px 10px',display:'flex',flexDirection:'column',gap:2}}>
          {sections.map(s => (
            <button key={s.key} onClick={() => setSection(s.key)} style={{
              display:'flex',alignItems:'center',gap:10,padding:'10px 12px',background:section===s.key?'#000':'transparent',color:section===s.key?'#fff':C.ink,
              border:'none',borderRadius:8,fontSize:13,fontWeight:600,textAlign:'left',transition:'background .15s',position:'relative'
            }}>
              <span style={{fontSize:14}}>{s.icon}</span>
              <span style={{flex:1}}>{s.label}</span>
              {s.badge>0 && <span style={{background:section===s.key?'#fff':C.red,color:section===s.key?C.red:'#fff',fontSize:10,fontWeight:800,padding:'2px 7px',borderRadius:10,minWidth:18,textAlign:'center'}}>{s.badge}</span>}
            </button>
          ))}
        </nav>
        <div style={{padding:'14px 16px',borderTop:`1px solid ${C.border}`}}>
          <div style={{fontSize:12,fontWeight:700,color:C.ink,marginBottom:2}}>{auth.name}</div>
          <div style={{fontSize:11,color:C.mid,marginBottom:10}}>{auth.role}</div>
          <Btn variant="ghost" small full onClick={logout}>Cerrar sesión</Btn>
        </div>
      </aside>

      {/* Main */}
      <main style={{flex:1,padding:'28px 32px',overflowX:'auto'}}>
        {section==='dashboard'    && <Dashboard onJump={setSection}/>}
        {section==='turno'        && <SupervisionTurno/>}
        {section==='aprobaciones' && <Aprobaciones user={auth.user} userName={auth.name}/>}
        {section==='quejas'       && <QuejasYRatings user={auth.user} userName={auth.name}/>}
        {section==='stock86'      && <Stock86 user={auth.user} userName={auth.name}/>}
        {section==='caja'         && <CajaLive/>}
        {section==='reservas'     && <ReservasHoy/>}
        {section==='bitacora'     && <BitacoraTurno user={auth.user} userName={auth.name}/>}
        {section==='reportes'     && <ReportesDelDia/>}
      </main>

      <ToastContainer/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
