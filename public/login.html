<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mythos · Acceso</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="mythos-offline.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#F5F5F7;color:#1D1D1F;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
    .card{background:#fff;border:1px solid #D2D2D7;border-radius:20px;padding:48px 40px;width:100%;max-width:380px;box-shadow:0 4px 24px rgba(0,0,0,0.08),0 0 1px rgba(0,0,0,0.04)}
    .logo{text-align:center;margin-bottom:36px}
    .logo-title{font-size:32px;font-weight:800;color:#000;letter-spacing:-1.2px}
    .logo-sub{font-size:13px;font-weight:500;color:#6E6E73;margin-top:4px}
    label{display:block;font-size:13px;font-weight:500;color:#6E6E73;margin-bottom:6px}
    input{width:100%;background:#fff;border:1px solid #D2D2D7;color:#1D1D1F;padding:11px 14px;border-radius:10px;font-size:15px;outline:none;transition:border-color .15s;font-family:inherit}
    input:focus{border-color:#000}
    input::placeholder{color:#AEAEB2}
    .field{margin-bottom:20px}
    .btn{width:100%;background:#000;color:#fff;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:600;cursor:pointer;transition:opacity .15s;margin-top:4px;font-family:inherit}
    .btn:hover{opacity:0.84}
    .btn:active{opacity:0.72}
    .btn:disabled{opacity:.38;cursor:not-allowed}
    .error{background:#fff;border:1px solid #FFCDD0;color:#C0190F;border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:20px;display:none}
    .error.show{display:block}
    .hint{font-size:12px;color:#AEAEB2;text-align:center;margin-top:24px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .spinner{width:15px;height:15px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;display:inline-block;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-title">Mythos</div>
    <div class="logo-sub">Iniciá sesión para continuar</div>
  </div>

  <div id="err" class="error"></div>

  <form id="loginForm">
    <div class="field">
      <label for="email">Correo Electrónico</label>
      <input id="email" type="email" autocomplete="username" inputmode="email" placeholder="tu@correo.com" required/>
    </div>
    <div class="field">
      <label for="password">Contraseña</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" required/>
    </div>
    <button class="btn" type="submit" id="submitBtn">Ingresar</button>
  </form>

  <div class="hint">Mythos · Sistema gastronómico</div>
</div>

<script>
(function() {
  const cfg = window.SUPABASE_CONFIG;
  if (!cfg?.url || !cfg?.anonKey) {
    showErr('Sin configuración de Supabase. Verificá config.js');
    return;
  }
  const url = cfg.url.replace(/^﻿/, '').trim();
  const key = cfg.anonKey.replace(/^﻿/, '').trim();
  const db  = window.supabase.createClient(url, key);

  function showErr(msg) {
    const el = document.getElementById('err');
    el.textContent = msg;
    el.classList.add('show');
  }
  function hideErr() {
    document.getElementById('err').classList.remove('show');
  }
  function setLoading(on) {
    const btn = document.getElementById('submitBtn');
    btn.disabled = on;
    btn.innerHTML = on
      ? '<span class="spinner"></span>Ingresando…'
      : 'Ingresar';
  }

  // Limpia sólo las claves de sesión previas (no toca tema ni cachés de menú)
  function clearSession() {
    ['mythos_role','mythos_restaurant_id','mythos_user_id','mythos_display_name','mythos_last_activity']
      .forEach(k => { try { localStorage.removeItem(k); } catch(_) {} });
  }

  function saveSession(profile) {
    try {
      localStorage.setItem('mythos_restaurant_id', profile.restaurant_id || '');
      localStorage.setItem('mythos_role',          profile.role          || '');
      localStorage.setItem('mythos_user_id',        profile.id            || '');
      localStorage.setItem('mythos_display_name',   profile.display_name  || profile.username || '');
      // Arranca el reloj de inactividad (mythos-session.js) de cero en cada login.
      localStorage.setItem('mythos_last_activity',  String(Date.now()));
    } catch(_) {}
  }

  // Panel operativo destino según el rol. null = rol no reconocido.
  function homeForRole(role) {
    switch ((role || '').toLowerCase()) {
      case 'superadmin':       return 'superadmin.html';
      case 'admin':            return 'admin.html';
      case 'gerente':
      case 'supervisor_local': return 'gerente.html';
      case 'cajero':
      case 'caja':             return 'caja.html';
      case 'mozo':             return 'mozo.html';
      case 'cocinero':
      case 'cocina':           return 'cocina.html';
      case 'rider':
      case 'repartidor':       return 'delivery-rider.html';
      default:                 return null;
    }
  }

  // Valida perfil → guarda sesión autoritativa → redirige. Devuelve mensaje de error o null.
  function validateAndRedirect(profile) {
    if (!profile || !profile.role) return 'Tu cuenta no tiene un rol asignado. Contactá al administrador.';

    const dest = homeForRole(profile.role);
    if (!dest) return 'Tu cuenta tiene un rol no reconocido. Contactá al administrador.';

    // superadmin opera a nivel plataforma → no requiere comercio asignado
    if (!profile.restaurant_id && profile.role.toLowerCase() !== 'superadmin')
      return 'Tu cuenta no está vinculada a ningún comercio activo.';

    clearSession();
    saveSession(profile);
    window.location.replace(dest);
    return null;
  }

  // Sesión ya activa → revalidar perfil y redirigir; si es inválida, cerrar sesión.
  db.auth.getSession().then(({ data: { session } }) => {
    if (!session) return;
    db.rpc('get_my_profile').then(({ data }) => {
      const err = validateAndRedirect(data);
      if (err) db.auth.signOut();
    });
  });

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    hideErr();
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    if (!email || !password) { showErr('Completá correo y contraseña'); return; }

    setLoading(true);
    try {
      // 1. Autenticar con Supabase Auth (correo + contraseña, sin PIN ni usuario interno)
      const { error: authErr } = await db.auth.signInWithPassword({ email, password });
      if (authErr) {
        const m = authErr.message || '';
        if (m.includes('Invalid login credentials')) throw new Error('Correo o contraseña incorrectos.');
        if (m.includes('Email not confirmed'))        throw new Error('Tu correo aún no fue confirmado. Contactá al administrador.');
        throw new Error(m || 'No pudimos iniciar sesión. Intentá de nuevo.');
      }

      // 2. Leer perfil (rol + comercio) desde la tabla de perfiles
      const { data: profile, error: profErr } = await db.rpc('get_my_profile');
      if (profErr) throw new Error('Error al leer tu perfil. Intentá de nuevo.');

      // 3. Validar tenancy + redirigir al panel del rol
      const err = validateAndRedirect(profile);
      if (err) {
        await db.auth.signOut();
        clearSession();
        throw new Error(err);
      }
    } catch(err) {
      showErr(err.message);
      setLoading(false);
    }
  });
})();
</script>
</body>
</html>
