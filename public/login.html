<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mythos · Acceso</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#F5F5F7;color:#1D1D1F;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
    .card{background:#fff;border:1px solid #D2D2D7;border-radius:20px;padding:48px 40px;width:100%;max-width:380px;box-shadow:0 4px 24px rgba(0,0,0,0.08),0 0 1px rgba(0,0,0,0.04)}
    .logo{text-align:center;margin-bottom:36px}
    .logo-title{font-size:32px;font-weight:800;color:#000;letter-spacing:-1.2px}
    .logo-sub{font-size:13px;font-weight:500;color:#6E6E73;margin-top:4px}
    label{display:block;font-size:13px;font-weight:500;color:#6E6E73;margin-bottom:6px}
    input{width:100%;background:#fff;border:1px solid #D2D2D7;color:#1D1D1F;padding:11px 14px;border-radius:10px;font-size:15px;outline:none;transition:border-color .15s;font-family:inherit}
    input:focus{border-color:#000}
    input::placeholder{color:#AEAEB2}
    .field{margin-bottom:20px}
    .btn{width:100%;background:#000;color:#fff;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:600;cursor:pointer;transition:opacity .15s;margin-top:4px;font-family:inherit}
    .btn:hover{opacity:0.84}
    .btn:active{opacity:0.72}
    .btn:disabled{opacity:.38;cursor:not-allowed}
    .error{background:#fff;border:1px solid #FFCDD0;color:#C0190F;border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:20px;display:none}
    .error.show{display:block}
    .hint{font-size:12px;color:#AEAEB2;text-align:center;margin-top:24px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .spinner{width:15px;height:15px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;display:inline-block;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-title">Mythos</div>
    <div class="logo-sub">Iniciá sesión para continuar</div>
  </div>

  <div id="err" class="error"></div>

  <form id="loginForm">
    <div class="field">
      <label for="username">Usuario</label>
      <input id="username" type="text" autocomplete="username" placeholder="Tu usuario" required/>
    </div>
    <div class="field">
      <label for="password">Contraseña</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" required/>
    </div>
    <button class="btn" type="submit" id="submitBtn">Ingresar</button>
  </form>

  <div class="hint">Mythos · Sistema gastronómico</div>
</div>

<script>
(function() {
  const cfg = window.SUPABASE_CONFIG;
  if (!cfg?.url || !cfg?.anonKey) {
    showErr('Sin configuración de Supabase. Verificá config.js');
    return;
  }
  const url = cfg.url.replace(/^﻿/, '').trim();
  const key = cfg.anonKey.replace(/^﻿/, '').trim();
  const db  = window.supabase.createClient(url, key);

  function showErr(msg) {
    const el = document.getElementById('err');
    el.textContent = msg;
    el.classList.add('show');
  }
  function hideErr() {
    document.getElementById('err').classList.remove('show');
  }
  function setLoading(on) {
    const btn = document.getElementById('submitBtn');
    btn.disabled = on;
    btn.innerHTML = on
      ? '<span class="spinner"></span>Ingresando…'
      : 'Ingresar';
  }

  function saveSession(profile) {
    try {
      localStorage.setItem('mythos_role',          profile.role          || '');
      localStorage.setItem('mythos_restaurant_id', profile.restaurant_id || '');
      localStorage.setItem('mythos_user_id',       profile.id            || '');
      localStorage.setItem('mythos_display_name',  profile.display_name  || profile.username || '');
    } catch(_) {}
  }

  // Qué roles pueden entrar a cada panel (superadmin entra a todos)
  const PANEL_ACCESS = {
    'superadmin.html':     ['superadmin'],
    'admin.html':          ['admin','superadmin'],
    'gerente.html':        ['supervisor_local','admin','superadmin'],
    'caja.html':           ['cajero','admin','superadmin','cocina'],
    'cocina.html':         ['cocina','admin','superadmin'],
    'mozo.html':           ['mozo','admin','superadmin'],
    'delivery-rider.html': ['rider','admin','superadmin'],
  };

  function homeForRole(role) {
    if (role === 'superadmin')            return 'superadmin.html';
    if (role === 'admin')                 return 'admin.html';
    if (role === 'supervisor_local')      return 'gerente.html';
    if (role === 'cajero')                return 'caja.html';
    if (role === 'mozo')                  return 'mozo.html';
    if (role === 'rider')                 return 'delivery-rider.html';
    return 'cocina.html';
  }

  // Lee ?next= sólo si apunta a una página local .html (anti open-redirect)
  function getNextParam() {
    try {
      const n = new URLSearchParams(location.search).get('next');
      if (!n || !/^[a-z0-9_-]+\.html$/i.test(n)) return null;
      return n;
    } catch(_) { return null; }
  }

  // Panel → capacidad de plan (allowed_panels). Lo no listado no se gatea por plan.
  const PANEL_CAP = {
    'caja.html':            'caja',
    'mozo.html':            'mozo',
    'cocina.html':          'cocina',
    'delivery-rider.html':  'delivery-rider',
    'delivery-cliente.html':'delivery-cliente',
  };

  // ¿El plan (∪ add-ons) del restaurante incluye este panel? Falla abierto ante error de red.
  async function panelAllowedByPlan(panel, restaurantId) {
    const cap = PANEL_CAP[panel];
    if (!cap || !restaurantId) return true;
    try {
      const { data } = await db.rpc('get_restaurant_capabilities', { p_restaurant_id: restaurantId });
      const panels = (data && data.allowed_panels) || null;
      if (!Array.isArray(panels)) return true;   // RPC ausente/legacy → no bloquear
      return panels.includes(cap);
    } catch(_) { return true; }
  }

  async function destinationFor(profile) {
    const role = profile.role;
    const rid  = profile.restaurant_id;
    const next = getNextParam();
    if (next) {
      const allowed = PANEL_ACCESS[next];
      const roleOk  = role === 'superadmin' || !allowed || allowed.includes(role);
      // superadmin entra a todo; el resto necesita rol permitido Y que el plan incluya el panel
      if (roleOk && (role === 'superadmin' || await panelAllowedByPlan(next, rid))) return next;
    }
    return homeForRole(role);
  }

  async function redirectByRole(profile) {
    const p = typeof profile === 'string'
      ? { role: profile, restaurant_id: localStorage.getItem('mythos_restaurant_id') }
      : profile;
    window.location.replace(await destinationFor(p));
  }

  // Redirect si ya hay sesión activa con localStorage válido
  db.auth.getSession().then(({ data: { session } }) => {
    if (!session) return;
    const cachedRole = localStorage.getItem('mythos_role');
    const cachedRid  = localStorage.getItem('mythos_restaurant_id');
    if (cachedRole && cachedRid) { redirectByRole({ role: cachedRole, restaurant_id: cachedRid }); return; }
    db.rpc('get_my_profile').then(({ data }) => {
      if (data) { saveSession(data); redirectByRole(data); }
    });
  });

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    hideErr();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    if (!username || !password) { showErr('Completá usuario y contraseña'); return; }

    setLoading(true);
    try {
      // 1. Obtener email interno por username (función SECURITY DEFINER, accesible sin auth)
      const { data: email, error: emailErr } = await db
        .rpc('get_user_email', { p_username: username });
      if (emailErr) throw new Error('Error de servidor: ' + emailErr.message);
      if (!email) throw new Error('Usuario no encontrado');

      // 2. Autenticar con Supabase Auth
      const { error: authErr } = await db.auth.signInWithPassword({ email, password });
      if (authErr) {
        if (authErr.message.includes('Invalid login credentials')) throw new Error('Contraseña incorrecta');
        throw new Error(authErr.message);
      }

      // 3. Obtener perfil, guardar en localStorage y redirigir
      const { data: profile } = await db.rpc('get_my_profile');
      if (!profile || !profile.role) throw new Error('Usuario sin rol asignado. Contactá al administrador.');
      // superadmin no requiere restaurant_id (opera a nivel SaaS)
      if (!profile.restaurant_id && profile.role !== 'superadmin')
        throw new Error('Usuario sin restaurante asignado. Contactá al administrador.');

      saveSession(profile);
      await redirectByRole(profile);
    } catch(err) {
      showErr(err.message);
      setLoading(false);
    }
  });
})();
</script>
</body>
</html>
