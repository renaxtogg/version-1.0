<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mythos · Acceso</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.1/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="mythos-offline.js"></script>
  <!-- PR-B3H: solo se enlaza tokens.css (define las CSS custom properties en :root).
       NO carga design-system.css/ui-primitives.css/theme (evita conflictos de estilo y
       no cambia el flujo de login). El <style> de abajo aliasa sus neutrales a estos tokens. -->
  <link rel="stylesheet" href="tokens.css">
  <!-- PR-B4H: Login activa dark real. Se agrega SOLO mythos-theme.js + init() (script
       de presentación: setea data-theme/color-scheme según preferencia/sistema). NO
       toca el flujo de Auth/login (script aparte, no comparte estado salvo el tema).
       Sin toggle propio: Login refleja la preferencia global; el token bridge (PR-B3H)
       ya resuelve a los valores dark de tokens.css. -->
  <script src="mythos-theme.js"></script>
  <script>MythosTheme.init();</script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    /* PR-B3H: neutrales aliaseados a tokens globales (tokens.css). Valores light idénticos,
       salvo el casi-negro de marca #000 → var(--primary) (#1D1D1F, delta sancionado en PR-B1).
       Rojos de error y blancos del spinner (sobre botón) se preservan como semánticos. */
    body{background:var(--bg-subtle);color:var(--text-primary);font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:48px 40px;width:100%;max-width:380px;box-shadow:0 4px 24px rgba(0,0,0,0.08),0 0 1px rgba(0,0,0,0.04)}
    .logo{text-align:center;margin-bottom:36px}
    .logo-title{font-size:32px;font-weight:800;color:var(--primary);letter-spacing:-1.2px}
    .logo-sub{font-size:13px;font-weight:500;color:var(--text-secondary);margin-top:4px}
    label{display:block;font-size:13px;font-weight:500;color:var(--text-secondary);margin-bottom:6px}
    input{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text-primary);padding:11px 14px;border-radius:10px;font-size:15px;outline:none;transition:border-color .15s;font-family:inherit}
    input:focus{border-color:var(--primary)}
    input::placeholder{color:var(--text-disabled)}
    .field{margin-bottom:20px}
    .btn{width:100%;background:var(--primary);color:var(--on-primary);border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:600;cursor:pointer;transition:opacity .15s;margin-top:4px;font-family:inherit}
    .btn:hover{opacity:0.84}
    .btn:active{opacity:0.72}
    .btn:disabled{opacity:.38;cursor:not-allowed}
    .error{background:var(--surface);border:1px solid #FFCDD0;color:#C0190F;border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:20px;display:none}
    .error.show{display:block}
    /* PR-B4H: en dark, el rojo oscuro (#C0190F) sobre superficie oscura quedaba sin
       contraste → usa var(--error) (claro en dark). Light queda idéntico. */
    [data-theme="dark"] .error{border-color:color-mix(in srgb, var(--error) 45%, transparent);color:var(--error)}
    /* PR/WS4-B: footer subido un escalón (disabled → tertiary) para más legibilidad
       en light y dark; sigue de-enfatizado (chrome de marca, no contenido). */
    .hint{font-size:12px;color:var(--text-tertiary);text-align:center;margin-top:24px}
    @keyframes spin{to{transform:rotate(360deg)}}
    /* PR-B4H: spinner usa el color de texto del botón (var(--on-primary)) para
       contrastar con --primary en ambos temas (en dark el botón es claro). */
    .spinner{width:15px;height:15px;border:2px solid color-mix(in srgb, var(--on-primary) 30%, transparent);border-top-color:var(--on-primary);border-radius:50%;display:inline-block;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
    /* Login social (Google/Facebook) — neutrales por tokens (dark-safe). Los logos
       de marca conservan sus colores oficiales (excepción razonable a los tokens). */
    .divider{display:flex;align-items:center;gap:12px;margin:26px 0 18px;color:var(--text-tertiary);font-size:12px;font-weight:500}
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
    .social{display:flex;flex-direction:column;gap:10px}
    .btn-social{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--surface);color:var(--text-primary);border:1px solid var(--border);border-radius:10px;padding:12px;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s,opacity .15s;font-family:inherit}
    .btn-social:hover:not(:disabled){background:var(--bg-subtle)}
    .btn-social:disabled{opacity:.5;cursor:not-allowed}
    .btn-social svg{flex-shrink:0}
    .social-note{font-size:12px;color:var(--text-tertiary);text-align:center;margin-top:14px;line-height:1.5;display:none}
    .social-note.show{display:block}
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-title">Mythos</div>
    <div class="logo-sub">Iniciá sesión para continuar</div>
  </div>

  <div id="err" class="error"></div>

  <form id="loginForm">
    <div class="field">
      <label for="email">Cédula o correo</label>
      <input id="email" type="text" autocomplete="username" inputmode="text" placeholder="Tu cédula o tu@correo.com" required/>
    </div>
    <div class="field">
      <label for="password">Contraseña</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" required/>
    </div>
    <button class="btn" type="submit" id="submitBtn">Ingresar</button>
  </form>

  <div id="forgotWrap" style="text-align:center;margin-top:16px">
    <a href="#" id="forgotLink" style="font-size:13px;color:var(--text-secondary);text-decoration:none">¿Olvidaste tu contraseña?</a>
    <div style="margin-top:10px;font-size:13px;color:var(--text-tertiary)">¿No tenés cuenta? <a href="/registro" style="color:var(--text-secondary);text-decoration:none">Registrá tu local</a></div>
  </div>

  <div class="divider">o</div>

  <div class="social">
    <button class="btn-social" id="btnGoogle" type="button">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/><path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/><path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238C29.211 35.091 26.715 36 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/><path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303c-.792 2.237-2.231 4.166-4.087 5.571l6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/></svg>
      <span>Continuar con Google</span>
    </button>
    <button class="btn-social" id="btnFacebook" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#1877F2" aria-hidden="true"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
      <span>Continuar con Facebook</span>
    </button>
  </div>
  <div class="social-note" id="socialNote"></div>

  <!-- AUTH-1: recuperación "olvidé mi contraseña" (oculto por defecto). -->
  <div id="recoveryPanel" style="display:none">
    <div class="field">
      <label for="recEmail">Correo electrónico</label>
      <input id="recEmail" type="email" inputmode="email" autocomplete="email" placeholder="tu@correo.com"/>
    </div>
    <button class="btn" type="button" id="recSendBtn">Enviarme el enlace</button>
    <div id="recMsg" style="display:none;font-size:13px;margin-top:14px;text-align:center;color:var(--text-secondary)" role="status" aria-live="polite"></div>
    <div class="hint"><a href="#" id="recBack" style="color:var(--text-secondary)">Volver a iniciar sesión</a></div>
  </div>

  <div class="hint">Mythos · Sistema gastronómico</div>
</div>

<script>
(function() {
  const cfg = window.SUPABASE_CONFIG;
  if (!cfg?.url || !cfg?.anonKey) {
    showErr('Sin configuración de Supabase. Verificá config.js');
    return;
  }
  const url = cfg.url.replace(/^﻿/, '').trim();
  const key = cfg.anonKey.replace(/^﻿/, '').trim();
  const db  = window.supabase.createClient(url, key);

  function showErr(msg) {
    const el = document.getElementById('err');
    el.textContent = msg;
    el.classList.add('show');
  }
  function hideErr() {
    document.getElementById('err').classList.remove('show');
  }
  function setLoading(on) {
    const btn = document.getElementById('submitBtn');
    btn.disabled = on;
    btn.innerHTML = on
      ? '<span class="spinner"></span>Ingresando…'
      : 'Ingresar';
  }

  // Limpia sólo las claves de sesión previas (no toca tema ni cachés de menú)
  function clearSession() {
    ['mythos_role','mythos_restaurant_id','mythos_user_id','mythos_display_name','mythos_last_activity']
      .forEach(k => { try { localStorage.removeItem(k); } catch(_) {} });
  }

  function saveSession(profile) {
    try {
      localStorage.setItem('mythos_restaurant_id', profile.restaurant_id || '');
      localStorage.setItem('mythos_role',          profile.role          || '');
      localStorage.setItem('mythos_user_id',        profile.id            || '');
      localStorage.setItem('mythos_display_name',   profile.display_name  || profile.username || '');
      // Arranca el reloj de inactividad (mythos-session.js) de cero en cada login.
      localStorage.setItem('mythos_last_activity',  String(Date.now()));
    } catch(_) {}
  }

  // Panel operativo destino según el rol. null = rol no reconocido.
  function homeForRole(role) {
    switch ((role || '').toLowerCase()) {
      case 'superadmin':       return 'superadmin.html';
      case 'admin':            return 'admin.html';
      case 'gerente':
      case 'supervisor_local': return 'gerente.html';
      case 'cajero':
      case 'caja':             return 'caja.html';
      case 'mozo':             return 'mozo.html';
      case 'cocinero':
      case 'cocina':           return 'cocina.html';
      case 'rider':
      case 'repartidor':       return 'delivery-rider.html';
      default:                 return null;
    }
  }

  // Valida perfil → guarda sesión autoritativa → redirige. Devuelve mensaje de error o null.
  function validateAndRedirect(profile) {
    if (!profile || !profile.role) return 'Tu cuenta no tiene un rol asignado. Contactá al administrador.';

    const dest = homeForRole(profile.role);
    if (!dest) return 'Tu cuenta tiene un rol no reconocido. Contactá al administrador.';

    // superadmin opera a nivel plataforma → no requiere comercio asignado
    if (!profile.restaurant_id && profile.role.toLowerCase() !== 'superadmin')
      return 'Tu cuenta no está vinculada a ningún comercio activo.';

    clearSession();
    saveSession(profile);
    window.location.replace(dest);
    return null;
  }

  // Etiqueta legible del rol (para la pantalla "Elegir panel").
  function roleLabel(role) {
    switch ((role || '').toLowerCase()) {
      case 'superadmin':       return 'Superadmin';
      case 'admin':            return 'Administrador';
      case 'gerente':
      case 'supervisor_local': return 'Gerente';
      case 'cajero':
      case 'caja':             return 'Caja';
      case 'mozo':             return 'Mozo';
      case 'cocinero':
      case 'cocina':           return 'Cocina';
      case 'rider':
      case 'repartidor':       return 'Delivery (Rider)';
      default:                 return role || 'Panel';
    }
  }
  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

  // Pantalla simple "Elegí tu panel" (usuario con más de un panel disponible).
  function showChooser(items, profile) {
    const card = document.querySelector('.card');
    if (!card) return;
    const name = ((profile && (profile.display_name || profile.username)) || '').trim();
    const btns = items.map((it, i) =>
      '<button class="btn-social" type="button" data-i="' + i + '">' + escapeHtml(roleLabel(it.role)) + '</button>'
    ).join('');
    card.innerHTML =
      '<div class="logo"><div class="logo-title">Mythos</div>' +
        '<div class="logo-sub">' + (name ? 'Hola, ' + escapeHtml(name) + ' — ' : '') + 'elegí tu panel</div></div>' +
      '<div class="social">' + btns + '</div>' +
      '<div class="hint"><a id="chooserLogout" href="#">Cerrar sesión</a></div>';
    items.forEach((it, i) => {
      const b = card.querySelector('button[data-i="' + i + '"]');
      if (b) b.addEventListener('click', () => {
        clearSession();
        saveSession({ role: it.role, restaurant_id: it.restaurant_id, id: profile.id, display_name: profile.display_name, username: profile.username });
        window.location.replace(it.dest);
      });
    });
    const lo = card.querySelector('#chooserLogout');
    if (lo) lo.addEventListener('click', async (e) => {
      e.preventDefault();
      try { await db.auth.signOut(); } catch (_) {}
      clearSession();
      window.location.reload();
    });
  }

  // Resolver el destino: si el usuario tiene >1 panel válido → "Elegí tu panel";
  // si no, usar el flujo single-role probado (validateAndRedirect). Reutiliza
  // homeForRole. Best-effort: si la lectura de roles falla, cae al single-role.
  async function resolveAndRoute(profile) {
    // OWNER-ONBOARDING (Bloque C): sesión válida pero SIN rol asignado = dueño recién
    // registrado que todavía no creó su local → al onboarding (no es un error). El
    // resto de casos (rol no reconocido, sin comercio, varios roles) sigue igual.
    if (!profile || !profile.role) { window.location.replace('onboarding.html'); return null; }

    // Filas de rol activas del propio usuario. FILTRAMOS por user_id explícito: la RLS de
    // user_roles hoy es PERMISIVA (un authenticated ve TODAS las filas), así que sin este
    // filtro el "Elegí tu panel" y el gate de onboarding verían roles de otros tenants
    // (cualquier admin SIM con onboarding incompleto desviaría TODOS los logins). profile.id
    // = user_id (get_my_profile). No tocamos RLS (eso es el Sprint 1).
    let rows = null;
    try {
      const { data, error } = await db.from('user_roles')
        .select('role, restaurant_id').eq('user_id', profile.id).eq('is_active', true);
      if (!error && Array.isArray(data)) rows = data;
    } catch (_) { rows = null; }

    // OWNER-ONBOARDING (Bloque C p.1): si CUALQUIER rol admin activo tiene el wizard SIN
    // terminar (onboarding_completed_at IS NULL) → retomar onboarding, NO entrar al panel,
    // sea cual sea el rol que devolvió get_my_profile. Cubre cuentas multi-rol (get_my_profile
    // es LIMIT 1 sin ORDER BY → podría no devolver el rol admin) y cierra el bypass por el
    // "Elegí tu panel". Otros roles sin cambios. Fail-open ante error de consulta.
    try {
      const adminRows = ((rows && rows.length) ? rows
          : (String(profile.role).toLowerCase() === 'admin' && profile.restaurant_id
              ? [{ role: 'admin', restaurant_id: profile.restaurant_id }] : []))
        .filter(r => String(r.role).toLowerCase() === 'admin' && r.restaurant_id);
      for (const ar of adminRows) {
        const { data, error } = await db.from('restaurants')
          .select('onboarding_completed_at').eq('id', ar.restaurant_id).maybeSingle();
        if (!error && data && !data.onboarding_completed_at) {
          window.location.replace('onboarding.html'); return null;
        }
      }
    } catch (_) { /* fail-open */ }

    if (rows && rows.length > 1) {
      const items = [];
      const seen = {};
      rows.forEach(r => {
        const dest = homeForRole(r.role);
        if (!dest) return;
        const okTenant = r.restaurant_id || String(r.role).toLowerCase() === 'superadmin';
        if (!okTenant) return;
        if (seen[dest]) return; seen[dest] = true;
        items.push({ role: r.role, restaurant_id: r.restaurant_id, dest });
      });
      if (items.length > 1) { showChooser(items, profile); return null; }
    }
    return validateAndRedirect(profile);
  }

  // AUTH-1: ¿el usuario debe cambiar su contraseña antes de entrar?
  // Lee user_security_flags (RLS: solo su fila). FAIL-OPEN: si la tabla no
  // existe (mig 113 no aplicada) o hay error, devuelve false → login normal.
  async function needsPasswordChange() {
    try {
      const { data: { session } } = await db.auth.getSession();
      if (!session || !session.user) return false;
      const { data, error } = await db
        .from('user_security_flags')
        .select('must_change_password')
        .eq('user_id', session.user.id)
        .maybeSingle();
      if (error) return false;
      return !!(data && data.must_change_password === true);
    } catch (_) { return false; }
  }

  // Gate previo al redirect por rol: si hay cambio obligatorio pendiente,
  // mandar a /cambiar-password y NO entrar al panel. Aplica también a Google
  // OAuth (solo se dispara si existe el flag explícito; los usuarios OAuth no
  // lo tienen salvo que se haya forzado).
  async function routeAfterAuth(profile) {
    if (await needsPasswordChange()) {
      window.location.replace('cambiar-password.html?reason=first_login');
      return null;
    }
    return resolveAndRoute(profile);
  }

  // Sesión ya activa → revalidar perfil y enrutar; si es inválida, cerrar sesión.
  db.auth.getSession().then(({ data: { session } }) => {
    if (!session) return;
    db.rpc('get_my_profile').then(async ({ data }) => {
      const err = await routeAfterAuth(data);
      if (err) db.auth.signOut();
    });
  });

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    hideErr();
    const ident    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    if (!ident || !password) { showErr('Completá tu cédula o correo y la contraseña'); return; }
    // Identificador flexible (NO migra cuentas demo):
    //   • con "@"             → correo del dueño, sin cambios (signInWithPassword igual).
    //   • sólo dígitos/separad → cédula → ${digitos}@mythos.internal (staff nuevo).
    //   • con letras           → username legacy → sanitizado @mythos.internal (demo).
    let email;
    if (ident.includes('@'))                 email = ident;
    else if (/^[\d.\s-]+$/.test(ident))      email = `${ident.replace(/\D/g, '')}@mythos.internal`;
    else                                     email = `${ident.toLowerCase().replace(/[^a-z0-9._-]/g, '')}@mythos.internal`;

    setLoading(true);
    try {
      // 1. Autenticar con Supabase Auth (correo + contraseña, sin PIN ni usuario interno)
      const { error: authErr } = await db.auth.signInWithPassword({ email, password });
      if (authErr) {
        const m = authErr.message || '';
        if (m.includes('Invalid login credentials')) throw new Error('Cédula/correo o contraseña incorrectos.');
        if (m.includes('Email not confirmed'))        throw new Error('Tu correo aún no fue confirmado. Contactá al administrador.');
        throw new Error(m || 'No pudimos iniciar sesión. Intentá de nuevo.');
      }

      // 2. Leer perfil (rol + comercio) desde la tabla de perfiles
      const { data: profile, error: profErr } = await db.rpc('get_my_profile');
      if (profErr) throw new Error('Error al leer tu perfil. Intentá de nuevo.');

      // 3. Gate de cambio obligatorio de contraseña + enrutar al panel del rol
      //    (o "Elegí tu panel" si hay varios).
      const err = await routeAfterAuth(profile);
      if (err) {
        await db.auth.signOut();
        clearSession();
        throw new Error(err);
      }
    } catch(err) {
      showErr(err.message);
      setLoading(false);
    }
  });

  // ── Login social (Google / Facebook) — PREPARADO ─────────────────────────
  // Los proveedores se habilitan vía window.MYTHOS_CONFIG.authProviders (lo genera
  // build.sh desde env vars). Con el flag en false el botón queda deshabilitado en
  // estado "pendiente de configuración" y NO dispara OAuth: el login por correo +
  // contraseña sigue intacto. El flag se pone en true SOLO tras habilitar el provider
  // en Supabase → Authentication → Providers.
  async function signInOAuth(provider, niceName) {
    hideErr();
    try {
      const redirectTo = window.location.origin + window.location.pathname;
      const { error } = await db.auth.signInWithOAuth({ provider, options: { redirectTo } });
      if (error) throw error;
      // En éxito el navegador redirige al proveedor; al volver, el getSession()
      // de arriba revalida el perfil y enruta al panel del rol.
    } catch (err) {
      showErr('No pudimos iniciar con ' + niceName + '. ' + (err.message || 'Intentá de nuevo.'));
    }
  }

  function setupSocial() {
    const providers = (window.MYTHOS_CONFIG && window.MYTHOS_CONFIG.authProviders) || {};
    const pending = [];
    const wire = (btnId, provider, niceName) => {
      const btn = document.getElementById(btnId);
      if (!btn) return;
      if (providers[provider]) {
        btn.addEventListener('click', () => signInOAuth(provider, niceName));
      } else {
        btn.disabled = true;
        btn.title = niceName + ': pendiente de configuración';
        pending.push(niceName);
      }
    };
    wire('btnGoogle', 'google', 'Google');
    wire('btnFacebook', 'facebook', 'Facebook');
    if (pending.length) {
      const note = document.getElementById('socialNote');
      note.textContent = 'El acceso con ' + pending.join(' y ') + ' estará disponible cuando se configure.';
      note.classList.add('show');
    }
  }
  setupSocial();

  // ── AUTH-1: "Olvidé mi contraseña" ───────────────────────────────────────
  // Alterna entre el panel de login y el de recuperación. El envío SIEMPRE
  // responde con el mismo mensaje genérico (no revela si el email existe).
  function showRecovery(show) {
    [document.getElementById('loginForm'),
     document.querySelector('.divider'),
     document.querySelector('.social'),
     document.getElementById('socialNote'),
     document.getElementById('forgotWrap')
    ].forEach(function (el) { if (el) el.style.display = show ? 'none' : ''; });
    var rp = document.getElementById('recoveryPanel');
    if (rp) rp.style.display = show ? '' : 'none';
    hideErr();
  }

  var forgotLink = document.getElementById('forgotLink');
  if (forgotLink) forgotLink.addEventListener('click', function (e) { e.preventDefault(); showRecovery(true); });
  var recBack = document.getElementById('recBack');
  if (recBack) recBack.addEventListener('click', function (e) { e.preventDefault(); showRecovery(false); });

  var recSendBtn = document.getElementById('recSendBtn');
  if (recSendBtn) recSendBtn.addEventListener('click', async function () {
    var email = (document.getElementById('recEmail').value || '').trim();
    var msg = document.getElementById('recMsg');
    if (!email) { if (msg) { msg.style.display = ''; msg.textContent = 'Ingresá tu correo.'; } return; }
    recSendBtn.disabled = true;
    recSendBtn.textContent = 'Enviando…';
    try {
      // El enlace del correo abre /cambiar-password en modo recuperación.
      await db.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + '/cambiar-password?mode=recovery' });
    } catch (_) { /* nunca revelar el detalle */ }
    if (msg) { msg.style.display = ''; msg.textContent = 'Si el correo existe, te enviamos un enlace para cambiar tu contraseña.'; }
    recSendBtn.disabled = false;
    recSendBtn.textContent = 'Enviarme el enlace';
  });
})();
</script>
</body>
</html>
