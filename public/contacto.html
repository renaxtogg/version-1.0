<!DOCTYPE html>
<html lang="es-PY" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto — MYTHOS</title>
  <meta name="description" content="Hablá con el equipo de MYTHOS. Soporte y ventas por WhatsApp, en español.">
  <meta name="theme-color" content="#FFFFFF">
  <link rel="canonical" href="/contacto">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="es_PY">
  <meta property="og:site_name" content="MYTHOS">
  <meta property="og:title" content="Contacto — MYTHOS">
  <meta property="og:description" content="Hablá con el equipo de MYTHOS. Soporte y ventas por WhatsApp, en español.">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="web-marketing.css">
  <script src="mythos-theme.js"></script>
  <script>if(!localStorage.getItem('mythos-theme')&&window.MythosTheme){window.MythosTheme.init('light');}</script>
  <!-- Capa de datos (WEB-3): WhatsApp dinámico + tracking (degrada si faltan) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.1/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="web-marketing-data.js"></script>
</head>
<body>
  <div id="site-header"></div>
  <noscript>
    <nav class="wrap" style="display:flex;gap:20px;padding:16px 24px;border-bottom:1px solid var(--border)">
      <a href="/inicio"><strong>MYTHOS</strong></a>
      <a href="/precios">Precios</a><a href="/demo">Demo</a>
      <a href="/contacto">Contacto</a><a href="/login">Iniciar sesión</a>
    </nav>
  </noscript>

  <main>
    <section class="page-hero wrap">
      <h1>Hablemos</h1>
      <p class="lead">¿Dudas, demo o ganas de empezar? Te respondemos por WhatsApp, en español.</p>
    </section>

    <section class="block wrap" style="padding-top:20px">
      <div style="max-width:520px;margin:0 auto 28px;display:flex;flex-direction:column;gap:12px">
        <a class="btn btn-primary btn-lg" data-wa="Hola, quiero más información sobre MYTHOS."><span data-icon="chat"></span> Escribir por WhatsApp</a>
        <a class="btn btn-secondary" data-email><span data-icon="mail"></span> Enviar un email</a>
      </div>

      <!--
        WEB-5: formulario real. Escribe SOLO en `marketing_leads` (anon INSERT-only,
        RLS mig 110) vía MythosWebData.submitLead. NO usa Auth, NO service_role, NO
        crea cuentas/restaurantes/trials, NO lee leads. Los leads se gestionan desde
        Superadmin → "Sitio web" (WEB-6).
      -->
      <form class="form-card" aria-label="Formulario de contacto" novalidate>
        <div class="field">
          <label for="c-type">¿En qué te ayudamos?</label>
          <select id="c-type" name="type">
            <option value="contact">Contacto general</option>
            <option value="demo">Quiero una demo</option>
            <option value="trial_interest">Me interesa probar MYTHOS</option>
          </select>
        </div>
        <div class="field">
          <label for="c-name">Nombre</label>
          <input id="c-name" name="name" type="text" placeholder="Tu nombre" autocomplete="name">
        </div>
        <div class="field">
          <label for="c-biz">Restaurante / local</label>
          <input id="c-biz" name="business_name" type="text" placeholder="Nombre de tu restaurante" autocomplete="organization">
        </div>
        <div class="field">
          <label for="c-email">Email</label>
          <input id="c-email" name="email" type="email" placeholder="vos@turestaurante.com" autocomplete="email">
        </div>
        <div class="field">
          <label for="c-wsp">WhatsApp</label>
          <input id="c-wsp" name="whatsapp" type="tel" placeholder="+595 9xx xxx xxx" autocomplete="tel">
        </div>
        <div class="field">
          <label for="c-msg">Mensaje</label>
          <textarea id="c-msg" name="message" rows="4" placeholder="Contanos sobre tu restaurante"></textarea>
        </div>
        <p class="microcopy" style="margin:0 0 12px">Dejanos al menos un WhatsApp o un email para poder responderte.</p>
        <p data-lead-status class="lead-status" style="display:none" role="status" aria-live="polite"></p>
        <button class="btn btn-primary" type="submit" data-lead-submit>Enviar</button>
      </form>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="mythos-icons.js"></script>
  <script defer src="mythos-cookie-banner.js"></script>
  <script src="web-marketing.js"></script>
  <script>
    MythosWeb.init({ active: 'contacto' });
    (function () {
      var form = document.querySelector('form[aria-label="Formulario de contacto"]');
      if (!form || !window.MythosWeb || !MythosWeb.wireLeadForm) return;
      var sel = form.querySelector('[name="type"]');
      // Preseleccionar tipo desde ?type= (contact|demo|trial_interest)
      try {
        var t = new URLSearchParams(location.search).get('type');
        var allow = { contact: 1, demo: 1, trial_interest: 1 };
        if (t && allow[t] && sel) sel.value = t;
      } catch (e) {}
      function successMsg(type) {
        return type === 'demo'
          ? '¡Listo! Recibimos tu pedido de demo. Te escribimos para coordinar día y hora.'
          : type === 'trial_interest'
            ? '¡Gracias! Recibimos tu interés. Te contactamos para activar tu prueba.'
            : '¡Listo! Recibimos tu mensaje y te respondemos a la brevedad.';
      }
      MythosWeb.wireLeadForm(form, { successMsg: successMsg });
    })();
  </script>
</body>
</html>
