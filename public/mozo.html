<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Mythos · Mozo</title>
<link rel="stylesheet" href="design-system.css">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="ui-primitives.css">
<script src="mythos-theme.js"></script>
<script src="mythos-icons.js"></script>
<script src="mythos-offline.js"></script>
<script>MythosTheme.init('light');</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.1/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="mythos-presence.js"></script>
<script src="mythos-session.js"></script>
<script src="mythos-gating.js"></script>
<style>
:root {
  /* PR-B3F — token bridge (alineación con tokens.css; NO se tocan clases ni JSX).
     --bg/--surface/--border comparten nombre con el token global → se OMITEN aquí y
     los aporta tokens.css directamente (un `--bg: var(--bg)` sería un ciclo inválido);
     valores light idénticos, y en dark pasan a la base de tokens (--bg #0B0B0D).
     El resto de neutrales aliasa al token: light idéntico salvo --accent
     (#000000 → #1D1D1F, el delta de marca "casi-negro" sancionado en PR-B1). */
  --bg2: var(--bg-subtle); --bg3: var(--bg-hover);
  --text: var(--text-primary); --text2: var(--text-secondary); --text3: var(--text-tertiary);
  --accent: var(--primary); --accent-soft: #F5F5F7;
  --indigo: #000000; --indigo-soft: #F5F5F7;
  --green: #34C759; --green-soft: #E8F9ED;
  --orange: #FF9500; --orange-soft: #FFF4E0;
  --red: #FF3B30; --red-soft: #FFEDEC;
  --blue: #007AFF; --blue-soft: #E5F1FF;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.10);
  --radius: 12px; --radius-sm: 8px;
  --nav-h: 64px; --header-h: 56px;
}
[data-theme="dark"] {
  /* PR-B3F — token bridge: en dark los neutrales (--bg/--bg2/--bg3/--surface/--border/
     --text/--text2/--text3/--accent) los aporta tokens.css vía el alias de :root;
     aquí quedan solo las familias locales NO bridgeadas (soft/indigo/estados/sombras). */
  --accent-soft: #2C2C2E;
  --indigo: #F5F5F7; --indigo-soft: #2C2C2E;
  --green: #30D158; --green-soft: rgba(48,209,88,0.18);
  --orange: #FF9F0A; --orange-soft: rgba(255,159,10,0.22);
  --red: #FF453A; --red-soft: rgba(255,69,58,0.22);
  --blue: #0A84FF; --blue-soft: rgba(10,132,255,0.22);
  --shadow: 0 1px 3px rgba(0,0,0,0.5), 0 1px 2px rgba(0,0,0,0.3);
  --shadow-lg: 0 12px 36px rgba(0,0,0,0.6);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg); color: var(--text);
  max-width: 480px; margin: 0 auto; min-height: 100vh;
  position: relative; overflow-x: hidden;
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
@keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
@keyframes pulse-ring { 0% { box-shadow: 0 0 0 0 rgba(220,38,38,0.4); } 70% { box-shadow: 0 0 0 8px rgba(220,38,38,0); } 100% { box-shadow: 0 0 0 0 rgba(220,38,38,0); } }

/* HEADER */
.app-header {
  position: fixed; top: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px; height: var(--header-h);
  background: var(--surface); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px; z-index: 100;
}
.brand { font-size: 20px; font-weight: 800; letter-spacing: -1px; color: var(--text); }
.header-actions { display: flex; gap: 8px; align-items: center; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 10px;
  background: var(--bg2); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 16px; color: var(--text2);
  position: relative; transition: background 0.15s;
}
.icon-btn:active { background: var(--bg3); }
.notif-badge {
  position: absolute; top: 4px; right: 4px;
  background: var(--red); color: white;
  font-size: 9px; font-weight: 700; min-width: 16px; height: 16px;
  border-radius: 8px; display: flex; align-items: center; justify-content: center; padding: 0 4px;
}
.ready-count-badge {
  display: inline-flex; align-items: center; justify-content: center;
  background: #000; color: #fff; font-size: 11px; font-weight: 700;
  min-width: 22px; height: 22px; border-radius: 11px; padding: 0 5px;
  cursor: default;
}

/* MAIN */
.main { padding-top: var(--header-h); padding-bottom: var(--nav-h); min-height: 100vh; }

/* BOTTOM NAV */
.bottom-nav {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px; height: var(--nav-h);
  background: var(--surface); border-top: 1px solid var(--border);
  display: flex; z-index: 100;
}
.nav-item {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 3px; cursor: pointer; color: var(--text3);
  font-size: 10px; font-weight: 500; transition: color 0.15s;
  padding: 8px 0; position: relative;
}
.nav-item svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.nav-item.active { color: var(--indigo); }
.nav-badge {
  position: absolute; top: 8px; right: calc(50% - 18px);
  background: var(--red); color: white;
  font-size: 9px; font-weight: 700; min-width: 16px; height: 16px;
  border-radius: 8px; display: none; align-items: center; justify-content: center; padding: 0 4px;
}
.nav-badge.show { display: flex; }

/* SECTION HEADER */
.section-header {
  padding: 16px 16px 8px;
  display: flex; align-items: center; justify-content: space-between;
}
.section-title { font-size: 18px; font-weight: 700; color: var(--text); }
.section-sub { font-size: 13px; color: var(--text2); margin-top: 2px; }

/* TABLE GRID */
.table-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 16px; }
.mesa-card {
  aspect-ratio: 1; border-radius: var(--radius-sm); border: 2px solid var(--border);
  background: var(--surface); display: flex; flex-direction: column;
  align-items: center; justify-content: center; cursor: pointer;
  position: relative; transition: transform 0.1s, box-shadow 0.1s; user-select: none;
}
.mesa-card:active { transform: scale(0.95); }
.mesa-num { font-size: 18px; font-weight: 800; color: var(--text); }
.mesa-time { font-size: 9px; color: #6E6E73; font-weight: 500; margin-top: 1px; }
.mesa-time.overtime { color: #FF9500; }
.mesa-label { font-size: 9px; color: var(--text3); font-weight: 500; margin-top: 2px; }
.mesa-badge {
  position: absolute; top: -5px; right: -5px;
  background: var(--indigo); color: white; font-size: 9px; font-weight: 700;
  min-width: 18px; height: 18px; border-radius: 9px;
  display: flex; align-items: center; justify-content: center; padding: 0 4px;
}
.cobrar-badge {
  position: absolute; top: -5px; left: -5px;
  background: #000; color: #fff; font-size: 8px; font-weight: 800;
  padding: 2px 5px; border-radius: 4px; letter-spacing: 0.5px;
}
.mesa-card.libre { background: var(--surface); border-color: var(--border); }
.mesa-card.ocupada { background: #000000; border-color: #000000; }
.mesa-card.ocupada .mesa-num { color: #FFFFFF; }
.mesa-card.ocupada .mesa-label { color: #86868B; }
.mesa-card.ocupada .mesa-time { color: #86868B; }
.mesa-card.ocupada .mesa-time.overtime { color: #FF9500; }
.mesa-card.cocina { background: #86868B; border-color: #86868B; }
.mesa-card.cocina .mesa-num { color: #FFFFFF; }
.mesa-card.cocina .mesa-label { color: #D2D2D7; }
.mesa-card.cocina .mesa-time { color: #D2D2D7; }
.mesa-card.cocina .mesa-time.overtime { color: #FF9500; }
.mesa-card.lista { background: #34C759; border: 2px solid #248A3D; animation: pulse-ring 1.5s infinite; }
.mesa-card.lista .mesa-num { color: #FFFFFF; }
.mesa-card.lista .mesa-label { color: #FFFFFF; font-weight: 800; }
.mesa-card.lista .mesa-time { color: rgba(255,255,255,0.85); }
.mesa-card.cuenta { background: #FFFFFF; border-color: #000000; }
.mesa-card.cuenta .mesa-num { color: #000000; }
.mesa-card.alerta { background: var(--red-soft); border-color: var(--red); animation: pulse-ring 1.5s infinite; }
.mesa-card.alerta .mesa-num { color: var(--red); }
.mesa-card.pendiente_pago { background: #FF9500; border-color: #B45309; animation: pulse-ring 1.5s infinite; }
.mesa-card.pendiente_pago .mesa-num { color: #FFFFFF; }
.mesa-card.pendiente_pago .mesa-label { color: #FFFFFF; font-weight: 800; }
.mesa-card.pendiente_pago .mesa-time { color: rgba(255,255,255,0.85); }

/* COBROS PENDIENTES SECTION */
.cobros-section {
  margin: 0 16px 12px; background: var(--orange-soft); border: 1.5px solid var(--orange);
  border-radius: var(--radius); padding: 12px 14px;
}
.cobros-section-title { font-size: 11px; font-weight: 700; color: var(--orange); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
.cobro-pending-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 7px 0; border-bottom: 1px solid rgba(255,149,0,0.2);
}
.cobro-pending-row:last-child { border-bottom: none; }

/* ITEM NOTE EDIT */
.item-note-edit {
  width: 100%; padding: 6px 10px; border-radius: var(--radius-sm);
  border: 1px solid var(--orange); background: var(--bg2); color: var(--text);
  font-size: 12px; font-family: inherit; resize: none; outline: none; margin-top: 6px;
}
.item-note-edit:focus { border-color: var(--indigo); }

/* LEYENDA */
.legend { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 16px; }
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text2); }
.legend-dot { width: 10px; height: 10px; border-radius: 3px; }

/* ORDER HEADER */
.order-header { background: var(--text); color: white; padding: 12px 16px 10px; }
.order-header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.order-title { font-size: 13px; font-weight: 600; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.5px; }
.order-actions { display: flex; gap: 6px; }
.order-action-btn {
  width: 36px; height: 36px; border-radius: 9px;
  background: rgba(255,255,255,0.15);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 16px; transition: background 0.15s;
  border: none; color: white;
}
.order-action-btn:active { background: rgba(255,255,255,0.3); }
.order-action-btn.primary-action { background: white; color: var(--text); }
.order-mesa-btn {
  display: flex; align-items: center; gap: 4px;
  background: rgba(255,255,255,0.15); border-radius: 8px;
  padding: 4px 10px; font-size: 14px; font-weight: 700; color: white;
}
.order-info {
  display: flex; gap: 12px; align-items: center; padding: 10px 16px;
  background: var(--bg2); border-bottom: 1px solid var(--border);
}
.order-info-item { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--text2); }
.order-status-badge {
  margin-left: auto; font-size: 11px; font-weight: 700; text-transform: uppercase;
  padding: 4px 10px; border-radius: 20px;
  background: var(--orange-soft); color: var(--orange);
}
.order-status-badge.lista { background: var(--green-soft); color: var(--green); }

/* ITEMS */
.items-list { padding: 8px 16px; }
.item-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 12px; margin-bottom: 8px;
}
.item-top { display: flex; align-items: center; justify-content: space-between; }
.item-name { font-size: 14px; font-weight: 600; color: var(--text); flex: 1; }
.item-price { font-size: 14px; font-weight: 700; color: var(--text); margin: 0 12px; }
.item-del { font-size: 14px; color: var(--text3); cursor: pointer; padding: 4px; font-weight: 700; }
.item-del:active { color: var(--red); }
.item-note { font-size: 11px; color: var(--text2); margin-top: 6px; font-style: italic; background: var(--bg2); padding: 4px 8px; border-radius: 6px; }
.item-status-row { margin-top: 8px; }
.item-badge {
  display: inline-flex; align-items: center;
  font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 4px;
  text-transform: uppercase; letter-spacing: 0.3px;
}
.item-badge-prep { background: var(--bg3); color: var(--text2); }
.item-badge-cooking { background: var(--orange-soft); color: var(--orange); }
.item-badge-listo { background: #000; color: #fff; }
.item-badge-entregado { background: var(--green-soft); color: #1A7E37; }

.items-empty { text-align: center; padding: 40px 20px; color: var(--text3); }
.items-empty .empty-icon { font-size: 40px; margin-bottom: 10px; }

/* TOTAL BAR */
.total-bar {
  margin: 0 16px 12px; background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px 16px;
  display: flex; align-items: center; justify-content: space-between;
}
.total-label { font-size: 13px; color: var(--text2); }
.total-amount { font-size: 22px; font-weight: 800; color: var(--text); }

/* ACTIONS BAR (Pedir más / Llamar caja) */
.actions-bar { display: flex; gap: 10px; padding: 0 16px 16px; }

/* ALERTS */
.alerts-list { padding: 8px 16px; }
.alert-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px; margin-bottom: 8px;
  display: flex; gap: 12px; align-items: flex-start;
}
.alert-card.urgente { border-color: var(--red); background: var(--red-soft); }
.alert-icon { font-size: 20px; font-weight: 800; flex-shrink: 0; color: var(--red); }
.alert-body { flex: 1; }
.alert-title { font-size: 14px; font-weight: 700; color: var(--text); }
.alert-card.urgente .alert-title { color: var(--red); }
.alert-sub { font-size: 12px; color: var(--text2); margin-top: 2px; }
.alert-time { font-size: 11px; color: var(--text3); margin-top: 4px; }
.alert-action {
  font-size: 12px; font-weight: 700; color: white; background: var(--red);
  border-radius: 8px; padding: 6px 12px; cursor: pointer; border: none; margin-top: 8px;
}
.alerts-empty { text-align: center; padding: 60px 20px; color: var(--text3); }
.alerts-empty .empty-icon { font-size: 48px; margin-bottom: 12px; }

/* MODAL */
.modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
  z-index: 200; align-items: flex-end; justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--surface); width: 100%; max-width: 480px;
  border-radius: 20px 20px 0 0; max-height: 90vh;
  display: flex; flex-direction: column; animation: slideUp 0.25s ease;
}
.modal-handle { width: 40px; height: 4px; background: var(--border); border-radius: 2px; margin: 12px auto 4px; flex-shrink: 0; }
.modal-header {
  padding: 8px 16px 14px; display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.modal-title { font-size: 17px; font-weight: 700; color: var(--text); }
.modal-close { font-size: 20px; color: var(--text3); cursor: pointer; padding: 4px; }
.modal-body { overflow-y: auto; flex: 1; padding: 16px; }
.modal-footer { padding: 12px 16px; border-top: 1px solid var(--border); flex-shrink: 0; }

/* SEARCH */
.search-box {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 10px 14px; margin-bottom: 12px;
}
.search-box input { flex: 1; background: none; border: none; outline: none; font-size: 15px; color: var(--text); }
.search-box input::placeholder { color: var(--text3); }

.category-chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-bottom: 12px; }
.category-chips::-webkit-scrollbar { display: none; }
.chip {
  padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600;
  border: 1px solid var(--border); background: var(--surface); color: var(--text2);
  cursor: pointer; white-space: nowrap; transition: all 0.15s; flex-shrink: 0;
}
.chip.active { background: var(--indigo); color: white; border-color: var(--indigo); }

.product-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
.product-item:last-child { border-bottom: none; }
.product-img {
  width: 44px; height: 44px; border-radius: 10px; background: var(--bg3);
  flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 20px; overflow: hidden;
}
.product-img img { width: 100%; height: 100%; object-fit: cover; }
.product-info { flex: 1; }
.product-name { font-size: 14px; font-weight: 600; color: var(--text); }
.product-price { font-size: 13px; color: var(--text2); margin-top: 2px; }
.product-add-btn {
  width: 28px; height: 28px; border-radius: 8px; background: var(--indigo-soft);
  border: 1px solid var(--indigo); color: var(--indigo); font-size: 18px;
  display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; font-weight: 700;
}
.product-qty-ctrl { display: flex; align-items: center; gap: 8px; }
.qty-btn {
  width: 28px; height: 28px; border-radius: 8px; background: var(--bg2);
  border: 1px solid var(--border); font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-weight: 700; color: var(--text);
}
.qty-btn:active { background: var(--bg3); }
.qty-num { font-size: 15px; font-weight: 700; min-width: 20px; text-align: center; color: var(--text); }

/* PROMOS & FEATURED */
.promo-badge {
  display: inline-block; font-size: 9px; font-weight: 800;
  background: #000; color: #fff; border-radius: 4px;
  padding: 2px 6px; letterSpacing: 0.04em;
  margin-left: 6px; vertical-align: middle;
}
.promo-badge.disc { background: var(--green); }
.promo-badge.type { background: var(--blue); }
.promo-section-title {
  font-size: 11px; font-weight: 800; color: var(--text2);
  text-transform: uppercase; letter-spacing: 0.6px;
  margin: 14px 0 8px; padding: 0 2px;
  display: flex; align-items: center; gap: 6px;
}
.featured-card {
  display: flex; align-items: center; gap: 12px;
  background: linear-gradient(135deg, #1D1D1F 0%, #000 100%);
  color: #fff; border-radius: 12px; padding: 12px 14px;
  margin-bottom: 10px; cursor: pointer; position: relative; overflow: hidden;
}
.featured-card .feat-img {
  width: 52px; height: 52px; border-radius: 10px; background: rgba(255,255,255,0.08);
  flex-shrink: 0; display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.featured-card .feat-img img { width: 100%; height: 100%; object-fit: cover; }
.featured-card .feat-info { flex: 1; min-width: 0; }
.featured-card .feat-tag { font-size: 9px; font-weight: 800; color: rgba(255,255,255,0.55); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 2px; }
.featured-card .feat-name { font-size: 14px; font-weight: 700; color: #fff; }
.featured-card .feat-price { font-size: 12px; color: rgba(255,255,255,0.65); margin-top: 2px; }
.featured-card .feat-add {
  background: #fff; color: #000; border-radius: 8px;
  width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
  font-size: 20px; font-weight: 800; flex-shrink: 0;
}
.promo-strip {
  display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
  margin-bottom: 10px; padding-bottom: 4px;
}
.promo-strip::-webkit-scrollbar { display: none; }
.promo-pill {
  flex-shrink: 0; min-width: 140px; max-width: 180px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 8px 10px; cursor: pointer;
  display: flex; flex-direction: column; gap: 2px;
}
.promo-pill .pill-badge {
  display: inline-block; font-size: 9px; font-weight: 800;
  background: var(--orange); color: #fff;
  border-radius: 4px; padding: 1px 6px; align-self: flex-start;
}
.promo-pill.disc .pill-badge { background: var(--green); }
.promo-pill .pill-name { font-size: 12px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.promo-pill .pill-price { font-size: 11px; color: var(--text2); display: flex; gap: 6px; align-items: baseline; }
.promo-pill .pill-old { text-decoration: line-through; color: var(--text3); font-size: 10px; }

/* PRODUCT EXTRAS / NOTES */
.product-extras { padding: 6px 0 8px 56px; }
.product-note-field {
  width: 100%; padding: 7px 10px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: var(--bg2); color: var(--text);
  font-size: 13px; font-family: inherit; resize: none; outline: none;
}
.product-note-field:focus { border-color: var(--indigo); }
.extra-check-label {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--text2); cursor: pointer; margin-top: 5px;
}
.extra-check-label input[type="checkbox"] { width: 14px; height: 14px; cursor: pointer; accent-color: #000; }

/* PAYMENT */
.pay-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.pay-item:last-child { border-bottom: none; }
.pay-item-name { flex: 1; font-size: 13px; color: var(--text); }
.pay-item-price { font-size: 13px; font-weight: 700; color: var(--text); }

.tip-section { margin-top: 16px; }
.section-label { font-size: 12px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
.tip-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.tip-chip {
  padding: 8px 14px; border-radius: 20px; font-size: 13px; font-weight: 700;
  border: 2px solid var(--border); background: var(--surface); color: var(--text2); cursor: pointer;
}
.tip-chip.active { background: var(--indigo); color: white; border-color: var(--indigo); }

.payment-methods { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; margin-top: 8px; }
.pay-method {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 10px 6px; border-radius: var(--radius-sm); border: 2px solid var(--border);
  background: var(--surface); cursor: pointer; font-size: 11px; font-weight: 600; color: var(--text2); text-align: center;
}
.pay-method .pay-icon { font-size: 20px; }
.pay-method.active { border-color: var(--indigo); background: var(--indigo-soft); color: var(--indigo); }

.pay-summary { margin-top: 16px; background: var(--bg2); border-radius: var(--radius-sm); padding: 14px; }
.pay-row { display: flex; justify-content: space-between; font-size: 14px; color: var(--text2); margin-bottom: 6px; }
.pay-row.total { font-size: 18px; font-weight: 800; color: var(--text); margin-bottom: 0; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }

/* BUTTONS */
.btn {
  padding: 14px 18px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 700;
  cursor: pointer; border: none; display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: opacity 0.15s, transform 0.1s;
}
.btn:active { opacity: 0.85; transform: scale(0.98); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.btn-primary { background: var(--text); color: white; flex: 1; }
.btn-secondary { background: var(--bg2); color: var(--text); border: 1px solid var(--border); }
.btn-indigo { background: var(--indigo); color: white; flex: 1; }
.btn-full { width: 100%; }
.btn-sm { padding: 10px 14px; font-size: 13px; }

/* DIALOG */
.dialog-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 300; align-items: center; justify-content: center; padding: 20px; }
.dialog-overlay.open { display: flex; }
.dialog { background: var(--surface); border-radius: var(--radius); padding: 24px; width: 100%; max-width: 320px; animation: fadeIn 0.2s ease; }
.dialog-title { font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
.dialog-body { font-size: 14px; color: var(--text2); margin-bottom: 20px; line-height: 1.5; white-space: pre-line; }
.dialog-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.dialog-btn { padding: 10px 20px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 700; cursor: pointer; border: none; }
.dialog-btn.cancel { background: var(--bg2); color: var(--text2); }
.dialog-btn.confirm { background: var(--indigo); color: white; }
.dialog-btn.danger { background: var(--red); color: white; }

/* TOAST */
.toast {
  position: fixed; top: 70px; left: 50%; transform: translateX(-50%);
  background: var(--text); color: white; padding: 12px 20px;
  border-radius: var(--radius); font-size: 14px; font-weight: 600;
  z-index: 400; opacity: 0; transition: opacity 0.3s; pointer-events: none;
  white-space: nowrap; display: flex; align-items: center; gap: 8px;
}
.toast.show { opacity: 1; }

/* NO ORDER */
.no-order-state { padding: 60px 20px; text-align: center; }
.no-order-state h3 { font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
.no-order-state p { font-size: 14px; color: var(--text2); margin-bottom: 24px; }

/* NOTE */
.note-field {
  width: 100%; padding: 10px 12px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: var(--bg2); color: var(--text);
  font-size: 14px; font-family: inherit; resize: none; outline: none; margin-top: 8px;
}
.note-field:focus { border-color: var(--indigo); }

/* LOADING */
.loading-screen {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 100vh; gap: 16px;
}
.spinner {
  width: 40px; height: 40px; border: 3px solid var(--border);
  border-top-color: var(--indigo); border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

/* ALERT POPUP */
@keyframes slideDown { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.alert-popup {
  position: fixed; top: 70px; left: 16px; right: 16px; max-width: 448px;
  margin: 0 auto; background: var(--red); color: white;
  border-radius: var(--radius); padding: 14px 16px;
  z-index: 350; animation: slideDown 0.3s ease; box-shadow: var(--shadow-lg);
  display: flex; align-items: center; gap: 12px;
}
.alert-popup-body { flex: 1; }
.alert-popup-title { font-size: 15px; font-weight: 700; }
.alert-popup-sub { font-size: 13px; opacity: 0.85; margin-top: 2px; }
.alert-popup-btn {
  background: white; color: var(--red); border: none; border-radius: 8px;
  padding: 8px 14px; font-size: 13px; font-weight: 700; cursor: pointer; flex-shrink: 0;
}

/* TURNO */
.turno-stat {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 12px; padding: 14px 18px;
  display: flex; justify-content: space-between; align-items: center;
}
.turno-stat-label { font-size: 13px; color: var(--text2); font-weight: 500; }
.turno-stat-value { font-size: 20px; font-weight: 800; color: var(--text); }
.turno-stat.highlight { background: #000; border-color: #000; }
.turno-stat.highlight .turno-stat-label { color: rgba(255,255,255,0.65); }
.turno-stat.highlight .turno-stat-value { color: #fff; }
[data-theme="dark"] .btn-indigo { color: var(--bg); }
[data-theme="dark"] .tip-chip.active { color: var(--bg); }
[data-theme="dark"] .ready-count-badge { background: var(--text); color: var(--bg); }
[data-theme="dark"] .turno-stat.highlight { background: var(--bg3); border-color: var(--border-strong, #636366); }
[data-theme="dark"] .mesa-card.cocina { background: #48484A; border-color: #48484A; }
</style>
