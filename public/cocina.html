<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mythos · Cocina</title>
<link rel="stylesheet" href="design-system.css">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="ui-primitives.css">
<script src="mythos-theme.js"></script>
<script src="mythos-icons.js"></script>
<script src="mythos-offline.js"></script>
<script>MythosTheme.init('dark');</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.1/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="mythos-presence.js"></script>
<script src="mythos-session.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;color:var(--text-primary);-webkit-font-smoothing:antialiased;transition:background var(--transition),color var(--transition)}
  ::-webkit-scrollbar{width:4px;height:4px}
  ::-webkit-scrollbar-track{background:var(--bg-subtle)}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
  input,textarea,select{font-family:inherit;background:var(--surface);border:1px solid var(--border);color:var(--text-primary);outline:none;border-radius:8px}
  input:focus,textarea:focus,select:focus{border-color:var(--text-primary)}
  button{font-family:inherit;cursor:pointer}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
  @keyframes blink{0%,100%{border-color:#FF3B30;box-shadow:0 0 0 0 rgba(255,59,48,0)}50%{border-color:#FF3B30;box-shadow:0 0 0 4px rgba(255,59,48,0.18)}}
  @keyframes ring{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  @keyframes slideIn{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:translateX(0)}}
  @keyframes slideRight{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
  @keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes greenFlash{0%{background:rgba(52,199,89,0.0)}30%{background:rgba(52,199,89,0.18)}100%{background:transparent}}
  .spin{animation:spin .8s linear infinite;display:inline-block;width:18px;height:18px;border:2px solid #38383A;border-top-color:#F5F5F7;border-radius:50%;vertical-align:middle}
  .card-critical{animation:blink 1s ease infinite}
</style>
</head>
<body>
<div id="root"></div>
<script>
/* ── Guardia de seguridad — redirige si no hay sesión activa ── */
(function(){
  var rid  = localStorage.getItem('mythos_restaurant_id');
  var role = localStorage.getItem('mythos_role');
  if (!rid && role !== 'superadmin') { window.location.replace('login.html?next=cocina.html'); }
})();
</script>
<!-- PR-5: panel precompilado con Vite. Reemplaza los CDN de React/ReactDOM y el transpilador en navegador + el script JSX inline. El bundle se genera en public/build/ por `npm run build`. -->
<script src="build/cocina.js"></script>
</body>
</html>
