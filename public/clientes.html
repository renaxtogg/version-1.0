<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mythos · Comensales</title>
<!-- Beta cerrada: fuera del índice hasta que se abra al público (ver robots.txt). -->
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Tu identidad gastronómica en Mythos: historial entre restaurantes, experiencia y reseñas verificadas.">
<meta name="theme-color" content="#000000">
<link rel="stylesheet" href="design-system.css">
<link rel="stylesheet" href="tokens.css">
<script src="mythos-offline.js"></script>
<!-- Supabase JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.1/dist/umd/supabase.min.js"></script>
<!-- Configuración del proyecto (SUPABASE_URL + ANON_KEY) -->
<script src="config.js"></script>
<!-- CAPTCHA: Cloudflare Turnstile (soporte NATIVO de Supabase Auth). Está PRENDIDO
     en el proyecto, así que TODA llamada de Auth (signUp, signInWithPassword,
     resetPasswordForEmail) tiene que mandar options.captchaToken o el server
     responde "captcha protection: request disallowed".

     Diferencia con registro.html: acá el widget lo monta REACT cuando dibuja la
     pantalla de acceso (mount(el)), porque el contenedor no existe en el HTML.
     El token es de UN SOLO USO: después de cada intento hay que reset() o el
     segundo intento se rechaza aunque los datos estén bien. -->
<script>
(function () {
  // Site key PÚBLICA de Turnstile — la misma de registro.html (va en el front).
  var SITE_KEY = '0x4AAAAAADs0-Olt_9L_CI3V';
  var st = { token: '', id: null, ready: false, el: null };

  function render() {
    if (!window.turnstile || !st.el || st.id !== null) return;
    try {
      st.id = window.turnstile.render(st.el, {
        sitekey: SITE_KEY,
        callback: function (t) { st.token = t; },
        'error-callback': function () { st.token = ''; },
        'expired-callback': function () { st.token = ''; }
      });
    } catch (e) {}
  }

  window.onTurnstileLoad = function () { st.ready = true; render(); };

  window.MythosCaptcha = {
    siteKey: SITE_KEY,
    mount: function (el) { st.el = el; render(); },
    token: function () { return st.token; },
    reset: function () {
      try { if (st.id !== null) window.turnstile.reset(st.id); } catch (e) {}
      st.token = '';
    },
    // El token llega ASÍNCRONO: si alguien tipea rápido y toca Entrar antes de
    // que Turnstile resuelva, mandaríamos vacío y el server rebota con un error
    // que el usuario no puede corregir. Esperamos hasta `ms` y si no llega,
    // devolvemos '' — que Supabase decida (si el CAPTCHA se apaga, sigue andando).
    waitToken: function (ms) {
      var limit = ms || 12000, t0 = Date.now();
      return new Promise(function (resolve) {
        (function poll() {
          if (st.token) return resolve(st.token);
          if (Date.now() - t0 > limit) return resolve('');
          setTimeout(poll, 150);
        })();
      });
    }
  };
})();
</script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTurnstileLoad&render=explicit" async defer></script>
<!-- Sin mythos-theme.js a propósito: el tema de este panel lo maneja React
     (src/clientes/theme.jsx) porque el marco del teléfono pinta su propio
     fondo, igual que el panel del QR. -->
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:#111;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  .phone-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh}
  .phone{width:390px;height:844px;border-radius:44px;overflow:hidden;position:relative;box-shadow:0 40px 80px rgba(0,0,0,0.7),0 0 0 1px rgba(255,255,255,0.08);flex-shrink:0}
  .screen{position:absolute;inset:0;overflow:hidden;display:flex;flex-direction:column;-webkit-overflow-scrolling:touch}
  .screen::-webkit-scrollbar{display:none}
  .screen *::-webkit-scrollbar{display:none}
  .screen>*{flex:1;min-height:0}
  input,textarea,select{font-family:inherit}
  button{font-family:inherit}
  @keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes spin{to{transform:rotate(360deg)}}
  /* En un teléfono real el marco desaparece y la app ocupa la pantalla entera.
     Mismo corte que el panel del QR (430px). */
  @media(max-width:430px){
    body{display:block;background:#fff}
    .phone-wrap,.phone-wrap>div{display:block}
    .phone{width:100%!important;height:100dvh!important;border-radius:0!important;box-shadow:none!important}
    .screen{position:fixed!important}
  }
</style>
</head>
<body>
<div id="app"></div>
<!-- Panel precompilado con Vite (patrón PR-5). El bundle lo genera
     `npm run build` en public/build/ y lo reconstruye Vercel en cada deploy. -->
<script src="build/clientes.js"></script>
</body>
</html>
