<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mythos · Comensales</title>
<!-- Beta cerrada: fuera del índice hasta que se abra al público (ver robots.txt). -->
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Tu identidad gastronómica en Mythos: historial entre restaurantes, experiencia y reseñas verificadas.">
<meta name="theme-color" content="#000000">
<link rel="stylesheet" href="design-system.css">
<link rel="stylesheet" href="tokens.css">
<script src="mythos-offline.js"></script>
<!-- Supabase JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.1/dist/umd/supabase.min.js"></script>
<!-- Configuración del proyecto (SUPABASE_URL + ANON_KEY) -->
<script src="config.js"></script>
<!-- CAPTCHA: Cloudflare Turnstile (soporte NATIVO de Supabase Auth). Está PRENDIDO
     en el proyecto, así que TODA llamada de Auth (signUp, signInWithPassword,
     resetPasswordForEmail) tiene que mandar options.captchaToken o el server
     responde "captcha protection: request disallowed".

     Diferencia con registro.html: acá el widget lo monta REACT cuando dibuja la
     pantalla de acceso (mount(el)), porque el contenedor no existe en el HTML.
     El token es de UN SOLO USO: después de cada intento hay que reset() o el
     segundo intento se rechaza aunque los datos estén bien. -->
<script>
(function () {
  // Site key PÚBLICA de Turnstile — la misma de registro.html (va en el front).
  var SITE_KEY = '0x4AAAAAADs0-Olt_9L_CI3V';
  var st = { token: '', id: null, ready: false, el: null };

  function render() {
    if (!window.turnstile || !st.el || st.id !== null) return;
    try {
      st.id = window.turnstile.render(st.el, {
        sitekey: SITE_KEY,
        callback: function (t) { st.token = t; },
        'error-callback': function () { st.token = ''; },
        'expired-callback': function () { st.token = ''; }
      });
    } catch (e) {}
  }

  window.onTurnstileLoad = function () { st.ready = true; render(); };

  window.MythosCaptcha = {
    siteKey: SITE_KEY,
    mount: function (el) { st.el = el; render(); },
    token: function () { return st.token; },
    reset: function () {
      try { if (st.id !== null) window.turnstile.reset(st.id); } catch (e) {}
      st.token = '';
    },
    // El token llega ASÍNCRONO: si alguien tipea rápido y toca Entrar antes de
    // que Turnstile resuelva, mandaríamos vacío y el server rebota con un error
    // que el usuario no puede corregir. Esperamos hasta `ms` y si no llega,
    // devolvemos '' — que Supabase decida (si el CAPTCHA se apaga, sigue andando).
    waitToken: function (ms) {
      var limit = ms || 12000, t0 = Date.now();
      return new Promise(function (resolve) {
        (function poll() {
          if (st.token) return resolve(st.token);
          if (Date.now() - t0 > limit) return resolve('');
          setTimeout(poll, 150);
        })();
      });
    }
  };
})();
</script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTurnstileLoad&render=explicit" async defer></script>
<!-- Sin mythos-theme.js a propósito: el tema de este panel lo maneja React
     (src/clientes/theme.jsx) porque el marco del teléfono pinta su propio
     fondo, igual que el panel del QR. -->
<style>
  /* ── Página responsive real: celular Y computadora ──────────────────────
     Antes esto era un marco de teléfono de 390×844 centrado sobre fondo
     oscuro: en una notebook se veía una maqueta, no un sitio. La vitrina se
     navega sin cuenta y tiene que verse como lo que es en las dos pantallas.
     El color de fondo lo pinta React (tema claro/oscuro), acá sólo la caja. */
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{min-height:100dvh;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
       -webkit-font-smoothing:antialiased;overflow-x:hidden}
  #app{min-height:100dvh;display:flex;flex-direction:column}
  img{max-width:100%;display:block}
  input,textarea,select,button{font-family:inherit}

  /* Contenedor único de todas las secciones. El ancho máximo es el mismo que
     usa la web de marketing, así /clientes no se siente otro sitio. */
  .wrap{width:100%;max-width:1180px;margin:0 auto;padding:0 20px}
  @media(max-width:640px){ .wrap{padding:0 16px} }

  /* Grilla de tarjetas: 3 → 2 → 1 según ancho. Nunca desborda en horizontal. */
  .grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
  @media(max-width:640px){ .grid{gap:14px;grid-template-columns:1fr} }

  /* Fila de chips que se desplaza sola en celular en vez de romper el layout. */
  .chips{display:flex;gap:9px;flex-wrap:wrap}
  @media(max-width:640px){
    .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;
           padding-bottom:2px;-webkit-overflow-scrolling:touch}
    .chips::-webkit-scrollbar{display:none}
  }

  /* ── App del comensal identificado ──────────────────────────────────────
     Dos shells en la misma página, a propósito:
       • SIN cuenta  → vitrina responsive (lo de arriba). Es una web pública:
         se navega igual en una notebook que en el celular.
       • CON cuenta  → la app de siempre, en marco de teléfono. Renato la
         prefiere así y tiene sentido: adentro es una app personal de una mano
         (navegación abajo, una pantalla por objetivo), no un sitio para leer.
     En un celular real el marco desaparece y ocupa la pantalla entera. */
  body.app-mode{background:#111;display:flex;align-items:center;justify-content:center}
  body.app-mode #app{display:block;min-height:100dvh}
  .phone-wrap{display:flex;align-items:center;justify-content:center;min-height:100dvh}
  .phone{width:390px;height:844px;border-radius:44px;overflow:hidden;position:relative;
         box-shadow:0 40px 80px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.08);flex-shrink:0}
  .screen{position:absolute;inset:0;overflow:hidden;display:flex;flex-direction:column;
          -webkit-overflow-scrolling:touch}
  .screen::-webkit-scrollbar,.screen *::-webkit-scrollbar{display:none}
  .screen>*{flex:1;min-height:0}
  @media(max-width:430px){
    body.app-mode{display:block;background:#fff}
    .phone-wrap{display:block;min-height:0}
    .phone{width:100%!important;height:100dvh!important;border-radius:0!important;box-shadow:none!important}
    .screen{position:fixed!important}
  }

  @keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"></div>
<!-- Panel precompilado con Vite (patrón PR-5). El bundle lo genera
     `npm run build` en public/build/ y lo reconstruye Vercel en cada deploy. -->
<script src="build/clientes.js"></script>
</body>
</html>
