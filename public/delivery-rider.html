<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mythos · Rider</title>
<link rel="stylesheet" href="design-system.css">
<script src="mythos-theme.js"></script>
<script src="mythos-icons.js"></script>
<script src="mythos-offline.js"></script>
<script>MythosTheme.init('light');</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.1/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>window.MYTHOS_PRESENCE_MANUAL = true;</script>
<script src="mythos-presence.js"></script>
<script src="mythos-session.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:#111;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  .phone-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh}
  .phone{width:390px;height:844px;border-radius:44px;overflow:hidden;position:relative;box-shadow:0 40px 80px rgba(0,0,0,0.7),0 0 0 1px rgba(255,255,255,0.08);flex-shrink:0}
  .screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scroll-behavior:smooth;background:#fff}
  .screen::-webkit-scrollbar{display:none}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(1.15)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes popIn{0%{opacity:0;transform:scale(.88)}100%{opacity:1;transform:scale(1)}}
  @media(max-width:430px){
    body{display:block;background:#fff}
    .phone-wrap,.phone-wrap>div{display:block}
    .phone{width:100%!important;height:100dvh!important;border-radius:0!important;box-shadow:none!important}
    .screen{position:fixed!important}
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ── Guardia de seguridad — redirige si no hay sesión activa ── */
(function(){
  var rid  = localStorage.getItem('mythos_restaurant_id');
  var role = localStorage.getItem('mythos_role');
  if (!rid && role !== 'superadmin') { window.location.replace('login.html?next=delivery-rider.html'); }
})();
</script>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ── DB ── */
const _initDB = () => {
  const cfg = window.SUPABASE_CONFIG;
  if (!cfg?.url || !cfg?.anonKey) return null;
  const url = cfg.url.replace(/^﻿/,'').trim();
  const key = cfg.anonKey.replace(/^﻿/,'').trim();
  if (!url || url.includes('YOUR_') || !key) return null;
  try { return window.supabase.createClient(url, key); } catch(e) { return null; }
};
const db = _initDB();
// Multi-tenant Engine: el comercio se resuelve desde la sesión activa (localStorage), sin UUID hardcodeado.
const RESTAURANT_ID = localStorage.getItem('mythos_restaurant_id');
const RID = RESTAURANT_ID; // alias retro-compatible con consultas/suscripciones existentes

/* ── UTILS ── */
const fmt = n => '₲ ' + (n||0).toLocaleString('es-PY');
const fmtTime = d => new Date(d).toLocaleTimeString('es-PY',{hour:'2-digit',minute:'2-digit'});
const diffMin = (a,b) => Math.round((new Date(b)-new Date(a))/60000);
const vibrate = () => { try { navigator.vibrate && navigator.vibrate([200,100,200]); } catch(e) {} };
const VEHICLE = { moto:'🛵', bici:'🚲', auto:'🚗', pie:'🚶' };

/* ── SPINNER ── */
function Spinner() {
  return <div style={{width:22,height:22,border:'2px solid #D2D2D7',borderTopColor:'#000',borderRadius:'50%',animation:'spin .7s linear infinite',margin:'48px auto',display:'block'}} />;
}

/* ─────────────────────────────────────────
   PANTALLA: ERROR (cuenta sin ficha de rider / desactivada)
   El login es por correo+contraseña en login.html; acá ya no hay PIN.
───────────────────────────────────────── */
function ErrorScreen({ msg, onLogout }) {
  return (
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',height:'100%',padding:32,background:'#fff',textAlign:'center'}}>
      <div style={{fontSize:52,marginBottom:12}}>🛵</div>
      <div style={{fontSize:20,fontWeight:800,color:'#1D1D1F',marginBottom:10}}>No pudimos abrir tu panel</div>
      <div style={{fontSize:14,color:'#86868B',marginBottom:32,lineHeight:1.5,maxWidth:300}}>{msg}</div>
      <button
        onClick={onLogout}
        style={{width:'100%',padding:'16px',background:'#000',color:'#fff',border:'none',borderRadius:16,fontSize:16,fontWeight:700,cursor:'pointer'}}
      >Volver al inicio de sesión</button>
    </div>
  );
}

/* ─────────────────────────────────────────
   PANTALLA: HOME (con pedidos asignados integrados)
───────────────────────────────────────── */
function HomeScreen({ rider, stats, activeOrders, onStartRoute, onShowRoute, onShowHistory, onLogout, onStatusChange, onRefresh }) {
  const [changingStatus, setChangingStatus] = useState(false);
  const [starting, setStarting] = useState(false);
  const status = rider.current_status || 'disponible';

  const pendingOrders = activeOrders.filter(o => o.rider_status === 'confirmed');
  const routeOrders   = activeOrders.filter(o => o.rider_status === 'on_way');

  async function toggleStatus() {
    if (!db) return;
    setChangingStatus(true);
    const next = status === 'disponible' ? 'offline' : 'disponible';
    await db.from('delivery_riders').update({ current_status: next }).eq('id', rider.id);
    onStatusChange(next);
    setChangingStatus(false);
  }

  async function handleStartRoute() {
    if (!pendingOrders.length || !db || starting) return;
    setStarting(true);
    for (const o of pendingOrders) {
      await db.from('delivery_orders').update({
        rider_status: 'on_way',
        picked_up_at: new Date().toISOString(),
      }).eq('id', o.id);
    }
    await db.from('delivery_riders').update({ current_status: 'en_ruta' }).eq('id', rider.id);
    setStarting(false);
    onStartRoute(pendingOrders);
  }

  function getMapsUrl(orders) {
    const addrs = orders.map(o => encodeURIComponent(o.delivery_address || o.customer_name || ''));
    if (!addrs.length) return null;
    if (addrs.length === 1) return `https://www.google.com/maps/dir/?api=1&destination=${addrs[0]}`;
    return `https://www.google.com/maps/dir/?api=1&destination=${addrs[addrs.length-1]}&waypoints=${addrs.slice(0,-1).join('|')}`;
  }

  const STATUS_BG    = { disponible:'#F0FAF4', offline:'#F5F5F7', en_ruta:'#FFF7E6' };
  const STATUS_COLOR = { disponible:'#34C759', offline:'#86868B', en_ruta:'#FF9500' };
  const STATUS_LABEL = { disponible:'Disponible', offline:'Offline', en_ruta:'En ruta' };

  function earnLabel() {
    if (!stats.count) return '—';
    if (rider.commission_type === 'salary') return `${stats.count} entregas`;
    return fmt(stats.earned);
  }

  return (
    <div style={{display:'flex',flexDirection:'column',height:'100%',background:'#fff'}}>
      {/* Header */}
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'20px 20px 14px',borderBottom:'1px solid #F5F5F7'}}>
        <div>
          <div style={{fontSize:20,fontWeight:800,color:'#1D1D1F'}}>
            {VEHICLE[rider.vehicle]||'🛵'} {rider.name.split(' ')[0]}
          </div>
          <div style={{fontSize:12,color:'#86868B',marginTop:2}}>{rider.name}</div>
        </div>
        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          <button onClick={onRefresh} style={{background:'none',border:'1.5px solid #D2D2D7',borderRadius:8,padding:'6px 10px',fontSize:13,color:'#6E6E73',cursor:'pointer'}}>↻</button>
          <button onClick={onLogout} style={{background:'none',border:'1.5px solid #D2D2D7',borderRadius:8,padding:'6px 12px',fontSize:12,color:'#6E6E73',cursor:'pointer',fontWeight:500}}>Salir</button>
        </div>
      </div>

      <div style={{flex:1,overflowY:'auto',padding:'16px 20px 80px'}}>

        {/* Status card */}
        <div style={{background:STATUS_BG[status]||'#F5F5F7',borderRadius:16,padding:'16px 20px',marginBottom:16,animation:'fadeIn .2s'}}>
          <div style={{display:'flex',alignItems:'center',gap:12}}>
            <div style={{width:11,height:11,borderRadius:'50%',background:STATUS_COLOR[status]||'#86868B',flexShrink:0,animation:status==='disponible'?'pulse 1.8s ease-in-out infinite':'none'}} />
            <div style={{fontSize:15,fontWeight:700,color:'#1D1D1F',flex:1}}>{STATUS_LABEL[status]||status}</div>
            {status !== 'en_ruta' && (
              <button onClick={toggleStatus} disabled={changingStatus} style={{padding:'7px 14px',background:status==='disponible'?'transparent':'#000',color:status==='disponible'?'#6E6E73':'#fff',border:status==='disponible'?'1.5px solid #D2D2D7':'none',borderRadius:9,fontSize:12,fontWeight:600,cursor:'pointer'}}>
                {changingStatus ? '…' : status==='disponible' ? 'Ir offline' : 'Activarme'}
              </button>
            )}
          </div>
        </div>

        {/* Ruta activa */}
        {routeOrders.length > 0 && (
          <div style={{background:'#FFF7ED',border:'1.5px solid #FDBA74',borderRadius:16,padding:'16px',marginBottom:16,animation:'fadeIn .2s'}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
              <div style={{fontSize:14,fontWeight:800,color:'#C2410C'}}>🛵 Ruta activa — {routeOrders.length} entrega{routeOrders.length>1?'s':''}</div>
              {getMapsUrl(routeOrders) && (
                <a href={getMapsUrl(routeOrders)} target="_blank" rel="noopener noreferrer" style={{fontSize:12,fontWeight:700,color:'#fff',background:'#C2410C',borderRadius:8,padding:'5px 10px',textDecoration:'none'}}>
                  Ver mapa
                </a>
              )}
            </div>
            {routeOrders.map((o,i) => (
              <div key={o.id} style={{fontSize:12,color:'#92400E',padding:'4px 0',borderTop:i>0?'1px solid rgba(194,65,12,.15)':'none',display:'flex',gap:8,alignItems:'flex-start'}}>
                <span style={{fontWeight:800,flexShrink:0}}>{i+1}.</span>
                <span>{o.customer_name} — {o.delivery_address||'—'}</span>
              </div>
            ))}
            <button onClick={onShowRoute} style={{marginTop:12,width:'100%',padding:'12px',background:'#C2410C',color:'#fff',border:'none',borderRadius:12,fontSize:14,fontWeight:700,cursor:'pointer'}}>
              Continuar ruta →
            </button>
          </div>
        )}

        {/* Pedidos asignados esperando inicio */}
        {pendingOrders.length > 0 && (
          <div style={{marginBottom:16,animation:'fadeIn .2s'}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
              <div style={{fontSize:11,fontWeight:700,color:'#86868B',textTransform:'uppercase',letterSpacing:.8}}>
                {pendingOrders.length} pedido{pendingOrders.length>1?'s':''} asignado{pendingOrders.length>1?'s':''} —{' '}
                {pendingOrders.every(o => o.orders?.status === 'ready') ? '¡Listos para buscar!' : 'En preparación'}
              </div>
              {getMapsUrl(pendingOrders) && (
                <a href={getMapsUrl(pendingOrders)} target="_blank" rel="noopener noreferrer" style={{fontSize:11,color:'#6E6E73',textDecoration:'underline'}}>
                  Ver en mapa
                </a>
              )}
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:10}}>
              {pendingOrders.map((o,i) => {
                const kitchenStatus = o.orders?.status || 'kitchen_received';
                const isReady = kitchenStatus === 'ready';
                const orderNum = o.orders?.order_number || null;
                return (
                <div key={o.id} style={{background: isReady ? '#F0FAF4' : '#F5F5F7', border: isReady ? '1.5px solid #34C759' : '1.5px solid transparent', borderRadius:14,padding:'14px 16px',animation:'fadeIn .15s'}}>
                  {/* Ticket + estado cocina */}
                  <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:8}}>
                    {orderNum && <span style={{fontFamily:"'SF Mono',ui-monospace,monospace",fontSize:12,fontWeight:800,color:'#1D1D1F'}}>#{orderNum}</span>}
                    <KitchenBadge status={kitchenStatus} />
                  </div>
                  <div style={{display:'flex',alignItems:'flex-start',gap:10,marginBottom:6}}>
                    <div style={{width:26,height:26,borderRadius:'50%',background:'#000',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:800,flexShrink:0,marginTop:1}}>{i+1}</div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:14,fontWeight:700,color:'#1D1D1F'}}>{o.customer_name||'Sin nombre'}</div>
                      {o.customer_phone && <div style={{fontSize:11,color:'#6E6E73',marginTop:1}}>📞 {o.customer_phone}</div>}
                    </div>
                    <div style={{fontSize:13,fontWeight:700,color:'#1D1D1F',flexShrink:0}}>{fmt((o.order_total||0)+(o.delivery_fee||0))}</div>
                  </div>
                  <div style={{fontSize:12,color:'#1D1D1F',marginBottom:8,paddingLeft:36,lineHeight:1.4}}>
                    📍 {o.delivery_address||'Sin dirección'}
                    {o.delivery_detail && <div style={{fontSize:11,color:'#6E6E73',marginTop:1}}>{o.delivery_detail}</div>}
                  </div>
                  <div style={{display:'flex',gap:8,paddingLeft:36}}>
                    {o.customer_phone && (
                      <a href={`tel:${o.customer_phone}`} style={{display:'flex',alignItems:'center',justifyContent:'center',width:36,height:36,background:'#fff',border:'1.5px solid #D2D2D7',borderRadius:8,fontSize:16,textDecoration:'none',flexShrink:0}}>📞</a>
                    )}
                    <a href={`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(o.delivery_address||o.customer_name||'')}`} target="_blank" rel="noopener noreferrer" style={{display:'flex',alignItems:'center',justifyContent:'center',width:36,height:36,background:'#fff',border:'1.5px solid #D2D2D7',borderRadius:8,fontSize:16,textDecoration:'none',flexShrink:0}}>🗺️</a>
                  </div>
                </div>
                );
              })}
            </div>
            <button
              onClick={handleStartRoute}
              disabled={starting}
              style={{width:'100%',padding:'16px',background:'#000',color:'#fff',border:'none',borderRadius:14,fontSize:15,fontWeight:700,cursor:starting?'default':'pointer',opacity:starting?.7:1,marginTop:12,display:'flex',alignItems:'center',justifyContent:'center',gap:10}}
            >
              <span>🛵</span>
              <span>{starting ? 'Iniciando…' : pendingOrders.every(o => o.orders?.status === 'ready') ? `Salir a entregar · ${pendingOrders.length} pedido${pendingOrders.length>1?'s':''}` : `Comenzar ruta · ${pendingOrders.length} pedido${pendingOrders.length>1?'s':''}`}</span>
            </button>
          </div>
        )}

        {/* Sin pedidos */}
        {pendingOrders.length === 0 && routeOrders.length === 0 && (
          <div style={{textAlign:'center',padding:'32px 20px',color:'#86868B',fontSize:14,background:'#F5F5F7',borderRadius:16,marginBottom:16}}>
            <div style={{fontSize:36,marginBottom:10}}>📦</div>
            <div style={{fontWeight:600}}>Sin pedidos asignados</div>
            <div style={{fontSize:12,marginTop:4}}>Cuando un pedido de delivery entre a cocina,<br/>te aparecerá aquí automáticamente.</div>
          </div>
        )}

        {/* Stats */}
        <div style={{background:'#F5F5F7',borderRadius:14,padding:'14px 18px',marginBottom:14}}>
          <div style={{fontSize:10,fontWeight:700,color:'#86868B',textTransform:'uppercase',letterSpacing:.8,marginBottom:10}}>Hoy</div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8,textAlign:'center'}}>
            <div>
              <div style={{fontSize:22,fontWeight:800,color:'#1D1D1F'}}>{stats.count}</div>
              <div style={{fontSize:10,color:'#86868B',marginTop:2}}>Entregas</div>
            </div>
            <div>
              <div style={{fontSize:rider.commission_type==='salary'?12:13,fontWeight:700,color:'#1D1D1F',lineHeight:1.3}}>{earnLabel()}</div>
              <div style={{fontSize:10,color:'#86868B',marginTop:2}}>{rider.commission_type==='salary'?'Sueldo fijo':'Ganado'}</div>
            </div>
            <div>
              <div style={{fontSize:18,fontWeight:700,color:'#1D1D1F'}}>{stats.avgMin>0?stats.avgMin+'min':'—'}</div>
              <div style={{fontSize:10,color:'#86868B',marginTop:2}}>Promedio</div>
            </div>
          </div>
        </div>

        <button onClick={onShowHistory} style={{width:'100%',padding:'12px',background:'transparent',color:'#1D1D1F',border:'1.5px solid #D2D2D7',borderRadius:12,fontSize:14,fontWeight:500,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:8}}>
          <span>📋</span> Historial del día
        </button>
      </div>
    </div>
  );
}

/* Badge de estado de cocina para el rider */
function KitchenBadge({ status }) {
  const map = {
    kitchen_received: { label: 'En cocina', bg: '#EFF6FF', color: '#1E40AF' },
    paid:             { label: 'En cocina', bg: '#EFF6FF', color: '#1E40AF' },
    cooking:          { label: 'Preparándose', bg: '#FFF7ED', color: '#C2410C' },
    ready:            { label: '✓ Listo', bg: '#F0FAF4', color: '#166534' },
  };
  const s = map[status] || { label: 'En cocina', bg: '#EFF6FF', color: '#1E40AF' };
  return (
    <span style={{
      display:'inline-block', padding:'2px 8px', borderRadius:6,
      background:s.bg, color:s.color, fontSize:11, fontWeight:700, flexShrink:0
    }}>{s.label}</span>
  );
}

/* PinEntryScreen eliminado — asignación automática por cocina */
function PinEntryScreen({ onBack }) {
  return (
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',height:'100%',padding:32,background:'#fff',textAlign:'center'}}>
      <div style={{fontSize:44,marginBottom:16}}>🛵</div>
      <div style={{fontSize:16,fontWeight:700,color:'#1D1D1F',marginBottom:8}}>Los pedidos se asignan automáticamente</div>
      <div style={{fontSize:13,color:'#86868B',marginBottom:24,lineHeight:1.6}}>Cocina te asigna los pedidos cuando están listos.<br/>Volvé al inicio para verlos.</div>
      <button onClick={onBack} style={{padding:'12px 24px',background:'#000',color:'#fff',border:'none',borderRadius:12,fontSize:14,fontWeight:700,cursor:'pointer'}}>Volver</button>
    </div>
  );
}

/* ─────────────────────────────────────────
   PANTALLA: RUTA ACTIVA
───────────────────────────────────────── */
function RouteScreen({ rider, initialOrders, onDone }) {
  const [orders, setOrders] = useState(() =>
    initialOrders.map(o => ({ ...o, _done:false, _delivering:false }))
  );
  const [allDone, setAllDone] = useState(false);

  const pending   = orders.filter(o => !o._done);
  const delivered = orders.filter(o =>  o._done);

  async function deliverOrder(id) {
    setOrders(prev => prev.map(o => o.id===id ? {...o, _delivering:true} : o));

    if (db) {
      const delivOrd = orders.find(o => o.id === id);
      await db.from('delivery_orders').update({
        rider_status: 'delivered',
        status: 'delivered',
        delivered_at: new Date().toISOString(),
      }).eq('id', id);
      // Actualizar orders.status para que caja y cliente vean el pedido como entregado
      if (delivOrd?.order_id) {
        await db.from('orders').update({ status: 'delivered' }).eq('id', delivOrd.order_id);
      }
    }

    const updated = orders.map(o =>
      o.id===id ? {...o, _done:true, _delivering:false} : o
    );
    setOrders(updated);

    if (updated.every(o => o._done)) {
      if (db) await db.from('delivery_riders').update({ current_status:'disponible' }).eq('id', rider.id);
      vibrate();
      setAllDone(true);
    }
  }

  function getMapsUrl() {
    const addrs = pending.map(o => encodeURIComponent(o.delivery_address || o.customer_name || ''));
    if (!addrs.length) return null;
    if (addrs.length === 1) return `https://www.google.com/maps/dir/?api=1&destination=${addrs[0]}`;
    return `https://www.google.com/maps/dir/?api=1&destination=${addrs[addrs.length-1]}&waypoints=${addrs.slice(0,-1).join('|')}`;
  }

  /* ── Todos entregados ── */
  if (allDone) {
    return (
      <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',height:'100%',padding:32,background:'#fff',textAlign:'center'}}>
        <div style={{fontSize:72,marginBottom:20,animation:'popIn .4s ease'}}>✅</div>
        <div style={{fontSize:24,fontWeight:800,color:'#1D1D1F',marginBottom:8}}>¡Ruta completada!</div>
        <div style={{fontSize:15,color:'#6E6E73',marginBottom:48,lineHeight:1.6}}>
          {orders.length} pedido{orders.length>1?'s':''} entregado{orders.length>1?'s':''}<br/>
          Estás disponible de nuevo
        </div>
        <button
          onClick={onDone}
          style={{width:'100%',padding:'18px',background:'#000',color:'#fff',border:'none',borderRadius:16,fontSize:17,fontWeight:700,cursor:'pointer'}}
        >Volver al inicio</button>
      </div>
    );
  }

  return (
    <div style={{display:'flex',flexDirection:'column',height:'100%',background:'#fff'}}>
      {/* Header */}
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'16px 20px',borderBottom:'1px solid #F5F5F7',background:'#fff',position:'sticky',top:0,zIndex:10}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <div style={{fontSize:17,fontWeight:700,color:'#1D1D1F'}}>En ruta</div>
          <div style={{background:'#FF9500',color:'#fff',borderRadius:12,padding:'2px 9px',fontSize:12,fontWeight:800}}>{pending.length}</div>
        </div>
        {getMapsUrl() && (
          <a
            href={getMapsUrl()}
            target="_blank"
            rel="noopener noreferrer"
            style={{display:'flex',alignItems:'center',gap:6,padding:'8px 14px',background:'#000',color:'#fff',borderRadius:10,textDecoration:'none',fontSize:13,fontWeight:600}}
          >
            🗺️ Ruta completa
          </a>
        )}
      </div>

      <div style={{flex:1,overflowY:'auto',padding:'16px 20px 32px'}}>

        {/* Pending orders */}
        {pending.map((o, i) => (
          <div key={o.id} style={{background:'#F5F5F7',borderRadius:16,padding:'16px 18px',marginBottom:14,animation:'fadeIn .2s'}}>
            {/* Top row: number + customer + total */}
            <div style={{display:'flex',alignItems:'flex-start',gap:10,marginBottom:10}}>
              <div style={{width:30,height:30,borderRadius:'50%',background:'#000',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,fontWeight:800,flexShrink:0,marginTop:1}}>{i+1}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:15,fontWeight:700,color:'#1D1D1F'}}>{o.customer_name||'Sin nombre'}</div>
                {o.customer_phone && <div style={{fontSize:12,color:'#6E6E73',marginTop:1}}>{o.customer_phone}</div>}
              </div>
              <div style={{fontSize:15,fontWeight:700,color:'#1D1D1F',flexShrink:0}}>{fmt((o.order_total||0)+(o.delivery_fee||0))}</div>
            </div>

            {/* Address */}
            <div style={{fontSize:14,color:'#1D1D1F',marginBottom:12,paddingLeft:40,lineHeight:1.4}}>
              📍 {o.delivery_address||'Sin dirección'}
            </div>

            {/* Actions */}
            <div style={{display:'flex',gap:8,paddingLeft:40}}>
              {o.customer_phone && (
                <a
                  href={`tel:${o.customer_phone}`}
                  style={{display:'flex',alignItems:'center',justifyContent:'center',width:42,height:42,background:'#fff',border:'1.5px solid #D2D2D7',borderRadius:10,fontSize:18,textDecoration:'none',flexShrink:0}}
                >📞</a>
              )}
              <a
                href={`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(o.delivery_address||o.customer_name||'')}`}
                target="_blank"
                rel="noopener noreferrer"
                style={{display:'flex',alignItems:'center',justifyContent:'center',width:42,height:42,background:'#fff',border:'1.5px solid #D2D2D7',borderRadius:10,fontSize:18,textDecoration:'none',flexShrink:0}}
              >🗺️</a>
              <button
                onClick={() => deliverOrder(o.id)}
                disabled={o._delivering}
                style={{flex:1,padding:'10px',background:'#34C759',color:'#fff',border:'none',borderRadius:10,fontSize:14,fontWeight:700,cursor:o._delivering?'default':'pointer',opacity:o._delivering?.7:1,transition:'opacity .15s'}}
              >{o._delivering ? '…' : '✓ Entregar'}</button>
            </div>
          </div>
        ))}

        {/* Delivered orders */}
        {delivered.length > 0 && (
          <div style={{marginTop:8}}>
            <div style={{fontSize:11,fontWeight:700,color:'#86868B',textTransform:'uppercase',letterSpacing:.8,marginBottom:10}}>
              Entregados ({delivered.length})
            </div>
            {delivered.map(o => (
              <div key={o.id} style={{padding:'12px 0',borderBottom:'1px solid #F5F5F7',display:'flex',alignItems:'center',gap:12}}>
                <div style={{width:26,height:26,borderRadius:'50%',background:'#34C759',display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,color:'#fff',flexShrink:0}}>✓</div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:14,fontWeight:600,color:'#8E8E93'}}>{o.customer_name||'Sin nombre'}</div>
                  <div style={{fontSize:12,color:'#C7C7CC',marginTop:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{o.delivery_address||'—'}</div>
                </div>
                <div style={{fontSize:13,color:'#8E8E93',flexShrink:0}}>{fmt((o.order_total||0)+(o.delivery_fee||0))}</div>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────
   PANTALLA: HISTORIAL
───────────────────────────────────────── */
function HistoryScreen({ rider, onBack }) {
  const [orders, setOrders] = useState(null);

  useEffect(() => {
    if (!db) { setOrders([]); return; }
    const today = new Date(); today.setHours(0,0,0,0);
    db.from('delivery_orders')
      .select('id,delivery_pin,customer_name,delivery_address,order_total,delivery_fee,picked_up_at,delivered_at')
      .eq('rider_id', rider.id)
      .eq('rider_status', 'delivered')
      .gte('delivered_at', today.toISOString())
      .order('delivered_at', { ascending: false })
      .then(({ data }) => setOrders(data || []));
  }, []);

  function calcEarning(o) {
    if (rider.commission_type === 'pct')   return Math.round((o.order_total||0) * (rider.commission_value||0) / 100);
    if (rider.commission_type === 'fixed') return rider.commission_value||0;
    return null;
  }

  const totalEarned = (orders||[]).reduce((s, o) => s + (calcEarning(o)||0), 0);
  const timings = (orders||[]).filter(o => o.picked_up_at && o.delivered_at);
  const avgMin  = timings.length
    ? Math.round(timings.reduce((s,o) => s + diffMin(o.picked_up_at, o.delivered_at), 0) / timings.length)
    : 0;

  return (
    <div style={{display:'flex',flexDirection:'column',height:'100%',background:'#fff'}}>
      <div style={{display:'flex',alignItems:'center',gap:8,padding:'16px 20px',borderBottom:'1px solid #F5F5F7',position:'sticky',top:0,background:'#fff',zIndex:10}}>
        <button onClick={onBack} style={{background:'none',border:'none',padding:'4px 8px 4px 0',fontSize:22,lineHeight:1,color:'#1D1D1F',cursor:'pointer'}}>‹</button>
        <div style={{fontSize:17,fontWeight:600,color:'#1D1D1F'}}>Historial del día</div>
      </div>

      <div style={{flex:1,overflowY:'auto',padding:'16px 20px 32px'}}>
        {orders === null && <Spinner />}
        {orders !== null && orders.length === 0 && (
          <div style={{textAlign:'center',padding:'60px 20px',color:'#86868B',fontSize:15}}>
            <div style={{fontSize:44,marginBottom:14}}>📋</div>
            No hay entregas hoy todavía
          </div>
        )}
        {orders !== null && orders.map((o, i) => {
          const mins    = (o.picked_up_at && o.delivered_at) ? diffMin(o.picked_up_at, o.delivered_at) : null;
          const earning = calcEarning(o);
          return (
            <div key={o.id} style={{padding:'14px 0',borderBottom:i<orders.length-1?'1px solid #F5F5F7':'none'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
                <div style={{flex:1,paddingRight:12}}>
                  <div style={{fontSize:12,color:'#86868B',marginBottom:2}}>{o.delivered_at ? fmtTime(o.delivered_at) : '—'}</div>
                  <div style={{fontSize:15,fontWeight:600,color:'#1D1D1F',marginBottom:2}}>{o.customer_name||'Sin nombre'}</div>
                  <div style={{fontSize:12,color:'#6E6E73',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{o.delivery_address||'—'}</div>
                </div>
                <div style={{textAlign:'right',flexShrink:0}}>
                  <div style={{fontSize:14,fontWeight:600,color:'#1D1D1F'}}>{fmt((o.order_total||0)+(o.delivery_fee||0))}</div>
                  {earning !== null && <div style={{fontSize:12,color:'#34C759',marginTop:2,fontWeight:600}}>+{fmt(earning)}</div>}
                  {mins !== null && <div style={{fontSize:11,color:'#86868B',marginTop:2}}>{mins}min</div>}
                </div>
              </div>
            </div>
          );
        })}
      </div>

      {/* Summary footer */}
      {orders !== null && orders.length > 0 && (
        <div style={{borderTop:'1px solid #F5F5F7',padding:'16px 20px',background:'#F5F5F7',display:'grid',gridTemplateColumns:'repeat(3,1fr)',textAlign:'center'}}>
          <div>
            <div style={{fontSize:22,fontWeight:800,color:'#1D1D1F'}}>{orders.length}</div>
            <div style={{fontSize:11,color:'#86868B',marginTop:2}}>Entregas</div>
          </div>
          <div>
            {rider.commission_type === 'salary'
              ? <>
                  <div style={{fontSize:12,fontWeight:700,color:'#1D1D1F'}}>Sueldo</div>
                  <div style={{fontSize:11,color:'#86868B',marginTop:2}}>fijo mensual</div>
                </>
              : <>
                  <div style={{fontSize:14,fontWeight:700,color:'#1D1D1F'}}>{fmt(totalEarned)}</div>
                  <div style={{fontSize:11,color:'#86868B',marginTop:2}}>Ganado</div>
                </>
            }
          </div>
          <div>
            <div style={{fontSize:22,fontWeight:700,color:'#1D1D1F'}}>{avgMin>0?avgMin+'min':'—'}</div>
            <div style={{fontSize:11,color:'#86868B',marginTop:2}}>Promedio</div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ─────────────────────────────────────────
   APP ROOT
───────────────────────────────────────── */
function App() {
  const [screen, setScreen]       = useState('loading');
  const [rider, setRider]         = useState(null);
  const [activeOrders, setActiveOrders] = useState([]);
  const [stats, setStats]         = useState({ count:0, earned:0, avgMin:0 });
  const [errMsg, setErrMsg]       = useState('');

  // Multi-tenant Engine: fail-safe — sin tenant en sesión, limpia y expulsa al login (salvo superadmin).
  useEffect(() => {
    if ((!RESTAURANT_ID || !RESTAURANT_ID.trim()) && localStorage.getItem('mythos_role') !== 'superadmin') {
      localStorage.clear();
      window.location.href = '/login.html';
    }
  }, []);

  // Resolver la ficha del rider desde la sesión auth — login por correo+contraseña (login.html),
  // sin PIN. Emparejamos delivery_riders.user_id = auth.uid(). La sesión persiste entre cierres
  // de pestaña (Supabase localStorage): al reabrir reanudamos sin re-login (cierre sólo por
  // logout explícito o 1h de inactividad vía mythos-session.js).
  useEffect(() => {
    let cancelled = false;
    (async () => {
      if (!db) { setErrMsg('Sin conexión a la base de datos.'); setScreen('error'); return; }
      let uid = '';
      try { const { data:{ user } } = await db.auth.getUser(); uid = user?.id || ''; } catch(_) {}
      if (!uid) uid = localStorage.getItem('mythos_user_id') || '';
      if (!uid) { window.location.replace('login.html?next=delivery-rider.html'); return; }
      const { data, error } = await db.from('delivery_riders').select('*').eq('user_id', uid).maybeSingle();
      if (cancelled) return;
      if (error || !data) {
        setErrMsg('Tu cuenta no está vinculada a un rider. Pedile al administrador que te dé de alta en Delivery → Riders.');
        setScreen('error'); return;
      }
      if (data.active === false) {
        setErrMsg('Tu cuenta de rider está desactivada. Contactá al administrador.');
        setScreen('error'); return;
      }
      startRiderSession(data);
    })();
    return () => { cancelled = true; };
  }, []);

  async function loadStats(r) {
    if (!db || !r) return;
    const today = new Date(); today.setHours(0,0,0,0);
    const { data } = await db.from('delivery_orders')
      .select('order_total,delivery_fee,picked_up_at,delivered_at')
      .eq('rider_id', r.id)
      .eq('rider_status', 'delivered')
      .gte('delivered_at', today.toISOString());

    if (!data?.length) return;

    let earned = 0;
    data.forEach(o => {
      if (r.commission_type === 'pct')   earned += Math.round((o.order_total||0) * (r.commission_value||0) / 100);
      else if (r.commission_type === 'fixed') earned += (r.commission_value||0);
    });

    const timings = data.filter(o => o.picked_up_at && o.delivered_at);
    const avgMin  = timings.length
      ? Math.round(timings.reduce((s,o) => s + diffMin(o.picked_up_at, o.delivered_at), 0) / timings.length)
      : 0;

    setStats({ count: data.length, earned, avgMin });
  }

  async function loadActiveOrders(r) {
    if (!db || !r) return;
    const { data } = await db.from('delivery_orders')
      .select('*, orders!order_id(status, order_number)')
      .eq('rider_id', r.id)
      .in('rider_status', ['confirmed','on_way'])
      .order('created_at', { ascending: true });
    setActiveOrders(data || []);
  }

  const pollRef = useRef(null);

  function startRiderSession(riderData) {
    // Registrar conexión del rider para el módulo Personal del admin (presencia).
    try {
      window.MythosPresence?.start({
        restaurant_id: RID, role: 'rider', panel: 'delivery-rider',
        rider_id: riderData.id, user_id: riderData.user_id || null, name: riderData.name || null
      });
    } catch(_) {}
    setRider(riderData);
    setScreen('home');
    loadStats(riderData);
    loadActiveOrders(riderData);

    if (db) {
      // Realtime: delivery_orders debe estar en supabase_realtime publication (migración 078).
      // Sin filtro de columna para capturar el UPDATE rider_id NULL→UUID.
      db.channel('rider-orders-' + riderData.id)
        .on('postgres_changes', {
          event: '*', schema: 'public', table: 'delivery_orders'
        }, () => loadActiveOrders(riderData))
        .subscribe();
    }

    // Polling de respaldo cada 30 s por si el realtime falla o se desconecta.
    if (pollRef.current) clearInterval(pollRef.current);
    pollRef.current = setInterval(() => loadActiveOrders(riderData), 30000);
  }

  async function handleLogout() {
    if (pollRef.current) { clearInterval(pollRef.current); pollRef.current = null; }
    try { await window.MythosPresence?.stop('manual'); } catch(_) {}
    if (rider?.id && db) {
      await db.from('delivery_riders').update({ current_status: 'disponible' }).eq('id', rider.id);
      try { db.removeAllChannels(); } catch(_) {}
    }
    // El rider es una cuenta auth real → cerrar sesión Supabase y volver al login.
    try { await db?.auth.signOut(); } catch(_) {}
    ['mythos_role','mythos_restaurant_id','mythos_user_id','mythos_display_name','mythos_last_activity']
      .forEach(k => { try { localStorage.removeItem(k); } catch(_) {} });
    window.location.replace('login.html');
  }

  function handleStartRoute(orders) {
    // Pasar a ruta con los pedidos que acaban de iniciar (on_way)
    loadActiveOrders(rider).then(() => setScreen('route'));
  }

  function handleAllDelivered() {
    const updated = rider ? { ...rider, current_status:'disponible' } : rider;
    setRider(updated);
    setActiveOrders([]);
    if (updated) loadStats(updated);
    setScreen('home');
  }

  return (
    <div className="phone-wrap">
      <div className="phone">
        <div className="screen">
          {screen === 'loading' && <Spinner />}
          {screen === 'error' && (
            <ErrorScreen msg={errMsg} onLogout={handleLogout} />
          )}
          {screen === 'home' && rider && (
            <HomeScreen
              rider={rider}
              stats={stats}
              activeOrders={activeOrders}
              onStartRoute={handleStartRoute}
              onShowRoute={() => setScreen('route')}
              onShowHistory={() => setScreen('history')}
              onLogout={handleLogout}
              onRefresh={() => { loadActiveOrders(rider); loadStats(rider); }}
              onStatusChange={next => setRider(prev => prev ? {...prev, current_status:next} : prev)}
            />
          )}
          {screen === 'route' && rider && (
            <RouteScreen
              rider={rider}
              initialOrders={activeOrders.filter(o => o.rider_status === 'on_way')}
              onDone={handleAllDelivered}
            />
          )}
          {screen === 'history' && rider && (
            <HistoryScreen
              rider={rider}
              onBack={() => setScreen('home')}
            />
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(React.createElement(App));
</script>
</body>
</html>
