<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mythos · Cambiar contraseña</title>
  <meta name="robots" content="noindex"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.1/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <link rel="stylesheet" href="tokens.css">
  <script src="mythos-theme.js"></script>
  <script>MythosTheme.init();</script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg-subtle);color:var(--text-primary);font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:48px 40px;width:100%;max-width:400px;box-shadow:0 4px 24px rgba(0,0,0,0.08),0 0 1px rgba(0,0,0,0.04)}
    .logo{text-align:center;margin-bottom:28px}
    .logo-title{font-size:32px;font-weight:800;color:var(--primary);letter-spacing:-1.2px}
    .logo-sub{font-size:13px;font-weight:500;color:var(--text-secondary);margin-top:6px;line-height:1.5}
    label{display:block;font-size:13px;font-weight:500;color:var(--text-secondary);margin-bottom:6px}
    input{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text-primary);padding:11px 14px;border-radius:10px;font-size:15px;outline:none;transition:border-color .15s;font-family:inherit}
    input:focus{border-color:var(--primary)}
    input::placeholder{color:var(--text-disabled)}
    .field{margin-bottom:18px}
    .btn{width:100%;background:var(--primary);color:var(--on-primary);border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:600;cursor:pointer;transition:opacity .15s;margin-top:4px;font-family:inherit}
    .btn:hover{opacity:.84}
    .btn:disabled{opacity:.38;cursor:not-allowed}
    .msg{border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:18px;display:none;line-height:1.5}
    .msg.show{display:block}
    .msg.error{background:var(--surface);border:1px solid #FFCDD0;color:#C0190F}
    [data-theme="dark"] .msg.error{border-color:color-mix(in srgb, var(--error) 45%, transparent);color:var(--error)}
    .msg.ok{background:var(--surface);border:1px solid color-mix(in srgb, var(--success) 45%, transparent);color:var(--success)}
    .msg.info{background:var(--surface);border:1px solid var(--border);color:var(--text-secondary)}
    .hint{font-size:12px;color:var(--text-tertiary);text-align:center;margin-top:22px}
    .hint a{color:var(--text-secondary)}
    @keyframes spin{to{transform:rotate(360deg)}}
    .spinner{width:15px;height:15px;border:2px solid color-mix(in srgb, var(--on-primary) 30%, transparent);border-top-color:var(--on-primary);border-radius:50%;display:inline-block;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-title">Mythos</div>
    <div class="logo-sub" id="subtitle">Creá tu nueva contraseña</div>
  </div>

  <div id="msg" class="msg"></div>

  <!-- Estado inicial: verificando sesión / token de recuperación -->
  <div id="checking" class="hint">Verificando…</div>

  <!-- Formulario (oculto hasta confirmar que hay sesión válida) -->
  <form id="pwForm" style="display:none">
    <div class="field">
      <label for="pw1">Nueva contraseña</label>
      <input id="pw1" type="password" autocomplete="new-password" placeholder="Mínimo 8 caracteres" minlength="8"/>
    </div>
    <div class="field">
      <label for="pw2">Repetir contraseña</label>
      <input id="pw2" type="password" autocomplete="new-password" placeholder="Repetí la contraseña" minlength="8"/>
    </div>
    <button class="btn" type="submit" id="saveBtn">Guardar contraseña</button>
  </form>

  <div class="hint" id="backHint" style="display:none"><a href="login.html">Volver a iniciar sesión</a></div>
</div>

<script>
(function () {
  'use strict';
  var cfg = window.SUPABASE_CONFIG || {};
  var url = String(cfg.url || '').replace(/^﻿/, '').trim();
  var key = String(cfg.anonKey || '').replace(/^﻿/, '').trim();

  var elChecking = document.getElementById('checking');
  var elForm = document.getElementById('pwForm');
  var elMsg = document.getElementById('msg');
  var elBack = document.getElementById('backHint');
  var elSub = document.getElementById('subtitle');
  var saveBtn = document.getElementById('saveBtn');

  function show(el, on) { if (el) el.style.display = on ? '' : 'none'; }
  function msg(text, kind) {
    elMsg.textContent = text;
    elMsg.className = 'msg show ' + (kind || 'info');
  }
  function clearMsg() { elMsg.className = 'msg'; elMsg.textContent = ''; }

  if (!window.supabase || !url || !key || url.indexOf('YOUR_') !== -1) {
    show(elChecking, false);
    msg('El cambio de contraseña no está disponible en este momento.', 'error');
    show(elBack, true);
    return;
  }

  var params = new URLSearchParams(location.search);
  var mode = (params.get('mode') || '').toLowerCase();
  var reason = (params.get('reason') || '').toLowerCase();
  if (reason === 'first_login' || reason === 'required') {
    elSub.textContent = 'Por seguridad, antes de continuar tenés que crear tu propia contraseña.';
  } else if (mode === 'recovery') {
    elSub.textContent = 'Elegí una nueva contraseña para tu cuenta.';
  }

  var db = window.supabase.createClient(url, key);
  var ready = false;

  function enableForm() {
    if (ready) return;
    ready = true;
    show(elChecking, false);
    show(elForm, true);
  }

  // El enlace de recuperación trae el token en el hash; supabase-js lo procesa
  // y dispara PASSWORD_RECOVERY. En modo logueado, getSession ya devuelve sesión.
  db.auth.onAuthStateChange(function (event, session) {
    if (session) enableForm();
  });
  db.auth.getSession().then(function (r) {
    if (r && r.data && r.data.session) enableForm();
  });

  // Si tras un momento no hay sesión: enlace vencido (recovery) o falta login.
  setTimeout(function () {
    if (ready) return;
    show(elChecking, false);
    if (mode === 'recovery') {
      msg('El enlace expiró o no es válido. Pedí uno nuevo desde "¿Olvidaste tu contraseña?".', 'error');
    } else {
      msg('Iniciá sesión para cambiar tu contraseña.', 'info');
    }
    show(elBack, true);
  }, 3500);

  function isTrivial(pw) {
    var l = pw.toLowerCase();
    if (/^(.)\1+$/.test(pw)) return true;                  // todos los caracteres iguales
    if (/password|contrasen/i.test(pw)) return true;       // términos obvios (la marca NO se bloquea)
    var list = ['1234567890', '123456789', '0123456789', 'qwertyuiop', 'abcdefghij'];
    return list.indexOf(l) !== -1;
  }

  elForm.addEventListener('submit', async function (e) {
    e.preventDefault();
    clearMsg();
    var pw1 = document.getElementById('pw1').value || '';
    var pw2 = document.getElementById('pw2').value || '';

    if (pw1.length < 8) { msg('La contraseña debe tener al menos 8 caracteres.', 'error'); return; }
    if (pw1 !== pw2) { msg('Las contraseñas no coinciden.', 'error'); return; }
    if (isTrivial(pw1)) { msg('Elegí una contraseña menos predecible.', 'error'); return; }

    // Token de la sesión actual (normal o de recuperación).
    var token = null;
    try {
      var s = await db.auth.getSession();
      token = s && s.data && s.data.session ? s.data.session.access_token : null;
    } catch (_) {}
    if (!token) { msg('Tu sesión expiró. Volvé a intentar desde el enlace o iniciá sesión.', 'error'); return; }

    saveBtn.disabled = true;
    saveBtn.innerHTML = '<span class="spinner"></span>Guardando…';
    try {
      var resp = await fetch('/api/change-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ password: pw1 })
      });
      var data = await resp.json().catch(function () { return {}; });
      if (resp.ok && data.success) {
        show(elForm, false);
        msg('¡Listo! Tu contraseña fue actualizada. Ya podés iniciar sesión.', 'ok');
        // Cerrar la sesión (incluida la de recuperación) y volver al login.
        try { await db.auth.signOut(); } catch (_) {}
        setTimeout(function () { location.replace('login.html?changed=1'); }, 2200);
        return;
      }
      msg(data.error || 'No se pudo cambiar la contraseña. Probá de nuevo.', 'error');
    } catch (_) {
      msg('No se pudo cambiar la contraseña. Revisá tu conexión e intentá de nuevo.', 'error');
    }
    saveBtn.disabled = false;
    saveBtn.textContent = 'Guardar contraseña';
  });
})();
</script>
</body>
</html>
