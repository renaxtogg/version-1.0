<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pedido a domicilio · Mythos</title>
<link rel="stylesheet" href="design-system.css">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="ui-primitives.css">
<script src="mythos-theme.js"></script>
<script src="mythos-icons.js"></script>
<script src="mythos-offline.js"></script>
<!-- PR-B4J: Delivery cliente es superficie CUSTOMER-FACING con branding propio
     (src/delivery-cliente/main.jsx → makeTheme(): superficies claras hardcodeadas
     #FFF/#000/#F8F8F8 + mapas de color por zona). Decisión (igual criterio que el
     menú/QR cliente en PR-B3I.X): NO se integra al dark del staff; queda en LIGHT.
     ⚠️ NO cambiar a init() sin un rebrand completo del panel: el bridge de tokens
     es PARCIAL (ink/mid/gray flipean, las superficies NO) → init() dejaría texto
     claro sobre superficie blanca = invisible en todo el flujo. El pin 'light'
     fuerza light e ignora la preferencia global del staff (protege la marca). -->
<script>MythosTheme.init('light');</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.1/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="mythos-panel-gate.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:#111;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  .phone-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh}
  .phone{width:390px;height:844px;border-radius:44px;overflow:hidden;position:relative;box-shadow:0 40px 80px rgba(0,0,0,0.7),0 0 0 1px rgba(255,255,255,0.08);flex-shrink:0}
  .screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
  .screen::-webkit-scrollbar{display:none}
  @keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  @keyframes slideDown{from{transform:translateY(-8px);opacity:0}to{transform:translateY(0);opacity:1}}
  @media(max-width:430px){
    body{display:block;background:#fff}
    .phone-wrap,.phone-wrap>div{display:block}
    .phone{width:100%!important;height:100dvh!important;border-radius:0!important;box-shadow:none!important}
    .screen{position:fixed!important}
  }
</style>
</head>
<body>
<div id="app"></div>
<!-- PR-12: panel precompilado con Vite. Reemplaza los CDN de React/ReactDOM y el transpilador en navegador + el script JSX inline. El bundle se genera en public/build/ por `npm run build`. -->
<script src="build/delivery-cliente.js"></script>
</body>
</html>
