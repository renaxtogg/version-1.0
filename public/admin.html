<script>
function initTheme() {
  document.documentElement.setAttribute('data-theme','light');
}
function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('mesa_theme', next);
}
initTheme();

/* ── DB ── */
const _initDB = () => {
  const cfg = window.SUPABASE_CONFIG;
  if (!cfg?.url || !cfg?.anonKey) return null;
  const url = cfg.url.replace(/^﻿/,'').trim();
  const key = cfg.anonKey.replace(/^﻿/,'').trim();
  if (!url || url.includes('YOUR_') || !key) return null;
  try { return window.supabase.createClient(url, key); } catch(e) { return null; }
};

const RID = ((window.SUPABASE_CONFIG?.restaurantId)||'00000000-0000-0000-0000-000000000001').replace(/^﻿/,'').trim();

const fmtDate = d => new Date(d).toLocaleDateString('es-PY',{day:'2-digit',month:'2-digit',year:'2-digit'});
const fmtTime = d => new Date(d).toLocaleTimeString('es-PY',{hour:'2-digit',minute:'2-digit'});
const fmtDT   = d => `${fmtDate(d)} ${fmtTime(d)}`;
const DAY = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const SL = {draft:'Borrador',confirmed:'Confirmado',paid:'Nuevo',kitchen_received:'En cocina',cooking:'Preparando',ready:'Listo',delivered:'Entregado',cancelled:'Cancelado'};
const SC = {draft:'#86868B',confirmed:'#6E6E73',paid:'#FF9500',kitchen_received:'#007AFF',cooking:'#FF9500',ready:'#34C759',delivered:'#86868B',cancelled:'#FF3B30'};
const PL = {efectivo:'Efectivo',tarjeta:'Tarjeta',qr:'QR',pos:'POS'};
const EG_CATS = ['Insumos','Personal','Servicios','Alquiler','Mantenimiento','Impuestos','Otro'];

/* ── PALETTE ── */

  border:'#D2D2D7',bs:'#86868B',
  white:'#FFFFFF',ink:'#1D1D1F',mid:'#6E6E73',dim:'#86868B',

/* ── TOAST ── */
const _toast = { fn: null };
function toast(msg, ok=true) { _toast.fn?.({ msg, ok, id: Date.now() }); }
function ToastContainer() {
  const [items, setItems] = useState([]);
  useEffect(() => {
    _toast.fn = item => {
      setItems(p => [...p.slice(-4), item]);
      setTimeout(() => setItems(p => p.filter(i => i.id !== item.id)), 4000);
    };
    return () => { _toast.fn = null; };
  }, []);
  return (
    <div style={{position:'fixed',bottom:20,right:20,zIndex:9999,display:'flex',flexDirection:'column',gap:8,pointerEvents:'none'}}>
      {items.map(it => (
        <div key={it.id} style={{background:it.ok?'#F0FAF3':'#FFF1F0',border:`1px solid ${it.ok?'#A3D9B1':'#FFB3AD'}`,color:it.ok?'#1A7E37':'#C0190F',padding:'10px 16px',fontSize:13,fontWeight:700,borderRadius:8,animation:'slideUp 200ms ease',minWidth:220,maxWidth:320}}>
          {it.ok ? '✓ ' : '✕ '}{it.msg}
        </div>
      ))}
    </div>
  );
}

/* ── MODAL ── */
function Modal({ title, onClose, children, width=420 }) {
  useEffect(() => {
    const fn = e => e.key === 'Escape' && onClose();
    window.addEventListener('keydown', fn);
    return () => window.removeEventListener('keydown', fn);
  }, [onClose]);
  return (
    <div onClick={e => e.target===e.currentTarget && onClose()} style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.85)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000,padding:20}}>

    </button>

/* ── IMAGE UPLOADER ── */
async function _compressImg(file) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const MAX = 900;
      let w = img.naturalWidth, h = img.naturalHeight;
      if (w > MAX || h > MAX) {
        if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
        else { w = Math.round(w * MAX / h); h = MAX; }
      }
      const cvs = document.createElement('canvas');
      cvs.width = w; cvs.height = h;
      cvs.getContext('2d').drawImage(img, 0, 0, w, h);
      cvs.toBlob(b => resolve(b), 'image/webp', 0.82);
    };
    img.onerror = () => resolve(null);
    img.src = URL.createObjectURL(file);
  });
}
function ImageUploader({ value, onChange, compact = false, bucket = 'menu-images' }) {
  const [drag, setDrag] = useState(false);
  const [busy, setBusy] = useState(false);
  const ref = useRef();

  async function handleFile(file) {
    if (!['image/jpeg','image/png','image/webp'].includes(file.type)) {
      toast('Formato no permitido — usá JPG, PNG o WebP', false); return;
    }
    if (file.size > 5 * 1024 * 1024) {
      toast('Archivo demasiado grande — máximo 5 MB', false); return;
    }
    if (!db) { toast('Sin Supabase — configurá config.js', false); return; }
    setBusy(true);
    try {
      const blob = await _compressImg(file);
      if (!blob) { toast('No se pudo procesar la imagen', false); setBusy(false); return; }
      const path = `${RID}/${Date.now()}_${Math.random().toString(36).slice(2)}.webp`;
      const { error } = await db.storage.from(bucket).upload(path, blob, { contentType: 'image/webp', upsert: false });
      if (error) {
        const hint = error.message.includes('Bucket not found')
          ? `Bucket "${bucket}" no existe — ejecutá la migración ${bucket==='menu-images'?'011':'015'} en Supabase`
          : error.message;
        toast('Error al subir: ' + hint, false);
      } else {
        const { data: { publicUrl } } = db.storage.from(bucket).getPublicUrl(path);
        onChange(publicUrl);
        toast('Imagen subida correctamente');
      }
    } catch(e) { toast('Error: ' + e.message, false); }
    setBusy(false);
  }

  function onDrop(e) { e.preventDefault(); setDrag(false); const f = e.dataTransfer.files[0]; if (f) handleFile(f); }

  if (compact) {
    return (
      <div style={{display:'flex',alignItems:'center',gap:6}}>
        {value
          ? <img src={value} alt="" style={{width:36,height:36,objectFit:'cover',borderRadius:5,flexShrink:0,border:`1px solid ${C.border}`}} onError={e=>{e.target.style.display='none';}}/>
          : <div style={{width:36,height:36,background:'#FFFFFF',borderRadius:5,display:'flex',alignItems:'center',justifyContent:'center',fontSize:16,flexShrink:0}}>🍽</div>}
        <div style={{display:'flex',flexDirection:'column',gap:3}}>
          <button onClick={()=>ref.current.click()} disabled={busy} style={{background:'transparent',border:`1px solid ${C.border}`,color:C.mid,padding:'2px 8px',fontSize:10,fontWeight:600,borderRadius:4,cursor:'pointer',whiteSpace:'nowrap'}}>
            {busy?'⏳':value?'Cambiar':'Subir foto'}
          </button>
          {value&&<button onClick={()=>onChange('')} style={{background:'transparent',border:'1px solid rgba(239,68,68,0.2)',color:'rgba(239,68,68,0.5)',padding:'2px 8px',fontSize:10,fontWeight:600,borderRadius:4,cursor:'pointer'}}>Quitar</button>}
        </div>
        <input ref={ref} type="file" accept=".jpg,.jpeg,.png,.webp" style={{display:'none'}} onClick={e=>e.stopPropagation()} onChange={e=>{if(e.target.files[0])handleFile(e.target.files[0]);e.target.value='';}}/>
      </div>
    );
  }

  if (value) {
    return (
      <div style={{position:'relative',width:'100%',height:150,borderRadius:8,overflow:'hidden',border:`1px solid ${C.border}`}}>
        <img src={value} alt="" style={{width:'100%',height:'100%',objectFit:'cover'}} onError={e=>{e.target.style.display='none';}}/>
        {busy&&<div style={{position:'absolute',inset:0,background:'rgba(0,0,0,0.75)',display:'flex',alignItems:'center',justifyContent:'center'}}><span className="spin"/></div>}
        <div style={{position:'absolute',bottom:0,left:0,right:0,background:'linear-gradient(transparent,rgba(0,0,0,0.88))',padding:'22px 10px 8px',display:'flex',gap:0}}>
          <button onClick={()=>ref.current.click()} disabled={busy} style={{flex:1,background:'rgba(255,255,255,0.12)',border:'1px solid rgba(255,255,255,0.18)',color:'#fff',padding:'5px 8px',fontSize:11,fontWeight:700,borderRadius:'5px 0 0 5px',cursor:'pointer'}}>Cambiar portada</button>
          <button onClick={()=>onChange('')} style={{background:'rgba(239,68,68,0.15)',border:'1px solid rgba(239,68,68,0.3)',borderLeft:'none',color:'#FF3B30',padding:'5px 8px',fontSize:11,fontWeight:700,borderRadius:'0 5px 5px 0',cursor:'pointer'}}>Eliminar foto</button>
        </div>
        <input ref={ref} type="file" accept=".jpg,.jpeg,.png,.webp" style={{display:'none'}} onClick={e=>e.stopPropagation()} onChange={e=>{if(e.target.files[0])handleFile(e.target.files[0]);e.target.value='';}}/>
      </div>
    );
  }

  return (
    <div
      onDragOver={e=>{e.preventDefault();setDrag(true)}}
      onDragLeave={()=>setDrag(false)}
      onDrop={onDrop}
      onClick={()=>ref.current.click()}
      style={{border:`2px dashed ${drag?'#6E6E73':'#D2D2D7'}`,borderRadius:8,padding:'26px 16px',textAlign:'center',cursor:'pointer',background:drag?'rgba(255,255,255,0.04)':'transparent',transition:'border-color .15s,background .15s',userSelect:'none'}}>
      {busy
        ? <><span className="spin"/><div style={{fontSize:12,color:'#6E6E73',marginTop:10}}>Comprimiendo y subiendo…</div></>
        : <>
          <div style={{fontSize:28,marginBottom:6}}>🖼</div>
          <div style={{fontSize:12,color:'#6E6E73'}}>Arrastrá una imagen o hacé clic para subir</div>
          <div style={{fontSize:10,color:'#D2D2D7',marginTop:4}}>JPG · PNG · WebP · máx 5 MB · se comprime automáticamente</div>
        </>}
      <input ref={ref} type="file" accept=".jpg,.jpeg,.png,.webp" style={{display:'none'}} onClick={e=>e.stopPropagation()} onChange={e=>{if(e.target.files[0])handleFile(e.target.files[0]);e.target.value='';}}/>
    </div>
  );
}

function DashboardPage({orders,ratings,setPage}) {
  const today = new Date().toDateString();
  const thisWeekStart = new Date(); thisWeekStart.setDate(thisWeekStart.getDate()-6); thisWeekStart.setHours(0,0,0,0);
  const valid = o => !['draft','cancelled'].includes(o.status);
  const todayOrds  = orders.filter(o => new Date(o.created_at).toDateString()===today && valid(o));
  const weekOrds   = orders.filter(o => new Date(o.created_at)>=thisWeekStart && valid(o));
  const active     = orders.filter(o => ['paid','kitchen_received','cooking','ready'].includes(o.status));
  const cancelled  = orders.filter(o => o.status==='cancelled');
  const avgTicket  = weekOrds.length ? Math.round(weekOrds.reduce((s,o)=>s+(o.total||0),0)/weekOrds.length) : 0;
  const avgRating  = ratings.length ? (ratings.reduce((s,r)=>s+r.stars,0)/ratings.length).toFixed(1) : '—';
  const cancelRate = orders.length ? Math.round(cancelled.length/orders.length*100) : 0;

  // Últimos 7 días
  const last7 = Array.from({length:7},(_,i)=>{
    const d = new Date(); d.setDate(d.getDate()-6+i);
    const ds = d.toDateString();
    const dayOrds = orders.filter(o=>new Date(o.created_at).toDateString()===ds && valid(o));
    return {label:DAY[d.getDay()],rev:dayOrds.reduce((s,o)=>s+(o.total||0),0),cnt:dayOrds.length,isToday:i===6};
  });
  const maxRev = Math.max(...last7.map(d=>d.rev),1);

  // Horas pico — un solo recorrido en lugar de 24 filter calls
  const hourly = Array(24).fill(0);
  orders.filter(valid).forEach(o => { hourly[new Date(o.created_at).getHours()]++; });
  const maxHour = Math.max(...hourly,1);

  // Top items from orders (approximate via items_count per order is not enough — use preloaded top if available)
  const recent = orders.slice(0,10);

  return (
    <div className="page">
      <div style={{marginBottom:20}}>
        <h1 style={{fontSize:22,fontWeight:800,color:'#000000'}}>Dashboard</h1>
        <div style={{fontSize:12,color:'#6E6E73',marginTop:3}}>{new Date().toLocaleDateString('es-PY',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div>
      </div>

      {/* KPIs fila 1 */}
      <div style={{display:'flex',gap:10,marginBottom:14,flexWrap:'wrap'}}>
        <KpiCard label="Ventas hoy"     value={fmt(todayOrds.reduce((s,o)=>s+(o.total||0),0))} sub={`${todayOrds.length} pedidos`} accent={C.green} onClick={()=>setPage('pedidos')}/>
        <KpiCard label="Ventas semana"  value={fmt(weekOrds.reduce((s,o)=>s+(o.total||0),0))} sub={`${weekOrds.length} pedidos`} onClick={()=>setPage('finanzas')}/>
        <KpiCard label="Ticket promedio" value={fmt(avgTicket)} sub="últimos 7 días"/>
        <KpiCard label="Activos ahora"  value={active.length} accent={active.length>0?C.orange:C.mid} sub="en cocina o listos" onClick={()=>setPage('pedidos')}/>
        <KpiCard label="Cancelaciones"  value={`${cancelRate}%`} sub={`${cancelled.length} pedidos`} accent={cancelRate>10?C.red:C.mid} onClick={()=>setPage('pedidos')}/>
        <KpiCard label="Rating"         value={avgRating} sub={`${ratings.length} reseñas`} accent={C.yellow} onClick={()=>setPage('ratings')}/>
      </div>

      {/* Charts row */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14,marginBottom:14}}>
        {/* Ingresos 7 días */}
        <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,padding:20}}>
          <div style={{fontSize:10,color:'#6E6E73',fontWeight:700,letterSpacing:1,marginBottom:16}}>INGRESOS — ÚLTIMOS 7 DÍAS</div>
          <div style={{display:'flex',alignItems:'flex-end',gap:8,height:100}}>
            {last7.map((d,i) => (
              <div key={i} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:5}}>
                <div style={{fontSize:9,color:'#86868B',fontFamily:"'SF Mono',ui-monospace,monospace",textAlign:'center',minHeight:12}}>{d.rev>0?fmtK(d.rev):''}</div>
                <div style={{width:'100%',height:`${Math.max(d.rev>0?Math.round((d.rev/maxRev)*80):0,d.rev>0?3:0)}px`,background:d.rev===maxRev&&d.rev>0?'#000000':'#D2D2D7',borderRadius:'3px 3px 0 0',transition:'height .3s',minHeight:d.rev>0?3:0}}/>
                <div style={{fontSize:10,color:'#6E6E73',fontWeight:400}}>{d.label}</div>
              </div>
            ))}
          </div>
        </div>

        {/* Horas pico */}
        <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,padding:20}}>
          <div style={{fontSize:10,color:'#6E6E73',fontWeight:700,letterSpacing:1,marginBottom:16}}>HORAS PICO</div>
          <div style={{display:'flex',alignItems:'flex-end',gap:2,height:80}}>
            {hourly.map((n,h) => {
              const isNow = new Date().getHours()===h;
              const isPeak = n === maxHour && n > 0;
              return (
                <div key={h} title={`${h}:00 — ${n} pedidos`} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:3}}>
                  <div style={{width:'100%',height:`${Math.max(n>0?Math.round((n/maxHour)*68):0,n>0?2:0)}px`,background:isPeak?'#000000':isNow?'#6E6E73':'#D2D2D7',borderRadius:'2px 2px 0 0',transition:'height .3s'}}/>
                  {h%4===0 && <div style={{fontSize:8,color:'#6E6E73',fontFamily:"'SF Mono',ui-monospace,monospace"}}>{h}</div>}
                </div>
              );
            })}
          </div>
          <div style={{fontSize:10,color:'#1D1D1F',marginTop:8}}>
            {maxHour>0 ? `Pico: ${hourly.indexOf(maxHour)}:00 (${maxHour} pedidos)` : 'Sin datos suficientes'}
          </div>
        </div>
      </div>

      {/* Métodos de pago + Pedidos recientes */}
      <div style={{display:'grid',gridTemplateColumns:'220px 1fr',gap:14}}>
        <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,padding:18}}>
          <div style={{fontSize:10,color:'#6E6E73',fontWeight:700,letterSpacing:1,marginBottom:14}}>MÉTODOS DE PAGO</div>
          {Object.entries(orders.filter(o=>valid(o)&&o.payment_method).reduce((acc,o)=>{acc[o.payment_method]=(acc[o.payment_method]||0)+1;return acc;},{})).sort((a,b)=>b[1]-a[1]).map(([m,n])=>(
            <div key={m} style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:9}}>
              <span style={{fontSize:12,color:'#1D1D1F'}}>{PL[m]||m}</span>
              <span style={{fontFamily:"'SF Mono',ui-monospace,monospace",fontSize:13,fontWeight:700}}>{n}</span>
            </div>
          ))}
          {orders.filter(o=>valid(o)&&o.payment_method).length===0 && <div style={{color:'#D2D2D7',fontSize:12}}>Sin datos</div>}
        </div>
        <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,overflow:'hidden'}}>
          <div style={{padding:'12px 16px',borderBottom:`1px solid ${C.border}`,fontSize:10,fontWeight:700,color:'#6E6E73',letterSpacing:1}}>PEDIDOS RECIENTES</div>
          <table style={{width:'100%',borderCollapse:'collapse'}}>
            <thead><tr style={{borderBottom:`1px solid ${C.border}`}}><Th>#</Th><Th>Mesa</Th><Th>Estado</Th><Th right>Total</Th><Th>Pago</Th><Th>Hora</Th></tr></thead>
            <tbody>
              {recent.map(o=>(
                <tr key={o.id} style={{borderBottom:`1px solid #0d0d0d`}}>
                  <Td mono dim>{o.order_number}</Td>
                  <Td>{mesaLabel(o)}</Td>
                  <Td><Badge status={o.status}/></Td>
                  <Td mono right>{fmt(o.total)}</Td>
                  <Td dim>{PL[o.payment_method]||'—'}</Td>
                  <Td mono dim>{fmtTime(o.created_at)}</Td>
                </tr>
              ))}
              {recent.length===0 && <EmptyRow cols={6} label="No hay pedidos"/>}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════
   PEDIDOS
══════════════════════════════════════════════ */
function PedidosPage({orders,onRefresh}) {
  const [filter,setFilter] = useState('all');
  const [selected,setSelected] = useState(null);
  const [items,setItems] = useState([]);
  const [loadingItems,setLoadingItems] = useState(false);
  const [upd,setUpd] = useState(false);
  const FILTERS = [{id:'all',label:'Todos'},{id:'active',label:'Activos'},{id:'paid',label:'Nuevos'},{id:'cooking',label:'Preparando'},{id:'delivered',label:'Entregados'},{id:'cancelled',label:'Cancelados'}];
  const filtered = useMemo(()=>{
    if(filter==='all') return orders;
    if(filter==='active') return orders.filter(o=>['paid','kitchen_received','cooking','ready'].includes(o.status));
    if(filter==='paid') return orders.filter(o=>['paid','kitchen_received'].includes(o.status));
    return orders.filter(o=>o.status===filter);
  },[orders,filter]);

  async function selectOrder(o) {
    setSelected(o);setItems([]);
    if(!db)return;
    setLoadingItems(true);
    const{data}=await db.from('order_items').select('item_name,quantity,unit_price,total_price,observations').eq('order_id',o.id);
    setItems(data||[]);setLoadingItems(false);
  }
  async function updateStatus(orderId,newStatus) {
    if(!db)return;setUpd(true);
    const{data,error}=await db.from('orders').update({status:newStatus,...(newStatus==='delivered'?{completed_at:new Date().toISOString()}:{})}).eq('id',orderId).select('id');
    if(error){toast('Error: '+error.message,false);}
    else if(!data||data.length===0){toast('No se pudo actualizar el estado — verificá RLS en Supabase',false);}
    else{toast('Estado actualizado');setSelected(s=>s?.id===orderId?{...s,status:newStatus}:s);onRefresh();}
    setUpd(false);
  }
  return (
    <div className="page">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
        <h1 style={{fontSize:22,fontWeight:800,color:'#000000'}}>Pedidos</h1>
        <Btn onClick={onRefresh} variant="secondary">↺ Actualizar</Btn>
      </div>
      <div style={{display:'flex',gap:0,borderBottom:`1px solid ${C.border}`,marginBottom:0}}>
        {FILTERS.map(f=>(
          <button key={f.id} onClick={()=>setFilter(f.id)} style={{background:'none',border:'none',color:filter===f.id?C.ink:'#86868B',padding:'8px 13px',fontSize:12,fontWeight:filter===f.id?700:400,borderBottom:filter===f.id?'2px solid #000':'2px solid transparent',cursor:'pointer',marginBottom:-1}}>
            {f.label} {f.id!=='all'&&<span style={{color:'#6E6E73',fontSize:10}}>({filtered.length})</span>}
          </button>
        ))}
      </div>
      <div style={{display:'flex',gap:12,paddingTop:12,minHeight:400}}>
        <div style={{flex:1,background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,overflow:'auto'}}>
          <table style={{width:'100%',borderCollapse:'collapse'}}>
            <thead><tr style={{borderBottom:`1px solid ${C.border}`}}><Th>#</Th><Th>Mesa</Th><Th>Estado</Th><Th>Items</Th><Th right>Total</Th><Th>Pago</Th><Th>Fecha</Th></tr></thead>
            <tbody>
              {filtered.map(o=>(
                <tr key={o.id} onClick={()=>selectOrder(o)} style={{borderBottom:`1px solid #0d0d0d`,cursor:'pointer',background:selected?.id===o.id?'#FFFFFF':'transparent'}}>
                  <Td mono dim>{o.order_number}</Td>
                  <Td>{mesaLabel(o)}</Td>
                  <Td><Badge status={o.status}/></Td>
                  <Td dim>{o.items_count||0}</Td>
                  <Td mono right>{fmt(o.total)}</Td>
                  <Td dim>{PL[o.payment_method]||'—'}</Td>
                  <Td mono dim>{fmtDT(o.created_at)}</Td>
                </tr>
              ))}
              {filtered.length===0&&<EmptyRow cols={7} label="Sin pedidos"/>}
            </tbody>
          </table>
        </div>
        {selected&&(
          <div style={{width:280,background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,flexShrink:0,display:'flex',flexDirection:'column',overflow:'hidden'}}>
            <div style={{padding:'13px 16px',borderBottom:`1px solid ${C.border}`,display:'flex',justifyContent:'space-between'}}>
              <div><div style={{fontFamily:"'SF Mono',ui-monospace,monospace",fontSize:14,fontWeight:700}}>{selected.order_number}</div><div style={{fontSize:10,color:'#86868B',marginTop:2}}>{fmtDT(selected.created_at)}</div></div>
              <button onClick={()=>{setSelected(null);setItems([]);}} style={{background:'none',border:'none',color:'#86868B',fontSize:20,lineHeight:1,padding:0}}>×</button>
            </div>
            <div style={{padding:'8px 16px',borderBottom:`1px solid ${C.border}`,display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>
              <Badge status={selected.status}/>
              <span style={{fontSize:12,color:'#6E6E73'}}>{mesaLabel(selected)}</span>
            </div>
            <div style={{flex:1,padding:'8px 16px',overflowY:'auto',borderBottom:`1px solid ${C.border}`}}>
              {loadingItems&&<span className="spin"/>}
              {items.map((it,i)=>(
                <div key={i} style={{borderBottom:`1px solid #0d0d0d`,padding:'6px 0'}}>
                  <div style={{display:'flex',justifyContent:'space-between',fontSize:13}}><span>{it.quantity}× {it.item_name}</span><span style={{fontFamily:"'SF Mono',ui-monospace,monospace",color:'#6E6E73',marginLeft:6}}>{fmt(it.total_price)}</span></div>
                  {it.observations&&<div style={{fontSize:11,color:'#6E6E73',marginTop:2}}>→ {it.observations}</div>}
                </div>
              ))}
            </div>
            <div style={{padding:'8px 16px',borderBottom:`1px solid ${C.border}`}}>
              {selected.discount_amount>0&&<div style={{display:'flex',justifyContent:'space-between',fontSize:12,marginBottom:4,color:C.green}}><span>Descuento</span><span style={{fontFamily:"'SF Mono',ui-monospace,monospace"}}>-{fmt(selected.discount_amount)}</span></div>}
              <div style={{display:'flex',justifyContent:'space-between',fontWeight:700,fontSize:14}}><span>Total</span><span style={{fontFamily:"'SF Mono',ui-monospace,monospace"}}>{fmt(selected.total)}</span></div>
            </div>
            <div style={{padding:'12px 16px',display:'flex',flexDirection:'column',gap:7}}>
              {selected.status==='paid'&&<Btn onClick={()=>updateStatus(selected.id,'cooking')} disabled={upd}>→ Iniciar preparación</Btn>}
              {selected.status==='cooking'&&<Btn onClick={()=>updateStatus(selected.id,'ready')} disabled={upd}>✓ Marcar listo</Btn>}
              {selected.status==='ready'&&<Btn onClick={()=>updateStatus(selected.id,'delivered')} disabled={upd}>✓ Entregar</Btn>}
              {!['delivered','cancelled'].includes(selected.status)&&<Btn variant="danger" onClick={()=>{if(confirm(`¿Cancelar ${selected.order_number}?`))updateStatus(selected.id,'cancelled');}} disabled={upd}>✕ Cancelar</Btn>}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════
   MENÚ
══════════════════════════════════════════════ */
function MenuPage({categories,menuItems,onRefresh}) {
  const [catFilter,setCatFilter] = useState('all');
  const [showForm,setShowForm] = useState(false);
  const [editId,setEditId] = useState(null);
  const [editVals,setEditVals] = useState({});
  const [saving,setSaving] = useState(false);
  const [newCat,setNewCat] = useState('');
  const [form,setForm] = useState({name:'',description:'',price_guarani:'',category_id:'',is_available:true,promo_tag:'',image_url:''});
  const visible = catFilter==='all'?menuItems:menuItems.filter(i=>i.category_id===catFilter);
  const catName = id => categories.find(c=>c.id===id)?.name||'—';

  async function addCategory() {
    if(!db||!newCat.trim())return;
    const{data,error}=await db.from('menu_categories').insert({restaurant_id:RID,name:newCat.trim(),sort_order:categories.length+1}).select('id');
    if(error){toast('Error: '+error.message,false);}
    else if(!data||data.length===0){toast('No se pudo crear la categoría — verificá RLS en Supabase',false);}
    else{toast('Categoría agregada');setNewCat('');onRefresh();}
  }
  async function addItem() {
    if(!db||!form.name||!form.price_guarani||!form.category_id){toast('Completá nombre, precio y categoría',false);return;}
    setSaving(true);
    const{data:maxData}=await db.from('menu_items').select('id').order('id',{ascending:false}).limit(1);
    const nextId=(maxData&&maxData.length>0?maxData[0].id:0)+1;
    const{data,error}=await db.from('menu_items').insert({id:nextId,name:form.name,description:form.description||null,price_guarani:parseInt(form.price_guarani),category_id:form.category_id,restaurant_id:RID,is_available:form.is_available,promo_tag:form.promo_tag||null,image_url:form.image_url||null}).select('id');
    if(error){toast('Error al guardar: '+error.message,false);}
    else if(!data||data.length===0){toast('No se pudo crear el item — verificá RLS en Supabase',false);}
    else{toast('Item creado — ya visible en la app');setShowForm(false);setForm({name:'',description:'',price_guarani:'',category_id:'',is_available:true,promo_tag:'',image_url:''});onRefresh();}
    setSaving(false);
  }
  async function toggleAvail(item) {
    if(!db)return;
    const{data,error}=await db.from('menu_items').update({is_available:!item.is_available}).eq('id',item.id).select('id');
    if(error){toast('Error: '+error.message,false);}
    else if(!data||data.length===0){toast('No se pudo actualizar — verificá permisos RLS en Supabase',false);}
    else{toast(item.is_available?'Desactivado — no aparece en carta':'Activado — visible en carta');onRefresh();}
  }
  async function saveEdit(item) {
    if(!db)return;
    const v=editVals[item.id]||{};
    const upd={};
    if(v.name!==undefined&&v.name!==item.name)upd.name=v.name;
    if(v.desc!==undefined&&v.desc!==(item.description||''))upd.description=v.desc||null;
    if(v.price!==undefined&&parseInt(v.price)!==item.price_guarani)upd.price_guarani=parseInt(v.price);
    if(v.promo!==undefined&&v.promo!==(item.promo_tag||''))upd.promo_tag=v.promo||null;
    if(v.img!==undefined&&v.img!==(item.image_url||''))upd.image_url=v.img||null;
    if(!Object.keys(upd).length){setEditId(null);return;}
    const{data,error}=await db.from('menu_items').update(upd).eq('id',item.id).select('id');
    if(error){toast('Error: '+error.message,false);}
    else if(!data||data.length===0){toast('No se pudo guardar — verificá permisos RLS en Supabase',false);}
    else{toast('Guardado — reflejado en la app');setEditId(null);onRefresh();}
  }
  async function deleteItem(item) {
    if(!db||!confirm(`¿Eliminar "${item.name}"?`))return;
    const{data,error}=await db.from('menu_items').delete().eq('id',item.id).select('id');
    if(error){
      const msg = error.message.includes('foreign key') || error.message.includes('order_items')
        ? 'Este item tiene pedidos históricos. Ejecutá la migración 012 en Supabase para habilitarlo.'
        : 'Error: '+error.message;
      toast(msg,false);
    }
    else if(!data||data.length===0){toast('No se pudo eliminar — ejecutá la migración 010 en Supabase',false);}
    else{toast('Item eliminado');onRefresh();}
  }
  function startEdit(item){setEditId(item.id);setEditVals(v=>({...v,[item.id]:{name:item.name,desc:item.description||'',price:item.price_guarani,promo:item.promo_tag||'',img:item.image_url||''}}));}
  function upd(id,k,v){setEditVals(ev=>({...ev,[id]:{...ev[id],[k]:v}}));}

  return (
    <div className="page">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
        <h1 style={{fontSize:22,fontWeight:800,color:'#000000'}}>Menú</h1>
        <div style={{display:'flex',gap:8}}>
          <a href="index.html" target="_blank" style={{fontSize:12,color:'#6E6E73',padding:'8px 12px',border:`1px solid ${C.border}`,borderRadius:6,textDecoration:'none'}}>Ver app →</a>
          <Btn onClick={()=>setShowForm(!showForm)}>+ Nuevo item</Btn>
        </div>
      </div>
      <div style={{background:'rgba(34,197,94,0.06)',border:'1px solid rgba(34,197,94,0.2)',borderRadius:8,padding:'9px 14px',marginBottom:14,fontSize:12,color:'#86868B'}}>
        Los cambios se guardan en Supabase. La app del cliente los ve al refrescar. Si crear o eliminar items falla, ejecutá las migraciones <code style={{fontFamily:"'SF Mono',ui-monospace,monospace",color:'#AEAEB2',fontSize:11}}>010</code> y <code style={{fontFamily:"'SF Mono',ui-monospace,monospace",color:'#AEAEB2',fontSize:11}}>012</code> en Supabase. Para subir fotos ejecutá también la <code style={{fontFamily:"'SF Mono',ui-monospace,monospace",color:'#AEAEB2',fontSize:11}}>011</code>.
      </div>
      <div style={{display:'flex',gap:14}}>
        <div style={{width:165,flexShrink:0}}>
          <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,marginBottom:10,overflow:'hidden'}}>
            <div style={{padding:'8px 12px',fontSize:10,color:'#6E6E73',fontWeight:700,letterSpacing:1,borderBottom:`1px solid ${C.border}`}}>CATEGORÍAS</div>
            {[{id:'all',name:'Todas',cnt:menuItems.length},...categories.map(c=>({id:c.id,name:c.name,cnt:menuItems.filter(i=>i.category_id===c.id).length}))].map(c=>{
              const active=catFilter===c.id;
              return <button key={c.id} onClick={()=>setCatFilter(c.id)} style={{display:'flex',justifyContent:'space-between',width:'100%',textAlign:'left',padding:'8px 12px',background:active?'rgba(255,255,255,0.08)':'none',border:'none',color:active?C.white:C.mid,fontSize:13,cursor:'pointer',borderBottom:`1px solid #0d0d0d`,borderLeft:active?`2px solid ${C.white}`:'2px solid transparent'}}>
                <span>{c.name}</span><span style={{color:'#D2D2D7',fontSize:11}}>{c.cnt}</span>
              </button>;
            })}
          </div>
          <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,padding:12}}>
            <div style={{fontSize:10,color:'#6E6E73',fontWeight:700,marginBottom:7}}>+ CATEGORÍA</div>
            <Inp value={newCat} onChange={e=>setNewCat(e.target.value)} placeholder="Nombre…" onKeyDown={e=>e.key==='Enter'&&addCategory()}/>
            <Btn variant="secondary" onClick={addCategory} style={{marginTop:7,width:'100%'}} small disabled={!newCat.trim()}>Agregar</Btn>
          </div>
        </div>
        <div style={{flex:1}}>
          {showForm&&(
            <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,padding:20,marginBottom:12}}>
              <div style={{fontSize:11,color:'#6E6E73',fontWeight:700,marginBottom:14,letterSpacing:1}}>NUEVO ITEM</div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:12}}>
                <div><Lbl>NOMBRE *</Lbl><Inp value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="Lomito completo"/></div>
                <div><Lbl>PRECIO (₲) *</Lbl><Inp type="number" mono value={form.price_guarani} onChange={e=>setForm({...form,price_guarani:e.target.value})} placeholder="75000"/></div>
                <div><Lbl>CATEGORÍA *</Lbl><Sel value={form.category_id} onChange={e=>setForm({...form,category_id:e.target.value})}><option value="">Seleccionar…</option>{categories.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</Sel></div>
                <div><Lbl>PROMO TAG</Lbl><Inp value={form.promo_tag} onChange={e=>setForm({...form,promo_tag:e.target.value})} placeholder="2×1, Nuevo, Chef ★"/></div>
                <div style={{gridColumn:'1/-1'}}><Lbl>IMAGEN DEL PRODUCTO</Lbl><ImageUploader value={form.image_url} onChange={url=>setForm({...form,image_url:url})}/></div>
                <div style={{gridColumn:'1/-1'}}><Lbl>DESCRIPCIÓN</Lbl><textarea value={form.description||''} onChange={e=>setForm({...form,description:e.target.value})} rows={2} style={{width:'100%',padding:'8px 10px',fontSize:13,resize:'vertical',background:'#F5F5F7',border:'1px solid #222',color:'#fff',borderRadius:6}}/></div>
              </div>
              <div style={{display:'flex',gap:8,alignItems:'center'}}>
                <Btn onClick={addItem} disabled={saving}>{saving?'Guardando…':'Guardar item'}</Btn>
                <Btn variant="ghost" onClick={()=>setShowForm(false)}>Cancelar</Btn>
              </div>
            </div>
          )}
          <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,overflow:'hidden'}}>
            <table style={{width:'100%',borderCollapse:'collapse'}}>
              <thead><tr style={{borderBottom:`1px solid ${C.border}`}}><Th>Foto</Th><Th>Nombre</Th><Th>Cat.</Th><Th right>Precio</Th><Th>Promo</Th><Th>Estado</Th><Th>Acc.</Th></tr></thead>
              <tbody>
                {visible.map(item=>{
                  const ed=editId===item.id;const ev=editVals[item.id]||{};
                  return (
                    <tr key={item.id} style={{borderBottom:`1px solid #0d0d0d`}}>
                      <Td>
                        {ed
                          ?<ImageUploader compact value={ev.img||''} onChange={url=>upd(item.id,'img',url)}/>
                          :item.image_url?<img src={item.image_url} alt="" style={{width:36,height:36,objectFit:'cover',borderRadius:4,border:`1px solid ${C.border}`}} onError={e=>{e.target.style.display='none';}}/>
                          :<div style={{width:36,height:36,background:'#FFFFFF',borderRadius:4,display:'flex',alignItems:'center',justifyContent:'center',fontSize:14}}>🍽</div>}
                      </Td>
                      <Td>
                        {ed?<div style={{display:'flex',flexDirection:'column',gap:4}}>
                            <Inp value={ev.name||''} onChange={e=>upd(item.id,'name',e.target.value)} placeholder="Nombre" style={{fontSize:13}}/>
                            <Inp value={ev.desc||''} onChange={e=>upd(item.id,'desc',e.target.value)} placeholder="Descripción" style={{fontSize:11,color:'#777'}}/>
                          </div>
                          :<div><div style={{color:item.is_available?C.ink:'#86868B'}}>{item.name}</div>{item.description&&<div style={{fontSize:11,color:'#86868B',marginTop:2,maxWidth:180,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{item.description}</div>}</div>}
                      </Td>
                      <Td dim>{catName(item.category_id)}</Td>
                      <Td mono right>
                        {ed?<Inp type="number" mono value={ev.price||''} onChange={e=>upd(item.id,'price',e.target.value)} style={{width:100,textAlign:'right'}}/>:fmt(item.price_guarani)}
                      </Td>
                      <Td>
                        {ed?<Inp value={ev.promo||''} onChange={e=>upd(item.id,'promo',e.target.value)} placeholder="promo…" style={{width:80,fontSize:11}}/>
                          :item.promo_tag&&<span style={{background:'#FFF4E0',border:'1px solid #FFD580',color:'#8A4B00',padding:'2px 6px',fontSize:11,borderRadius:4}}>{item.promo_tag}</span>}
                      </Td>
                      <Td>
                        <button onClick={()=>toggleAvail(item)} style={{background:item.is_available?'rgba(34,197,94,0.1)':'rgba(255,255,255,0.04)',border:`1px solid ${item.is_available?'rgba(34,197,94,0.3)':C.border}`,color:item.is_available?C.green:'#86868B',padding:'3px 9px',fontSize:11,fontWeight:600,borderRadius:5}}>
                          {item.is_available?'Activo':'Inactivo'}
                        </button>
                      </Td>
                      <Td>
                        {ed?<div style={{display:'flex',gap:5}}>
                            <Btn small onClick={()=>saveEdit(item)}>✓</Btn>
                            <Btn small variant="ghost" onClick={()=>setEditId(null)}>✕</Btn>
                          </div>
                          :<div style={{display:'flex',gap:5}}>
                            <Btn small variant="secondary" onClick={()=>startEdit(item)}>Editar</Btn>
                            <Btn small variant="danger" onClick={()=>deleteItem(item)}>✕</Btn>
                          </div>}
                      </Td>
                    </tr>
                  );
                })}
                {visible.length===0&&<EmptyRow cols={7} label="Sin items"/>}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════
   MESAS — CRUD COMPLETO + ZONAS
══════════════════════════════════════════════ */
function MesasPage({tables,orders,onRefresh}) {
  const [zones,setZones] = useState(()=>LS.get(ZONES_KEY,{}));
  const [modal,setModal] = useState(null); // null | {mode:'add'} | {mode:'edit', table}
  const [form,setForm] = useState({number:'',capacity:'4',zone:''});
  const [saving,setSaving] = useState(false);
  const [activeZone,setActiveZone] = useState('todas');

  const activeOrders = orders.filter(o=>['paid','kitchen_received','cooking','ready'].includes(o.status));
  const allZones = [...new Set(Object.values(zones).filter(Boolean))].sort();

  function saveZone(tableId,zone) {
    const z={...zones};
    if(zone.trim())z[tableId]=zone.trim();else delete z[tableId];
    setZones(z);LS.set(ZONES_KEY,z);
  }

  function openAdd() { setForm({number:'',capacity:'4',zone:''});setModal({mode:'add'}); }
  function openEdit(t) { setForm({number:String(t.number),capacity:String(t.capacity||4),zone:zones[t.id]||''});setModal({mode:'edit',table:t}); }

  async function saveTable() {
    if(!db||!form.number){toast('Número de mesa requerido',false);return;}
    const num=parseInt(form.number);
    if(isNaN(num)||num<1){toast('Número inválido',false);return;}
    setSaving(true);
    if(modal.mode==='add') {
      const token=(crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)).replace(/-/g,'').slice(0,16);
      const{data,error}=await db.from('tables').insert({restaurant_id:RID,number:num,capacity:parseInt(form.capacity)||4,qr_token:token}).select().single();
      if(error){toast('Error: '+error.message,false);}
      else{saveZone(data.id,form.zone);toast('Mesa '+num+' creada');onRefresh();setModal(null);}
    } else {
      const{data,error}=await db.from('tables').update({number:num,capacity:parseInt(form.capacity)||4}).eq('id',modal.table.id).select('id');
      if(error){toast('Error: '+error.message,false);}
      else if(!data||data.length===0){toast('No se pudo actualizar la mesa — verificá RLS en Supabase',false);}
      else{saveZone(modal.table.id,form.zone);toast('Mesa actualizada');onRefresh();setModal(null);}
    }
    setSaving(false);
  }

  async function deleteTable(t) {
    if(!db)return;
    const hasActive=activeOrders.some(o=>o.table_id===t.id);
    if(hasActive){toast('Mesa con pedido activo, no se puede eliminar',false);return;}
    if(!confirm(`¿Eliminar Mesa ${t.number}? Esta acción no se puede deshacer.`))return;
    const{data,error}=await db.from('tables').delete().eq('id',t.id).select('id');
    if(error){toast('Error: '+error.message,false);}
    else if(!data||data.length===0){toast('No se pudo eliminar — falta política DELETE en Supabase RLS',false);}
    else{const z={...zones};delete z[t.id];setZones(z);LS.set(ZONES_KEY,z);toast('Mesa eliminada');onRefresh();}
  }

  const filtered = activeZone==='todas' ? tables : activeZone==='sin zona' ? tables.filter(t=>!zones[t.id]) : tables.filter(t=>zones[t.id]===activeZone);
  const grouped = activeZone!=='todas' ? [{zone:activeZone,items:filtered}] :
    [...allZones.map(z=>({zone:z,items:tables.filter(t=>zones[t.id]===z)})),
     {zone:'Sin zona',items:tables.filter(t=>!zones[t.id])}].filter(g=>g.items.length>0);

  return (
    <div className="page">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
        <div>
          <h1 style={{fontSize:22,fontWeight:800,color:'#000000'}}>Mesas</h1>
          <div style={{fontSize:12,color:'#6E6E73',marginTop:2}}>{activeOrders.length} con pedidos activos · {tables.length} mesas</div>
        </div>
        <Btn onClick={openAdd}>+ Nueva mesa</Btn>
      </div>

      {/* Filtro zonas */}
      <div style={{display:'flex',gap:6,marginBottom:16,flexWrap:'wrap'}}>
        {['todas',...allZones,'sin zona'].map(z=>(
          <button key={z} onClick={()=>setActiveZone(z)} style={{background:activeZone===z?'#000000':'transparent',border:`1px solid ${activeZone===z?C.bs:C.border}`,color:activeZone===z?C.white:C.mid,padding:'5px 12px',fontSize:12,fontWeight:activeZone===z?700:400,borderRadius:20,cursor:'pointer',textTransform:'capitalize'}}>
            {z}
          </button>
        ))}
      </div>

      {/* Grupos por zona */}
      {grouped.map(({zone,items})=>(
        <div key={zone} style={{marginBottom:24}}>
          {grouped.length>1&&<div style={{fontSize:10,color:'#6E6E73',fontWeight:700,letterSpacing:'0.14em',textTransform:'uppercase',marginBottom:10,display:'flex',alignItems:'center',gap:8}}>{zone}<div style={{flex:1,height:1,background:C.border}}/></div>}
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(175px,1fr))',gap:10}}>
            {items.map(t=>{
              const order=activeOrders.find(o=>o.table_id===t.id);
              const busy=!!order;
              return (
                <div key={t.id} style={{background:busy?'#000000':'#F5F5F7',border:`1px solid ${busy?'#000000':C.border}`,borderRadius:10,padding:16,position:'relative'}}>
                  {busy&&<div style={{position:'absolute',top:10,right:10}}><Badge status={order.status}/></div>}
                  <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:10}}>
                    <div style={{width:36,height:36,borderRadius:'50%',background:'#FFFFFF',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:800,fontSize:15,color:busy?'#000000':'#D2D2D7',flexShrink:0}}>{t.number}</div>
                    <div>
                      <div style={{fontSize:11,color:'#6E6E73'}}>Cap. {t.capacity||4}p</div>
                      {zones[t.id]&&<div style={{fontSize:10,color:'#86868B',marginTop:1}}>{zones[t.id]}</div>}
                    </div>
                  </div>
                  {order
                    ?<div><div style={{fontFamily:"'SF Mono',ui-monospace,monospace",fontSize:11,color:'#86868B',marginBottom:2}}>{order.order_number}</div><div style={{fontSize:14,fontWeight:700}}>{fmt(order.total)}</div><div style={{fontSize:10,color:'#6E6E73',marginTop:1}}>{fmtTime(order.created_at)}</div></div>
                    :<div style={{fontSize:12,color:'#6E6E73'}}>Libre</div>}
                  <div style={{display:'flex',gap:6,marginTop:12}}>
                    <button onClick={()=>openEdit(t)} style={{flex:1,background:'transparent',border:`1px solid ${C.border}`,color:C.dim,padding:'4px',fontSize:11,borderRadius:5,cursor:'pointer'}}>Editar</button>
                    <button onClick={()=>deleteTable(t)} style={{background:'transparent',border:'1px solid rgba(239,68,68,0.2)',color:'rgba(239,68,68,0.6)',padding:'4px 8px',fontSize:11,borderRadius:5,cursor:'pointer'}}>✕</button>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      ))}
      {tables.length===0&&<div style={{color:'#D2D2D7',padding:40,textAlign:'center',fontSize:13}}>No hay mesas. Creá la primera con "+ Nueva mesa"</div>}

      {/* Modal add/edit */}
      {modal&&(
        <Modal title={modal.mode==='add'?'Nueva mesa':'Editar mesa'} onClose={()=>setModal(null)} width={360}>
          <div style={{display:'flex',flexDirection:'column',gap:12}}>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
              <div><Lbl>NÚMERO *</Lbl><Inp type="number" mono value={form.number} onChange={e=>setForm({...form,number:e.target.value})} placeholder="1"/></div>
              <div><Lbl>CAPACIDAD</Lbl><Inp type="number" mono value={form.capacity} onChange={e=>setForm({...form,capacity:e.target.value})} placeholder="4"/></div>
            </div>
            <div>
              <Lbl>ZONA</Lbl>
              <input list="zonas-list" value={form.zone} onChange={e=>setForm({...form,zone:e.target.value})} placeholder="Salón, Terraza, Barra…" style={{width:'100%',padding:'8px 10px',fontSize:13,borderRadius:6,background:'#FFFFFF',border:'1px solid #D2D2D7',color:'#1D1D1F'}}/>
              <datalist id="zonas-list">{allZones.map(z=><option key={z} value={z}/>)}</datalist>
              <div style={{fontSize:10,color:'#86868B',marginTop:4}}>Las zonas se guardan en este navegador (no en DB)</div>
            </div>
            {modal.mode==='edit'&&modal.table.qr_token&&(
              <div style={{background:'#0a0a0a',border:`1px solid ${C.border}`,borderRadius:6,padding:10}}>
                <div style={{fontSize:10,color:'#6E6E73',fontWeight:700,marginBottom:4}}>TOKEN QR</div>
                <div style={{fontFamily:"'SF Mono',ui-monospace,monospace",fontSize:11,color:'#86868B',wordBreak:'break-all'}}>{modal.table.qr_token}</div>
              </div>
            )}
            <div style={{display:'flex',gap:8,marginTop:4}}>
              <Btn onClick={saveTable} disabled={saving}>{saving?'Guardando…':modal.mode==='add'?'Crear mesa':'Guardar cambios'}</Btn>
              <Btn variant="ghost" onClick={()=>setModal(null)}>Cancelar</Btn>
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════════
   PERSONAL
══════════════════════════════════════════════ */
function PersonalPage() {
  const [profiles,setProfiles] = useState([]);
  const [loading,setLoading] = useState(true);
  const [error,setError] = useState(null);
  const [editId,setEditId] = useState(null);
  const [editRole,setEditRole] = useState('');
  const [editActive,setEditActive] = useState(true);

  async function loadProfiles() {
    if(!db){setLoading(false);return;}
    setLoading(true);
    setError(null);
    const {data:rpcData,error:rpcErr} = await db.rpc('admin_list_restaurant_users',{p_restaurant_id:RID});
    if(!rpcErr) {
      setProfiles(rpcData||[]);setLoading(false);return;
    }
    console.warn('[Personal] RPC falló:',rpcErr?.message);
    // Fallback: query directa (funciona para superadmin con superadmin_manage_roles)
    const{data,error:e}=await db.from('user_roles')
      .select('id,user_id,username,display_name,role,email,is_active,created_at')
      .eq('restaurant_id',RID)
      .order('created_at',{ascending:false});
    if(!e) {
      setProfiles(data||[]);setLoading(false);return;
    }
    console.warn('[Personal] Query directa falló:',e?.message);
    // Último recurso: al menos mostrar el propio usuario
    const uid=(await db.auth.getUser()).data?.user?.id||'';
    const{data:me,error:meErr}=await db.from('user_roles')
      .select('id,user_id,username,display_name,role,email,is_active,created_at')
      .eq('user_id',uid)
      .limit(1);
    if(!meErr && me?.length) { setProfiles(me);setLoading(false);return; }
    console.warn('[Personal] Query propia falló:',meErr?.message,'uid:',uid);
    setError(`Error al cargar personal: ${rpcErr?.message||e?.message||'Sin acceso a user_roles'}. Revisá la consola del navegador.`);
    setLoading(false);
  }

  useEffect(()=>{ loadProfiles(); },[]);

  async function saveRole(id) {
    if(!db)return;
    // Intentar con RPC primero, luego direct update
    const{error:rpcErr}=await db.rpc('admin_update_user_role',{p_user_role_id:id,p_role:editRole,p_is_active:editActive});
    if(rpcErr) {
      const{error:e}=await db.from('user_roles').update({role:editRole,is_active:editActive}).eq('id',id);
      if(e){toast('Error: '+e.message,false);return;}
    }
    toast('Usuario actualizado');
    setProfiles(p=>p.map(x=>x.id===id?{...x,role:editRole,is_active:editActive}:x));
    setEditId(null);
  }

  const roleColor={cocina:C.orange,admin:C.blue,superadmin:C.purple,waiter:C.green,cajero:C.yellow,delivery:'#06b6d4'};

  return (
    <div className="page">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
        <h1 style={{fontSize:22,fontWeight:800,color:'#000000'}}>Personal</h1>
        <Btn small variant="secondary" onClick={loadProfiles}>↺ Actualizar</Btn>
      </div>
      <div style={{fontSize:12,color:'#6E6E73',marginBottom:16}}>Usuarios con acceso al sistema · restaurante {RID.slice(0,8)}…</div>
      {loading&&<div style={{display:'flex',gap:10,alignItems:'center',color:'#6E6E73',fontSize:13}}><span className="spin"/>Cargando personal…</div>}
      {error&&(
        <div style={{color:C.orange,fontSize:13,padding:16,background:'rgba(249,115,22,0.08)',border:'1px solid rgba(249,115,22,0.2)',borderRadius:8,marginBottom:14}}>
          <div style={{fontWeight:700,marginBottom:4}}>Atención</div>
          {error}
          <div style={{marginTop:8,fontSize:11,color:'#86868B'}}>Si acabás de ejecutar la migración 023, recargá la página y volvé a intentar.</div>
        </div>
      )}
      {!loading&&(
        <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,overflow:'hidden'}}>
          <table style={{width:'100%',borderCollapse:'collapse'}}>
            <thead>
              <tr style={{borderBottom:`1px solid ${C.border}`}}>
                <Th>Usuario</Th><Th>Nombre</Th><Th>Email</Th><Th>Rol</Th><Th>Estado</Th><Th>Desde</Th><Th>Acc.</Th>
              </tr>
            </thead>
            <tbody>
              {profiles.map(p=>(
                <tr key={p.id} style={{borderBottom:`1px solid #0d0d0d`,opacity:p.is_active===false?0.5:1}}>
                  <Td mono>{p.username||'—'}</Td>
                  <Td>{p.display_name||'—'}</Td>
                  <Td dim style={{fontSize:11}}>{p.email||'—'}</Td>
                  <Td>
                    {editId===p.id
                      ?<Sel value={editRole} onChange={e=>setEditRole(e.target.value)} style={{width:120}}>
                          {ROLES.map(r=><option key={r} value={r}>{r}</option>)}
                        </Sel>
                      :<span style={{background:(roleColor[p.role]||'#6E6E73')+'22',color:roleColor[p.role]||'#6E6E73',border:`1px solid ${(roleColor[p.role]||'#6E6E73')}44`,padding:'3px 9px',fontSize:11,fontWeight:700,borderRadius:5}}>{p.role}</span>}
                  </Td>
                  <Td>
                    {editId===p.id
                      ?<Sel value={String(editActive)} onChange={e=>setEditActive(e.target.value==='true')} style={{width:100}}>
                          <option value="true">Activo</option>
                          <option value="false">Inactivo</option>
                        </Sel>
                      :<span style={{fontSize:11,color:p.is_active!==false?C.green:C.red}}>{p.is_active!==false?'Activo':'Inactivo'}</span>}
                  </Td>
                  <Td mono dim>{fmtDate(p.created_at)}</Td>
                  <Td>
                    {editId===p.id
                      ?<div style={{display:'flex',gap:5}}>
                          <Btn small onClick={()=>saveRole(p.id)}>✓</Btn>
                          <Btn small variant="ghost" onClick={()=>setEditId(null)}>✕</Btn>
                        </div>
                      :<Btn small variant="secondary" onClick={()=>{setEditId(p.id);setEditRole(p.role);setEditActive(p.is_active!==false);}}>Editar</Btn>}
                  </Td>
                </tr>
              ))}
              {profiles.length===0&&!error&&<EmptyRow cols={7} label="Sin usuarios registrados. Creá usuarios desde el panel SuperAdmin."/>}
            </tbody>
          </table>
        </div>
      )}
      {profiles.length>0&&(
        <div style={{marginTop:10,fontSize:11,color:'#86868B'}}>
          {profiles.filter(p=>p.is_active!==false).length} activos · {profiles.filter(p=>p.is_active===false).length} inactivos · Para crear usuarios usá el panel SuperAdmin.
        </div>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════════
   CLIENTES
══════════════════════════════════════════════ */
function ClientesPage({orders}) {
  const [view,setView] = useState('todos');
  const { clientMap, inactivos, frecuentes } = useMemo(()=>{
    const m={};
    orders.filter(o=>!['draft','cancelled'].includes(o.status)&&o.customer_name).forEach(o=>{
      const k=o.customer_name;
      if(!m[k])m[k]={name:k,phone:o.customer_phone||null,orders:0,total:0,lastDate:o.created_at};
      m[k].orders++;
      m[k].total+=(o.total||0);
      // ISO strings son comparables lexicográficamente — no se necesita new Date()
      if(o.created_at>m[k].lastDate)m[k].lastDate=o.created_at;
    });
    const all=Object.values(m).sort((a,b)=>b.orders-a.orders);
    const cutoff=new Date(Date.now()-30*864e5).toISOString();
    return {
      clientMap: all,
      inactivos: all.filter(c=>c.lastDate<cutoff),
      frecuentes: all.filter(c=>c.orders>=3),
    };
  },[orders]);

  const now=Date.now();
  const INACTIVE_DAYS=30;
  const displayed = view==='frecuentes'?frecuentes:view==='inactivos'?inactivos:clientMap;

  return (
    <div className="page">
      <h1 style={{fontSize:22,fontWeight:800,color:'#000000',marginBottom:16}}>Clientes</h1>
      <div style={{display:'flex',gap:10,marginBottom:16,flexWrap:'wrap'}}>
        <KpiCard label="Clientes únicos"  value={clientMap.length} sub="con nombre registrado"/>
        <KpiCard label="Frecuentes"       value={frecuentes.length} sub="3+ pedidos" accent={C.green}/>
        <KpiCard label="Inactivos"        value={inactivos.length} sub={`+${INACTIVE_DAYS} días sin pedir`} accent={inactivos.length>5?C.orange:C.mid}/>
      </div>
      <div style={{display:'flex',gap:0,borderBottom:`1px solid ${C.border}`,marginBottom:0}}>
        {[['todos','Todos'],['frecuentes','Frecuentes'],['inactivos',`Inactivos +${INACTIVE_DAYS}d`]].map(([id,lbl])=>(
          <button key={id} onClick={()=>setView(id)} style={{background:'none',border:'none',color:view===id?C.ink:'#86868B',padding:'8px 14px',fontSize:12,fontWeight:view===id?700:400,borderBottom:view===id?'2px solid #000':'2px solid transparent',cursor:'pointer',marginBottom:-1}}>{lbl}</button>
        ))}
      </div>
      <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,overflow:'hidden',marginTop:0}}>
        <table style={{width:'100%',borderCollapse:'collapse'}}>
          <thead><tr style={{borderBottom:`1px solid ${C.border}`}}><Th>Nombre</Th><Th>Teléfono</Th><Th right>Pedidos</Th><Th right>Total gastado</Th><Th>Último pedido</Th></tr></thead>
          <tbody>
            {displayed.map((c,i)=>{
              const diasInactivo=Math.floor((now-new Date(c.lastDate).getTime())/864e5);
              return (
                <tr key={i} style={{borderBottom:`1px solid #0d0d0d`}}>
                  <Td>{c.name}</Td>
                  <Td dim>{c.phone||'—'}</Td>
                  <Td right><span style={{fontFamily:"'SF Mono',ui-monospace,monospace",fontWeight:700,color:c.orders>=3?C.green:C.ink}}>{c.orders}</span></Td>
                  <Td mono right>{fmt(c.total)}</Td>
                  <Td><span style={{color:diasInactivo>30?C.orange:C.mid}}>{fmtDate(c.lastDate)} <span style={{fontSize:10,color:'#6E6E73'}}>{diasInactivo>0?`hace ${diasInactivo}d`:''}</span></span></Td>
                </tr>
              );
            })}
            {displayed.length===0&&<EmptyRow cols={5} label="Sin clientes en este filtro"/>}
          </tbody>
        </table>
      </div>
      {clientMap.length===0&&<div style={{marginTop:12,fontSize:12,color:'#86868B',padding:'10px 14px',background:'rgba(255,255,255,0.02)',borderRadius:8}}>Los pedidos deben incluir nombre del cliente para aparecer aquí.</div>}
    </div>
  );
}

  useEffect(()=>{ if(db) loadAll(); else setLoading(false); },[]);

    setLoading(true);
    const [tR,qR] = await Promise.all([
      db.from('turnos_caja').select('*').eq('restaurant_id',RID).order('fecha_apertura',{ascending:false}).limit(30),
      db.from('quejas_sugerencias').select('*').eq('restaurant_id',RID).order('created_at',{ascending:false}).limit(50),
    ]);
    const ts = tR.data||[];
    setTurnos(ts);
    setQuejas(qR.data||[]);
    if(ts.length>0){
      const{data:md}=await db.from('movimientos_caja').select('*').eq('turno_id',ts[0].id).order('created_at',{ascending:false});

/* helper local para la página de caja */
function AlertBoxAdmin({type='info',children}){
  const cfg={info:{bg:'rgba(59,130,246,0.08)',border:'rgba(59,130,246,0.25)',color:'#93c5fd'},warn:{bg:'rgba(251,191,36,0.08)',border:'rgba(251,191,36,0.25)',color:'#fde68a'},error:{bg:'rgba(239,68,68,0.08)',border:'rgba(239,68,68,0.25)',color:'#fca5a5'}};
  const s=cfg[type]||cfg.info;
  return<div style={{background:s.bg,border:`1px solid ${s.border}`,color:s.color,padding:'10px 14px',borderRadius:8,fontSize:13}}>{children}</div>;
}

/* ══════════════════════════════════════════════
   FINANZAS
══════════════════════════════════════════════ */
function FinanzasPage({orders}) {
  const [period,setPeriod] = useState('semana');
  const [egresos,setEgresos] = useState([]);
  const [loadingEg,setLoadingEg] = useState(false);
  const [delivPct,setDelivPct] = useState(()=>LS.get(DELIV_KEY,0));
  const [showEgForm,setShowEgForm] = useState(false);
  const [savingEg,setSavingEg] = useState(false);
  const [egForm,setEgForm] = useState({date:new Date().toISOString().slice(0,10),desc:'',amount:'',category:'Insumos'});

  async function loadEgresos() {
    if(!db){setEgresos(LS.get(EGRESOS_KEY,[]));return;}
    setLoadingEg(true);
    const{data,error}=await db.from('expenses').select('*').eq('restaurant_id',RID).order('date',{ascending:false}).order('created_at',{ascending:false});
    if(error) {
      // Fallback a localStorage si la tabla no existe aún
      setEgresos(LS.get(EGRESOS_KEY,[]));
    } else {
      setEgresos((data||[]).map(e=>({...e,desc:e.description})));
    }
    setLoadingEg(false);
  }

  useEffect(()=>{ loadEgresos(); },[]);

  const valid = o => !['draft','cancelled'].includes(o.status);
  function periodStart(p, asString=false) {
    const d=new Date();
    if(p==='hoy'){d.setHours(0,0,0,0);}
    else if(p==='semana'){d.setDate(d.getDate()-6);d.setHours(0,0,0,0);}
    else{d.setDate(1);d.setHours(0,0,0,0);}
    return asString ? d.toISOString().slice(0,10) : d;
  }
  const start=periodStart(period);
  const periodOrders=orders.filter(o=>valid(o)&&new Date(o.created_at)>=start);
  const ingresos=periodOrders.reduce((s,o)=>s+(o.total||0),0);
  const llevarOrders=periodOrders.filter(o=>o.order_type==='llevar');
  const llevarTotal=llevarOrders.reduce((s,o)=>s+(o.total||0),0);
  const comision=Math.round(llevarTotal*(delivPct/100));

  const egPeriod=egresos.filter(e=>(e.date||'')>=periodStart(period, true));
  const egresoTotal=egPeriod.reduce((s,e)=>s+(e.amount||0),0);
  const margen=ingresos-egresoTotal-comision;
  const margenPct=ingresos>0?Math.round(margen/ingresos*100):0;

  async function addEgreso() {
    if(!egForm.desc||!egForm.amount){toast('Completá descripción y monto',false);return;}
    setSavingEg(true);
    if(db) {
      const{error}=await db.from('expenses').insert({
        restaurant_id:RID, date:egForm.date, description:egForm.desc,
        amount:parseInt(egForm.amount), category:egForm.category,
      });
      if(error) {
        // Fallback localStorage
        const item={id:Date.now().toString(),date:egForm.date,desc:egForm.desc,description:egForm.desc,amount:parseInt(egForm.amount),category:egForm.category};
        const u=[item,...egresos];setEgresos(u);LS.set(EGRESOS_KEY,u);
        toast('Egreso guardado localmente (ejecutá migración 023 para usar Supabase)');
      } else {
        toast('Egreso registrado en Supabase');
        await loadEgresos();
      }
    } else {
      const item={id:Date.now().toString(),date:egForm.date,desc:egForm.desc,description:egForm.desc,amount:parseInt(egForm.amount),category:egForm.category};
      const u=[item,...egresos];setEgresos(u);LS.set(EGRESOS_KEY,u);
      toast('Egreso guardado');
    }
    setSavingEg(false);
    setShowEgForm(false);
    setEgForm({date:new Date().toISOString().slice(0,10),desc:'',amount:'',category:'Insumos'});
  }

  async function delEgreso(eg) {
    if(!confirm('¿Eliminar este egreso?'))return;
    if(db && eg.restaurant_id) {
      await db.from('expenses').delete().eq('id',eg.id);
      await loadEgresos();
    } else {
      const u=egresos.filter(e=>e.id!==eg.id);setEgresos(u);LS.set(EGRESOS_KEY,u);
    }
    toast('Eliminado');
  }

  const egByCat=EG_CATS.map(cat=>({cat,total:egPeriod.filter(e=>e.category===cat).reduce((s,e)=>s+e.amount,0)})).filter(x=>x.total>0).sort((a,b)=>b.total-a.total);
  const maxCat=egByCat[0]?.total||1;

  return (
    <div className="page">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
        <h1 style={{fontSize:22,fontWeight:800,color:'#000000'}}>Finanzas</h1>
        <div style={{display:'flex',gap:6}}>
          {['hoy','semana','mes'].map(p=>(
            <button key={p} onClick={()=>setPeriod(p)} style={{background:period===p?'rgba(255,255,255,0.1)':'transparent',border:`1px solid ${period===p?C.bs:C.border}`,color:period===p?C.white:C.mid,padding:'6px 14px',fontSize:12,fontWeight:period===p?700:400,borderRadius:6,cursor:'pointer',textTransform:'capitalize'}}>{p}</button>
          ))}
        </div>
      </div>

      {/* KPIs financieros */}
      <div style={{display:'flex',gap:10,marginBottom:14,flexWrap:'wrap'}}>
        <KpiCard label={`Ingresos (${period})`} value={fmt(ingresos)} sub={`${periodOrders.length} pedidos`} accent={C.green}/>
        <KpiCard label={`Egresos (${period})`}  value={fmt(egresoTotal)} sub={`${egPeriod.length} registros`} accent={C.red}/>
        <KpiCard label="Margen estimado"         value={fmt(margen)} sub={`${margenPct}% del ingreso`} accent={margenPct>=30?C.green:margenPct>=10?C.yellow:C.red}/>
        <KpiCard label="Ventas delivery"         value={fmt(llevarTotal)} sub={`${llevarOrders.length} pedidos llevar`}/>
        <KpiCard label="Comisión delivery"       value={fmt(comision)} sub={`${delivPct}% del delivery`} accent={C.orange}/>
      </div>

      {/* Config comisión delivery */}
      <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,padding:16,marginBottom:14,display:'flex',alignItems:'center',gap:14}}>
        <div style={{fontSize:11,color:'#6E6E73',fontWeight:700,letterSpacing:1}}>COMISIÓN DELIVERY %</div>
        <input type="number" value={delivPct} onChange={e=>{const v=parseInt(e.target.value)||0;setDelivPct(v);LS.set(DELIV_KEY,v);}} min={0} max={50} style={{width:70,padding:'6px 9px',fontSize:14,fontFamily:"'SF Mono',ui-monospace,monospace",textAlign:'right',background:'#F5F5F7',border:'1px solid #333',color:'#fff',borderRadius:6}}/>
        <span style={{fontSize:12,color:'#6E6E73'}}>% sobre total pedidos para llevar</span>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 320px',gap:14}}>
        {/* Egresos list */}
        <div>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
            <div style={{fontSize:11,color:'#6E6E73',fontWeight:700,letterSpacing:1}}>EGRESOS REGISTRADOS</div>
            <Btn small onClick={()=>setShowEgForm(!showEgForm)}>+ Agregar</Btn>
          </div>
          {showEgForm&&(
            <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,padding:16,marginBottom:10}}>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:10}}>
                <div><Lbl>FECHA</Lbl><Inp type="date" value={egForm.date} onChange={e=>setEgForm({...egForm,date:e.target.value})}/></div>
                <div><Lbl>MONTO (₲) *</Lbl><Inp type="number" mono value={egForm.amount} onChange={e=>setEgForm({...egForm,amount:e.target.value})} placeholder="50000"/></div>
                <div><Lbl>CATEGORÍA</Lbl><Sel value={egForm.category} onChange={e=>setEgForm({...egForm,category:e.target.value})}>{EG_CATS.map(c=><option key={c}>{c}</option>)}</Sel></div>
                <div><Lbl>DESCRIPCIÓN *</Lbl><Inp value={egForm.desc} onChange={e=>setEgForm({...egForm,desc:e.target.value})} placeholder="Descripción…"/></div>
              </div>
              <div style={{display:'flex',gap:8}}><Btn small onClick={addEgreso} disabled={savingEg}>{savingEg?'Guardando…':'Guardar egreso'}</Btn><Btn small variant="ghost" onClick={()=>setShowEgForm(false)}>Cancelar</Btn></div>
            </div>
          )}
          <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,overflow:'hidden'}}>
            <table style={{width:'100%',borderCollapse:'collapse'}}>
              <thead><tr style={{borderBottom:`1px solid ${C.border}`}}><Th>Fecha</Th><Th>Descripción</Th><Th>Cat.</Th><Th right>Monto</Th><Th/></tr></thead>
              <tbody>
                {egPeriod.map(e=>(
                  <tr key={e.id} style={{borderBottom:`1px solid #0d0d0d`}}>
                    <Td mono dim>{e.date}</Td>
                    <Td>{e.desc}</Td>
                    <Td dim>{e.category}</Td>
                    <Td mono right style={{color:C.red}}>{fmt(e.amount)}</Td>
                    <Td><button onClick={()=>delEgreso(e)} style={{background:'none',border:'none',color:'#86868B',cursor:'pointer',fontSize:14}}>✕</button></Td>
                  </tr>
                ))}
                {egPeriod.length===0&&<EmptyRow cols={5} label="Sin egresos este período"/>}
              </tbody>
            </table>
          </div>
        </div>

        {/* Distribución por categoría */}
        <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,padding:18}}>
          <div style={{fontSize:10,color:'#6E6E73',fontWeight:700,letterSpacing:1,marginBottom:14}}>EGRESOS POR CATEGORÍA</div>
          {egByCat.length===0&&<div style={{color:'#D2D2D7',fontSize:12}}>Sin egresos este período</div>}
          {egByCat.map(({cat,total})=>(
            <div key={cat} style={{marginBottom:12}}>
              <div style={{display:'flex',justifyContent:'space-between',fontSize:12,marginBottom:4}}>
                <span style={{color:C.mid}}>{cat}</span>
                <span style={{fontFamily:"'SF Mono',ui-monospace,monospace",color:C.red}}>{fmt(total)}</span>
              </div>
              <div style={{height:4,background:'#FFFFFF',borderRadius:2,overflow:'hidden'}}>
                <div style={{width:`${(total/maxCat)*100}%`,height:'100%',background:C.red,borderRadius:2}}/>
              </div>
            </div>
          ))}
          {egByCat.length>0&&(
            <div style={{borderTop:`1px solid ${C.border}`,paddingTop:12,marginTop:4,display:'flex',justifyContent:'space-between',fontSize:13,fontWeight:700}}>
              <span>Total</span><span style={{fontFamily:"'SF Mono',ui-monospace,monospace",color:C.red}}>{fmt(egresoTotal)}</span>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function MarketingPage({coupons,orders,onRefresh}) {
  const [tab,setTab] = useState('cupones');
  const [form,setForm] = useState({code:'',discount_type:'percentage',discount_value:'',min_order_amount:'',max_uses:''});
  const [saving,setSaving] = useState(false);
  const [tplId,setTplId] = useState('promo');
  const [tplVars,setTplVars] = useState({nombre:'',descuento:'10',codigo:'',fecha:'',mesa:''});
  const [copied,setCopied] = useState(false);

  const TPLS = [
    {id:'promo',label:'Promoción',msg:'Hola {nombre}! 👋 Tenemos una promo especial para vos: {descuento}% OFF usando el código *{codigo}*. Válido hasta el {fecha}. ¡Te esperamos en La Huaca! 🍽'},
    {id:'inactive',label:'Cliente inactivo',msg:'Hola {nombre}! Hace tiempo que no te vemos 😊. Tenemos novedades en el menú. Pasate por La Huaca o pedí escaneando el QR de tu mesa. ¡Te esperamos!'},
    {id:'birthday',label:'Cumpleaños',msg:'Hola {nombre}! 🎂 El equipo de La Huaca te desea un feliz cumpleaños. Como regalo tenés {descuento}% OFF con el código *{codigo}*. ¡Celebrá con nosotros!'},
  ];
  const tpl=TPLS.find(t=>t.id===tplId);
  const preview=tpl?tpl.msg.replace(/\{(\w+)\}/g,(_,k)=>tplVars[k]||`{${k}}`):'' ;

  function copyMsg(){navigator.clipboard?.writeText(preview);setCopied(true);setTimeout(()=>setCopied(false),2000);}

  const now=Date.now();
  const inactivos=useMemo(()=>{
    const m={};
    orders.filter(o=>!['draft','cancelled'].includes(o.status)&&o.customer_name).forEach(o=>{
      const k=o.customer_name;
      if(!m[k]||o.created_at>m[k].last)m[k]={name:k,phone:o.customer_phone||null,last:o.created_at};
    });
    const cutoff=new Date(Date.now()-30*864e5).toISOString();
    return Object.values(m).filter(c=>c.last<cutoff).sort((a,b)=>a.last<b.last?-1:1);
  },[orders]);

  async function addCoupon(){
    if(!db||!form.code||!form.discount_value){toast('Completá código y valor',false);return;}
    setSaving(true);
    const{data,error}=await db.from('coupons').insert({restaurant_id:RID,code:form.code.toUpperCase().trim(),discount_type:form.discount_type,discount_value:parseInt(form.discount_value),min_order_amount:parseInt(form.min_order_amount)||0,max_uses:form.max_uses?parseInt(form.max_uses):null,is_active:true}).select('id');
    if(error){toast('Error: '+error.message,false);}
    else if(!data||data.length===0){toast('No se pudo crear el cupón — verificá RLS en Supabase',false);}
    else{toast('Cupón creado');setForm({code:'',discount_type:'percentage',discount_value:'',min_order_amount:'',max_uses:''});onRefresh();}
    setSaving(false);
  }
  async function toggleCoupon(id,current){
    const{data,error}=await db.from('coupons').update({is_active:!current}).eq('id',id).select('id');
    if(error){toast('Error: '+error.message,false);}
    else if(!data||data.length===0){toast('No se pudo actualizar el cupón — verificá RLS en Supabase',false);}
    else{toast(current?'Cupón desactivado':'Cupón activado');onRefresh();}

  return (
    <div className="page">
      <h1 style={{fontSize:22,fontWeight:800,color:'#000000',marginBottom:16}}>Marketing</h1>
      <div style={{display:'flex',gap:0,borderBottom:`1px solid ${C.border}`,marginBottom:16}}>
        {[['cupones','Cupones'],['whatsapp','WhatsApp'],['inactivos','Clientes inactivos']].map(([id,lbl])=>(
          <button key={id} onClick={()=>setTab(id)} style={{background:'none',border:'none',color:tab===id?C.ink:'#86868B',padding:'8px 14px',fontSize:12,fontWeight:tab===id?700:400,borderBottom:tab===id?'2px solid #000':'2px solid transparent',cursor:'pointer',marginBottom:-1}}>{lbl}</button>
        ))}
      </div>

      {tab==='cupones'&&(
        <div>
          <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,padding:18,marginBottom:14}}>
            <div style={{fontSize:10,color:'#6E6E73',fontWeight:700,letterSpacing:1,marginBottom:12}}>NUEVO CUPÓN / DESCUENTO</div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(140px,1fr))',gap:10,marginBottom:12}}>
              <div><Lbl>CÓDIGO *</Lbl><Inp value={form.code} onChange={e=>setForm({...form,code:e.target.value.toUpperCase()})} placeholder="PROMO20"/></div>
              <div><Lbl>TIPO</Lbl><Sel value={form.discount_type} onChange={e=>setForm({...form,discount_type:e.target.value})}><option value="percentage">% Porcentaje</option><option value="fixed">₲ Fijo</option></Sel></div>
              <div><Lbl>VALOR *</Lbl><Inp type="number" mono value={form.discount_value} onChange={e=>setForm({...form,discount_value:e.target.value})} placeholder={form.discount_type==='percentage'?'10':'5000'}/></div>
              <div><Lbl>MONTO MÍN. (₲)</Lbl><Inp type="number" mono value={form.min_order_amount} onChange={e=>setForm({...form,min_order_amount:e.target.value})} placeholder="0"/></div>
              <div><Lbl>USOS MÁX.</Lbl><Inp type="number" mono value={form.max_uses} onChange={e=>setForm({...form,max_uses:e.target.value})} placeholder="∞"/></div>
            </div>
            <Btn onClick={addCoupon} disabled={saving||!form.code||!form.discount_value}>{saving?'Creando…':'Crear cupón'}</Btn>
          </div>
          <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,overflow:'hidden'}}>
            <table style={{width:'100%',borderCollapse:'collapse'}}>
              <thead><tr style={{borderBottom:`1px solid ${C.border}`}}><Th>Código</Th><Th>Descuento</Th><Th>Tipo</Th><Th>Mín.</Th><Th>Usos</Th><Th>Estado</Th></tr></thead>
              <tbody>
                {coupons.map(c=>(
                  <tr key={c.id} style={{borderBottom:`1px solid #0d0d0d`}}>
                    <Td><span style={{fontFamily:"'SF Mono',ui-monospace,monospace",fontWeight:700}}>{c.code}</span></Td>
                    <Td><span style={{fontFamily:"'SF Mono',ui-monospace,monospace",color:C.green,fontWeight:700}}>{c.discount_type==='percentage'?`${c.discount_value}%`:fmt(c.discount_value)}</span></Td>
                    <Td dim>{c.discount_type==='percentage'?'Porcentaje':'Fijo'}</Td>
                    <Td mono dim>{c.min_order_amount>0?fmt(c.min_order_amount):'—'}</Td>
                    <Td mono>{c.used_count||0}/{c.max_uses||'∞'}</Td>
                    <Td><button onClick={()=>toggleCoupon(c.id,c.is_active)} style={{background:c.is_active?'rgba(34,197,94,0.1)':'rgba(255,255,255,0.04)',border:`1px solid ${c.is_active?'rgba(34,197,94,0.3)':C.border}`,color:c.is_active?C.green:'#86868B',padding:'3px 9px',fontSize:11,fontWeight:600,borderRadius:5}}>{c.is_active?'Activo':'Inactivo'}</button></Td>
                  </tr>
                ))}
                {coupons.length===0&&<EmptyRow cols={6} label="Sin cupones"/>}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {tab==='whatsapp'&&(
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
          <div>
            <div style={{fontSize:10,color:'#6E6E73',fontWeight:700,letterSpacing:1,marginBottom:10}}>PLANTILLA</div>
            <div style={{display:'flex',flexDirection:'column',gap:8,marginBottom:14}}>
              {TPLS.map(t=>(
                <button key={t.id} onClick={()=>setTplId(t.id)} style={{textAlign:'left',padding:'10px 14px',background:tplId===t.id?'rgba(255,255,255,0.08)':'#F5F5F7',border:`1px solid ${tplId===t.id?C.bs:C.border}`,borderRadius:8,cursor:'pointer',color:tplId===t.id?C.white:C.mid,fontSize:13,fontWeight:tplId===t.id?600:400}}>
                  {t.label}
                </button>
              ))}
            </div>
            <div style={{fontSize:10,color:'#6E6E73',fontWeight:700,letterSpacing:1,marginBottom:10}}>VARIABLES</div>
            {['nombre','descuento','codigo','fecha'].map(k=>(
              <div key={k} style={{marginBottom:8}}><Lbl>{k.toUpperCase()}</Lbl><Inp value={tplVars[k]||''} onChange={e=>setTplVars({...tplVars,[k]:e.target.value})} placeholder={k}/></div>
            ))}
          </div>
          <div>
            <div style={{fontSize:10,color:'#6E6E73',fontWeight:700,letterSpacing:1,marginBottom:10}}>PREVIEW</div>
            <div style={{background:'#0a1a12',border:'1px solid rgba(34,197,94,0.2)',borderRadius:12,padding:18,fontSize:14,lineHeight:1.6,color:'#d1fae5',minHeight:180,fontFamily:'inherit',whiteSpace:'pre-wrap',marginBottom:12}}>
              {preview}

            <Btn onClick={copyMsg} variant={copied?'primary':'secondary'}>{copied?'✓ Copiado!':'Copiar mensaje'}</Btn>

      {tab==='inactivos'&&(
        <div>
          <div style={{fontSize:12,color:'#6E6E73',marginBottom:12}}>{inactivos.length} clientes sin pedidos en los últimos 30 días</div>
          <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,overflow:'hidden'}}>
            <table style={{width:'100%',borderCollapse:'collapse'}}>
              <thead><tr style={{borderBottom:`1px solid ${C.border}`}}><Th>Cliente</Th><Th>Teléfono</Th><Th>Último pedido</Th><Th>Días inactivo</Th></tr></thead>
              <tbody>
                {inactivos.map((c,i)=>{
                  const dias=Math.floor((now-new Date(c.last).getTime())/864e5);
                  return (
                    <tr key={i} style={{borderBottom:`1px solid #0d0d0d`}}>
                      <Td>{c.name}</Td>
                      <Td dim>{c.phone||'—'}</Td>
                      <Td dim>{fmtDate(c.last)}</Td>
                      <Td><span style={{color:dias>60?C.red:C.orange,fontFamily:"'SF Mono',ui-monospace,monospace",fontWeight:700}}>{dias}d</span></Td>

                })}
                {inactivos.length===0&&<EmptyRow cols={4} label="Todos los clientes estuvieron activos recientemente"/>}
