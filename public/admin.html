function initTheme() {
  document.documentElement.setAttribute('data-theme','light');
}
function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('mesa_theme', next);
}

  const cfg = window.SUPABASE_CONFIG;
  if (!cfg?.url || !cfg?.anonKey) return null;
  const url = cfg.url.replace(/^﻿/,'').trim();
  const key = cfg.anonKey.replace(/^﻿/,'').trim();
  if (!url || url.includes('YOUR_') || !key) return null;
  try { return window.supabase.createClient(url, key); } catch(e) { return null; }

const fmtTime = d => new Date(d).toLocaleTimeString('es-PY',{hour:'2-digit',minute:'2-digit'});

const PL = {efectivo:'Efectivo',tarjeta:'Tarjeta',qr:'QR',pos:'POS'};
const EG_CATS = ['Insumos','Personal','Servicios','Alquiler','Mantenimiento','Impuestos','Otro'];

/* ── TOAST ── */
const _toast = { fn: null };
function toast(msg, ok=true) { _toast.fn?.({ msg, ok, id: Date.now() }); }
function ToastContainer() {
  const [items, setItems] = useState([]);
  useEffect(() => {
    _toast.fn = item => {
      setItems(p => [...p.slice(-4), item]);
      setTimeout(() => setItems(p => p.filter(i => i.id !== item.id)), 4000);
    };
    return () => { _toast.fn = null; };
  }, []);
  return (
    <div style={{position:'fixed',bottom:20,right:20,zIndex:9999,display:'flex',flexDirection:'column',gap:8,pointerEvents:'none'}}>

        <div key={it.id} style={{background:it.ok?'#F0FAF3':'#FFF1F0',border:`1px solid ${it.ok?'#A3D9B1':'#FFB3AD'}`,color:it.ok?'#1A7E37':'#C0190F',padding:'10px 16px',fontSize:13,fontWeight:700,borderRadius:8,animation:'slideUp 200ms ease',minWidth:220,maxWidth:320}}>
          {it.ok ? '✓ ' : '✕ '}{it.msg}
        </div>
      ))}

  );
}

function Modal({ title, onClose, children, width=420 }) {
  useEffect(() => {
    _modalOpen = true;
    const fn = e => e.key === 'Escape' && onClose();
    window.addEventListener('keydown', fn);
    return () => { _modalOpen = false; window.removeEventListener('keydown', fn); };
  }, [onClose]);
  return (
    <div onClick={e => e.target===e.currentTarget && onClose()} style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.85)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000,padding:20}}>

    </button>
  );
}
function Divider() { return <div style={{height:1,background:C.border,margin:'4px 0'}}/> }

/* ── IMAGE UPLOADER ── */
async function _compressImg(file) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const MAX = 900;
      let w = img.naturalWidth, h = img.naturalHeight;
      if (w > MAX || h > MAX) {
        if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
        else { w = Math.round(w * MAX / h); h = MAX; }
      }
      const cvs = document.createElement('canvas');
      cvs.width = w; cvs.height = h;
      cvs.getContext('2d').drawImage(img, 0, 0, w, h);
      cvs.toBlob(b => resolve(b), 'image/webp', 0.82);
    };
    img.onerror = () => resolve(null);
    img.src = URL.createObjectURL(file);
  });
}
function ImageUploader({ value, onChange, compact = false, bucket = 'menu-images' }) {
  const [drag, setDrag] = useState(false);
  const [busy, setBusy] = useState(false);
  const ref = useRef();

  async function handleFile(file) {
    if (!['image/jpeg','image/png','image/webp'].includes(file.type)) {
      toast('Formato no permitido — usá JPG, PNG o WebP', false); return;
    }
    if (file.size > 5 * 1024 * 1024) {
      toast('Archivo demasiado grande — máximo 5 MB', false); return;
    }
    if (!db) { toast('Sin Supabase — configurá config.js', false); return; }
    setBusy(true);
    try {
      const blob = await _compressImg(file);
      if (!blob) { toast('No se pudo procesar la imagen', false); setBusy(false); return; }
      const path = `${RID}/${Date.now()}_${Math.random().toString(36).slice(2)}.webp`;
      const { error } = await db.storage.from(bucket).upload(path, blob, { contentType: 'image/webp', upsert: false });
      if (error) {
        const hint = error.message.includes('Bucket not found')
          ? `Bucket "${bucket}" no existe — ejecutá la migración ${bucket==='menu-images'?'011':'015'} en Supabase`
          : error.message;
        toast('Error al subir: ' + hint, false);
      } else {
        const { data: { publicUrl } } = db.storage.from(bucket).getPublicUrl(path);
        onChange(publicUrl);
        toast('Imagen subida correctamente');
      }
    } catch(e) { toast('Error: ' + e.message, false); }
    setBusy(false);
  }

  function onDrop(e) { e.preventDefault(); setDrag(false); const f = e.dataTransfer.files[0]; if (f) handleFile(f); }

  if (compact) {
    return (
      <div style={{display:'flex',alignItems:'center',gap:6}}>
        {value
          ? <img src={value} alt="" style={{width:36,height:36,objectFit:'cover',borderRadius:5,flexShrink:0,border:`1px solid ${C.border}`}} onError={e=>{e.target.style.display='none';}}/>
          : <div style={{width:36,height:36,background:'#FFFFFF',borderRadius:5,display:'flex',alignItems:'center',justifyContent:'center',fontSize:16,flexShrink:0}}>🍽</div>}
        <div style={{display:'flex',flexDirection:'column',gap:3}}>
          <button onClick={()=>ref.current.click()} disabled={busy} style={{background:'transparent',border:`1px solid ${C.border}`,color:C.mid,padding:'2px 8px',fontSize:10,fontWeight:600,borderRadius:4,cursor:'pointer',whiteSpace:'nowrap'}}>
            {busy?'⏳':value?'Cambiar':'Subir foto'}
          </button>
          {value&&<button onClick={()=>onChange('')} style={{background:'transparent',border:'1px solid rgba(239,68,68,0.2)',color:'rgba(239,68,68,0.5)',padding:'2px 8px',fontSize:10,fontWeight:600,borderRadius:4,cursor:'pointer'}}>Quitar</button>}
        </div>
        <input ref={ref} type="file" accept=".jpg,.jpeg,.png,.webp" style={{display:'none'}} onClick={e=>e.stopPropagation()} onChange={e=>{if(e.target.files[0])handleFile(e.target.files[0]);e.target.value='';}}/>
      </div>
    );
  }

  if (value) {
    return (
      <div style={{position:'relative',width:'100%',height:150,borderRadius:8,overflow:'hidden',border:`1px solid ${C.border}`}}>
        <img src={value} alt="" style={{width:'100%',height:'100%',objectFit:'cover'}} onError={e=>{e.target.style.display='none';}}/>
        {busy&&<div style={{position:'absolute',inset:0,background:'rgba(0,0,0,0.75)',display:'flex',alignItems:'center',justifyContent:'center'}}><span className="spin"/></div>}
        <div style={{position:'absolute',bottom:0,left:0,right:0,background:'linear-gradient(transparent,rgba(0,0,0,0.88))',padding:'22px 10px 8px',display:'flex',gap:0}}>
          <button onClick={()=>ref.current.click()} disabled={busy} style={{flex:1,background:'rgba(255,255,255,0.12)',border:'1px solid rgba(255,255,255,0.18)',color:'#fff',padding:'5px 8px',fontSize:11,fontWeight:700,borderRadius:'5px 0 0 5px',cursor:'pointer'}}>Cambiar portada</button>
          <button onClick={()=>onChange('')} style={{background:'rgba(239,68,68,0.15)',border:'1px solid rgba(239,68,68,0.3)',borderLeft:'none',color:'#FF3B30',padding:'5px 8px',fontSize:11,fontWeight:700,borderRadius:'0 5px 5px 0',cursor:'pointer'}}>Eliminar foto</button>
        </div>
        <input ref={ref} type="file" accept=".jpg,.jpeg,.png,.webp" style={{display:'none'}} onClick={e=>e.stopPropagation()} onChange={e=>{if(e.target.files[0])handleFile(e.target.files[0]);e.target.value='';}}/>
      </div>
    );
  }

  return (
    <div
      onDragOver={e=>{e.preventDefault();setDrag(true)}}
      onDragLeave={()=>setDrag(false)}
      onDrop={onDrop}
      onClick={()=>ref.current.click()}
      style={{border:`2px dashed ${drag?'#6E6E73':'#D2D2D7'}`,borderRadius:8,padding:'26px 16px',textAlign:'center',cursor:'pointer',background:drag?'rgba(255,255,255,0.04)':'transparent',transition:'border-color .15s,background .15s',userSelect:'none'}}>
      {busy
        ? <><span className="spin"/><div style={{fontSize:12,color:'#6E6E73',marginTop:10}}>Comprimiendo y subiendo…</div></>
        : <>
          <div style={{fontSize:28,marginBottom:6}}>🖼</div>
          <div style={{fontSize:12,color:'#6E6E73'}}>Arrastrá una imagen o hacé clic para subir</div>
          <div style={{fontSize:10,color:'#D2D2D7',marginTop:4}}>JPG · PNG · WebP · máx 5 MB · se comprime automáticamente</div>
        </>}
      <input ref={ref} type="file" accept=".jpg,.jpeg,.png,.webp" style={{display:'none'}} onClick={e=>e.stopPropagation()} onChange={e=>{if(e.target.files[0])handleFile(e.target.files[0]);e.target.value='';}}/>
    </div>
  );
}

function DashboardPage({orders, ratings, setPage}) {
  const [todayItems, setTodayItems] = useState([]);
  const now = new Date();
  const todayStr = now.toDateString();
  const ayer = new Date(now); ayer.setDate(ayer.getDate()-1);
  const ayerStr = ayer.toDateString();
  const nowHour = now.getHours();

  const valid = o => !['draft','cancelled'].includes(o.status);
  const todayOrds = orders.filter(o => new Date(o.created_at).toDateString()===todayStr && valid(o));
  const ayerOrds  = orders.filter(o => new Date(o.created_at).toDateString()===ayerStr  && valid(o));

  const ventasHoy  = todayOrds.reduce((s,o)=>s+(o.total||0),0);
  const ventasAyer = ayerOrds.reduce((s,o)=>s+(o.total||0),0);
  const pedidosHoy  = todayOrds.length;
  const pedidosAyer = ayerOrds.length;
  const ticketHoy   = pedidosHoy  ? Math.round(ventasHoy/pedidosHoy)   : 0;
  const ticketAyer  = pedidosAyer ? Math.round(ventasAyer/pedidosAyer) : 0;

  const mesaCount = {}; todayOrds.forEach(o=>{if(o.table_number)mesaCount[o.table_number]=(mesaCount[o.table_number]||0)+1;});
  const mesaActiva = Object.entries(mesaCount).sort((a,b)=>b[1]-a[1])[0];
  const mesaCountAyer = {}; ayerOrds.forEach(o=>{if(o.table_number)mesaCountAyer[o.table_number]=(mesaCountAyer[o.table_number]||0)+1;});
  const mesaActivaAyer = Object.entries(mesaCountAyer).sort((a,b)=>b[1]-a[1])[0];

  const pctDelta = (hoy,ayer) => (ayer>0 ? Math.round((hoy-ayer)/ayer*100) : null);
  const Delta = ({val,ayer}) => {
    const pct = pctDelta(val,ayer);
    if(pct===null) return <span style={{fontSize:11,color:'#86868B'}}>sin datos ayer</span>;
    const up = pct>=0;
    return <span style={{fontSize:11,fontWeight:700,color:up?'#34C759':'#FF3B30'}}>{up?'↑':'↓'} {Math.abs(pct)}% vs ayer</span>;
  };

  // Gráfico por hora — de 6am a hora actual
  const hourlyRev = Array(24).fill(0);
  todayOrds.forEach(o=>{ hourlyRev[new Date(o.created_at).getHours()]+=(o.total||0); });
  const startH = 6; const endH = Math.max(nowHour, startH);
  const hourSlice = hourlyRev.slice(startH, endH+1);
  const maxHourRev = Math.max(...hourSlice, 1);

  // Top 5 productos
  const prodTotals = {};
  todayItems.forEach(it=>{
    const k = it.item_name||'—';
    if(!prodTotals[k]) prodTotals[k]={name:k,qty:0,total:0};
    prodTotals[k].qty+=(it.quantity||1); prodTotals[k].total+=(it.total_price||0);
  });
  const top5 = Object.values(prodTotals).sort((a,b)=>b.qty-a.qty).slice(0,5);

  useEffect(()=>{
    if(!db||!todayOrds.length) return;
    const ids = todayOrds.map(o=>o.id).slice(0,150);
    db.from('order_items').select('order_id,item_name,quantity,total_price').in('order_id',ids)
      .then(({data})=>setTodayItems(data||[]));
  },[orders]);

  useEffect(()=>{
    if(!db) return;
    const ch = db.channel('dash-rt')
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'orders',filter:`restaurant_id=eq.${RID}`},()=>{})
      .subscribe();
    const poll = setInterval(()=>{}, 30000);
    return ()=>{ db.removeChannel(ch); clearInterval(poll); };
  },[]);

  return (
    <div className="page">
      <div style={{marginBottom:20}}>
        <h1 style={{fontSize:22,fontWeight:800,color:'#000000'}}>Dashboard</h1>
        <div style={{fontSize:12,color:'#6E6E73',marginTop:3}}>{now.toLocaleDateString('es-PY',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div>
      </div>

      {/* 4 KPIs principales */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12,marginBottom:20}}>
        <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,padding:'18px 20px',cursor:'pointer'}} onClick={()=>setPage('pedidos')}>
          <div style={{fontSize:12,color:'#6E6E73',fontWeight:500,marginBottom:8}}>Ventas hoy</div>
          <div style={{fontSize:28,fontWeight:800,color:'#000000',lineHeight:1,letterSpacing:'-0.5px'}}>{fmt(ventasHoy)}</div>
          <div style={{marginTop:6}}><Delta val={ventasHoy} ayer={ventasAyer}/></div>
        </div>
        <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,padding:'18px 20px',cursor:'pointer'}} onClick={()=>setPage('pedidos')}>
          <div style={{fontSize:12,color:'#6E6E73',fontWeight:500,marginBottom:8}}>Pedidos hoy</div>
          <div style={{fontSize:28,fontWeight:800,color:'#000000',lineHeight:1,letterSpacing:'-0.5px'}}>{pedidosHoy}</div>
          <div style={{marginTop:6}}><Delta val={pedidosHoy} ayer={pedidosAyer}/></div>
        </div>
        <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,padding:'18px 20px'}}>
          <div style={{fontSize:12,color:'#6E6E73',fontWeight:500,marginBottom:8}}>Ticket promedio</div>
          <div style={{fontSize:28,fontWeight:800,color:'#000000',lineHeight:1,letterSpacing:'-0.5px'}}>{pedidosHoy>0?fmt(ticketHoy):'—'}</div>
          <div style={{marginTop:6}}>{ticketAyer>0?<Delta val={ticketHoy} ayer={ticketAyer}/>:<span style={{fontSize:11,color:'#86868B'}}>sin datos ayer</span>}</div>
        </div>
        <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,padding:'18px 20px'}}>
          <div style={{fontSize:12,color:'#6E6E73',fontWeight:500,marginBottom:8}}>Mesa más activa</div>
          <div style={{fontSize:28,fontWeight:800,color:'#000000',lineHeight:1,letterSpacing:'-0.5px'}}>{mesaActiva?`Mesa ${mesaActiva[0]}`:'—'}</div>
          <div style={{marginTop:6,fontSize:11,color:'#86868B'}}>{mesaActiva?`${mesaActiva[1]} pedidos hoy`:mesaActivaAyer?`ayer: Mesa ${mesaActivaAyer[0]}`:''}</div>
        </div>
      </div>

      {/* Gráfico barras por hora + Top 5 */}
      <div style={{display:'grid',gridTemplateColumns:'2fr 1fr',gap:14,marginBottom:20}}>
        <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,padding:20}}>
          <div style={{fontSize:10,color:'#6E6E73',fontWeight:700,letterSpacing:1,marginBottom:16}}>VENTAS POR HORA — HOY ({startH}hs al momento)</div>
          <div style={{display:'flex',alignItems:'flex-end',gap:3,height:100}}>
            {hourSlice.map((rev,i)=>{
              const h = startH+i;
              const isNow = h===nowHour;
              const barH = rev>0?Math.max(Math.round((rev/maxHourRev)*88),4):0;
              return (
                <div key={h} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:2}}>
                  {rev>0?<div style={{fontSize:8,color:'#86868B',fontFamily:"'SF Mono',ui-monospace,monospace",textAlign:'center',whiteSpace:'nowrap'}}>{fmtK(rev)}</div>
                        :<div style={{height:12}}/>}
                  <div style={{width:'100%',height:`${barH}px`,background:isNow?'#000000':'#D2D2D7',borderRadius:'3px 3px 0 0',transition:'height .3s'}}/>
                  <div style={{fontSize:8,color:isNow?'#000':'#6E6E73',fontWeight:isNow?700:400,whiteSpace:'nowrap'}}>{h}hs</div>
                </div>
              );
            })}
          </div>
        </div>
        <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,padding:20}}>
          <div style={{fontSize:10,color:'#6E6E73',fontWeight:700,letterSpacing:1,marginBottom:14}}>TOP 5 PRODUCTOS — HOY</div>
          {top5.length===0
            ?<div style={{color:'#D2D2D7',fontSize:12,textAlign:'center',paddingTop:20}}>Sin ventas hoy</div>
            :top5.map((p,i)=>(
              <div key={i} style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:12,fontWeight:600,color:'#1D1D1F',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p.name}</div>
                  <div style={{fontSize:10,color:'#86868B'}}>{fmt(p.total)}</div>
                </div>
                <div style={{fontFamily:"'SF Mono',ui-monospace,monospace",fontSize:18,fontWeight:800,color:'#000',marginLeft:12}}>{p.qty}</div>
              </div>
            ))
          }
        </div>
      </div>

      {/* Pedidos recientes */}
      <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,overflow:'hidden'}}>
        <div style={{padding:'12px 16px',borderBottom:`1px solid ${C.border}`,fontSize:10,fontWeight:700,color:'#6E6E73',letterSpacing:1,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          PEDIDOS RECIENTES
          <button onClick={()=>setPage('pedidos')} style={{background:'none',border:'none',color:'#86868B',fontSize:11,cursor:'pointer'}}>Ver todos →</button>
        </div>
        <table style={{width:'100%',borderCollapse:'collapse'}}>
          <thead><tr style={{borderBottom:`1px solid ${C.border}`}}><Th>#</Th><Th>Mesa</Th><Th>Estado</Th><Th right>Total</Th><Th>Hora</Th></tr></thead>
          <tbody>
            {orders.slice(0,8).map(o=>(
              <tr key={o.id} style={{borderBottom:`1px solid #F0F0F0`}}>
                <Td mono dim>{o.order_number}</Td>
                <Td>{mesaLabel(o)}</Td>
                <Td><Badge status={o.status}/></Td>
                <Td mono right>{fmt(o.total)}</Td>
                <Td mono dim>{fmtTime(o.created_at)}</Td>
              </tr>
            ))}
            {orders.length===0&&<EmptyRow cols={5} label="No hay pedidos"/>}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════
   PEDIDOS
══════════════════════════════════════════════ */
function PedidosPage({orders, tables, onRefresh}) {
  const [filter,setFilter]     = useState('all');
  const [mesaF,setMesaF]       = useState('all');
  const [period,setPeriod]     = useState('hoy');
  const [dateFrom,setDateFrom] = useState('');
  const [dateTo,setDateTo]     = useState('');
  const [search,setSearch]     = useState('');
  const [selected,setSelected] = useState(null);
  const [items,setItems]       = useState([]);
  const [loadingItems,setLoadingItems] = useState(false);
  const [upd,setUpd]           = useState(false);
  const [newBadge,setNewBadge] = useState(0);

  const FILTERS = [
    {id:'all',label:'Todos'},
    {id:'pending',label:'Pendientes'},
    {id:'kitchen',label:'En cocina'},
    {id:'ready',label:'Listos'},
    {id:'paid_done',label:'Cobrados'},
    {id:'cancelled',label:'Cancelados'},
  ];

  const filtered = useMemo(()=>{
    let res = [...orders];
    // período
    const now = new Date();
    if(period==='hoy'){const d=now.toDateString();res=res.filter(o=>new Date(o.created_at).toDateString()===d);}
    else if(period==='7d'){const s=new Date();s.setDate(s.getDate()-6);s.setHours(0,0,0,0);res=res.filter(o=>new Date(o.created_at)>=s);}
    else if(period==='30d'){const s=new Date();s.setDate(s.getDate()-29);s.setHours(0,0,0,0);res=res.filter(o=>new Date(o.created_at)>=s);}
    else if(period==='custom'&&dateFrom){
      const s=new Date(dateFrom); const e=dateTo?new Date(dateTo+'T23:59:59'):new Date();
      res=res.filter(o=>{const d=new Date(o.created_at);return d>=s&&d<=e;});
    }
    // filtro estado
    if(filter==='pending') res=res.filter(o=>['draft','confirmed'].includes(o.status));
    else if(filter==='kitchen') res=res.filter(o=>['paid','kitchen_received','cooking'].includes(o.status));
    else if(filter==='ready') res=res.filter(o=>o.status==='ready');
    else if(filter==='paid_done') res=res.filter(o=>o.status==='delivered');
    else if(filter==='cancelled') res=res.filter(o=>o.status==='cancelled');
    // filtro mesa
    if(mesaF!=='all') res=res.filter(o=>String(o.table_number)===mesaF);
    // búsqueda
    if(search.trim()) res=res.filter(o=>(o.order_number||'').toLowerCase().includes(search.toLowerCase()));
    return res;
  },[orders,filter,mesaF,period,dateFrom,dateTo,search]);

  // Realtime
  useEffect(()=>{
    if(!db) return;
    const ch = db.channel('pedidos-rt')
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'orders',filter:`restaurant_id=eq.${RID}`},()=>{ setNewBadge(n=>n+1); if(!_modalOpen) onRefresh(); })
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'orders',filter:`restaurant_id=eq.${RID}`},()=>{ if(!_modalOpen) onRefresh(); })
      .subscribe();
    const poll = setInterval(()=>{ if(_modalOpen) return; onRefresh(); }, 30000);
    return ()=>{ db.removeChannel(ch); clearInterval(poll); };
  },[]);

  function exportExcel() {
    const rows = filtered.map(o=>({
      'N° orden': o.order_number||'',
      'Mesa': mesaLabel(o),
      'Estado': SL[o.status]||o.status,
      'Productos': o.items_count||0,
      'Total (₲)': o.total||0,
      'Método pago': PL[o.payment_method]||o.payment_method||'',
      'Fecha': fmtDT(o.created_at),
    }));
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Pedidos');
    XLSX.writeFile(wb, `pedidos_${new Date().toISOString().slice(0,10)}.xlsx`);
  }

  async function selectOrder(o) {
    setSelected(o); setItems([]);
    if(!db) return;
    setLoadingItems(true);
    const{data}=await db.from('order_items').select('item_name,quantity,unit_price,total_price,observations').eq('order_id',o.id);
    setItems(data||[]); setLoadingItems(false);
  }
  async function updateStatus(orderId,newStatus) {
    if(!db) return; setUpd(true);
    const{data,error}=await db.from('orders').update({status:newStatus,...(newStatus==='delivered'?{completed_at:new Date().toISOString()}:{})}).eq('id',orderId).select('id');
    if(error){toast('Error: '+error.message,false);}
    else if(!data||data.length===0){toast('No se pudo actualizar el estado — verificá RLS en Supabase',false);}
    else{toast('Estado actualizado');setSelected(s=>s?.id===orderId?{...s,status:newStatus}:s);onRefresh();}
    setUpd(false);
  }

  const tablaNums = [...new Set(orders.map(o=>o.table_number).filter(Boolean))].sort((a,b)=>a-b);

  return (
    <div className="page">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <h1 style={{fontSize:22,fontWeight:800,color:'#000000'}}>Pedidos</h1>
          {newBadge>0&&<span style={{background:'#FF3B30',color:'#fff',fontSize:10,fontWeight:800,padding:'2px 7px',borderRadius:10}}>{newBadge} nuevos</span>}
        </div>
        <div style={{display:'flex',gap:8}}>
          <Btn onClick={exportExcel} variant="secondary" small>Exportar Excel</Btn>
          <Btn onClick={()=>{onRefresh();setNewBadge(0);}} variant="secondary">↺ Actualizar</Btn>
        </div>
      </div>

      {/* Filtros de estado */}
      <div style={{display:'flex',gap:0,borderBottom:`1px solid ${C.border}`,marginBottom:0,flexWrap:'wrap'}}>
        {FILTERS.map(f=>(
          <button key={f.id} onClick={()=>setFilter(f.id)} style={{background:'none',border:'none',color:filter===f.id?C.ink:'#86868B',padding:'8px 13px',fontSize:12,fontWeight:filter===f.id?700:400,borderBottom:filter===f.id?'2px solid #000':'2px solid transparent',cursor:'pointer',marginBottom:-1}}>
            {f.label}
          </button>
        ))}
      </div>

      {/* Barra filtros secundaria */}
      <div style={{display:'flex',gap:8,padding:'10px 0',flexWrap:'wrap',alignItems:'center'}}>
        <select value={mesaF} onChange={e=>setMesaF(e.target.value)} style={{padding:'5px 9px',fontSize:12,borderRadius:6,border:`1px solid ${C.border}`,background:'#fff',color:'#1D1D1F'}}>
          <option value="all">Todas las mesas</option>
          {tablaNums.map(n=><option key={n} value={String(n)}>Mesa {n}</option>)}
        </select>
        <div style={{display:'flex',gap:0,border:`1px solid ${C.border}`,borderRadius:6,overflow:'hidden'}}>
          {['hoy','7d','30d','custom'].map((p,i,a)=>(
            <button key={p} onClick={()=>setPeriod(p)} style={{padding:'5px 10px',fontSize:11,fontWeight:period===p?700:400,background:period===p?'#000':'#fff',color:period===p?'#fff':'#6E6E73',border:'none',cursor:'pointer',borderRight:i<a.length-1?`1px solid ${C.border}`:'none'}}>
              {p==='hoy'?'Hoy':p==='7d'?'7 días':p==='30d'?'30 días':'Custom'}
            </button>
          ))}
        </div>
        {period==='custom'&&(
          <div style={{display:'flex',gap:4,alignItems:'center'}}>
            <input type="date" value={dateFrom} onChange={e=>setDateFrom(e.target.value)} style={{padding:'4px 8px',fontSize:11,borderRadius:5,border:`1px solid ${C.border}`}}/>
            <span style={{fontSize:11,color:'#86868B'}}>–</span>
            <input type="date" value={dateTo} onChange={e=>setDateTo(e.target.value)} style={{padding:'4px 8px',fontSize:11,borderRadius:5,border:`1px solid ${C.border}`}}/>
          </div>
        )}
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Buscar N° orden…" style={{padding:'5px 9px',fontSize:12,borderRadius:6,border:`1px solid ${C.border}`,width:160}}/>
        <span style={{fontSize:11,color:'#86868B',marginLeft:'auto'}}>{filtered.length} pedido{filtered.length!==1?'s':''}</span>
      </div>

      <div style={{display:'flex',gap:12,minHeight:400}}>
        <div style={{flex:1,background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,overflow:'auto'}}>
          <table style={{width:'100%',borderCollapse:'collapse'}}>
            <thead><tr style={{borderBottom:`1px solid ${C.border}`}}><Th>#</Th><Th>Mesa</Th><Th>Estado</Th><Th>Items</Th><Th right>Total</Th><Th>Pago</Th><Th>Fecha</Th></tr></thead>
            <tbody>
              {filtered.map(o=>(
                <tr key={o.id} onClick={()=>{selectOrder(o);setNewBadge(0);}} style={{borderBottom:`1px solid #F0F0F0`,cursor:'pointer',background:selected?.id===o.id?'#F5F5F7':'transparent'}}>
                  <Td mono dim>{o.order_number}</Td>
                  <Td>{mesaLabel(o)}</Td>
                  <Td><Badge status={o.status}/></Td>
                  <Td dim>{o.items_count||0}</Td>
                  <Td mono right>{fmt(o.total)}</Td>
                  <Td dim>{PL[o.payment_method]||'—'}</Td>
                  <Td mono dim>{fmtDT(o.created_at)}</Td>
                </tr>
              ))}
              {filtered.length===0&&<EmptyRow cols={7} label="Sin pedidos"/>}
            </tbody>
          </table>
        </div>
        {selected&&(
          <div style={{width:280,background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,flexShrink:0,display:'flex',flexDirection:'column',overflow:'hidden'}}>
            <div style={{padding:'13px 16px',borderBottom:`1px solid ${C.border}`,display:'flex',justifyContent:'space-between'}}>
              <div><div style={{fontFamily:"'SF Mono',ui-monospace,monospace",fontSize:14,fontWeight:700}}>{selected.order_number}</div><div style={{fontSize:10,color:'#86868B',marginTop:2}}>{fmtDT(selected.created_at)}</div></div>
              <button onClick={()=>{setSelected(null);setItems([]);}} style={{background:'none',border:'none',color:'#86868B',fontSize:20,lineHeight:1,padding:0}}>×</button>
            </div>
            <div style={{padding:'8px 16px',borderBottom:`1px solid ${C.border}`,display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>
              <Badge status={selected.status}/>
              <span style={{fontSize:12,color:'#6E6E73'}}>{mesaLabel(selected)}</span>
            </div>
            <div style={{flex:1,padding:'8px 16px',overflowY:'auto',borderBottom:`1px solid ${C.border}`}}>
              {loadingItems&&<span className="spin"/>}
              {items.map((it,i)=>(
                <div key={i} style={{borderBottom:`1px solid #0d0d0d`,padding:'6px 0'}}>
                  <div style={{display:'flex',justifyContent:'space-between',fontSize:13}}><span>{it.quantity}× {it.item_name}</span><span style={{fontFamily:"'SF Mono',ui-monospace,monospace",color:'#6E6E73',marginLeft:6}}>{fmt(it.total_price)}</span></div>
                  {it.observations&&<div style={{fontSize:11,color:'#6E6E73',marginTop:2}}>→ {it.observations}</div>}
                </div>
              ))}
            </div>
            <div style={{padding:'8px 16px',borderBottom:`1px solid ${C.border}`}}>
              {selected.discount_amount>0&&<div style={{display:'flex',justifyContent:'space-between',fontSize:12,marginBottom:4,color:C.green}}><span>Descuento</span><span style={{fontFamily:"'SF Mono',ui-monospace,monospace"}}>-{fmt(selected.discount_amount)}</span></div>}
              <div style={{display:'flex',justifyContent:'space-between',fontWeight:700,fontSize:14}}><span>Total</span><span style={{fontFamily:"'SF Mono',ui-monospace,monospace"}}>{fmt(selected.total)}</span></div>
            </div>
            <div style={{padding:'12px 16px',display:'flex',flexDirection:'column',gap:7}}>
              {selected.status==='paid'&&<Btn onClick={()=>updateStatus(selected.id,'cooking')} disabled={upd}>→ Iniciar preparación</Btn>}
              {selected.status==='cooking'&&<Btn onClick={()=>updateStatus(selected.id,'ready')} disabled={upd}>✓ Marcar listo</Btn>}
              {selected.status==='ready'&&<Btn onClick={()=>updateStatus(selected.id,'delivered')} disabled={upd}>✓ Entregar</Btn>}
              {!['delivered','cancelled'].includes(selected.status)&&<Btn variant="danger" onClick={()=>{if(confirm(`¿Cancelar ${selected.order_number}?`))updateStatus(selected.id,'cancelled');}} disabled={upd}>✕ Cancelar</Btn>}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════
   MENÚ
══════════════════════════════════════════════ */
/* ══════════════════════════════════════════════
   ITEM MODAL — crear / editar producto del menú
══════════════════════════════════════════════ */
const PROMO_TYPES = [
  {value:'',            label:'Sin tipo de promo'},
  {value:'pizza_corrida',    label:'Pizza corrida'},
  {value:'hamburgesa_corrida',label:'Hamburguesa corrida'},
  {value:'tenedor_libre',    label:'Tenedor libre'},
  {value:'sushi_libre',      label:'Sushi libre'},
  {value:'bebida_libre',     label:'Bebida libre'},
  {value:'other',            label:'Otra promo especial'},
];
const PROMO_LABEL = Object.fromEntries(PROMO_TYPES.map(p=>[p.value,p.label]));

function ItemModal({item, categories, onClose, onSaved}) {
  const isNew = !item;
  const [form, setForm] = useState({
    name:          item?.name          ?? '',
    description:   item?.description   ?? '',
    price_guarani: item?.price_guarani  ?? '',
    discount_pct:  item?.discount_pct   ?? 0,
    category_id:   item?.category_id   ?? '',
    is_available:  item?.is_available   ?? true,
    promo_type:    item?.promo_type     ?? '',
    promo_tag:     item?.promo_tag      ?? '',
    dine_in_only:  item?.dine_in_only   ?? false,
    image_url:     item?.image_url      ?? '',
    stock_min:     item?.stock_min      ?? 0,
  });
  const [extras, setExtras]         = useState([]);
  const [extrasReady, setExtrasReady] = useState(isNew);
  const [saving, setSaving]         = useState(false);

  const f = (k,v) => setForm(p=>({...p,[k]:v}));

  useEffect(()=>{
    if(!isNew && db){
      db.from('menu_item_extras').select('*').eq('item_id',item.id).order('id')
        .then(({data})=>{ setExtras(data||[]); setExtrasReady(true); });
    }
  },[]);

  const addExtra    = () => setExtras(p=>[...p,{id:null,name:'',price_guarani:0,is_active:true}]);
  const removeExtra = i  => setExtras(p=>p.filter((_,j)=>j!==i));
  const updExtra    = (i,k,v) => setExtras(p=>p.map((e,j)=>j===i?{...e,[k]:v}:e));

  const finalPrice = () => {
    const p = parseInt(form.price_guarani)||0;
    const d = parseInt(form.discount_pct)||0;
    return d>0 ? Math.round(p*(100-d)/100) : p;
  };

  async function save() {
    if(!form.name.trim()||!form.price_guarani||!form.category_id){
      toast('Completá nombre, precio y categoría',false); return;
    }
    setSaving(true);
    const payload = {
      name:          form.name.trim(),
      description:   form.description||null,
      price_guarani: parseInt(form.price_guarani),
      discount_pct:  parseInt(form.discount_pct)||0,
      category_id:   form.category_id,
      restaurant_id: RID,
      is_available:  form.is_available,
      promo_type:    form.promo_type||null,
      promo_tag:     form.promo_tag||null,
      dine_in_only:  form.dine_in_only,
      image_url:     form.image_url||null,
      stock_min:     parseInt(form.stock_min)||0,
    };
    let itemId = item?.id;
    if(isNew){
      const{data:mx}=await db.from('menu_items').select('id').order('id',{ascending:false}).limit(1);
      const nextId=(mx&&mx.length>0?mx[0].id:0)+1;
      const{data,error}=await db.from('menu_items').insert({id:nextId,...payload}).select('id');
      if(error||!data?.length){toast('Error: '+(error?.message||'verificá RLS'),false);setSaving(false);return;}
      itemId=data[0].id;
    } else {
      const{data,error}=await db.from('menu_items').update(payload).eq('id',item.id).select('id');
      if(error||!data?.length){toast('Error: '+(error?.message||'verificá RLS'),false);setSaving(false);return;}
      await db.from('menu_item_extras').delete().eq('item_id',item.id);
    }
    const validExtras = extras.filter(e=>e.name.trim());
    if(validExtras.length>0){
      await db.from('menu_item_extras').insert(
        validExtras.map(e=>({item_id:itemId,name:e.name.trim(),price_guarani:parseInt(e.price_guarani)||0,is_active:e.is_active!==false}))
      );
    }
    toast(isNew?'Producto creado — ya visible en la app':'Cambios guardados');
    setSaving(false);
    onSaved();
    onClose();
  }

  const disc = parseInt(form.discount_pct)||0;
  const baseP = parseInt(form.price_guarani)||0;

  return (
    <Modal title={isNew?'Nuevo producto':`Editar: ${item.name}`} onClose={onClose} width={650}>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>

        {/* Imagen */}
        <div style={{gridColumn:'1/-1'}}>
          <Lbl>IMAGEN DEL PRODUCTO</Lbl>
          <ImageUploader value={form.image_url} onChange={url=>f('image_url',url)}/>
        </div>

        {/* Nombre */}
        <div>
          <Lbl>NOMBRE *</Lbl>
          <Inp value={form.name} onChange={e=>f('name',e.target.value)} placeholder="Lomito completo"/>
        </div>

        {/* Categoría */}
        <div>
          <Lbl>CATEGORÍA *</Lbl>
          <Sel value={form.category_id} onChange={e=>f('category_id',e.target.value)}>
            <option value="">Seleccionar…</option>
            {categories.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
          </Sel>
        </div>

        {/* Precio */}
        <div>
          <Lbl>PRECIO (₲) *</Lbl>
          <Inp type="number" mono value={form.price_guarani} onChange={e=>f('price_guarani',e.target.value)} placeholder="75000"/>
        </div>

        {/* Descuento */}
        <div>
          <Lbl>DESCUENTO (%)</Lbl>
          <Inp type="number" mono value={form.discount_pct} onChange={e=>f('discount_pct',e.target.value)} placeholder="0" min="0" max="100"/>
          {disc>0&&baseP>0&&(
            <div style={{fontSize:11,marginTop:4,display:'flex',gap:8,alignItems:'center'}}>
              <span style={{color:'#86868B',textDecoration:'line-through'}}>{fmt(baseP)}</span>
              <span style={{color:'#34C759',fontWeight:700}}>{fmt(finalPrice())}</span>
              <span style={{color:'#34C759'}}>−{disc}%</span>
            </div>
          )}
        </div>

        {/* Tipo de promo */}
        <div>
          <Lbl>TIPO DE PROMO</Lbl>
          <Sel value={form.promo_type} onChange={e=>f('promo_type',e.target.value)}>
            {PROMO_TYPES.map(p=><option key={p.value} value={p.value}>{p.label}</option>)}
          </Sel>
          {form.promo_type&&<div style={{fontSize:11,color:'#8A4B00',marginTop:4,background:'#FFF4E0',padding:'3px 8px',borderRadius:4,display:'inline-block'}}>{PROMO_LABEL[form.promo_type]}</div>}
        </div>

        {/* Badge / etiqueta libre */}
        <div>
          <Lbl>BADGE / ETIQUETA</Lbl>
          <Inp value={form.promo_tag} onChange={e=>f('promo_tag',e.target.value)} placeholder="2×1, Chef ★, Nuevo…"/>
        </div>

        {/* Stock mínimo */}
        <div>
          <Lbl>STOCK MÍNIMO</Lbl>
          <Inp type="number" mono value={form.stock_min} onChange={e=>f('stock_min',e.target.value)} placeholder="0"/>
        </div>

        {/* Checkboxes */}
        <div style={{display:'flex',flexDirection:'column',gap:10,justifyContent:'flex-end',paddingBottom:2}}>
          <label style={{display:'flex',alignItems:'center',gap:8,fontSize:13,cursor:'pointer'}}>
            <input type="checkbox" checked={form.is_available} onChange={e=>f('is_available',e.target.checked)}/>
            Disponible en carta
          </label>
          <label style={{display:'flex',alignItems:'center',gap:8,fontSize:13,cursor:'pointer'}}>
            <input type="checkbox" checked={form.dine_in_only} onChange={e=>f('dine_in_only',e.target.checked)}/>
            Solo consumo en local
          </label>
        </div>

        {/* Descripción */}
        <div style={{gridColumn:'1/-1'}}>
          <Lbl>DESCRIPCIÓN</Lbl>
          <textarea value={form.description||''} onChange={e=>f('description',e.target.value)} rows={2}
            style={{width:'100%',padding:'8px 10px',fontSize:13,resize:'vertical',background:'#fff',border:'1px solid #D2D2D7',color:'#1D1D1F',borderRadius:6,boxSizing:'border-box'}}/>
        </div>

        {/* Extras */}
        <div style={{gridColumn:'1/-1',borderTop:`1px solid ${C.border}`,paddingTop:14}}>
          <Lbl>EXTRAS E INGREDIENTES ADICIONALES</Lbl>
          {!extrasReady&&<div style={{color:'#86868B',fontSize:12,padding:'4px 0 10px'}}>Cargando extras…</div>}
          {extrasReady&&(<>
            {extras.map((e,i)=>(
              <div key={i} style={{display:'grid',gridTemplateColumns:'1fr 140px 76px 32px',gap:8,alignItems:'center',marginBottom:7}}>
                <Inp value={e.name} onChange={ev=>updExtra(i,'name',ev.target.value)} placeholder="Ej: Queso extra, Picante, Sin cebolla"/>
                <div style={{display:'flex',alignItems:'center',gap:4}}>
                  <span style={{fontSize:11,color:'#6E6E73',flexShrink:0}}>₲</span>
                  <Inp type="number" mono value={e.price_guarani} onChange={ev=>updExtra(i,'price_guarani',ev.target.value)} placeholder="0"/>
                </div>
                <button onClick={()=>updExtra(i,'is_active',!e.is_active)}
                  style={{padding:'5px 6px',fontSize:11,fontWeight:600,borderRadius:5,cursor:'pointer',border:`1px solid ${e.is_active?'rgba(52,199,89,0.3)':'rgba(142,142,147,0.3)'}`,background:e.is_active?'rgba(52,199,89,0.1)':'transparent',color:e.is_active?'#34C759':'#86868B'}}>
                  {e.is_active?'Activo':'Inact.'}
                </button>
                <button onClick={()=>removeExtra(i)} style={{background:'none',border:'none',color:'#FF3B30',fontSize:20,cursor:'pointer',padding:0,lineHeight:1}}>×</button>
              </div>
            ))}
            {extras.length===0&&<div style={{color:'#D2D2D7',fontSize:12,padding:'4px 0 10px'}}>Sin extras — agregá el primero abajo</div>}
            <Btn variant="secondary" small onClick={addExtra}>+ Agregar extra</Btn>
          </>)}
        </div>

      </div>
      <div style={{display:'flex',gap:8,marginTop:20}}>
        <Btn onClick={save} disabled={saving}>{saving?'Guardando…':(isNew?'Crear producto':'Guardar cambios')}</Btn>
        <Btn variant="ghost" onClick={onClose}>Cancelar</Btn>
      </div>
    </Modal>
  );
}

/* ══════════════════════════════════════════════
   MENU PAGE
══════════════════════════════════════════════ */
function MenuPage({categories,menuItems,onRefresh}) {
  const [menuTab,setMenuTab]     = useState('productos');
  const [catFilter,setCatFilter] = useState('all');
  const [itemModal,setItemModal] = useState(null); // null | {item: null|object}
  const [previewItem,setPreviewItem] = useState(null);
  const [newCat,setNewCat]       = useState('');
  const [dragOver,setDragOver]   = useState(null);
  const dragItem = useRef(null);
  const [allExtras,setAllExtras]       = useState([]);
  const [extrasLoading,setExtrasLoading] = useState(false);

  const visible = catFilter==='all'?menuItems:menuItems.filter(i=>i.category_id===catFilter);
  const catName = id => categories.find(c=>c.id===id)?.name||'—';
  const itemName = id => menuItems.find(i=>i.id===id)?.name||'—';

  async function loadAllExtras() {
    if(!db||!menuItems.length) return;
    setExtrasLoading(true);
    const ids = menuItems.map(i=>i.id);
    const {data} = await db.from('menu_item_extras').select('*').in('item_id',ids).order('item_id').order('id');
    setAllExtras(data||[]);
    setExtrasLoading(false);
  }
  useEffect(()=>{ if(menuTab==='extras') loadAllExtras(); },[menuTab,menuItems]);

  async function toggleExtraActive(ext) {
    if(!db) return;
    const {error} = await db.from('menu_item_extras').update({is_active:!ext.is_active}).eq('id',ext.id);
    if(error){toast('Error: '+error.message,false);return;}
    setAllExtras(p=>p.map(e=>e.id===ext.id?{...e,is_active:!e.is_active}:e));
  }

  useEffect(()=>{
    if(!db) return;
    const ch = db.channel('menu-rt')
      .on('postgres_changes',{event:'*',schema:'public',table:'menu_items',filter:`restaurant_id=eq.${RID}`},()=>{ if(!_modalOpen) onRefresh(); })
      .subscribe();
    const poll = setInterval(()=>{ if(_modalOpen) return; onRefresh(); }, 30000);
    return ()=>{ db.removeChannel(ch); clearInterval(poll); };
  },[]);

  function onDragStart(item) { dragItem.current = item; }
  async function onDrop(targetItem) {
    if(!dragItem.current||!db||dragItem.current.id===targetItem.id) return;
    const from = dragItem.current; const to = targetItem;
    await Promise.all([
      db.from('menu_items').update({sort_order:to.sort_order}).eq('id',from.id),
      db.from('menu_items').update({sort_order:from.sort_order}).eq('id',to.id),
    ]);
    setDragOver(null); dragItem.current=null; onRefresh();
  }

  async function addCategory() {
    if(!db||!newCat.trim()) return;
    const{data,error}=await db.from('menu_categories').insert({restaurant_id:RID,name:newCat.trim(),sort_order:categories.length+1}).select('id');
    if(error){toast('Error: '+error.message,false);}
    else if(!data||data.length===0){toast('No se pudo crear la categoría — verificá RLS en Supabase',false);}
    else{toast('Categoría agregada');setNewCat('');onRefresh();}
  }

  async function toggleAvail(item) {
    if(!db) return;
    const{data,error}=await db.from('menu_items').update({is_available:!item.is_available}).eq('id',item.id).select('id');
    if(error){toast('Error: '+error.message,false);}
    else if(!data||data.length===0){toast('No se pudo actualizar — verificá permisos RLS en Supabase',false);}
    else{toast(item.is_available?'Desactivado — no aparece en carta':'Activado — visible en carta');onRefresh();}
  }

  async function deleteItem(item) {
    if(!db||!confirm(`¿Eliminar "${item.name}"?`)) return;
    const{data,error}=await db.from('menu_items').delete().eq('id',item.id).select('id');
    if(error){
      const msg = error.message.includes('foreign key')||error.message.includes('order_items')
        ? 'Este item tiene pedidos históricos. Ejecutá la migración 012 en Supabase para habilitarlo.'
        : 'Error: '+error.message;
      toast(msg,false);
    }
    else if(!data||data.length===0){toast('No se pudo eliminar — ejecutá la migración 010 en Supabase',false);}
    else{toast('Item eliminado');onRefresh();}
  }

  return (
    <div className="page">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
        <h1 style={{fontSize:22,fontWeight:800,color:'#000000'}}>Menú</h1>
        <div style={{display:'flex',gap:8}}>
          <a href="index.html" target="_blank" style={{fontSize:12,color:'#6E6E73',padding:'8px 12px',border:`1px solid ${C.border}`,borderRadius:6,textDecoration:'none'}}>Ver app →</a>
          {menuTab==='productos'&&<Btn onClick={()=>setItemModal({item:null})}>+ Nuevo producto</Btn>}
        </div>
      </div>

      {/* Sub-tabs */}
      <div style={{display:'flex',gap:0,borderBottom:`1px solid ${C.border}`,marginBottom:14}}>
        {[['productos','Productos'],['extras','Extras / Modificadores']].map(([id,lbl])=>(
          <button key={id} onClick={()=>setMenuTab(id)} style={{background:'none',border:'none',color:menuTab===id?'#000':'#86868B',padding:'8px 16px',fontSize:13,fontWeight:menuTab===id?700:400,borderBottom:menuTab===id?'2px solid #000':'2px solid transparent',cursor:'pointer',marginBottom:-1}}>{lbl}</button>
        ))}
      </div>

      {/* Modal crear / editar */}
      {itemModal&&(
        <ItemModal
          item={itemModal.item}
          categories={categories}
          onClose={()=>setItemModal(null)}
          onSaved={()=>{ onRefresh(); if(menuTab==='extras') loadAllExtras(); }}
        />
      )}

      {/* Modal vista previa */}
      {previewItem&&(
        <Modal title="Vista previa del producto" onClose={()=>setPreviewItem(null)} width={380}>
          <div style={{background:'#F5F5F7',borderRadius:12,overflow:'hidden'}}>
            {previewItem.image_url
              ?<img src={previewItem.image_url} alt="" style={{width:'100%',height:200,objectFit:'cover'}} onError={e=>{e.target.style.display='none';}}/>
              :<div style={{height:140,background:'#E8E8ED',display:'flex',alignItems:'center',justifyContent:'center',fontSize:40}}>🍽</div>
            }
            <div style={{padding:20}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:8,gap:8}}>
                <div style={{fontSize:18,fontWeight:700,color:'#1D1D1F',flex:1}}>{previewItem.name}</div>
                <div style={{display:'flex',flexDirection:'column',gap:4,alignItems:'flex-end',flexShrink:0}}>
                  {previewItem.promo_tag&&<span style={{background:'#FFF4E0',border:'1px solid #FFD580',color:'#8A4B00',padding:'2px 8px',fontSize:11,borderRadius:4}}>{previewItem.promo_tag}</span>}
                  {previewItem.promo_type&&<span style={{background:'#EFF6FF',border:'1px solid #BFDBFE',color:'#1D4ED8',padding:'2px 8px',fontSize:11,borderRadius:4}}>{PROMO_LABEL[previewItem.promo_type]}</span>}
                  {previewItem.dine_in_only&&<span style={{background:'#F0FDF4',border:'1px solid #BBF7D0',color:'#166534',padding:'2px 8px',fontSize:11,borderRadius:4}}>Solo en local</span>}
                </div>
              </div>
              {previewItem.description&&<div style={{fontSize:13,color:'#6E6E73',marginBottom:12,lineHeight:1.4}}>{previewItem.description}</div>}
              {(previewItem.discount_pct>0)
                ?<div style={{marginBottom:12}}>
                  <span style={{fontSize:14,color:'#86868B',textDecoration:'line-through',marginRight:8}}>{fmt(previewItem.price_guarani)}</span>
                  <span style={{fontSize:22,fontWeight:800,color:'#000'}}>{fmt(Math.round(previewItem.price_guarani*(100-previewItem.discount_pct)/100))}</span>
                  <span style={{fontSize:12,color:'#34C759',marginLeft:6,fontWeight:700}}>−{previewItem.discount_pct}%</span>
                </div>
                :<div style={{fontSize:22,fontWeight:800,color:'#000',marginBottom:12}}>{fmt(previewItem.price_guarani)}</div>
              }
              <div style={{background:'#000',color:'#fff',padding:'11px',textAlign:'center',borderRadius:8,fontSize:14,fontWeight:600}}>Agregar al pedido</div>
            </div>
          </div>
          <div style={{marginTop:12,fontSize:11,color:'#86868B',textAlign:'center'}}>Solo lectura — sin funcionalidad de carrito</div>
        </Modal>
      )}

      {/* ── TAB EXTRAS ── */}
      {menuTab==='extras'&&(
        <div>
          <div style={{fontSize:12,color:'#6E6E73',marginBottom:14}}>Todos los extras configurados. Para añadir o editar extras abrí el producto con "Editar".</div>
          {extrasLoading&&<div style={{display:'flex',gap:8,alignItems:'center',color:'#6E6E73',fontSize:13,padding:20}}><span className="spin"/>Cargando…</div>}
          {!extrasLoading&&(
            <div style={{background:'#fff',border:`1px solid ${C.border}`,borderRadius:8,overflow:'hidden'}}>
              <table style={{width:'100%',borderCollapse:'collapse'}}>
                <thead><tr style={{borderBottom:`1px solid ${C.border}`}}><Th>Nombre del extra</Th><Th>Producto</Th><Th right>Precio</Th><Th>Estado</Th></tr></thead>
                <tbody>
                  {allExtras.map(e=>(
                    <tr key={e.id} style={{borderBottom:`1px solid #F0F0F0`}}>
                      <Td>{e.name}</Td>
                      <Td dim style={{fontSize:11}}>{itemName(e.item_id)}</Td>
                      <Td mono right>{e.price_guarani>0?`₲ ${e.price_guarani.toLocaleString('es-PY')}`:'Gratis'}</Td>
                      <Td>
                        <button onClick={()=>toggleExtraActive(e)} style={{background:e.is_active?'rgba(52,199,89,0.1)':'rgba(142,142,147,0.1)',border:`1px solid ${e.is_active?'rgba(52,199,89,0.3)':'rgba(142,142,147,0.3)'}`,color:e.is_active?'#34C759':'#86868B',padding:'2px 9px',fontSize:11,fontWeight:600,borderRadius:5,cursor:'pointer'}}>
                          {e.is_active?'Activo':'Inactivo'}
                        </button>
                      </Td>
                    </tr>
                  ))}
                  {allExtras.length===0&&<EmptyRow cols={4} label="Sin extras configurados — agregalos editando un producto"/>}
                </tbody>
              </table>
            </div>
          )}
        </div>
      )}

      {/* ── TAB PRODUCTOS ── */}
      {menuTab==='productos'&&(
      <div style={{display:'flex',gap:14}}>
        {/* Sidebar categorías */}
        <div style={{width:165,flexShrink:0}}>
          <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,marginBottom:10,overflow:'hidden'}}>
            <div style={{padding:'8px 12px',fontSize:10,color:'#6E6E73',fontWeight:700,letterSpacing:1,borderBottom:`1px solid ${C.border}`}}>CATEGORÍAS</div>
            {[{id:'all',name:'Todas',cnt:menuItems.length},...categories.map(c=>({id:c.id,name:c.name,cnt:menuItems.filter(i=>i.category_id===c.id).length}))].map(c=>{
              const active=catFilter===c.id;
              return <button key={c.id} onClick={()=>setCatFilter(c.id)} style={{display:'flex',justifyContent:'space-between',width:'100%',textAlign:'left',padding:'8px 12px',background:active?'#F0F0F0':'none',border:'none',color:active?'#000':'#6E6E73',fontSize:13,cursor:'pointer',borderBottom:`1px solid #F0F0F0`,borderLeft:active?'2px solid #000':'2px solid transparent'}}>
                <span>{c.name}</span><span style={{color:'#D2D2D7',fontSize:11}}>{c.cnt}</span>
              </button>;
            })}
          </div>
          <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,padding:12}}>
            <div style={{fontSize:10,color:'#6E6E73',fontWeight:700,marginBottom:7}}>+ CATEGORÍA</div>
            <Inp value={newCat} onChange={e=>setNewCat(e.target.value)} placeholder="Nombre…" onKeyDown={e=>e.key==='Enter'&&addCategory()}/>
            <Btn variant="secondary" onClick={addCategory} style={{marginTop:7,width:'100%'}} small disabled={!newCat.trim()}>Agregar</Btn>
          </div>
        </div>

        {/* Tabla de productos */}
        <div style={{flex:1}}>
          <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,overflow:'hidden'}}>
            <table style={{width:'100%',borderCollapse:'collapse'}}>
              <thead><tr style={{borderBottom:`1px solid ${C.border}`}}><Th></Th><Th>Foto</Th><Th>Nombre</Th><Th>Cat.</Th><Th right>Precio</Th><Th>Promo / Tipo</Th><Th>Estado</Th><Th>Acc.</Th></tr></thead>
              <tbody>
                {visible.map(item=>{
                  const stockBajo=(item.stock_min>0)&&(item.stock!=null)&&(item.stock<=item.stock_min);
                  const isDragTarget=dragOver===item.id;
                  const discountedPrice = item.discount_pct>0 ? Math.round(item.price_guarani*(100-item.discount_pct)/100) : null;
                  return (
                    <tr key={item.id}
                      draggable
                      onDragStart={()=>onDragStart(item)}
                      onDragOver={e=>{e.preventDefault();setDragOver(item.id);}}
                      onDragLeave={()=>setDragOver(null)}
                      onDrop={()=>onDrop(item)}
                      style={{borderBottom:`1px solid #F0F0F0`,opacity:isDragTarget?0.5:1,background:isDragTarget?'#F0F0F0':'transparent',cursor:'grab'}}>
                      <Td><span style={{color:'#D2D2D7',fontSize:14,cursor:'grab'}}>⋮⋮</span></Td>
                      <Td>
                        {item.image_url
                          ?<img src={item.image_url} alt="" style={{width:36,height:36,objectFit:'cover',borderRadius:4,border:`1px solid ${C.border}`}} onError={e=>{e.target.style.display='none';}}/>
                          :<div style={{width:36,height:36,background:'#F5F5F7',borderRadius:4,display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,color:'#D2D2D7'}}>🍽</div>}
                      </Td>
                      <Td>
                        <div style={{color:item.is_available?'#1D1D1F':'#86868B',fontWeight:500}}>{item.name}</div>
                        {item.description&&<div style={{fontSize:11,color:'#86868B',marginTop:1,maxWidth:200,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{item.description}</div>}
                        {item.dine_in_only&&<span style={{fontSize:9,color:'#166534',background:'#F0FDF4',border:'1px solid #BBF7D0',padding:'1px 5px',borderRadius:3,marginTop:2,display:'inline-block'}}>Solo local</span>}
                      </Td>
                      <Td dim>{catName(item.category_id)}</Td>
                      <Td mono right>
                        {discountedPrice
                          ?<div>
                            <span style={{textDecoration:'line-through',color:'#86868B',fontSize:11}}>{fmt(item.price_guarani)}</span>
                            <div style={{color:'#34C759',fontWeight:700}}>{fmt(discountedPrice)}</div>
                          </div>
                          :fmt(item.price_guarani)
                        }
                        {stockBajo&&<div style={{fontSize:9,color:'#C0190F',fontWeight:700,marginTop:2}}>STOCK BAJO</div>}
                      </Td>
                      <Td>
                        <div style={{display:'flex',flexDirection:'column',gap:3}}>
                          {item.promo_tag&&<span style={{background:'#FFF4E0',border:'1px solid #FFD580',color:'#8A4B00',padding:'2px 6px',fontSize:11,borderRadius:4,display:'inline-block'}}>{item.promo_tag}</span>}
                          {item.promo_type&&<span style={{background:'#EFF6FF',border:'1px solid #BFDBFE',color:'#1D4ED8',padding:'2px 6px',fontSize:10,borderRadius:4,display:'inline-block'}}>{PROMO_LABEL[item.promo_type]}</span>}
                        </div>
                      </Td>
                      <Td>
                        <button onClick={()=>toggleAvail(item)} style={{background:item.is_available?'rgba(52,199,89,0.1)':'rgba(142,142,147,0.1)',border:`1px solid ${item.is_available?'rgba(52,199,89,0.3)':'rgba(142,142,147,0.3)'}`,color:item.is_available?'#34C759':'#86868B',padding:'3px 9px',fontSize:11,fontWeight:600,borderRadius:5,cursor:'pointer'}}>
                          {item.is_available?'Activo':'Inactivo'}
                        </button>
                      </Td>
                      <Td>
                        <div style={{display:'flex',gap:4}}>
                          <Btn small variant="secondary" onClick={()=>setPreviewItem(item)}>Ver</Btn>
                          <Btn small variant="secondary" onClick={()=>setItemModal({item})}>Editar</Btn>
                          <Btn small variant="danger" onClick={()=>deleteItem(item)}>✕</Btn>
                        </div>
                      </Td>
                    </tr>
                  );
                })}
                {visible.length===0&&<EmptyRow cols={8} label="Sin items en esta categoría"/>}
              </tbody>
            </table>
          </div>
        </div>
      </div>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════════
   MESAS — canvas drag-and-drop + fix is_occupied
══════════════════════════════════════════════ */
function MesasPage({tables: tablesProp, orders, onRefresh}) {
  const [tables, setTables]   = useState(tablesProp);
  const [editMode, setEditMode]= useState(false);
  const [modal, setModal]      = useState(null);
  const [formModal, setFormModal]=useState(null);
  const [form, setForm]        = useState({number:'',capacity:'4'});
  const [saving, setSaving]    = useState(false);
  const [dragging, setDragging]= useState(null);
  const [dragOff, setDragOff]  = useState({x:0,y:0});
  const canvasRef = useRef(null);
  const CELL = 80; const GAP = 16;

  // Sincronizar con prop externa y Realtime — FIX is_occupied
  useEffect(()=>{ setTables(tablesProp); },[tablesProp]);

  useEffect(()=>{
    if(!db) return;
    const ch = db.channel('mesas-rt')
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'tables',filter:`restaurant_id=eq.${RID}`}, payload=>{
        setTables(prev => prev.map(t=> t.id===payload.new.id ? {...t,...payload.new} : t));
      })
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'tables',filter:`restaurant_id=eq.${RID}`}, ()=>{ if(!_modalOpen) onRefresh(); })
      .on('postgres_changes',{event:'DELETE',schema:'public',table:'tables'}, ()=>{ if(!_modalOpen) onRefresh(); })
      .subscribe();
    const poll = setInterval(()=>{ if(_modalOpen) return; onRefresh(); }, 30000);
    return ()=>{ db.removeChannel(ch); clearInterval(poll); };
  },[]);

  const activeOrders = orders.filter(o=>['paid','kitchen_received','cooking','ready'].includes(o.status));

  // Posición inicial si no tiene pos_x/pos_y
  function getPos(t, idx) {
    const cols = Math.max(Math.floor((window.innerWidth-300) / (CELL+GAP)), 4);
    return { x: t.pos_x || (idx%cols)*(CELL+GAP)+GAP, y: t.pos_y || Math.floor(idx/cols)*(CELL+GAP)+GAP };
  }

  // Drag en canvas
  function onMouseDown(e, t) {
    if(!editMode) return;
    const rect = e.currentTarget.getBoundingClientRect();
    setDragOff({x: e.clientX-rect.left, y: e.clientY-rect.top});
    setDragging(t.id);
  }
  function onMouseMove(e) {
    if(!dragging||!canvasRef.current) return;
    const cr = canvasRef.current.getBoundingClientRect();
    const nx = Math.max(0, e.clientX-cr.left-dragOff.x);
    const ny = Math.max(0, e.clientY-cr.top-dragOff.y);
    setTables(prev=>prev.map(t=>t.id===dragging?{...t,pos_x:nx,pos_y:ny}:t));
  }
  async function onMouseUp() {
    if(!dragging||!db) { setDragging(null); return; }
    const t = tables.find(x=>x.id===dragging);
    if(t) await db.from('tables').update({pos_x:Math.round(t.pos_x),pos_y:Math.round(t.pos_y)}).eq('id',t.id);
    setDragging(null);
  }

  async function saveTable() {
    if(!db||!form.number){toast('Número de mesa requerido',false);return;}
    const num=parseInt(form.number);
    if(isNaN(num)||num<1){toast('Número inválido',false);return;}
    setSaving(true);
    if(formModal.mode==='add') {
      const token=(crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)).replace(/-/g,'').slice(0,16);
      const idx = tables.length;
      const cols = Math.max(Math.floor((window.innerWidth-300)/(CELL+GAP)),4);
      const px=(idx%cols)*(CELL+GAP)+GAP; const py=Math.floor(idx/cols)*(CELL+GAP)+GAP;
      const{error}=await db.from('tables').insert({restaurant_id:RID,number:num,capacity:parseInt(form.capacity)||4,qr_token:token,pos_x:px,pos_y:py}).select().single();
      if(error){toast('Error: '+error.message,false);}
      else{toast('Mesa '+num+' creada');onRefresh();setFormModal(null);}
    } else {
      const{data,error}=await db.from('tables').update({number:num,capacity:parseInt(form.capacity)||4}).eq('id',formModal.table.id).select('id');
      if(error){toast('Error: '+error.message,false);}
      else if(!data||data.length===0){toast('No se pudo actualizar la mesa — verificá RLS en Supabase',false);}
      else{toast('Mesa actualizada');onRefresh();setFormModal(null);}
    }
    setSaving(false);
  }

  async function deleteTable(t) {
    const hasActive=activeOrders.some(o=>o.table_id===t.id);
    if(hasActive){toast('Mesa con pedido activo, no se puede eliminar',false);return;}
    if(!confirm(`¿Eliminar Mesa ${t.number}?`))return;
    const{data,error}=await db.from('tables').delete().eq('id',t.id).select('id');
    if(error){toast('Error: '+error.message,false);}
    else if(!data||data.length===0){toast('No se pudo eliminar — verificá RLS DELETE en Supabase',false);}
    else{toast('Mesa eliminada');onRefresh();}
  }

  const canvasH = tables.length ? Math.max(...tables.map((t,i)=>{ const p=getPos(t,i); return p.y+CELL+GAP; }), 300) : 300;

  return (
    <div className="page">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
        <div>
          <h1 style={{fontSize:22,fontWeight:800,color:'#000000'}}>Mesas</h1>
          <div style={{fontSize:12,color:'#6E6E73',marginTop:2}}>{activeOrders.length} con pedidos activos · {tables.length} mesas</div>
        </div>
        <div style={{display:'flex',gap:8}}>
          <button onClick={()=>setEditMode(e=>!e)} style={{padding:'8px 16px',border:`1px solid ${C.border}`,borderRadius:6,background:editMode?'#000':'transparent',color:editMode?'#fff':'#6E6E73',fontSize:12,fontWeight:600,cursor:'pointer'}}>
            {editMode?'Modo vista':'Modo edición'}
          </button>
          <Btn onClick={()=>{setForm({number:'',capacity:'4'});setFormModal({mode:'add'});}}>+ Nueva mesa</Btn>
        </div>
      </div>

      {editMode&&<div style={{fontSize:11,color:'#86868B',marginBottom:12,padding:'8px 14px',background:'#F5F5F7',borderRadius:6}}>Arrastrá las mesas para posicionarlas. En modo vista, click en una mesa ocupada muestra sus pedidos.</div>}

      {/* Canvas drag-and-drop */}
      <div ref={canvasRef} onMouseMove={onMouseMove} onMouseUp={onMouseUp} onMouseLeave={onMouseUp}
        style={{position:'relative',width:'100%',minHeight:canvasH,background:'#FAFAFA',border:`1px solid ${C.border}`,borderRadius:10,overflow:'hidden',marginBottom:16}}>
        {tables.length===0&&<div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',color:'#D2D2D7',fontSize:13}}>No hay mesas. Creá la primera.</div>}
        {tables.map((t,idx)=>{
          const pos = getPos(t,idx);
          const order = activeOrders.find(o=>o.table_id===t.id);
          const busy = t.is_occupied || !!order;
          const isDrag = dragging===t.id;
          return (
            <div key={t.id}
              onMouseDown={e=>onMouseDown(e,t)}
              onClick={()=>{ if(!editMode&&busy) setModal({table:t,order}); }}
              style={{
                position:'absolute', left:pos.x, top:pos.y,
                width:CELL, height:CELL,
                background:busy?'#F5F5F7':'#FFFFFF',
                border:`2px solid ${busy?'#000000':'#D2D2D7'}`,
                borderRadius:10,
                display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',
                cursor: editMode?'grab': (busy?'pointer':'default'),
                userSelect:'none', transition:isDrag?'none':'box-shadow .15s',
                boxShadow: isDrag?'0 8px 20px rgba(0,0,0,0.18)':'none',
                zIndex: isDrag?10:1,
              }}>
              <div style={{fontSize:18,fontWeight:800,color:'#000',lineHeight:1}}>
                {t.number}
              </div>
              {busy
                ?<div style={{fontSize:8,color:'#6E6E73',textAlign:'center',marginTop:3,lineHeight:1.3}}>
                    {order?fmt(order.total):t.is_occupied?'Ocupada':''}
                  </div>
                :<div style={{fontSize:8,color:'#D2D2D7',marginTop:2}}>Libre</div>}
              {busy&&<div style={{width:6,height:6,borderRadius:'50%',background:'#000',marginTop:4}}/>}
            </div>
          );
        })}
      </div>

      {/* Modal: pedidos activos de mesa (modo vista) */}
      {modal&&!editMode&&(
        <Modal title={`Mesa ${modal.table.number}`} onClose={()=>setModal(null)} width={420}>
          {modal.order?(
            <div>
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:16}}>
                <div>
                  <div style={{fontFamily:"'SF Mono',ui-monospace,monospace",fontSize:13,color:'#86868B'}}>{modal.order.order_number}</div>
                  <div style={{fontSize:11,color:'#86868B'}}>{fmtTime(modal.order.created_at)}</div>
                </div>
                <Badge status={modal.order.status}/>
              </div>
              <div style={{fontSize:20,fontWeight:800,color:'#000',marginBottom:20}}>{fmt(modal.order.total)}</div>
              <div style={{display:'flex',gap:8}}>
                <Btn style={{flex:1}} onClick={()=>{setModal(null);}}>Cerrar</Btn>
                {!editMode&&<button onClick={()=>{setFormModal({mode:'edit',table:modal.table});setForm({number:String(modal.table.number),capacity:String(modal.table.capacity||4)});setModal(null);}} style={{padding:'8px 14px',border:`1px solid ${C.border}`,borderRadius:6,fontSize:12,cursor:'pointer',background:'transparent',color:'#6E6E73'}}>Editar mesa</button>}
              </div>
            </div>
          ):<div style={{color:'#6E6E73',fontSize:13}}>Sin pedido activo en esta mesa.</div>}
        </Modal>
      )}

      {/* Modal form add/edit */}
      {formModal&&(
        <Modal title={formModal.mode==='add'?'Nueva mesa':'Editar mesa'} onClose={()=>setFormModal(null)} width={340}>
          <div style={{display:'flex',flexDirection:'column',gap:12}}>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
              <div><Lbl>NÚMERO *</Lbl><Inp type="number" mono value={form.number} onChange={e=>setForm({...form,number:e.target.value})} placeholder="1"/></div>
              <div><Lbl>CAPACIDAD</Lbl><Inp type="number" mono value={form.capacity} onChange={e=>setForm({...form,capacity:e.target.value})} placeholder="4"/></div>
            </div>
            {formModal.mode==='edit'&&formModal.table.qr_token&&(
              <div style={{background:'#F5F5F7',border:`1px solid ${C.border}`,borderRadius:6,padding:10}}>
                <div style={{fontSize:10,color:'#6E6E73',fontWeight:700,marginBottom:4}}>TOKEN QR</div>
                <div style={{fontFamily:"'SF Mono',ui-monospace,monospace",fontSize:11,color:'#86868B',wordBreak:'break-all'}}>{formModal.table.qr_token}</div>
              </div>
            )}
            <div style={{display:'flex',gap:8,marginTop:4}}>
              <Btn onClick={saveTable} disabled={saving}>{saving?'Guardando…':formModal.mode==='add'?'Crear':'Guardar'}</Btn>
              <Btn variant="ghost" onClick={()=>setFormModal(null)}>Cancelar</Btn>
              {formModal.mode==='edit'&&<Btn variant="danger" small onClick={()=>{deleteTable(formModal.table);setFormModal(null);}}>Eliminar</Btn>}
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════════
   PERSONAL
══════════════════════════════════════════════ */
function PersonalPage() {
  const [tab,setTab]           = useState('empleados');
  const [profiles,setProfiles] = useState([]);
  const [loading,setLoading]   = useState(true);
  const [error,setError]       = useState(null);
  const [editId,setEditId]     = useState(null);
  const [editRole,setEditRole] = useState('');
  const [editActive,setEditActive] = useState(true);

  // Turnos
  const [shifts,setShifts]         = useState([]);
  const [loadingShifts,setLS]      = useState(false);
  const [shiftDate,setShiftDate]   = useState(new Date().toISOString().slice(0,10));
  const [shiftModal,setShiftModal] = useState(false);
  const [shiftEmp,setShiftEmp]     = useState('');

  async function loadProfiles() {
    if(!db){setLoading(false);return;}
    setLoading(true); setError(null);
    const {data:rpcData,error:rpcErr} = await db.rpc('admin_list_restaurant_users',{p_restaurant_id:RID});
    if(!rpcErr){setProfiles(rpcData||[]);setLoading(false);return;}
    const{data,error:e}=await db.from('user_roles').select('id,user_id,username,display_name,role,email,is_active,created_at').eq('restaurant_id',RID).order('created_at',{ascending:false});
    if(!e){setProfiles(data||[]);setLoading(false);return;}
    const uid=(await db.auth.getUser()).data?.user?.id||'';
    const{data:me,error:meErr}=await db.from('user_roles').select('id,user_id,username,display_name,role,email,is_active,created_at').eq('user_id',uid).limit(1);
    if(!meErr&&me?.length){setProfiles(me);setLoading(false);return;}
    setError(`Error al cargar personal: ${rpcErr?.message||e?.message||'Sin acceso a user_roles'}`);
    setLoading(false);
  }

  async function loadShifts() {
    if(!db) return;
    setLS(true);
    const s = new Date(shiftDate); s.setHours(0,0,0,0);
    const e = new Date(shiftDate); e.setHours(23,59,59,999);
    const{data}=await db.from('employee_shifts').select('*').eq('restaurant_id',RID).gte('clock_in',s.toISOString()).lte('clock_in',e.toISOString()).order('clock_in',{ascending:false});
    setShifts(data||[]);
    setLS(false);
  }

  useEffect(()=>{ loadProfiles(); },[]);
  useEffect(()=>{ if(tab==='turnos') loadShifts(); },[tab,shiftDate]);

  useEffect(()=>{
    if(!db) return;
    const ch = db.channel('personal-rt')
      .on('postgres_changes',{event:'*',schema:'public',table:'user_roles',filter:`restaurant_id=eq.${RID}`},()=>{ if(!_modalOpen) loadProfiles(); })
      .on('postgres_changes',{event:'*',schema:'public',table:'employee_shifts',filter:`restaurant_id=eq.${RID}`},()=>{ if(!_modalOpen) loadShifts(); })
      .subscribe();
    const poll = setInterval(()=>{ if(_modalOpen) return; loadProfiles(); if(tab==='turnos') loadShifts(); }, 30000);
    return ()=>{ db.removeChannel(ch); clearInterval(poll); };
  },[tab]);

  async function saveRole(id) {
    if(!db)return;
    if(!ADMIN_ALLOWED_ROLES.includes(editRole)){toast('No podés asignar ese rol desde el panel admin',false);return;}
    const{error:rpcErr}=await db.rpc('admin_update_user_role',{p_user_role_id:id,p_role:editRole,p_is_active:editActive});
    if(rpcErr){const{error:e}=await db.from('user_roles').update({role:editRole,is_active:editActive}).eq('id',id);if(e){toast('Error: '+e.message,false);return;}}
    toast('Usuario actualizado');
    setProfiles(p=>p.map(x=>x.id===id?{...x,role:editRole,is_active:editActive}:x));
    setEditId(null);
  }

  async function clockIn() {
    if(!db||!shiftEmp){toast('Seleccioná un empleado',false);return;}
    const emp = profiles.find(p=>p.id===shiftEmp);
    const{error}=await db.from('employee_shifts').insert({restaurant_id:RID,employee_id:emp.user_id||emp.id,employee_name:emp.display_name||emp.username||'—',role:emp.role,clock_in:new Date().toISOString()});
    if(error){toast('Error: '+error.message,false);return;}
    toast('Entrada registrada'); setShiftModal(false); setShiftEmp(''); loadShifts();
  }

  async function clockOut(shift) {
    if(!db)return;
    const{error}=await db.from('employee_shifts').update({clock_out:new Date().toISOString()}).eq('id',shift.id);
    if(error){toast('Error: '+error.message,false);return;}
    toast('Salida registrada'); loadShifts();
  }

  function duracion(s) {
    if(!s.clock_out) return '—';
    const min = Math.round((new Date(s.clock_out)-new Date(s.clock_in))/60000);
    return `${Math.floor(min/60)}h ${min%60}m`;
  }
  function horasTrabajadas(empName) {
    return shifts.filter(s=>s.employee_name===empName&&s.clock_out).reduce((acc,s)=>{
      return acc+Math.round((new Date(s.clock_out)-new Date(s.clock_in))/60000);
    },0);
  }

  const roleColor={cocina:C.orange,admin:C.blue,superadmin:C.purple,waiter:C.green,cajero:C.yellow,delivery:'#06b6d4'};

  return (
    <div className="page">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
        <h1 style={{fontSize:22,fontWeight:800,color:'#000000'}}>Personal</h1>
        <Btn small variant="secondary" onClick={()=>{ loadProfiles(); if(tab==='turnos') loadShifts(); }}>↺ Actualizar</Btn>
      </div>

      {/* Sub-tabs */}
      <div style={{display:'flex',gap:0,borderBottom:`1px solid ${C.border}`,marginBottom:16}}>
        {[['empleados','Empleados'],['turnos','Turnos']].map(([id,lbl])=>(
          <button key={id} onClick={()=>setTab(id)} style={{background:'none',border:'none',color:tab===id?'#000':'#86868B',padding:'8px 16px',fontSize:13,fontWeight:tab===id?700:400,borderBottom:tab===id?'2px solid #000':'2px solid transparent',cursor:'pointer',marginBottom:-1}}>{lbl}</button>
        ))}
      </div>

      {/* Tab Empleados */}
      {tab==='empleados'&&(<>
        <div style={{fontSize:12,color:'#6E6E73',marginBottom:12}}>Usuarios con acceso al sistema · restaurante {RID.slice(0,8)}…</div>
        {loading&&<div style={{display:'flex',gap:10,alignItems:'center',color:'#6E6E73',fontSize:13}}><span className="spin"/>Cargando personal…</div>}
        {error&&<div style={{color:C.orange,fontSize:13,padding:16,background:'rgba(249,115,22,0.08)',border:'1px solid rgba(249,115,22,0.2)',borderRadius:8,marginBottom:14}}><div style={{fontWeight:700,marginBottom:4}}>Atención</div>{error}</div>}
        {!loading&&(
          <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,overflow:'hidden'}}>
            <table style={{width:'100%',borderCollapse:'collapse'}}>
              <thead><tr style={{borderBottom:`1px solid ${C.border}`}}><Th>Usuario</Th><Th>Nombre</Th><Th>Email</Th><Th>Rol</Th><Th>Estado</Th><Th>Desde</Th><Th>Acc.</Th></tr></thead>
              <tbody>
                {profiles.map(p=>(
                  <tr key={p.id} style={{borderBottom:`1px solid #F0F0F0`,opacity:p.is_active===false?0.5:1}}>
                    <Td mono>{p.username||'—'}</Td>
                    <Td>{p.display_name||'—'}</Td>
                    <Td dim style={{fontSize:11}}>{p.email||'—'}</Td>
                    <Td>
                      {editId===p.id
                        ?<Sel value={editRole} onChange={e=>setEditRole(e.target.value)} style={{width:140}}>{ADMIN_ALLOWED_ROLES.map(r=><option key={r} value={r}>{r}</option>)}</Sel>
                        :<span style={{background:(roleColor[p.role]||'#6E6E73')+'22',color:roleColor[p.role]||'#6E6E73',border:`1px solid ${(roleColor[p.role]||'#6E6E73')}44`,padding:'3px 9px',fontSize:11,fontWeight:700,borderRadius:5}}>{p.role}</span>}
                    </Td>
                    <Td>
                      {editId===p.id
                        ?<Sel value={String(editActive)} onChange={e=>setEditActive(e.target.value==='true')} style={{width:100}}><option value="true">Activo</option><option value="false">Inactivo</option></Sel>
                        :<span style={{fontSize:11,color:p.is_active!==false?'#34C759':'#FF3B30'}}>{p.is_active!==false?'Activo':'Inactivo'}</span>}
                    </Td>
                    <Td mono dim>{fmtDate(p.created_at)}</Td>
                    <Td>
                      {editId===p.id
                        ?<div style={{display:'flex',gap:5}}><Btn small onClick={()=>saveRole(p.id)}>✓</Btn><Btn small variant="ghost" onClick={()=>setEditId(null)}>✕</Btn></div>
                        :<Btn small variant="secondary" onClick={()=>{setEditId(p.id);setEditRole(p.role);setEditActive(p.is_active!==false);}}>Editar</Btn>}
                    </Td>
                  </tr>
                ))}
                {profiles.length===0&&!error&&<EmptyRow cols={7} label="Sin usuarios. Creá usuarios desde el panel SuperAdmin."/>}
              </tbody>
            </table>
          </div>
        )}
        {profiles.length>0&&<div style={{marginTop:10,fontSize:11,color:'#86868B'}}>{profiles.filter(p=>p.is_active!==false).length} activos · {profiles.filter(p=>p.is_active===false).length} inactivos · Para crear usuarios usá el panel SuperAdmin.</div>}
        {/* Crear usuarios — sin service_role */}
        <div style={{marginTop:16,padding:'10px 14px',background:'#F5F5F7',border:`1px solid ${C.border}`,borderRadius:8,fontSize:12,color:'#86868B'}}>
          Para crear nuevos usuarios con contraseña usá el panel <a href="superadmin.html" style={{color:'#000',fontWeight:600}}>SuperAdmin</a>.
          {/* TODO: Edge Function — no usar service_role en frontend */}
        </div>
      </>)}

      {/* Tab Turnos */}
      {tab==='turnos'&&(<>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <label style={{fontSize:12,color:'#6E6E73'}}>Fecha:</label>
            <input type="date" value={shiftDate} onChange={e=>setShiftDate(e.target.value)} style={{padding:'5px 9px',fontSize:12,borderRadius:6,border:`1px solid ${C.border}`}}/>
          </div>
          <Btn small onClick={()=>setShiftModal(true)}>+ Registrar entrada</Btn>
        </div>
        {loadingShifts&&<div style={{display:'flex',gap:10,alignItems:'center',color:'#6E6E73',fontSize:13}}><span className="spin"/>Cargando turnos…</div>}
        <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,overflow:'hidden'}}>
          <table style={{width:'100%',borderCollapse:'collapse'}}>
            <thead><tr style={{borderBottom:`1px solid ${C.border}`}}><Th>Empleado</Th><Th>Rol</Th><Th>Entrada</Th><Th>Salida</Th><Th>Duración</Th><Th>Estado</Th><Th></Th></tr></thead>
            <tbody>
              {shifts.map(s=>{
                const activo=!s.clock_out;
                return (
                  <tr key={s.id} style={{borderBottom:`1px solid #F0F0F0`}}>
                    <Td>{s.employee_name||'—'}</Td>
                    <Td dim>{s.role||'—'}</Td>
                    <Td mono dim>{fmtTime(s.clock_in)}</Td>
                    <Td mono dim>{s.clock_out?fmtTime(s.clock_out):'—'}</Td>
                    <Td mono dim>{duracion(s)}</Td>
                    <Td><span style={{padding:'2px 8px',fontSize:10,fontWeight:700,borderRadius:4,background:activo?'#E8F9ED':'#F0F0F0',color:activo?'#1A7E37':'#86868B'}}>{activo?'ACTIVO':'CERRADO'}</span></Td>
                    <Td>{activo&&<Btn small variant="secondary" onClick={()=>clockOut(s)}>Registrar salida</Btn>}</Td>
                  </tr>
                );
              })}
              {shifts.length===0&&!loadingShifts&&<EmptyRow cols={7} label={`Sin turnos el ${shiftDate}`}/>}
            </tbody>
          </table>
        </div>
        {shifts.length>0&&(
          <div style={{marginTop:12,background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,padding:14}}>
