<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mythos · Superadmin</title>
  <link rel="stylesheet" href="design-system.css">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="ui-primitives.css">
  <script src="mythos-theme.js"></script>
  <script src="mythos-icons.js"></script>
  <script src="mythos-offline.js"></script>
  <!-- PR-B4C: Superadmin activa dark real. init() respeta preferencia/sistema y
       persiste vía el toggle del sidebar (MythosTheme.toggle). Solo Superadmin;
       el resto de paneles staff siguen pineados hasta su propio PR. -->
  <script>MythosTheme.init();</script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.1/dist/umd/supabase.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <!-- Leaflet (mapa del módulo Prospección — tiles Carto, sin API key). El CSP de
       vercel.json ya whitelistea unpkg (script), *.basemaps.cartocdn.com (tiles) y
       nominatim.openstreetmap.org (geocoding). Mismo Leaflet que admin/delivery. -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body,#root{height:100%}
    body{background:var(--bg-subtle);color:var(--text-primary);font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;transition:background var(--transition),color var(--transition)}
    ::-webkit-scrollbar{width:6px;height:6px}
    ::-webkit-scrollbar-track{background:var(--bg-subtle)}
    ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
    input,select,textarea{background:var(--surface);border:1px solid var(--border);color:var(--text-primary);padding:8px 12px;border-radius:8px;font-size:14px;width:100%;outline:none;font-family:inherit;transition:border-color .15s}
    input:focus,select:focus,textarea:focus{border-color:var(--text-primary)}
    button{cursor:pointer;border:none;font-family:inherit}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
    .animate-in{animation:fadeIn .25s ease both}
    .spin{animation:spin 1s linear infinite}
    .pulse{animation:pulse 2s ease infinite}
    .tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
    .cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
    @media(max-width:640px){.cards-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div id="root"></div>
<script src="config.js"></script>
<script src="mythos-session.js"></script>
<script src="mythos-auth-guard.js"></script>
<!-- PR-5: panel precompilado con Vite. Reemplaza los CDN de React/ReactDOM y el transpilador en navegador + el script JSX inline. El bundle se genera en public/build/ por `npm run build`. -->
<script src="build/superadmin.js"></script>
</body>
</html>
