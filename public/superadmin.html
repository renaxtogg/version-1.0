const fmtDateTime = d => d ? new Date(d).toLocaleString('es-PY',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}) : '—';

const fmtUSD = n => `$${Number(n||0).toFixed(2)}`;

// ── Analytics helpers ────────────────────────────────────────
function buildAnalytics(restaurants, orders, ratings, subscriptions, plans) {
  const now = new Date();
  const ago30 = new Date(now - 30*86400000).toISOString();
  const todayStr = now.toISOString().slice(0,10);

  return restaurants.map(r => {
    const rOrders     = orders.filter(o => o.restaurant_id === r.id);
    const recent      = rOrders.filter(o => (o.created_at||'') >= ago30);
    const todayOrders = rOrders.filter(o => (o.created_at||'').slice(0,10) === todayStr);
    const revenue30   = recent.reduce((s,o)=>s+(Number(o.total)||0),0);
    const rRatings    = ratings.filter(x=>x.restaurant_id===r.id).map(x=>x.stars);
    const rSub        = subscriptions.find(s=>s.restaurant_id===r.id);
    const plan        = rSub?.plan || (rSub ? plans.find(p=>p.id===rSub.plan_id) : null);
    return {
      ...r,
      orders30:     recent.length,
      ordersToday:  todayOrders.length,
      revenue30,
      avgRating:    rRatings.length ? +(avg(rRatings).toFixed(1)) : null,
      subscription: rSub,
      plan,
      daysLeft:     rSub ? daysUntil(rSub.end_date) : null,
    };
  });
}

// ── Página: Plataforma (Overview) ────────────────────────────
function PageOverview({enriched, events, plans, setFlash, reload, setPage}) {
  const activos    = enriched.filter(r=>r.status==='active').length;
  const trials     = enriched.filter(r=>r.status==='trial').length;
  const suspendidos= enriched.filter(r=>r.status==='suspended').length;
  const alertas    = enriched.filter(r=>r.daysLeft!==null&&r.daysLeft>=0&&r.daysLeft<=6).length;
  const mrr        = enriched.reduce((s,r)=>s+(['active','trial'].includes(r.status)&&r.plan?Number(r.plan.price_usd):0),0);
  const pedidosHoy = enriched.reduce((s,r)=>s+r.ordersToday,0);
  const pedidos30  = enriched.reduce((s,r)=>s+r.orders30,0);
  const vol30      = enriched.reduce((s,r)=>s+r.revenue30,0);
  const expirando  = enriched.filter(r=>r.daysLeft!==null&&r.daysLeft>=0&&r.daysLeft<=7&&r.status!=='suspended');
  const top        = [...enriched].sort((a,b)=>b.revenue30-a.revenue30)[0];

  const toggleStatus = async r => {
    const next = r.status==='active'?'suspended':(r.status==='suspended'?'active':r.status);
    if (!db) { setFlash({type:'warn',text:'Sin conexión — operación demo'}); return; }
    const {error} = await db.from('restaurants').update({status:next}).eq('id',r.id);
    if (error) { setFlash({type:'error',text:'Error: '+error.message}); return; }
    await db.from('platform_events').insert({restaurant_id:r.id,event_type:'status_changed',description:`Estado cambiado a ${next}`});
    setFlash({type:'ok',text:`${r.name} → ${next}`});
    reload();
  };

  return (
    <div className="animate-in">
      {expirando.length>0&&(
        <div style={{background:'#FFF1F0',border:'1px solid #FFCDD0',borderRadius:12,padding:'16px 20px',marginBottom:20,display:'flex',alignItems:'center',gap:12,flexWrap:'wrap'}}>
          <span style={{color:'#C0190F',fontWeight:600,fontSize:13}}>Suscripciones por vencer</span>
          {expirando.map(r=>(
            <span key={r.id} style={{background:'#FFEDEC',color:'#C0190F',borderRadius:6,padding:'4px 10px',fontSize:13}}>
              {r.name} — {r.daysLeft===0?'hoy':`${r.daysLeft}d`}
            </span>
          ))}
        </div>
      )}

      {/* KPIs */}
      <div style={{display:'flex',gap:12,marginBottom:20,flexWrap:'wrap'}}>
        <Kpi label="Restaurantes activos"  value={activos}          sub={`de ${enriched.length} totales`}    />
        <Kpi label="Trial"                 value={trials}           sub="periodo de prueba"                 />
        <Kpi label="Suspendidos"           value={suspendidos}      sub="sin acceso operativo"               accent={suspendidos>0?C.red:C.mid}/>

// ── Página: Ecosistemas ──────────────────────────────────────
function PageEcosistemas({enriched, plans, setFlash, reload}) {
  const [modal, setModal] = useState(null);
  const [filter, setFilter] = useState('all');
  const emptyForm = {name:'',legal_name:'',ruc:'',city:'',country:'Paraguay',address:'',phone:'',email:'',owner_name:'',owner_email:'',owner_phone:'',status:'active',notes:'',plan_id:'',onboarding_date:new Date().toISOString().slice(0,10)};
  const [form, setForm] = useState(emptyForm);
  const [saving, setSaving] = useState(false);

  const shown = filter==='all' ? enriched : enriched.filter(r=>r.status===filter);

  const openCreate = () => {
    setForm({...emptyForm, plan_id: plans[1]?.id||''});
    setModal('create');
  };

  const openEdit = r => {
    setForm({name:r.name||'',legal_name:r.legal_name||'',ruc:r.ruc||'',city:r.city||'',country:r.country||'Paraguay',address:r.address||'',phone:r.phone||'',email:r.email||'',owner_name:r.owner_name||'',owner_email:r.owner_email||'',owner_phone:r.owner_phone||'',status:r.status,notes:r.notes||'',plan_id:r.subscription?.plan_id||'',onboarding_date:r.onboarding_date||new Date().toISOString().slice(0,10)});
    setModal({edit:r});
  };

  const toggleStatus = async r => {
    const next = r.status==='active'?'suspended':r.status==='suspended'?'active':'active';
    if (!db) { setFlash({type:'warn',text:'Sin conexión — operación demo'}); return; }
    const {error} = await db.from('restaurants').update({status:next}).eq('id',r.id);
    if (error) { setFlash({type:'error',text:'Error: '+error.message}); return; }
    await db.from('platform_events').insert({restaurant_id:r.id,event_type:'status_changed',description:`Estado cambiado a ${next}`}).catch(()=>{});
    setFlash({type:'ok',text:`${r.name} → ${next}`});
    reload();
  };

  const saveRestaurant = async () => {
    if (!form.name.trim()) { setFlash({type:'error',text:'El nombre es requerido'}); return; }
    if (!db) { setFlash({type:'warn',text:'Sin conexión — operación demo'}); return; }
    setSaving(true);
    try {
      const payload = {
        name:form.name.trim(), legal_name:form.legal_name||null, ruc:form.ruc||null,
        city:form.city, country:form.country, address:form.address||null,
        phone:form.phone||null, email:form.email||null,
        owner_name:form.owner_name||null, owner_email:form.owner_email||null,
        owner_phone:form.owner_phone||null, status:form.status,
        notes:form.notes||null, onboarding_date:form.onboarding_date,
        timezone:'America/Asuncion'
      };
      if (modal==='create') {
        const {data:rest,error} = await db.from('restaurants').insert(payload).select().single();
        if (error) throw error;
        if (form.plan_id) {
          const today = new Date();
          const end = new Date(today); end.setMonth(end.getMonth()+1);
          const plan = plans.find(p=>p.id===form.plan_id);
          await db.from('subscriptions').insert({restaurant_id:rest.id,plan_id:form.plan_id,status:form.status==='trial'?'trial':'active',start_date:today.toISOString().slice(0,10),end_date:end.toISOString().slice(0,10),monthly_amount:plan?.price_usd||0}).catch(()=>{});
        }
        await db.from('platform_events').insert({restaurant_id:rest.id,event_type:'onboarding',description:`Alta en plataforma — ${form.status}`}).catch(()=>{});
        setFlash({type:'ok',text:`${form.name} dado de alta correctamente`});
      } else {
        const {error} = await db.from('restaurants').update(payload).eq('id',modal.edit.id);
        if (error) throw error;
        setFlash({type:'ok',text:`${form.name} actualizado`});
      }
      setModal(null); reload();
    } catch(e) { setFlash({type:'error',text:'Error: '+e.message}); }
    setSaving(false);
  };

  const sf = v => e => setForm(f=>({...f,[v]:e.target.value}));

  return (
    <div className="animate-in">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:18,flexWrap:'wrap',gap:10}}>
        <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
          {['all','active','trial','suspended','inactive'].map(v=>(
            <FilterBtn key={v} active={filter===v} onClick={()=>setFilter(v)}>
              {{all:'Todos',active:'Activos',trial:'Trial',suspended:'Suspendidos',inactive:'Inactivos'}[v]}
            </FilterBtn>
          ))}
        </div>
        <Btn onClick={openCreate}>+ Nuevo ecosistema</Btn>
      </div>

      <SectionCard>
        <div className="tbl-wrap">
          <table style={{width:'100%',borderCollapse:'collapse',minWidth:780}}>
            <thead><tr>
              <Th>Restaurante</Th><Th>Propietario</Th><Th>Plan</Th><Th>Estado</Th>
              <Th>Vence</Th><Th>Pedidos 30d</Th><Th>Rating</Th><Th>Acciones</Th>
            </tr></thead>
            <tbody>
              {shown.length===0&&<tr><td colSpan={8} style={{textAlign:'center',color:C.dim,padding:40,fontSize:13}}>Sin resultados</td></tr>}
              {shown.map(r=>{
                const db2 = daysBadge(r.daysLeft);
                return (
                  <tr key={r.id} onMouseEnter={e=>e.currentTarget.style.background=C.surface} onMouseLeave={e=>e.currentTarget.style.background=''} style={{transition:'background .1s'}}>
                    <Td>
                      <div style={{fontWeight:600,color:C.ink}}>{r.name}</div>
                      <div style={{fontSize:11,color:C.mid}}>{r.city}{r.country&&`, ${r.country}`}</div>
                    </Td>
                    <Td>
                      <div style={{fontSize:13}}>{r.owner_name||<span style={{color:C.dim}}>—</span>}</div>
                      <div style={{fontSize:11,color:C.mid}}>{r.owner_email||''}</div>
                    </Td>
                    <Td><PlanBadge name={r.plan?.name}/></Td>
                    <Td><Badge status={r.status}/></Td>
                    <Td><span style={{color:db2.color,fontWeight:600,fontSize:12,background:db2.bg,padding:'2px 7px',borderRadius:10}}>{db2.label}</span></Td>
                    <Td style={{fontWeight:600}}>{r.orders30}</Td>
                    <Td>{r.avgRating?<span style={{color:C.ink}}>{r.avgRating}</span>:<span style={{color:C.dim}}>—</span>}</Td>
                    <Td>
                      <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
                        <Btn size="sm" variant="ghost" onClick={()=>openEdit(r)}>Editar</Btn>
                        <Btn size="sm" variant={r.status==='active'?'danger':'success'} onClick={()=>toggleStatus(r)}>
                          {r.status==='active'?'Suspender':'Activar'}
                        </Btn>
                        <a href="admin.html" target="_blank" rel="noreferrer" style={{textDecoration:'none'}}><Btn size="sm" variant="ghost">↗ Admin</Btn></a>
                      </div>
                    </Td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </SectionCard>

      {modal&&(
        <Modal title={modal==='create'?'Nuevo ecosistema gastronómico':'Editar restaurante'} onClose={()=>setModal(null)} width={600}>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'0 16px'}}>
            <FormField label="Nombre del local *" col="1/-1">
              <input value={form.name} onChange={sf('name')} placeholder="Ej: La Huaca" autoFocus/>
            </FormField>
            <FormField label="Razón social"><input value={form.legal_name} onChange={sf('legal_name')} placeholder="La Huaca S.A."/></FormField>
            <FormField label="RUC"><input value={form.ruc} onChange={sf('ruc')} placeholder="80000001-1"/></FormField>
            <FormField label="Ciudad"><input value={form.city} onChange={sf('city')} placeholder="Asunción"/></FormField>
            <FormField label="País"><input value={form.country} onChange={sf('country')}/></FormField>
            <FormField label="Dirección" col="1/-1"><input value={form.address} onChange={sf('address')} placeholder="Mcal. Estigarribia 1234"/></FormField>
            <FormField label="Teléfono"><input value={form.phone} onChange={sf('phone')} placeholder="+595 21 555 0100"/></FormField>
            <FormField label="Email del local"><input type="email" value={form.email} onChange={sf('email')} placeholder="contacto@restaurante.com"/></FormField>
            <FormField label="Plan de suscripción">
              <select value={form.plan_id} onChange={sf('plan_id')}>
                <option value="">Sin asignar</option>
                {plans.map(p=><option key={p.id} value={p.id}>{p.name} — {fmtUSD(p.price_usd)}/mes</option>)}
              </select>
            </FormField>
            <FormField label="Estado">
              <select value={form.status} onChange={sf('status')}>
                <option value="active">Activo</option>
                <option value="trial">Trial</option>
                <option value="suspended">Suspendido</option>
                <option value="inactive">Inactivo</option>
              </select>
            </FormField>
            <FormField label="Fecha de alta"><input type="date" value={form.onboarding_date} onChange={sf('onboarding_date')}/></FormField>
          </div>

          <div style={{borderTop:`1px solid ${C.border}`,margin:'12px 0',paddingTop:14}}>
            <div style={{fontSize:10,color:C.mid,fontWeight:700,marginBottom:10,textTransform:'uppercase',letterSpacing:.5}}>Datos del propietario</div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'0 16px'}}>
              <FormField label="Nombre"><input value={form.owner_name} onChange={sf('owner_name')} placeholder="Carlos Gómez"/></FormField>
              <FormField label="Teléfono"><input value={form.owner_phone} onChange={sf('owner_phone')} placeholder="+595 981 123 456"/></FormField>
              <FormField label="Email" col="1/-1"><input type="email" value={form.owner_email} onChange={sf('owner_email')} placeholder="carlos@restaurante.com"/></FormField>
            </div>
          </div>

          <FormField label="Notas internas">
            <textarea value={form.notes} onChange={sf('notes')} rows={2} placeholder="Observaciones internas..."/>
          </FormField>

          <div style={{display:'flex',gap:10,justifyContent:'flex-end',marginTop:12}}>
            <Btn variant="ghost" onClick={()=>setModal(null)}>Cancelar</Btn>
            <Btn onClick={saveRestaurant} disabled={saving}>{saving?'Guardando…':'Guardar'}</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ── Página: Suscripciones ────────────────────────────────────
function PageSuscripciones({enriched, plans, setFlash, reload}) {
  const [editModal, setEditModal] = useState(null);
  const [form, setForm] = useState({});
  const [saving, setSaving] = useState(false);

  const planTotals = plans.map(p=>{
    const count = enriched.filter(r=>r.plan?.name===p.name&&r.status!=='suspended').length;
    return {...p,count};
  });

  const openEdit = r => {
    const s = r.subscription||{};
    setForm({plan_id:s.plan_id||plans[0]?.id||'',status:s.status||'active',start_date:s.start_date||new Date().toISOString().slice(0,10),end_date:s.end_date||'',auto_renew:s.auto_renew!==false,payment_method:s.payment_method||'manual',monthly_amount:s.monthly_amount||r.plan?.price_usd||'',notes:s.notes||''});
    setEditModal(r);
  };

  const saveSub = async () => {
    if (!db) { setFlash({type:'warn',text:'Sin conexión — operación demo'}); return; }
    setSaving(true);
    try {
      const sub = editModal.subscription;
      const payload = {plan_id:form.plan_id,status:form.status,start_date:form.start_date,end_date:form.end_date||null,auto_renew:form.auto_renew,payment_method:form.payment_method,monthly_amount:parseFloat(form.monthly_amount)||null,notes:form.notes||null};
      if (sub?.id) {
        const {error} = await db.from('subscriptions').update(payload).eq('id',sub.id);
        if (error) throw error;
      } else {
        const {error} = await db.from('subscriptions').insert({restaurant_id:editModal.id,...payload});
        if (error) throw error;
      }
      const planName = plans.find(p=>p.id===form.plan_id)?.name||'';
      await db.from('platform_events').insert({restaurant_id:editModal.id,event_type:'plan_changed',description:`Suscripción actualizada — ${planName}`}).catch(()=>{});
      setFlash({type:'ok',text:`Suscripción de ${editModal.name} actualizada`});
      setEditModal(null); reload();
    } catch(e) { setFlash({type:'error',text:'Error: '+e.message}); }
    setSaving(false);
  };

  const renew = async r => {
    if (!db) { setFlash({type:'warn',text:'Sin conexión — operación demo'}); return; }
    if (!r.subscription?.id) { openEdit(r); return; }
    const base = r.subscription.end_date && new Date(r.subscription.end_date) > new Date()
      ? new Date(r.subscription.end_date)
      : new Date();
    const end = new Date(base); end.setMonth(end.getMonth()+1);
    const {error} = await db.from('subscriptions').update({status:'active',end_date:end.toISOString().slice(0,10)}).eq('id',r.subscription.id);
    if (error) { setFlash({type:'error',text:error.message}); return; }
    await db.from('platform_events').insert({restaurant_id:r.id,event_type:'subscription_renewed',description:`Renovación manual — ${r.plan?.name}`}).catch(()=>{});
    if (r.subscription.monthly_amount) {
      await db.from('payments').insert({restaurant_id:r.id,subscription_id:r.subscription.id,amount:r.subscription.monthly_amount,currency:'USD',method:r.subscription.payment_method||'manual',status:'paid',notes:'Renovación manual'}).catch(()=>{});
    }
    setFlash({type:'ok',text:`${r.name} renovado hasta ${fmtDate(end.toISOString())}`});
    reload();
  };

  const sf = v => e => setForm(f=>({...f,[v]:e.target.value}));
  const mrrTotal = enriched.filter(r=>r.status!=='suspended').reduce((s,r)=>s+(r.plan?.price_usd||0),0);

  return (
    <div className="animate-in">
      <div style={{display:'flex',gap:12,marginBottom:20,flexWrap:'wrap'}}>
        {planTotals.map(p=>(
          <div key={p.id} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:'16px 20px',flex:'1 1 130px',minWidth:120}}>
            <PlanBadge name={p.name}/>
            <div style={{fontSize:22,fontWeight:700,marginTop:10}}>{p.count}</div>
            <div style={{fontSize:12,color:C.mid,marginTop:2}}>activos · {fmtUSD(p.price_usd)}/mes</div>
          </div>
        ))}
        <div style={{background:C.card,border:`1px solid ${C.green}40`,borderRadius:10,padding:'16px 20px',flex:'1 1 130px',minWidth:120}}>
          <span style={{fontSize:10,fontWeight:700,color:C.mid,textTransform:'uppercase',letterSpacing:.4}}>MRR Total</span>
          <div style={{fontSize:22,fontWeight:700,marginTop:10,color:C.ink}}>{fmtUSD(mrrTotal)}</div>
          <div style={{fontSize:12,color:C.mid,marginTop:2}}>mensual recurrente</div>
        </div>
      </div>

      <SectionCard>
        <div className="tbl-wrap">
          <table style={{width:'100%',borderCollapse:'collapse',minWidth:860}}>
            <thead><tr>
              <Th>Restaurante</Th><Th>Plan</Th><Th>Estado</Th><Th>Inicio</Th><Th>Vencimiento</Th>
              <Th>Días</Th><Th>Monto/mes</Th><Th>Auto-renov.</Th><Th>Pago</Th><Th>Acciones</Th>
            </tr></thead>
            <tbody>
              {enriched.map(r=>{
                const s = r.subscription;
                const db2 = daysBadge(r.daysLeft);
                const pct = s ? (() => {
                  const total = Math.ceil((new Date(s.end_date)-new Date(s.start_date))/86400000)||1;
                  const elapsed = Math.ceil((new Date()-new Date(s.start_date))/86400000);
                  return Math.min(100,Math.max(0,(elapsed/total)*100));
                })() : 0;
                return (
                  <tr key={r.id}>
                    <Td><div style={{fontWeight:600}}>{r.name}</div><div style={{fontSize:11,color:C.mid}}>{r.city}</div></Td>
                    <Td><PlanBadge name={r.plan?.name}/></Td>
                    <Td><Badge status={s?.status||'—'}/></Td>
                    <Td style={{fontSize:12,color:C.mid,whiteSpace:'nowrap'}}>{fmtDate(s?.start_date)}</Td>
                    <Td style={{fontSize:12,color:C.mid,whiteSpace:'nowrap'}}>{fmtDate(s?.end_date)}</Td>
                    <Td>
                      <div style={{display:'flex',flexDirection:'column',gap:4}}>
                        <span style={{color:db2.color,fontWeight:700,fontSize:12}}>{db2.label}</span>
                        <div style={{background:C.border,borderRadius:3,height:3,width:80,overflow:'hidden'}}>
                          <div style={{background:'#D2D2D7',height:3,borderRadius:3,width:`${pct}%`}}/>
                        </div>
                      </div>
                    </Td>
                    <Td style={{fontWeight:600,color:C.ink,whiteSpace:'nowrap'}}>{s?.monthly_amount?fmtUSD(s.monthly_amount):r.plan?.price_usd?fmtUSD(r.plan.price_usd):'—'}</Td>
                    <Td><span style={{color:s?.auto_renew?C.green:C.dim,fontSize:12}}>{s?.auto_renew?'Sí':'No'}</span></Td>
                    <Td style={{fontSize:12,color:C.mid,textTransform:'capitalize',whiteSpace:'nowrap'}}>{s?.payment_method||'—'}</Td>
                    <Td>
                      <div style={{display:'flex',gap:4}}>
                        <Btn size="sm" variant="ghost" onClick={()=>openEdit(r)}>Editar</Btn>
                        <Btn size="sm" variant="success" onClick={()=>renew(r)}>Renovar</Btn>
                      </div>
                    </Td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </SectionCard>

      {editModal&&(
        <Modal title={`Suscripción — ${editModal.name}`} onClose={()=>setEditModal(null)}>
          <FormField label="Plan">
            <select value={form.plan_id} onChange={sf('plan_id')}>
              {plans.map(p=><option key={p.id} value={p.id}>{p.name} — {fmtUSD(p.price_usd)}/mes</option>)}
            </select>
          </FormField>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'0 16px'}}>
            <FormField label="Estado">
              <select value={form.status} onChange={sf('status')}>
                {['active','trial','suspended','expired','cancelled','past_due'].map(s=><option key={s} value={s}>{statusMeta[s]?.label||s}</option>)}
              </select>
            </FormField>
            <FormField label="Monto mensual (USD)">
              <input type="number" step="0.01" value={form.monthly_amount} onChange={sf('monthly_amount')} placeholder="59.00"/>
            </FormField>
            <FormField label="Método de pago">
              <select value={form.payment_method} onChange={sf('payment_method')}>
                {['manual','transferencia','tarjeta','efectivo','qr'].map(m=><option key={m} value={m}>{m}</option>)}

function PagePlanes({plans, setFlash, reload}) {
  const [modal, setModal] = useState(null);
  const [form, setForm]   = useState({name:'',price_usd:'',billing_cycle:'monthly',max_tables:'',max_menu_items:'',features:'',is_active:true});
  const [saving, setSaving] = useState(false);

  const emptyForm = {name:'',price_usd:'',billing_cycle:'monthly',max_tables:'',max_menu_items:'',features:'',is_active:true};

  const openEdit = p => {
    setForm({name:p.name,price_usd:p.price_usd,billing_cycle:p.billing_cycle,max_tables:p.max_tables||'',max_menu_items:p.max_menu_items||'',features:Array.isArray(p.features)?p.features.join(', '):(p.features||''),is_active:p.is_active!==false});
    setModal({edit:p});
  };

  const savePlan = async () => {
    if (!form.name.trim()) { setFlash({type:'error',text:'El nombre es requerido'}); return; }
    if (!db) { setFlash({type:'warn',text:'Sin conexión — operación demo'}); return; }
    setSaving(true);
    try {
      const feats = form.features ? form.features.split(',').map(s=>s.trim()).filter(Boolean) : [];
      const payload = {name:form.name.trim(),price_usd:parseFloat(form.price_usd)||0,billing_cycle:form.billing_cycle,max_tables:parseInt(form.max_tables)||null,max_menu_items:parseInt(form.max_menu_items)||null,features:JSON.stringify(feats),is_active:form.is_active};
      if (modal==='create') {
        const {error} = await db.from('subscription_plans').insert(payload);
        if (error) throw error;
        setFlash({type:'ok',text:`Plan "${form.name}" creado`});
      } else {
        const {error} = await db.from('subscription_plans').update(payload).eq('id',modal.edit.id);
        if (error) throw error;
        setFlash({type:'ok',text:`Plan "${form.name}" actualizado`});
      }
      setModal(null); reload();
    } catch(e) { setFlash({type:'error',text:'Error: '+e.message}); }
    setSaving(false);
  };

  const toggleActive = async p => {
    if (!db) { setFlash({type:'warn',text:'Sin conexión — operación demo'}); return; }
    const {error} = await db.from('subscription_plans').update({is_active:!p.is_active}).eq('id',p.id);
    if (error) { setFlash({type:'error',text:error.message}); return; }
    setFlash({type:'ok',text:`Plan ${p.name} ${p.is_active?'desactivado':'activado'}`});
    reload();
  };

  const sf = v => e => setForm(f=>({...f,[v]:e.target.value}));

  return (
    <div className="animate-in">

      </div>

      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))',gap:16,marginBottom:24}}>
        {plans.map(p=>{
          const featArr = Array.isArray(p.features) ? p.features : (typeof p.features==='string'?JSON.parse(p.features||'[]'):[]);
          const accentColor = planColors[p.name]||C.mid;
          return (
            <div key={p.id} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:22,opacity:p.is_active?1:.6}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:14}}>
                <div>
                  <PlanBadge name={p.name}/>
                  <div style={{fontSize:26,fontWeight:800,marginTop:10,color:C.ink}}>{fmtUSD(p.price_usd)}<span style={{fontSize:13,fontWeight:400,color:C.mid}}>/mes</span></div>
                </div>
                <div style={{display:'flex',gap:6}}>
                  <Btn size="sm" variant="ghost" onClick={()=>openEdit(p)}>Editar</Btn>
                  <Btn size="sm" variant={p.is_active?'danger':'success'} onClick={()=>toggleActive(p)}>{p.is_active?'Desact.':'Activar'}</Btn>
                </div>
              </div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:14}}>
                <div style={{background:C.surface,borderRadius:6,padding:'8px 12px',textAlign:'center'}}>

                  <div style={{fontSize:10,color:C.mid,marginTop:2}}>Mesas</div>
                </div>
                <div style={{background:C.surface,borderRadius:6,padding:'8px 12px',textAlign:'center'}}>
                  <div style={{fontSize:18,fontWeight:700,color:C.ink}}>{p.max_menu_items??'∞'}</div>

              </div>
              <div style={{display:'flex',flexDirection:'column',gap:4}}>
                {featArr.map((f,i)=>(
                  <div key={i} style={{fontSize:12,color:C.mid,display:'flex',gap:6,alignItems:'center'}}>

// ── Página: Analytics ────────────────────────────────────────
function PageAnalytics({enriched, orders, ratings}) {
  const [range, setRange] = useState('30d');

  const now = new Date();
  const rangeMs = {today:86400000,'7d':7*86400000,'30d':30*86400000,'90d':90*86400000}[range]||30*86400000;
  const since = new Date(now - rangeMs).toISOString();
  const todayStr = now.toISOString().slice(0,10);

  const filteredOrders = range==='today'
    ? orders.filter(o=>(o.created_at||'').slice(0,10)===todayStr)
    : orders.filter(o=>(o.created_at||'')>=since);

  const enrichedFiltered = enriched.map(r => {
    const rOrds = filteredOrders.filter(o=>o.restaurant_id===r.id);
    return {...r, orders30:rOrds.length, revenue30:rOrds.reduce((s,o)=>s+(Number(o.total)||0),0)};
  });

  const totalOrders   = filteredOrders.length;
  const totalRevenue  = filteredOrders.reduce((s,o)=>s+(Number(o.total)||0),0);
  const allRatings    = ratings.map(r=>r.stars);
  const platformRating= allRatings.length ? +(avg(allRatings).toFixed(2)) : null;

  const maxRev = Math.max(...enrichedFiltered.map(r=>r.revenue30),1);
  const maxOrd = Math.max(...enrichedFiltered.map(r=>r.orders30),1);
  const byRev  = [...enrichedFiltered].sort((a,b)=>b.revenue30-a.revenue30);
  const byOrd  = [...enrichedFiltered].sort((a,b)=>b.orders30-a.orders30);
  const byRat  = [...enriched].filter(r=>r.avgRating).sort((a,b)=>b.avgRating-a.avgRating);

  const planRevenue = {};
  enriched.forEach(r=>{ if(r.plan?.name&&r.status!=='suspended') planRevenue[r.plan.name]=(planRevenue[r.plan.name]||0)+(r.plan.price_usd||0); });

  const rangeLabels = {today:'Hoy','7d':'7 días','30d':'30 días','90d':'90 días'};

  return (
    <div className="animate-in">
      {/* Filtro rango */}
      <div style={{display:'flex',gap:6,marginBottom:20,flexWrap:'wrap'}}>
        {Object.entries(rangeLabels).map(([v,l])=>(
          <FilterBtn key={v} active={range===v} onClick={()=>setRange(v)}>{l}</FilterBtn>
        ))}
        <span style={{marginLeft:8,fontSize:12,color:C.mid,alignSelf:'center'}}>Mostrando datos de: <strong style={{color:C.ink}}>{rangeLabels[range]}</strong></span>
      </div>

      <div style={{display:'flex',gap:12,marginBottom:20,flexWrap:'wrap'}}>
        <Kpi label="Pedidos procesados" value={totalOrders.toLocaleString('es-PY')} sub={`período seleccionado`}/>
        <Kpi label="Volumen total"       value={fmtGuarani(totalRevenue)}             sub="en guaraníes"         />
        <Kpi label="Rating plataforma"   value={platformRating?`${platformRating}`:'—'} sub={`${allRatings.length} calificaciones`} />
        <Kpi label="Restaurantes activos" value={enriched.filter(r=>r.status==='active').length} sub={`de ${enriched.length} totales`} />
      </div>

      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:16,marginBottom:16}}>
        <SectionCard title={`Ingresos — ${rangeLabels[range]}`}>
          <div style={{padding:'16px 20px'}}>
            {byRev.map(r=><BarRow key={r.id} label={r.name} value={r.revenue30} max={maxRev} fmt={v=>fmtGuarani(v)} color={'#D2D2D7'}/>)}
            {byRev.every(r=>r.revenue30===0)&&<div style={{color:C.dim,fontSize:12,textAlign:'center',padding:'16px 0'}}>Sin datos de pedidos</div>}
          </div>
        </SectionCard>
        <SectionCard title={`Pedidos — ${rangeLabels[range]}`}>
          <div style={{padding:'16px 20px'}}>
            {byOrd.map(r=><BarRow key={r.id} label={r.name} value={r.orders30} max={maxOrd} fmt={v=>`${v} ped.`} color={'#D2D2D7'}/>)}
            {byOrd.every(r=>r.orders30===0)&&<div style={{color:C.dim,fontSize:12,textAlign:'center',padding:'16px 0'}}>Sin pedidos en el período</div>}
          </div>
        </SectionCard>
        <SectionCard title="Rating promedio">
          <div style={{padding:'16px 20px'}}>
            {byRat.length>0 ? byRat.map(r=><BarRow key={r.id} label={r.name} value={r.avgRating} max={5} fmt={v=>`${v}/5`} color={'#D2D2D7'}/>) : <div style={{color:C.dim,fontSize:12,textAlign:'center',padding:'16px 0'}}>Sin calificaciones</div>}
          </div>
        </SectionCard>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
        <SectionCard title="MRR por plan">
          <div style={{padding:'4px 20px 12px'}}>
            {Object.entries(planRevenue).length===0&&<div style={{color:C.dim,fontSize:12,padding:'12px 0'}}>Sin datos</div>}
            {Object.entries(planRevenue).map(([name,usd])=>(
              <div key={name} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'10px 0',borderBottom:`1px solid ${C.border}`}}>
                <PlanBadge name={name}/>
                <span style={{fontWeight:700,color:C.ink}}>{fmtUSD(usd)}/mes</span>
              </div>
            ))}
          </div>
        </SectionCard>
        <SectionCard title="Desglose suscripciones">
          <div style={{padding:'4px 20px 12px'}}>
            {['active','trial','suspended','expired','cancelled'].map(st=>{
              const count = enriched.filter(r=>r.subscription?.status===st||(!r.subscription&&st==='expired')).length;
              const m = statusMeta[st]||{label:st,color:C.mid};
              return (
                <div key={st} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'10px 0',borderBottom:`1px solid ${C.border}`}}>
                  <Badge status={st}/>
                  <span style={{fontWeight:700,fontSize:18,color:C.ink}}>{count}</span>
                </div>
              );
            })}
          </div>
        </SectionCard>
      </div>
    </div>
  );
}

// ── Página: Usuarios ─────────────────────────────────────────
function PageUsuarios({restaurants, setFlash}) {
  const [users, setUsers]     = useState([]);
  const [loading, setLoading] = useState(true);
  const [modal, setModal]     = useState(null);
  const [editModal, setEditModal] = useState(null);
  const [saving, setSaving]   = useState(false);
  const [form, setForm]       = useState({username:'',display_name:'',password:'',role:'admin',restaurant_id:''});
  const [editForm, setEditForm] = useState({role:'admin',restaurant_id:'',display_name:''});

  const loadUsers = useCallback(async () => {
    if (!db) { setLoading(false); return; }
    setLoading(true);
    const { data, error } = await db.rpc('admin_list_users');
    if (!error && data) setUsers(data);
    setLoading(false);
  }, []);

  useEffect(() => { loadUsers(); }, [loadUsers]);

  const createUser = async () => {
    if (!form.username.trim())    { setFlash({type:'error',text:'El usuario es requerido'}); return; }
    if (form.password.length < 8) { setFlash({type:'error',text:'La contraseña debe tener al menos 8 caracteres'}); return; }
    setSaving(true);
    try {
      const safeUser = form.username.toLowerCase().replace(/[^a-z0-9._-]/g,'');
      const email    = `${safeUser}.${Date.now()}@internal.mesaapp.com`;
      const { error } = await db.rpc('admin_create_user', {
        p_email: email, p_username: form.username.trim(),
        p_display_name: form.display_name.trim()||form.username.trim(),
        p_role: form.role, p_restaurant_id: form.restaurant_id||null,
        p_password: form.password,
      });
      if (error) throw new Error(error.message);
      await db.from('platform_events').insert({event_type:'user_created',description:`Usuario "${form.username}" creado con rol ${form.role}`}).catch(()=>{});
      setFlash({type:'ok',text:`Usuario "${form.username}" creado correctamente`});
      setModal(null);
      setForm({username:'',display_name:'',password:'',role:'admin',restaurant_id:''});
      loadUsers();
    } catch(e) { setFlash({type:'error',text:e.message}); }
    setSaving(false);
  };

  const openEdit = u => {
    setEditForm({role:u.role,restaurant_id:u.restaurant_id||'',display_name:u.display_name||''});
    setEditModal(u);
  };

  const saveEdit = async () => {
    if (!db) { setFlash({type:'warn',text:'Sin conexión'}); return; }
    setSaving(true);
    try {
      const { error } = await db.rpc('admin_update_user_role', {
        p_user_id: editModal.user_id, p_role: editForm.role,
        p_restaurant_id: editForm.restaurant_id||null,
        p_display_name: editForm.display_name||null,
      });
      if (error) throw new Error(error.message);
      setFlash({type:'ok',text:`${editModal.display_name||editModal.username} actualizado`});
      setEditModal(null); loadUsers();
    } catch(e) { setFlash({type:'error',text:e.message}); }
    setSaving(false);
  };

  const toggleUser = async u => {
    if (!db) return;
    const next = !u.is_active;
    const { error } = await db.rpc('admin_toggle_user', { p_user_id: u.user_id, p_active: next });
    if (error) { setFlash({type:'error',text:error.message}); return; }
    setFlash({type:'ok',text:`${u.display_name||u.username} → ${next?'activo':'desactivado'}`});
    loadUsers();
  };

  const restName = id => restaurants.find(r=>r.id===id)?.name||'—';

  return (
    <div className="animate-in">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
        <div>
          <div style={{fontSize:16,fontWeight:700}}>Usuarios del sistema</div>
          <div style={{fontSize:13,color:C.mid,marginTop:3}}>
            {loading?'Cargando…':`${users.length} usuario${users.length!==1?'s':''} registrado${users.length!==1?'s':''}`}
          </div>
        </div>
        <Btn onClick={()=>{setForm({username:'',display_name:'',password:'',role:'admin',restaurant_id:''});setModal('create')}}>+ Nuevo usuario</Btn>
      </div>

      {!db&&(
        <div style={{background:'#FFF4E0',border:`1px solid #FFD580`,borderRadius:8,padding:'12px 18px',marginBottom:20,color:'#8A4B00',fontSize:13}}>
          Sin conexión a Supabase — gestión de usuarios no disponible en modo demo
        </div>
      )}

      <SectionCard>
        {loading ? (
          <div style={{padding:60,display:'flex',justifyContent:'center',alignItems:'center',gap:12}}><Spinner/><span style={{color:C.mid}}>Cargando usuarios…</span></div>
        ) : users.length===0 ? (
          <div style={{padding:60,textAlign:'center'}}>
            
            <div style={{color:C.mid,fontSize:14,fontWeight:500}}>Sin usuarios registrados</div>
            <div style={{color:C.dim,fontSize:12,marginTop:6}}>Creá el primer usuario con el botón de arriba</div>
          </div>
        ) : (
          <div className="tbl-wrap">
            <table style={{width:'100%',borderCollapse:'collapse',minWidth:620}}>
              <thead><tr>
                <Th>Usuario</Th><Th>Nombre</Th><Th>Rol</Th><Th>Restaurante</Th><Th>Estado</Th><Th style={{textAlign:'right'}}>Acciones</Th>
              </tr></thead>
              <tbody>
                {users.map(u=>(
                  <tr key={u.id} onMouseEnter={e=>e.currentTarget.style.background=C.surface} onMouseLeave={e=>e.currentTarget.style.background=''} style={{transition:'background .1s'}}>
                    <Td>
                      <div style={{fontFamily:'monospace',fontSize:13,fontWeight:600}}>{u.username||'—'}</div>
                      <div style={{fontSize:11,color:C.dim,marginTop:2}}>{u.email||''}</div>
                    </Td>
                    <Td style={{fontWeight:500}}>{u.display_name||'—'}</Td>
                    <Td>
                      <span style={{padding:'3px 10px',borderRadius:20,fontSize:11,fontWeight:700,background:(ROLE_COLORS[u.role]||C.mid)+'22',color:ROLE_COLORS[u.role]||C.mid}}>
                        {u.role}
                      </span>
                    </Td>
                    <Td style={{fontSize:13,color:C.mid}}>
                      {u.restaurant_id ? restName(u.restaurant_id) : <span style={{color:C.dim,fontStyle:'italic'}}>Todos</span>}
                    </Td>
                    <Td>
                      <span style={{display:'inline-flex',alignItems:'center',gap:5,fontSize:12,fontWeight:600,color:u.is_active?C.ink:C.dim}}>
                        <span style={{width:6,height:6,borderRadius:'50%',background:u.is_active?C.ink:C.dim}}/>
                        {u.is_active?'Activo':'Inactivo'}
                      </span>
                    </Td>
                    <Td style={{textAlign:'right'}}>
                      <div style={{display:'flex',gap:4,justifyContent:'flex-end'}}>
                        <Btn size="sm" variant="ghost" onClick={()=>openEdit(u)}>Editar</Btn>
                        <Btn size="sm" variant={u.is_active?'danger':'success'} onClick={()=>toggleUser(u)}>
                          {u.is_active?'Desactivar':'Activar'}
                        </Btn>
                      </div>
                    </Td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </SectionCard>

      {/* Modal crear */}
      {modal==='create'&&(
        <Modal title="Nuevo usuario" onClose={()=>setModal(null)}>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'0 16px'}}>
            <FormField label="Usuario *" hint="Sin espacios, sin acentos">
              <input value={form.username} onChange={e=>setForm(f=>({...f,username:e.target.value}))} placeholder="ej: jperez" autoFocus/>
            </FormField>
            <FormField label="Contraseña *" hint="Mínimo 8 caracteres">
              <input type="password" value={form.password} onChange={e=>setForm(f=>({...f,password:e.target.value}))} placeholder="••••••••"/>
            </FormField>
            <FormField label="Nombre para mostrar" hint="Opcional">
              <input value={form.display_name} onChange={e=>setForm(f=>({...f,display_name:e.target.value}))} placeholder="Juan Pérez"/>
            </FormField>
            <FormField label="Rol">
              <select value={form.role} onChange={e=>setForm(f=>({...f,role:e.target.value}))}>
                {ALL_ROLES.map(r=><option key={r} value={r}>{r}</option>)}
              </select>
            </FormField>
          </div>
          <FormField label="Restaurante asignado" hint="Vacío = acceso a todos (solo para superadmin)">
            <select value={form.restaurant_id} onChange={e=>setForm(f=>({...f,restaurant_id:e.target.value}))}>
              <option value="">Todos los restaurantes</option>
              {restaurants.map(r=><option key={r.id} value={r.id}>{r.name} — {r.city}</option>)}
            </select>
          </FormField>
          <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:6,padding:'10px 14px',fontSize:12,color:C.dim,marginBottom:14}}>
            El usuario inicia sesión en <strong style={{color:C.mid,fontFamily:'monospace'}}>{typeof window!=='undefined'?window.location.origin:''}/login.html</strong>
          </div>
          <div style={{display:'flex',gap:10,justifyContent:'flex-end'}}>
            <Btn variant="ghost" onClick={()=>setModal(null)}>Cancelar</Btn>
            <Btn onClick={createUser} disabled={saving}>{saving?'Creando…':'Crear usuario'}</Btn>
          </div>
        </Modal>
      )}

      {/* Modal editar */}
      {editModal&&(
        <Modal title={`Editar — ${editModal.display_name||editModal.username}`} onClose={()=>setEditModal(null)}>
          <FormField label="Nombre para mostrar">
            <input value={editForm.display_name} onChange={e=>setEditForm(f=>({...f,display_name:e.target.value}))}/>
          </FormField>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'0 16px'}}>
            <FormField label="Rol">
              <select value={editForm.role} onChange={e=>setEditForm(f=>({...f,role:e.target.value}))}>
                {ALL_ROLES.map(r=><option key={r} value={r}>{r}</option>)}
              </select>
            </FormField>
            <FormField label="Restaurante asignado">
              <select value={editForm.restaurant_id} onChange={e=>setEditForm(f=>({...f,restaurant_id:e.target.value}))}>
                <option value="">Todos los restaurantes</option>
                {restaurants.map(r=><option key={r.id} value={r.id}>{r.name}</option>)}
              </select>
            </FormField>
          </div>
          <div style={{display:'flex',gap:10,justifyContent:'flex-end',marginTop:8}}>
            <Btn variant="ghost" onClick={()=>setEditModal(null)}>Cancelar</Btn>
            <Btn onClick={saveEdit} disabled={saving}>{saving?'Guardando…':'Guardar cambios'}</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ── Sidebar ──────────────────────────────────────────────────
const NAV = [
  {id:'overview',      label:'Plataforma',    icon:'◉'},
  {id:'ecosistemas',   label:'Ecosistemas'},
  {id:'suscripciones', label:'Suscripciones'},
  {id:'planes',        label:'Planes'},
  {id:'analytics',     label:'Analytics'},
  {id:'actividad',     label:'Actividad'},
  {id:'usuarios',      label:'Usuarios'},
];

function Sidebar({page, setPage}) {
  const signOut = async () => {
    if (db) { try { await db.auth.signOut(); } catch(e){} }
    localStorage.removeItem('mesa_session');
    window.location.replace('login.html');
  };

  return (
    <div style={{width:220,background:C.sidebar,borderRight:`1px solid ${C.border}`,display:'flex',flexDirection:'column',height:'100%',flexShrink:0,overflowY:'auto'}}>
      <div style={{padding:'20px 18px 16px',borderBottom:`1px solid ${C.border}`,flexShrink:0}}>
        <div style={{fontWeight:800,fontSize:18,color:'#000000',letterSpacing:'-1px'}}>Mythos</div>
        <div style={{fontSize:11,fontWeight:500,color:'#6E6E73',marginTop:2}}>Superadmin</div>
      </div>
      <nav style={{padding:'10px 10px',flex:1}}>
        {NAV.map(n=>{
          const active = page===n.id;
          return (
            <button key={n.id} onClick={()=>setPage(n.id)} style={{display:'flex',alignItems:'center',gap:10,padding:'9px 12px',borderRadius:8,width:'100%',border:'none',background:active?'#000000':'transparent',color:active?'#FFFFFF':C.mid,fontWeight:active?600:400,fontSize:13,cursor:'pointer',transition:'all .15s',marginBottom:2}}>
              
              {n.label}
            </button>
          );
        })}
      </nav>
      <div style={{padding:'14px 16px',borderTop:`1px solid ${C.border}`,flexShrink:0}}>
        <div style={{fontSize:10,color:C.dim,marginBottom:8,textTransform:'uppercase',letterSpacing:.5}}>Links rápidos</div>
        {[['admin.html','Admin local'],['cocina.html','KDS cocina'],['caja.html','Panel caja'],['index.html','App cliente']].map(([href,label])=>(
          <a key={href} href={href} target="_blank" rel="noreferrer" style={{display:'flex',alignItems:'center',justifyContent:'space-between',fontSize:12,color:C.mid,textDecoration:'none',padding:'5px 0',transition:'color .1s'}} onMouseEnter={e=>e.currentTarget.style.color=C.ink} onMouseLeave={e=>e.currentTarget.style.color=C.mid}>
            <span>{label}</span><span style={{fontSize:10,opacity:.5}}>↗</span>
          </a>
        ))}
        <button onClick={signOut} style={{marginTop:10,width:'100%',background:'#000000',border:'none',borderRadius:6,color:'#FFFFFF',fontSize:12,padding:'7px',cursor:'pointer',fontFamily:'inherit',fontWeight:600}}>
          Cerrar sesión
        </button>
      </div>
    </div>
  );
}

// ── App principal ────────────────────────────────────────────
function App() {
  const [page, setPage]       = useState('overview');
  const [loading, setLoading] = useState(true);
  const [flash, setFlash]     = useState(null);
  const [offline, setOffline] = useState(false);
  const [rtLive, setRtLive]   = useState(false);
  const [rawData, setRawData] = useState({restaurants:[],plans:[],subscriptions:[],events:[],orders:[],ratings:[]});
  const [,forceRender] = useReducer(x=>x+1,0);

  function toggleTheme(){
    const next = document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
    Object.assign(C, next==='dark'?C_DARK:C_LIGHT);
    document.documentElement.setAttribute('data-theme',next);
    localStorage.setItem('mesa_theme',next);
    forceRender();
  }

  const loadAll = useCallback(async () => {
    if (!db) {
      setRawData(DEMO); setOffline(true); setLoading(false);
      return;
    }
    setLoading(true);
    try {
      const ago30 = new Date(Date.now()-30*86400000).toISOString();
      const [rests,subs,plans,events,orders,ratings] = await Promise.all([
        db.from('restaurants').select('*').order('created_at',{ascending:false}),
        db.from('subscriptions').select('*, plan:subscription_plans(id,name,price_usd,billing_cycle)').then(r=>r.error?{data:[]}:r),
        db.from('subscription_plans').select('*').order('price_usd').then(r=>r.error?{data:[]}:r),
        db.from('platform_events').select('*, restaurant:restaurants(name)').order('created_at',{ascending:false}).limit(100).then(r=>r.error?{data:[]}:r),
        db.from('orders').select('id,restaurant_id,total,created_at,status').gte('created_at',ago30).then(r=>r.error?{data:[]}:r),
        db.from('ratings').select('restaurant_id,stars').then(r=>r.error?{data:[]}:r),
      ]);
      if (rests.error) throw rests.error;
      setRawData({restaurants:rests.data||[],subscriptions:(subs.data||[]),plans:plans.data||[],events:events.data||[],orders:orders.data||[],ratings:ratings.data||[]});
      setOffline(false);
    } catch(e) {
      console.warn('Error cargando datos:',e);
      setRawData(DEMO); setOffline(true);
      setFlash({type:'warn',text:'Sin conexión a Supabase — datos demo'});
    }
    setLoading(false);
  }, []);

  useEffect(()=>{ loadAll(); },[loadAll]);

  useEffect(()=>{
    if (!db) return;
    const ch = db.channel('superadmin-rt')
      .on('postgres_changes',{event:'*',schema:'public',table:'orders'},         loadAll)
      .on('postgres_changes',{event:'*',schema:'public',table:'restaurants'},    loadAll)
      .on('postgres_changes',{event:'*',schema:'public',table:'subscriptions'},  loadAll)
      .on('postgres_changes',{event:'*',schema:'public',table:'platform_events'},loadAll)
      .subscribe(s=>setRtLive(s==='SUBSCRIBED'));
    return ()=>{ db.removeChannel(ch); };
  },[loadAll]);

  const {restaurants,plans,subscriptions,events,orders,ratings} = rawData;
  const enriched = buildAnalytics(restaurants, orders, ratings, subscriptions, plans);

  const pageTitles = {overview:'Plataforma',ecosistemas:'Ecosistemas',suscripciones:'Suscripciones',planes:'Planes SaaS',analytics:'Analytics',actividad:'Actividad',usuarios:'Usuarios'};

  return (
    <div style={{display:'flex',height:'100vh',overflow:'hidden'}}>
      <Sidebar page={page} setPage={setPage}/>
      <div style={{flex:1,display:'flex',flexDirection:'column',minWidth:0,overflow:'hidden'}}>
        {/* Header */}
        <div style={{background:C.sidebar,borderBottom:`1px solid ${C.border}`,padding:'12px 24px',display:'flex',justifyContent:'space-between',alignItems:'center',flexShrink:0,zIndex:10}}>
          <div style={{fontWeight:700,fontSize:15,color:C.ink}}>{pageTitles[page]||page}</div>
          <div style={{display:'flex',alignItems:'center',gap:12,flexShrink:0}}>
            {offline&&<span style={{fontSize:11,color:'#86868B',fontWeight:500,background:C.surface,border:`1px solid ${C.border}`,padding:'3px 10px',borderRadius:12}}>Demo offline</span>}
            {!offline&&!loading&&rtLive&&<span style={{fontSize:11,color:C.green,fontWeight:600,background:'#E8F9ED',padding:'3px 10px',borderRadius:12}} className="pulse">● En vivo</span>}
            {!offline&&!loading&&!rtLive&&<span style={{fontSize:11,color:C.mid,fontWeight:600,background:C.surface,padding:'3px 10px',borderRadius:12}}>● Conectado</span>}
            {window._userProfile&&<span style={{fontSize:12,color:C.mid,fontWeight:600}}>{window._userProfile.display_name||window._userProfile.username}</span>}
            <button onClick={loadAll} style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:6,padding:'6px 12px',color:C.mid,fontSize:12,cursor:'pointer'}}>↺</button>
          </div>
        </div>

        {/* Content */}
        <div style={{flex:1,padding:24,overflowY:'auto'}}>
          {loading ? (
            <div style={{display:'flex',justifyContent:'center',alignItems:'center',height:200,gap:14}}>
              <Spinner/><span style={{color:C.mid}}>Cargando plataforma…</span>
            </div>
          ) : (
            <>
              {page==='overview'      && <PageOverview     enriched={enriched} events={events} plans={plans} setFlash={setFlash} reload={loadAll} setPage={setPage}/>}
              {page==='ecosistemas'   && <PageEcosistemas  enriched={enriched} plans={plans} setFlash={setFlash} reload={loadAll}/>}
              {page==='suscripciones' && <PageSuscripciones enriched={enriched} plans={plans} setFlash={setFlash} reload={loadAll}/>}
              {page==='planes'        && <PagePlanes        plans={plans} setFlash={setFlash} reload={loadAll}/>}
              {page==='analytics'     && <PageAnalytics    enriched={enriched} orders={orders} ratings={ratings}/>}
              {page==='actividad'     && <PageActividad    events={events} restaurants={restaurants} setFlash={setFlash} reload={loadAll}/>}
              {page==='usuarios'      && <PageUsuarios     restaurants={restaurants} setFlash={setFlash}/>}
            </>
          )}
        </div>
      </div>
      <FlashMsg msg={flash} onClose={()=>setFlash(null)}/>
    </div>
  );
}

// ── Auth guard — solo superadmin ─────────────────────────────
async function bootstrap() {
  if (!db) {
    // Sin config de Supabase — modo demo directo
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
    return;
  }
  const { data: { session } } = await db.auth.getSession();
  if (!session) { window.location.replace('login.html'); return; }
  const { data: profile } = await db.rpc('get_my_profile');
  if (!profile || profile.role !== 'superadmin') {
    await db.auth.signOut();
    window.location.replace('login.html');
    return;
  }
  window._userProfile = profile;
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
}
bootstrap();
</script>
</body>
</html>
